ment Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Risk of hypersensitivity reaction - counsel patients Not in active infection (incl. localised) Serious infection risk (bacterial, fungal, viral & opportunistic) - caution chronic/recurrent infection hx. Risk colonic perforation (caution diverticulitis) - promptly evaluate abdominal symptoms Is associated with low ANC and/or platelets plus abnormal LFT’s – use contraindicated if ANC <2.0 x 10 9 cells/L, Platelets < 150 x 10 9 cells/L, initiating AST/ALT 1.5 X ULN or halting at x5 ULN) Manufacturer advises avoid with live vaccines Pregnancy & Breastfeeding: Women of childbearing potential to use an effective contraception during treatment and upto 3 months after treatment Should not be used unless clinical condition of the women requires treatment with sarilumab Breastfeeding Benefit to mother vs risk to infant Assessment of Response: To continue treatment if there is moderate EULAR response at 6 months after starting therapy Baseline Tests: FBC, U&E, LFTs Lipids Consider CXR Consider Hepatitis B and C, Quantiferon or T-spot (if appropriate), and HIV testing Consider Urinalysis *Consider pregnancy test Routine Monitoring: FBC and LFT’s - at 4 to 8 weeks then suggest 3 monthly Lipids - at 4 to 8 weeks then 6 monthly ( *Take bloods at the end of the dosing interval when considering dose modification) Indications for Stopping Therapy: ANC <1.0 x 10 9 cells/L Platelets <50 x 10 9 cells/L LFT’s 3 to 5 x ULN (Treatment with Kevzara should be withheld until < 3 x ULN then be resumed at 150 mg every 2 weeks and increased to 200 mg every 2 weeks as clinically appropriate; treatment with Kevzara should be discontinued if ALT > 5 x ULN) Serious infection/Opportunistic infection New onset abdominal symptoms Suspected Hypersensitivity reaction - Injection site rash, rash, urticaria Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/8145/smpc"},{"id":"secukinumab","title":"Secukinumab","subtitle":"Cosentyx®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Recombinant IgG1 monoclonal antibody that selectively binds to and\nneutralizes IL-17A<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p><strong>PsA<\/strong> - concomitant psoriasis or TNFi inadequate\nresponder 300mg sc wk 0,1,2,3 and 4 the monthly.<\/p>\n<p>Otherwise 150mg wk 0,1,2,3 and 4 then monthly<\/p>\n<p><strong>AS<\/strong> - 150mg sc wk 0,1,2,3 and 4 then monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA407\"><u>TA\n407<\/u><\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA445\"><u>TA445<\/u><\/a><\/p>\n<p>Ax/nrSPA: TA719<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal/hepatic impairment/Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>C/I Severe, active infection<\/p>\n<p>Caution chronic or recurrent infection or persistent candidiasis<\/p>\n<p>Inflammatory bowel disease – not recommended<\/p>\n<p>Latex allergy - risk of reaction due to needle cap<\/p>\n<p>Risk of neutropenia<\/p>\n<p>Risk of hypersensitivity reaction<\/p>\n<p>Live vaccines CI<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pregnancy &amp; Breastfeeding: (manufacturer advise)<\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective method of\ncontraception during and for atleast 20 weeks after treatment<\/p>\n<p>No adequate data for use in pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus\nno worsening of criteria<\/p>\n<p>AS- 16 wk BASDAI 50% reduction or at least 2 units plus at least 2cm\nimprovement in VAS<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, Quantiferon or T-spot (if appropriate),\nand HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Consider pregnancy test<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Hypersensitivity reaction: injection site reaction, rash, urticaria,\ndyspnea<\/p>\n<p>Severe infection<\/p>\n<p>Exacerbation of Inflammatory bowel disease<\/p>\n<p>ANC &lt;1.0 *10<sup>9<\/sup> cell/L<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/3669/smpc\"><u>https://www.medicines.org.uk/emc/product/3669/smpc<\/u><\/a><\/p>\n<p><u>https://www.medicines.org.uk/emc/product/11973/smpc<\/u><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><br />\n<\/strong><\/p>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Recombinant IgG1 monoclonal antibody that selectively binds to and\nneutralizes IL-17A<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p><strong>PsA<\/strong> - concomitant psoriasis or TNFi inadequate\nresponder 300mg sc wk 0,1,2,3 and 4 the monthly.<\/p>\n<p>Otherwise 150mg wk 0,1,2,3 and 4 then monthly<\/p>\n<p><strong>AS<\/strong> - 150mg sc wk 0,1,2,3 and 4 then monthly<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA407\"><u>TA\n407<\/u><\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA445\"><u>TA445<\/u><\/a><\/p>\n<p>Ax/nrSPA: TA719<\/p>\n<\/blockquote>"},"renal-hepatic-impairment-elderly":{"label":"Renal/hepatic impairment/Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>C/I Severe, active infection<\/p>\n<p>Caution chronic or recurrent infection or persistent candidiasis<\/p>\n<p>Inflammatory bowel disease – not recommended<\/p>\n<p>Latex allergy - risk of reaction due to needle cap<\/p>\n<p>Risk of neutropenia<\/p>\n<p>Risk of hypersensitivity reaction<\/p>\n<p>Live vaccines CI<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advise":{"label":"Pregnancy & Breastfeeding: (manufacturer advise)","html":"<blockquote>\n<p>Women of childbearing potential to use an effective method of\ncontraception during and for atleast 20 weeks after treatment<\/p>\n<p>No adequate data for use in pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus\nno worsening of criteria<\/p>\n<p>AS- 16 wk BASDAI 50% reduction or at least 2 units plus at least 2cm\nimprovement in VAS<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, Quantiferon or T-spot (if appropriate),\nand HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Consider pregnancy test<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Hypersensitivity reaction: injection site reaction, rash, urticaria,\ndyspnea<\/p>\n<p>Severe infection<\/p>\n<p>Exacerbation of Inflammatory bowel disease<\/p>\n<p>ANC &lt;1.0 *10<sup>9<\/sup> cell/L<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Recombinant IgG1 monoclonal antibody that selectively binds to and neutralizes IL-17A Licensed Dose: PsA - concomitant psoriasis or TNFi inadequate responder 300mg sc wk 0,1,2,3 and 4 the monthly. Otherwise 150mg wk 0,1,2,3 and 4 then monthly AS - 150mg sc wk 0,1,2,3 and 4 then monthly NICE Guidance: AS: TA 407 PsA: TA445 Ax/nrSPA: TA719 Renal/hepatic impairment/Elderly No dose adjustment Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) C/I Severe, active infection Caution chronic or recurrent infection or persistent candidiasis Inflammatory bowel disease – not recommended Latex allergy - risk of reaction due to needle cap Risk of neutropenia Risk of hypersensitivity reaction Live vaccines CI Pregnancy & Breastfeeding: (manufacturer advise) Women of childbearing potential to use an effective method of contraception during and for atleast 20 weeks after treatment No adequate data for use in pregnancy Breastfeeding safety unknown Assessment of Response: PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus no worsening of criteria AS- 16 wk BASDAI 50% reduction or at least 2 units plus at least 2cm improvement in VAS Baseline Tests: FBC LFT’s U&E Consider CXR Consider Hepatitis B and C, Quantiferon or T-spot (if appropriate), and HIV testing Consider Urinalysis Consider pregnancy test Routine Monitoring: Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Hypersensitivity reaction: injection site reaction, rash, urticaria, dyspnea Severe infection Exacerbation of Inflammatory bowel disease ANC <1.0 *10 9 cell/L Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/3669/smpc https://www.medicines.org.uk/emc/product/11973/smpc"},{"id":"tocilizumab","title":"Tocilizumab","subtitle":"Roactemra®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 62%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic Class:<\/th>\n<th><blockquote>\n<p>Recombinant humanized IgG1 monoclonal antibody against membrane\nbound/soluble interleukin-6 (IL-6) receptor<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p><strong>RA<\/strong> (with or without MTX), <strong>JIA,\nGCA<\/strong><\/p>\n<p>Off Label : ASOD<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p><strong>RA - intravenous infusion<\/strong> 8 mg/kg body weight, given\nonce every 4 weeks (maximum recommended dose 800mg)<\/p>\n<p><strong>subcutaneous injection -<\/strong> 162mg once every week.,<\/p>\n<p><strong>GCA<\/strong> 162 mg once weekly, not to be used alone for\nacute relapses, review needed beyond 52 weeks<\/p>\n<p>*for dose adjustments with liver enzymes abnormalities or low\nabsolute neutrophil or platelet count<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Preparation:<\/td>\n<td><blockquote>\n<p>Vial 80 mg, 200mg &amp; 400 mg (all 20 mg/ml), Given as an\nintravenous infusion in 100ml 0.9% sodium chloride over 60 minutes.<\/p>\n<p>162 mg solution for injection in pre-filled syringe<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a> and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta247\">TA247<\/a> (after TNF\nfailure if rituximab CI/failed)<\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a> ,\n<u>TA238<\/u><\/p>\n<p>GCA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta518\"><u>TA518<\/u><\/a><\/p>\n<\/blockquote>\n<p> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.england.nhs.uk/publication/clinical-commissioning-policy-anakinra-tocilizumab-for-the-treatment-of-adult-onset-stills-disease-refractory-to-second-line-therapy-adults/?UNLID=73189642220231028215134\"><u>Clinical\nCommissioning Policy: Anakinra/tocilizumab for the treatment of\nAdult-Onset Still’s Disease refractory to second-line therapy (adults)\n(170056P)<\/u><\/a><\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Warnings/Contraindications/Significant drug interactions: (*Refer to\nlicensed datasheet for special warnings)<\/td>\n<td><blockquote>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Active tuberculosis (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Active hepatic disease or impairment ● Preexisting neutropenia<\/p>\n<p>Gastro-intestinal ulcers or Diverticulitis<\/p>\n<p>Interstitial lung disease (increased risk of infection; reports of\ndeveloping pneumonitis and fibrosis)<\/p>\n<p>Don’t initiate if ANC less than 2 x 10 9 /litre<\/p>\n<p>Don’t initiate if hepatic enzymes more than 5 times ULN<\/p>\n<p>Caution with platelet count 100 x 10 3 /ul<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p><strong>● Drug interactions:<\/strong> Drugs metabolized by CYP450\n:<\/p>\n<p>statins , calcium channel blockers, theophylline, warfarin,\nphenytoin, ciclosporin, or benzodiazepines - dose increases may be\nrequired to maintain therapeutic effect of these medicines.<\/p>\n<p>*All patients treated with RoActemra should be given the Patient\nAlert Card.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal/hepatic impairment<\/td>\n<td><blockquote>\n<p>No dose adjustment in mild or moderate renal impairment<\/p>\n<p>No dose recommendation in hepatic disease<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; breastfeeding (manufacturer advise )<\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective method of\ncontraception during and upto 20 weeks after treatment<\/p>\n<p>No adequate data for use in pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Available data suggest that clinical improvement is observed within 6\nweeks of initiation of treatment with tocilizumab<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><ul>\n<li><p>Full clinical/infection screen<\/p><\/li>\n<li><p>Urinalysis &amp; BP<\/p><\/li>\n<li><p>FBC/U&amp;E/LFT/ANA/DNA (contraindicated if LFT’s &gt; 5*ULN or\nabsolute<\/p><\/li>\n<\/ul>\n<blockquote>\n<p>neutrophil count &lt;1.0 x 10<sup>9<\/sup> /l)<\/p>\n<\/blockquote>\n<ul>\n<li><p>CXR (evidence TB/fibrosis)<\/p><\/li>\n<li><p>Consider Hepatitis B and C, QuantiFERON or T-spot (if\nappropriate), and HIV testing<\/p><\/li>\n<li><p>Baseline lipids<\/p><\/li>\n<li><p>Pregnancy test if indicated<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>As for csDMARD therapy or LFT’s (Transaminases), neutrophils and\nplatelets 3 monthly<\/p>\n<p>Lipid parameters - assessment of lipid parameters at 3 months only.\nIf infusion only, bloods prior to each infusion.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Indications for<\/p>\n<p>Stopping Therapy:<\/p><\/td>\n<td><blockquote>\n<p>Infusion reaction<\/p>\n<p>Evidence of infection<\/p>\n<p>Development of new abdominal symptoms<\/p>\n<p>Deterioration in lung function (perform CXR / PFT)<\/p>\n<p>Vigilant for new onset symptoms of demyelination<\/p>\n<p>LFT’s transaminases persistently &gt; 3 xULN ●<\/p>\n<p>Neutrophils &lt; 1.0 x10<sup>9<\/sup> /l ● Platelets &lt; 50\nx10<sup>9<\/sup><\/p>\n<p>Macrophage activation syndrome (MAS) reported in sJIA<\/p>\n<p>*Mild infusion reaction common within 24 hours of the first infusion.\nSevere reaction may be observed between 2<sup>nd<\/sup> to 5<sup>th<\/sup>\ninfusion<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\">Please refer to licensed datasheet for more\ncomprehensive prescribing information:\n<u>https://www.medicines.org.uk/emc/product/9086/smpc<\/u> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/5357/smpc\"><u>https://www.medicines.org.uk/emc/product/5357/smpc<\/u><\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic Class","html":"<blockquote>\n<p>Recombinant humanized IgG1 monoclonal antibody against membrane\nbound/soluble interleukin-6 (IL-6) receptor<\/p>\n<\/blockquote>"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p><strong>RA<\/strong> (with or without MTX), <strong>JIA,\nGCA<\/strong><\/p>\n<p>Off Label : ASOD<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p><strong>RA - intravenous infusion<\/strong> 8 mg/kg body weight, given\nonce every 4 weeks (maximum recommended dose 800mg)<\/p>\n<p><strong>subcutaneous injection -<\/strong> 162mg once every week.,<\/p>\n<p><strong>GCA<\/strong> 162 mg once weekly, not to be used alone for\nacute relapses, review needed beyond 52 weeks<\/p>\n<p>*for dose adjustments with liver enzymes abnormalities or low\nabsolute neutrophil or platelet count<\/p>\n<\/blockquote>"},"preparation":{"label":"Preparation","html":"<blockquote>\n<p>Vial 80 mg, 200mg &amp; 400 mg (all 20 mg/ml), Given as an\nintravenous infusion in 100ml 0.9% sodium chloride over 60 minutes.<\/p>\n<p>162 mg solution for injection in pre-filled syringe<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a> and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta247\">TA247<\/a> (after TNF\nfailure if rituximab CI/failed)<\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a> ,\n<u>TA238<\/u><\/p>\n<p>GCA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta518\"><u>TA518<\/u><\/a><\/p>\n<\/blockquote>\n<p> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.england.nhs.uk/publication/clinical-commissioning-policy-anakinra-tocilizumab-for-the-treatment-of-adult-onset-stills-disease-refractory-to-second-line-therapy-adults/?UNLID=73189642220231028215134\"><u>Clinical\nCommissioning Policy: Anakinra/tocilizumab for the treatment of\nAdult-Onset Still’s Disease refractory to second-line therapy (adults)\n(170056P)<\/u><\/a><\/p>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Active tuberculosis (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Active hepatic disease or impairment ● Preexisting neutropenia<\/p>\n<p>Gastro-intestinal ulcers or Diverticulitis<\/p>\n<p>Interstitial lung disease (increased risk of infection; reports of\ndeveloping pneumonitis and fibrosis)<\/p>\n<p>Don’t initiate if ANC less than 2 x 10 9 /litre<\/p>\n<p>Don’t initiate if hepatic enzymes more than 5 times ULN<\/p>\n<p>Caution with platelet count 100 x 10 3 /ul<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p><strong>● Drug interactions:<\/strong> Drugs metabolized by CYP450\n:<\/p>\n<p>statins , calcium channel blockers, theophylline, warfarin,\nphenytoin, ciclosporin, or benzodiazepines - dose increases may be\nrequired to maintain therapeutic effect of these medicines.<\/p>\n<p>*All patients treated with RoActemra should be given the Patient\nAlert Card.<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"renal-hepatic-impairment":{"label":"Renal/hepatic impairment","html":"<blockquote>\n<p>No dose adjustment in mild or moderate renal impairment<\/p>\n<p>No dose recommendation in hepatic disease<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advise":{"label":"Pregnancy & breastfeeding (manufacturer advise )","html":"<blockquote>\n<p>Women of childbearing potential to use an effective method of\ncontraception during and upto 20 weeks after treatment<\/p>\n<p>No adequate data for use in pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Available data suggest that clinical improvement is observed within 6\nweeks of initiation of treatment with tocilizumab<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<ul>\n<li><p>Full clinical/infection screen<\/p><\/li>\n<li><p>Urinalysis &amp; BP<\/p><\/li>\n<li><p>FBC/U&amp;E/LFT/ANA/DNA (contraindicated if LFT’s &gt; 5*ULN or\nabsolute<\/p><\/li>\n<\/ul>\n<blockquote>\n<p>neutrophil count &lt;1.0 x 10<sup>9<\/sup> /l)<\/p>\n<\/blockquote>\n<ul>\n<li><p>CXR (evidence TB/fibrosis)<\/p><\/li>\n<li><p>Consider Hepatitis B and C, QuantiFERON or T-spot (if\nappropriate), and HIV testing<\/p><\/li>\n<li><p>Baseline lipids<\/p><\/li>\n<li><p>Pregnancy test if indicated<\/p><\/li>\n<\/ul>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>As for csDMARD therapy or LFT’s (Transaminases), neutrophils and\nplatelets 3 monthly<\/p>\n<p>Lipid parameters - assessment of lipid parameters at 3 months only.\nIf infusion only, bloods prior to each infusion.<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Infusion reaction<\/p>\n<p>Evidence of infection<\/p>\n<p>Development of new abdominal symptoms<\/p>\n<p>Deterioration in lung function (perform CXR / PFT)<\/p>\n<p>Vigilant for new onset symptoms of demyelination<\/p>\n<p>LFT’s transaminases persistently &gt; 3 xULN ●<\/p>\n<p>Neutrophils &lt; 1.0 x10<sup>9<\/sup> /l ● Platelets &lt; 50\nx10<sup>9<\/sup><\/p>\n<p>Macrophage activation syndrome (MAS) reported in sJIA<\/p>\n<p>*Mild infusion reaction common within 24 hours of the first infusion.\nSevere reaction may be observed between 2<sup>nd<\/sup> to 5<sup>th<\/sup>\ninfusion<\/p>\n<\/blockquote>"}},"text":"Therapeutic Class: Recombinant humanized IgG1 monoclonal antibody against membrane bound/soluble interleukin-6 (IL-6) receptor Licensed Indications: RA (with or without MTX), JIA, GCA Off Label : ASOD Licensed Dose: RA - intravenous infusion 8 mg/kg body weight, given once every 4 weeks (maximum recommended dose 800mg) subcutaneous injection - 162mg once every week., GCA 162 mg once weekly, not to be used alone for acute relapses, review needed beyond 52 weeks *for dose adjustments with liver enzymes abnormalities or low absolute neutrophil or platelet count Preparation: Vial 80 mg, 200mg & 400 mg (all 20 mg/ml), Given as an intravenous infusion in 100ml 0.9% sodium chloride over 60 minutes. 162 mg solution for injection in pre-filled syringe NICE Guidance: RA: TA375 and TA247 (after TNF failure if rituximab CI/failed) JIA: TA373 , TA238 GCA: TA518 Clinical Commissioning Policy: Anakinra/tocilizumab for the treatment of Adult-Onset Still’s Disease refractory to second-line therapy (adults) (170056P) Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to the active substance or to any of the excipients Active tuberculosis (TB) or other severe infections such as sepsis, and opportunistic infections Active hepatic disease or impairment ● Preexisting neutropenia Gastro-intestinal ulcers or Diverticulitis Interstitial lung disease (increased risk of infection; reports of developing pneumonitis and fibrosis) Don’t initiate if ANC less than 2 x 10 9 /litre Don’t initiate if hepatic enzymes more than 5 times ULN Caution with platelet count 100 x 10 3 /ul Manufacturer advises avoid use with live vaccines ● Drug interactions: Drugs metabolized by CYP450 : statins , calcium channel blockers, theophylline, warfarin, phenytoin, ciclosporin, or benzodiazepines - dose increases may be required to maintain therapeutic effect of these medicines. *All patients treated with RoActemra should be given the Patient Alert Card. Elderly No dose adjustment Renal/hepatic impairment No dose adjustment in mild or moderate renal impairment No dose recommendation in hepatic disease Pregnancy & breastfeeding (manufacturer advise ) Women of childbearing potential to use an effective method of contraception during and upto 20 weeks after treatment No adequate data for use in pregnancy Breastfeeding safety unknown Assessment of Response: Available data suggest that clinical improvement is observed within 6 weeks of initiation of treatment with tocilizumab Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA (contraindicated if LFT’s > 5*ULN or absolute neutrophil count <1.0 x 10 9 /l) CXR (evidence TB/fibrosis) Consider Hepatitis B and C, QuantiFERON or T-spot (if appropriate), and HIV testing Baseline lipids Pregnancy test if indicated Routine Monitoring: As for csDMARD therapy or LFT’s (Transaminases), neutrophils and platelets 3 monthly Lipid parameters - assessment of lipid parameters at 3 months only. If infusion only, bloods prior to each infusion. Indications for Stopping Therapy: Infusion reaction Evidence of infection Development of new abdominal symptoms Deterioration in lung function (perform CXR / PFT) Vigilant for new onset symptoms of demyelination LFT’s transaminases persistently > 3 xULN ● Neutrophils < 1.0 x10 9 /l ● Platelets < 50 x10 9 Macrophage activation syndrome (MAS) reported in sJIA *Mild infusion reaction common within 24 hours of the first infusion. Severe reaction may be observed between 2 nd to 5 th infusion Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/9086/smpc https://www.medicines.org.uk/emc/product/5357/smpc"},{"id":"ustekinumab","title":"Ustekinumab","subtitle":"Stelara®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 51%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Humanised IgG1κ monoclonal antibody that binds to the shared p40\nprotein subunit of IL-12 and IL-23<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p><strong>PsA<\/strong> - 45mg sc then 45mg 4 weeks later and then 45mg\n12 weekly. Consider 90mg dose if &gt;100kg<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed preparation<\/td>\n<td><blockquote>\n<p>Pre-filled syringe<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta340\"><u>TA340<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal/hepatic Impairment<\/td>\n<td><blockquote>\n<p>Not studied : no recommendations can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Caution in active or chronic infection<\/p>\n<p>Caution if history of malignancy<\/p>\n<p>Latex allergy - avoid pre-filled syringe<\/p>\n<p>Risk of hypersensitivity reaction<\/p>\n<p>Manufacturer advise to avoid use of live vaccine<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Pregnancy &amp; Breastfeeding:<\/p>\n<p>(manufacturer advise)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use contraception during and for\nat least 15 weeks after treatment .<\/p>\n<p>No data for use in pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus\nno worsening of criteria<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot (if appropriate),\nand HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Consider pregnancy test<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly &gt; 60 yrs - skin checks\nfor non-melanoma skin cancer<\/p>\n<p>Monitor for symptoms of erythrodermic psoriasis or exfoliative\ndermatitis<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Active infection /symptoms suggestive of tuberculosis<\/p>\n<p>Symptoms of erythrodermic psoriasis or exfoliative dermatitis<\/p>\n<p>Symptoms suggestive of hypersensitivity - injection site rash, rash,\nurticaria and/or dyspnea<\/p>\n<p>Lupus related conditions: If lesions occur in sun exposed area or if\naccompanied by arthralgia to seek urgent medical attention<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td colspan=\"2\">Please refer to licensed datasheet for more\ncomprehensive prescribing information :\n<u>https://www.medicines.org.uk/emc/product/4412/smpc<\/u><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Humanised IgG1κ monoclonal antibody that binds to the shared p40\nprotein subunit of IL-12 and IL-23<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p><strong>PsA<\/strong> - 45mg sc then 45mg 4 weeks later and then 45mg\n12 weekly. Consider 90mg dose if &gt;100kg<\/p>\n<\/blockquote>"},"licensed-preparation":{"label":"Licensed preparation","html":"<blockquote>\n<p>Pre-filled syringe<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta340\"><u>TA340<\/u><\/a><\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"renal-hepatic-impairment":{"label":"Renal/hepatic Impairment","html":"<blockquote>\n<p>Not studied : no recommendations can be made<\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Caution in active or chronic infection<\/p>\n<p>Caution if history of malignancy<\/p>\n<p>Latex allergy - avoid pre-filled syringe<\/p>\n<p>Risk of hypersensitivity reaction<\/p>\n<p>Manufacturer advise to avoid use of live vaccine<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advise":{"label":"Pregnancy & Breastfeeding: (manufacturer advise)","html":"<blockquote>\n<p>Women of childbearing potential to use contraception during and for\nat least 15 weeks after treatment .<\/p>\n<p>No data for use in pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus\nno worsening of criteria<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot (if appropriate),\nand HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Consider pregnancy test<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly &gt; 60 yrs - skin checks\nfor non-melanoma skin cancer<\/p>\n<p>Monitor for symptoms of erythrodermic psoriasis or exfoliative\ndermatitis<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Active infection /symptoms suggestive of tuberculosis<\/p>\n<p>Symptoms of erythrodermic psoriasis or exfoliative dermatitis<\/p>\n<p>Symptoms suggestive of hypersensitivity - injection site rash, rash,\nurticaria and/or dyspnea<\/p>\n<p>Lupus related conditions: If lesions occur in sun exposed area or if\naccompanied by arthralgia to seek urgent medical attention<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Humanised IgG1κ monoclonal antibody that binds to the shared p40 protein subunit of IL-12 and IL-23 Licensed Dose: PsA - 45mg sc then 45mg 4 weeks later and then 45mg 12 weekly. Consider 90mg dose if >100kg Licensed preparation Pre-filled syringe NICE Guidance: TA340 Elderly No dose adjustment Renal/hepatic Impairment Not studied : no recommendations can be made Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Caution in active or chronic infection Caution if history of malignancy Latex allergy - avoid pre-filled syringe Risk of hypersensitivity reaction Manufacturer advise to avoid use of live vaccine Pregnancy & Breastfeeding: (manufacturer advise) Women of childbearing potential to use contraception during and for at least 15 weeks after treatment . No data for use in pregnancy Breastfeeding safety unknown Assessment of Response: PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus no worsening of criteria Baseline Tests: FBC LFT’s U&E Consider CXR Consider Hepatitis B and C, QuantiFERON or T-spot (if appropriate), and HIV testing Consider Urinalysis Consider pregnancy test Routine Monitoring: Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly > 60 yrs - skin checks for non-melanoma skin cancer Monitor for symptoms of erythrodermic psoriasis or exfoliative dermatitis Indications for Stopping Therapy: Active infection /symptoms suggestive of tuberculosis Symptoms of erythrodermic psoriasis or exfoliative dermatitis Symptoms suggestive of hypersensitivity - injection site rash, rash, urticaria and/or dyspnea Lupus related conditions: If lesions occur in sun exposed area or if accompanied by arthralgia to seek urgent medical attention Please refer to licensed datasheet for more comprehensive prescribing information : https://www.medicines.org.uk/emc/product/4412/smpc"},{"id":"tsdmards","title":"tsDMARDs overview","group":"Targeted synthetic (tsDMARDs)","kind":"chapter","html":"","text":""},{"id":"apremilast","title":"Apremilast","subtitle":"Otezla®","group":"Targeted synthetic (tsDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 41%\" />\n<col style=\"width: 58%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th>PDE-4 inhibitor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td><strong>PsA<\/strong> - Day 1 10mg od, Day 2 10mg bd, Day 3 10mg om +\n20mg on, Day 4 20mg bd, Day 5 20mg om + 30mg on then Day 6+ 30mg bd and\ncontinue<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta433\">TA433<\/a><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal Impairment<\/td>\n<td>Dose adjustment only when CrCl &lt; 30ml/min - titrate using morning\ndose only to max 30mg od<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic impairment/elderly<\/td>\n<td>No dose adjustment required (higher risk GI effects in elderly)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><p>GI side effects common in first 2- 4 weeks<\/p>\n<p>Use associated with insomnia and depression - caution in patients\nprior hx, counsel re reporting suicidal ideation/mood change<\/p>\n<p>Contains lactose - avoid in <mark>Lapp lactase deficiency or\nglucose-galactose malabsorption<\/mark><\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td><p>No data but manufacturer recommends women of childbearing\npotential should use an effective method of contraception to prevent\npregnancy during treatment.<\/p>\n<p>Contraindicated in pregnancy and breast-feeding<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td>PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus\nno worsening of criteria<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>Body weight<\/p>\n<p>Consider history of psychiatric/depression<\/p>\n<p>*Consider pregnancy test<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>Monitor for weight loss - weight check each clinic visit -\ndiscontinuation of treatment should be considered in unexplained and\nclinically significant weight loss<\/p>\n<p>Changes in mood<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>Severe diarrhoea, nausea, or vomiting - discontinue<\/p>\n<p>Significant weight loss in patients especially if pre-existing low\nBMI<\/p>\n<p>Change in mood/suicidal thoughts/insomnia<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>Please refer to licensed datasheet for more comprehensive prescribing\ninformation:<\/p>\n<p>Otezla 30 mg Film-Coated Tablets - Summary of Product Characteristics\n(SmPC) - (emc) (medicines.org.uk)<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"PDE-4 inhibitor"},"licensed-dose":{"label":"Licensed Dose","html":"<strong>PsA<\/strong> - Day 1 10mg od, Day 2 10mg bd, Day 3 10mg om +\n20mg on, Day 4 20mg bd, Day 5 20mg om + 30mg on then Day 6+ 30mg bd and\ncontinue"},"nice-guidance":{"label":"NICE Guidance","html":"<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta433\">TA433<\/a>"},"renal-impairment":{"label":"Renal Impairment","html":"Dose adjustment only when CrCl &lt; 30ml/min - titrate using morning\ndose only to max 30mg od"},"hepatic-impairment-elderly":{"label":"Hepatic impairment/elderly","html":"No dose adjustment required (higher risk GI effects in elderly)"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<p>GI side effects common in first 2- 4 weeks<\/p>\n<p>Use associated with insomnia and depression - caution in patients\nprior hx, counsel re reporting suicidal ideation/mood change<\/p>\n<p>Contains lactose - avoid in <mark>Lapp lactase deficiency or\nglucose-galactose malabsorption<\/mark><\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"<p>No data but manufacturer recommends women of childbearing\npotential should use an effective method of contraception to prevent\npregnancy during treatment.<\/p>\n<p>Contraindicated in pregnancy and breast-feeding<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus\nno worsening of criteria"},"baseline-tests":{"label":"Baseline Tests","html":"<p>Body weight<\/p>\n<p>Consider history of psychiatric/depression<\/p>\n<p>*Consider pregnancy test<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>Monitor for weight loss - weight check each clinic visit -\ndiscontinuation of treatment should be considered in unexplained and\nclinically significant weight loss<\/p>\n<p>Changes in mood<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>Severe diarrhoea, nausea, or vomiting - discontinue<\/p>\n<p>Significant weight loss in patients especially if pre-existing low\nBMI<\/p>\n<p>Change in mood/suicidal thoughts/insomnia<\/p>"}},"text":"Therapeutic class: PDE-4 inhibitor Licensed Dose: PsA - Day 1 10mg od, Day 2 10mg bd, Day 3 10mg om + 20mg on, Day 4 20mg bd, Day 5 20mg om + 30mg on then Day 6+ 30mg bd and continue NICE Guidance: TA433 Renal Impairment Dose adjustment only when CrCl < 30ml/min - titrate using morning dose only to max 30mg od Hepatic impairment/elderly No dose adjustment required (higher risk GI effects in elderly) Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) GI side effects common in first 2- 4 weeks Use associated with insomnia and depression - caution in patients prior hx, counsel re reporting suicidal ideation/mood change Contains lactose - avoid in Lapp lactase deficiency or glucose-galactose malabsorption Pregnancy & Breastfeeding: No data but manufacturer recommends women of childbearing potential should use an effective method of contraception to prevent pregnancy during treatment. Contraindicated in pregnancy and breast-feeding Assessment of Response: PsA- PsARC 24 wk, 2 out of 4 incl joint tenderness or swelling, plus no worsening of criteria Baseline Tests: Body weight Consider history of psychiatric/depression *Consider pregnancy test Routine Monitoring: Monitor for weight loss - weight check each clinic visit - discontinuation of treatment should be considered in unexplained and clinically significant weight loss Changes in mood Indications for Stopping Therapy: Severe diarrhoea, nausea, or vomiting - discontinue Significant weight loss in patients especially if pre-existing low BMI Change in mood/suicidal thoughts/insomnia Please refer to licensed datasheet for more comprehensive prescribing information: Please refer to licensed datasheet for more comprehensive prescribing information: Otezla 30 mg Film-Coated Tablets - Summary of Product Characteristics (SmPC) - (emc) (medicines.org.uk)"},{"id":"avacopan","title":"Avacopan","subtitle":"Tavneos®","group":"Targeted synthetic (tsDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 41%\" />\n<col style=\"width: 58%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th>Complement 5a receptor (C5aR1) antagonist<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td>30mg BD<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><p>For use in severe, active GPA or MPA alongside either\ncyclophosphamide (followed by treatment with azathioprine or\nmycophenolate) or rituximab.<\/p>\n<p>Clinical study data are limited to 12 months’ treatment with\nAvacopan.<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal Impairment<\/td>\n<td><p>No dose adjustment needed.<\/p>\n<p>Avacopan has not been used in patients requiring renal support\n(dialysis), or with eGFR &lt;15<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic impairment/elderly<\/td>\n<td><p>Elderly people or those with mild or moderate hepatic impairment:\nno dose adjustment required.<\/p>\n<p>Severe hepatic impairment: no data available and not\nrecommended.<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><p>Avoid concomitant use with strong CYP3A4 enzyme inducers (e.g.,\ncarbamazepine, enzalutamide, mitotane, phenobarbital, phenytoin,\nrifampicin, and St. John's Wort)<\/p>\n<p>Contraindicated if neutrophil count &lt;1.5 x 10<sup>9<\/sup>/litre,\nlymphocyte count &lt;0.5 x 10<sup>9<\/sup>/litre, or total WCC &lt; 3.5 x\n10<sup>9<\/sup>/litre.<\/p>\n<p>There is a known association with hepatic dysfunction. Avoid in\nsevere liver disease (Child-Pugh Class C).<\/p>\n<p>Not studied in patients with eGFR&lt;15 or requiring dialysis<\/p>\n<p>Not studied in patients with severe disease manifested as alveolar\nhaemorrhage<\/p>\n<p>Pneumocystis jirovecii pneumonia prophylaxis is recommended.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td><p>No data.<\/p>\n<p>Recommended avoid in Pregnancy or breast feeding.<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td>In clinical trials, patients required less steroid compared to\nplacebo. Monitor response according to clinical systems affected by\nvasculitis.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>FBC, LFT<\/p>\n<p>Consider serology for hepatitis B, hepatitis C, and HIV, plus\nquantiferon or T-Spot: Avacopan has not been used in people with these\ncomorbidities.<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>FBC, LFT every 3 months. No data available for use of avacopan\nbeyond 12 months.<\/p>\n<p>Patients should be advised to contact their rheumatology team if they\ndevelop signs of infection, unexpected bruising, or bleeding.<\/p>\n<p>At clinical review, be vigilant for symptoms or signs of Neisseria\ninfections.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>ALT or AST &gt; 8 × ULN, ALT or AST &gt; 5 × ULN for &gt; 2\nweeks, ALT or AST &gt; 3 × ULN and total bilirubin &gt; 2 × ULN or\ninternational normalised ratio (INR) &gt; 1.5<\/p>\n<p>ALT or AST &gt; 3 × ULN with symptoms: fatigue, nausea, vomiting,\nright upper quadrant pain or tenderness, fever, rash, and/or\neosinophilia (&gt; 5%)<\/p>\n<p>Leukopenia (neutrophil count &lt;1.0 x 10<sup>9<\/sup>/litre,\nlymphocyte count &lt;0.2 x 10<sup>9<\/sup>/litre, or total WCC &lt; 2 x\n10<sup>9<\/sup>/litre.<\/p>\n<p>Active, serious infection<\/p>\n<p>Angioedema<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\">Please refer to licensed datasheet for more\ncomprehensive prescribing information: Tavneos (Avacopan) - Summary of\nProduct Characteristics (SmPC) - (emc) (medicines.org.uk)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"Complement 5a receptor (C5aR1) antagonist"},"licensed-dose":{"label":"Licensed Dose","html":"30mg BD"},"nice-guidance":{"label":"NICE Guidance","html":"<p>For use in severe, active GPA or MPA alongside either\ncyclophosphamide (followed by treatment with azathioprine or\nmycophenolate) or rituximab.<\/p>\n<p>Clinical study data are limited to 12 months’ treatment with\nAvacopan.<\/p>"},"renal-impairment":{"label":"Renal Impairment","html":"<p>No dose adjustment needed.<\/p>\n<p>Avacopan has not been used in patients requiring renal support\n(dialysis), or with eGFR &lt;15<\/p>"},"hepatic-impairment-elderly":{"label":"Hepatic impairment/elderly","html":"<p>Elderly people or those with mild or moderate hepatic impairment:\nno dose adjustment required.<\/p>\n<p>Severe hepatic impairment: no data available and not\nrecommended.<\/p>"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<p>Avoid concomitant use with strong CYP3A4 enzyme inducers (e.g.,\ncarbamazepine, enzalutamide, mitotane, phenobarbital, phenytoin,\nrifampicin, and St. John's Wort)<\/p>\n<p>Contraindicated if neutrophil count &lt;1.5 x 10<sup>9<\/sup>/litre,\nlymphocyte count &lt;0.5 x 10<sup>9<\/sup>/litre, or total WCC &lt; 3.5 x\n10<sup>9<\/sup>/litre.<\/p>\n<p>There is a known association with hepatic dysfunction. Avoid in\nsevere liver disease (Child-Pugh Class C).<\/p>\n<p>Not studied in patients with eGFR&lt;15 or requiring dialysis<\/p>\n<p>Not studied in patients with severe disease manifested as alveolar\nhaemorrhage<\/p>\n<p>Pneumocystis jirovecii pneumonia prophylaxis is recommended.<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"<p>No data.<\/p>\n<p>Recommended avoid in Pregnancy or breast feeding.<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"In clinical trials, patients required less steroid compared to\nplacebo. Monitor response according to clinical systems affected by\nvasculitis."},"baseline-tests":{"label":"Baseline Tests","html":"<p>FBC, LFT<\/p>\n<p>Consider serology for hepatitis B, hepatitis C, and HIV, plus\nquantiferon or T-Spot: Avacopan has not been used in people with these\ncomorbidities.<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>FBC, LFT every 3 months. No data available for use of avacopan\nbeyond 12 months.<\/p>\n<p>Patients should be advised to contact their rheumatology team if they\ndevelop signs of infection, unexpected bruising, or bleeding.<\/p>\n<p>At clinical review, be vigilant for symptoms or signs of Neisseria\ninfections.<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>ALT or AST &gt; 8 × ULN, ALT or AST &gt; 5 × ULN for &gt; 2\nweeks, ALT or AST &gt; 3 × ULN and total bilirubin &gt; 2 × ULN or\ninternational normalised ratio (INR) &gt; 1.5<\/p>\n<p>ALT or AST &gt; 3 × ULN with symptoms: fatigue, nausea, vomiting,\nright upper quadrant pain or tenderness, fever, rash, and/or\neosinophilia (&gt; 5%)<\/p>\n<p>Leukopenia (neutrophil count &lt;1.0 x 10<sup>9<\/sup>/litre,\nlymphocyte count &lt;0.2 x 10<sup>9<\/sup>/litre, or total WCC &lt; 2 x\n10<sup>9<\/sup>/litre.<\/p>\n<p>Active, serious infection<\/p>\n<p>Angioedema<\/p>"}},"text":"Therapeutic class: Complement 5a receptor (C5aR1) antagonist Licensed Dose: 30mg BD NICE Guidance: For use in severe, active GPA or MPA alongside either cyclophosphamide (followed by treatment with azathioprine or mycophenolate) or rituximab. Clinical study data are limited to 12 months’ treatment with Avacopan. Renal Impairment No dose adjustment needed. Avacopan has not been used in patients requiring renal support (dialysis), or with eGFR <15 Hepatic impairment/elderly Elderly people or those with mild or moderate hepatic impairment: no dose adjustment required. Severe hepatic impairment: no data available and not recommended. Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Avoid concomitant use with strong CYP3A4 enzyme inducers (e.g., carbamazepine, enzalutamide, mitotane, phenobarbital, phenytoin, rifampicin, and St. John's Wort) Contraindicated if neutrophil count <1.5 x 10 9 /litre, lymphocyte count <0.5 x 10 9 /litre, or total WCC < 3.5 x 10 9 /litre. There is a known association with hepatic dysfunction. Avoid in severe liver disease (Child-Pugh Class C). Not studied in patients with eGFR<15 or requiring dialysis Not studied in patients with severe disease manifested as alveolar haemorrhage Pneumocystis jirovecii pneumonia prophylaxis is recommended. Pregnancy & Breastfeeding: No data. Recommended avoid in Pregnancy or breast feeding. Assessment of Response: In clinical trials, patients required less steroid compared to placebo. Monitor response according to clinical systems affected by vasculitis. Baseline Tests: FBC, LFT Consider serology for hepatitis B, hepatitis C, and HIV, plus quantiferon or T-Spot: Avacopan has not been used in people with these comorbidities. Routine Monitoring: FBC, LFT every 3 months. No data available for use of avacopan beyond 12 months. Patients should be advised to contact their rheumatology team if they develop signs of infection, unexpected bruising, or bleeding. At clinical review, be vigilant for symptoms or signs of Neisseria infections. Indications for Stopping Therapy: ALT or AST > 8 × ULN, ALT or AST > 5 × ULN for > 2 weeks, ALT or AST > 3 × ULN and total bilirubin > 2 × ULN or international normalised ratio (INR) > 1.5 ALT or AST > 3 × ULN with symptoms: fatigue, nausea, vomiting, right upper quadrant pain or tenderness, fever, rash, and/or eosinophilia (> 5%) Leukopenia (neutrophil count <1.0 x 10 9 /litre, lymphocyte count <0.2 x 10 9 /litre, or total WCC < 2 x 10 9 /litre. Active, serious infection Angioedema Please refer to licensed datasheet for more comprehensive prescribing information: Tavneos (Avacopan) - Summary of Product Characteristics (SmPC) - (emc) (medicines.org.uk)"},{"id":"baricitinib","title":"Baricitinib","subtitle":"Olumiant®","group":"Targeted synthetic (tsDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 39%\" />\n<col style=\"width: 60%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th>Reversible JAK 1 and JAK 2 inhibitor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td><strong>Moderate to Severe RA (DAS28 &gt;5.1) - 4mg od with or\nwithout mtx (↓2mg od chronic/recurrent infection/≥ 75\nyears)<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta466\">TA466<\/a><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal Impairment<\/td>\n<td><p>CrCl 30-60ml/min 2mg od<\/p>\n<p>CrCl &lt;30ml/min do <strong>not<\/strong> use<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic Impairment<\/td>\n<td><p>Mild/mod - no dose ↓<\/p>\n<p>Severe - do not use in severe cirrhosis (Childs Pugh C)<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><p>MHRA have issued warnings of the association with JAK inhibitors\nand venous thromobo-embolism (VTE), major adverse cardiovascular events\n(MACE) and cancer.<\/p>\n<p>Unless there are no suitable alternative DMARDs, MHRA advises avoid\nin patients who:<\/p>\n<p>• Are aged 65 years or olde<\/p>\n<p>• Are current or past long-time smokers<\/p>\n<p>• Have other cardiovascular disease or malignancy risk factors<\/p>\n<p>Advised use with caution in patients with risk factors for VTE<\/p>\n<p>Use lower doses in patients with risk factors<\/p>\n<p>Use with caution in patients with diverticular disease, and those on\nlong-term medicines associated with increased risk of diverticulitis\n(NSAIDs, corticosteroids, and opioids).Contraindication absolute\nlymphocytes count &lt;0.5 x 10<sup>9<\/sup>cells/L, ANC &lt;1.0 x\n10<sup>9<\/sup>cells/L, Hb &lt;8g/dL Risk DVT/PE - use with caution in\nhigh risk individuals (older age, obesity, PMH DE/PVT, surgery and\nimmobile)<\/p>\n<p>Risk of herpes virus reactivation<\/p>\n<p>Contraindicated in active TB and other serious infection.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td><p>Manufacturer advises women of child-bearing potential to use\ncontraception during treatment and at least 1 week after stopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td>NICE - moderate EULAR response at 6 months<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>FBC, U&amp;E, LFT’s<\/p>\n<p>Quantiferon or T-spot if appropriate<\/p>\n<p>Hepatitis B and C (patients with active hepatitis B or C infection\nwere excluded from clinical trials. Monitor for expression of Hep B\nvirus DNA – consult hepatologist)/HIV<\/p>\n<p>Lipids<\/p>\n<p>Risk of herpes zoster re-activation. Consider herpes Zoster vaccine\nin patients at least 2 weeks, ideally 4 weeks, before starting this\nDMARD<\/p>\n<p>Consider pregnancy test<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>As per concurrent DMARD. If monotherapy:<\/p>\n<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then 6 monthly<\/p>\n<p>Check lipids 8-12 weeks after commencement - treat according to\ncurrent guidance and monitor accordingly<\/p>\n<p>CK levels may be elevated – the clinical significance of this is\nunknown<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>Hb &lt;8g/dL<\/p>\n<p>ALC &lt;0.5 x 10<sup>9<\/sup> cells/L ANC &lt;1.0 x 10<sup>9<\/sup>\ncells/L<\/p>\n<p>ALT/AST &gt; x3 ULN<\/p>\n<p>CrCl &lt;30ml/min<\/p>\n<p>Suspected DVT/PE, MACE or cancer<\/p>\n<p>Herpes Zoster/Simplex infection<\/p>\n<p>Active infection not responding to standard treatment<\/p>\n<p>Pregnancy<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>Olumiant 2 mg Film-Coated Tablets - Summary of Product\nCharacteristics (SmPC) - (emc) (medicines.org.uk)<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"Reversible JAK 1 and JAK 2 inhibitor"},"licensed-dose":{"label":"Licensed Dose","html":"<strong>Moderate to Severe RA (DAS28 &gt;5.1) - 4mg od with or\nwithout mtx (↓2mg od chronic/recurrent infection/≥ 75\nyears)<\/strong>"},"nice-guidance":{"label":"NICE Guidance","html":"<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta466\">TA466<\/a>"},"renal-impairment":{"label":"Renal Impairment","html":"<p>CrCl 30-60ml/min 2mg od<\/p>\n<p>CrCl &lt;30ml/min do <strong>not<\/strong> use<\/p>"},"hepatic-impairment":{"label":"Hepatic Impairment","html":"<p>Mild/mod - no dose ↓<\/p>\n<p>Severe - do not use in severe cirrhosis (Childs Pugh C)<\/p>"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<p>MHRA have issued warnings of the association with JAK inhibitors\nand venous thromobo-embolism (VTE), major adverse cardiovascular events\n(MACE) and cancer.<\/p>\n<p>Unless there are no suitable alternative DMARDs, MHRA advises avoid\nin patients who:<\/p>\n<p>• Are aged 65 years or olde<\/p>\n<p>• Are current or past long-time smokers<\/p>\n<p>• Have other cardiovascular disease or malignancy risk factors<\/p>\n<p>Advised use with caution in patients with risk factors for VTE<\/p>\n<p>Use lower doses in patients with risk factors<\/p>\n<p>Use with caution in patients with diverticular disease, and those on\nlong-term medicines associated with increased risk of diverticulitis\n(NSAIDs, corticosteroids, and opioids).Contraindication absolute\nlymphocytes count &lt;0.5 x 10<sup>9<\/sup>cells/L, ANC &lt;1.0 x\n10<sup>9<\/sup>cells/L, Hb &lt;8g/dL Risk DVT/PE - use with caution in\nhigh risk individuals (older age, obesity, PMH DE/PVT, surgery and\nimmobile)<\/p>\n<p>Risk of herpes virus reactivation<\/p>\n<p>Contraindicated in active TB and other serious infection.<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"<p>Manufacturer advises women of child-bearing potential to use\ncontraception during treatment and at least 1 week after stopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"NICE - moderate EULAR response at 6 months"},"baseline-tests":{"label":"Baseline Tests","html":"<p>FBC, U&amp;E, LFT’s<\/p>\n<p>Quantiferon or T-spot if appropriate<\/p>\n<p>Hepatitis B and C (patients with active hepatitis B or C infection\nwere excluded from clinical trials. Monitor for expression of Hep B\nvirus DNA – consult hepatologist)/HIV<\/p>\n<p>Lipids<\/p>\n<p>Risk of herpes zoster re-activation. Consider herpes Zoster vaccine\nin patients at least 2 weeks, ideally 4 weeks, before starting this\nDMARD<\/p>\n<p>Consider pregnancy test<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>As per concurrent DMARD. If monotherapy:<\/p>\n<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then 6 monthly<\/p>\n<p>Check lipids 8-12 weeks after commencement - treat according to\ncurrent guidance and monitor accordingly<\/p>\n<p>CK levels may be elevated – the clinical significance of this is\nunknown<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>Hb &lt;8g/dL<\/p>\n<p>ALC &lt;0.5 x 10<sup>9<\/sup> cells/L ANC &lt;1.0 x 10<sup>9<\/sup>\ncells/L<\/p>\n<p>ALT/AST &gt; x3 ULN<\/p>\n<p>CrCl &lt;30ml/min<\/p>\n<p>Suspected DVT/PE, MACE or cancer<\/p>\n<p>Herpes Zoster/Simplex infection<\/p>\n<p>Active infection not responding to standard treatment<\/p>\n<p>Pregnancy<\/p>"}},"text":"Therapeutic class: Reversible JAK 1 and JAK 2 inhibitor Licensed Dose: Moderate to Severe RA (DAS28 >5.1) - 4mg od with or without mtx (↓2mg od chronic/recurrent infection/≥ 75 years) NICE Guidance: TA466 Renal Impairment CrCl 30-60ml/min 2mg od CrCl <30ml/min do not use Hepatic Impairment Mild/mod - no dose ↓ Severe - do not use in severe cirrhosis (Childs Pugh C) Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) MHRA have issued warnings of the association with JAK inhibitors and venous thromobo-embolism (VTE), major adverse cardiovascular events (MACE) and cancer. Unless there are no suitable alternative DMARDs, MHRA advises avoid in patients who: • Are aged 65 years or olde • Are current or past long-time smokers • Have other cardiovascular disease or malignancy risk factors Advised use with caution in patients with risk factors for VTE Use lower doses in patients with risk factors Use with caution in patients with diverticular disease, and those on long-term medicines associated with increased risk of diverticulitis (NSAIDs, corticosteroids, and opioids).Contraindication absolute lymphocytes count <0.5 x 10 9 cells/L, ANC <1.0 x 10 9 cells/L, Hb <8g/dL Risk DVT/PE - use with caution in high risk individuals (older age, obesity, PMH DE/PVT, surgery and immobile) Risk of herpes virus reactivation Contraindicated in active TB and other serious infection. Pregnancy & Breastfeeding: Manufacturer advises women of child-bearing potential to use contraception during treatment and at least 1 week after stopping. Avoid in pregnancy and breast-feeding Assessment of Response: NICE - moderate EULAR response at 6 months Baseline Tests: FBC, U&E, LFT’s Quantiferon or T-spot if appropriate Hepatitis B and C (patients with active hepatitis B or C infection were excluded from clinical trials. Monitor for expression of Hep B virus DNA – consult hepatologist)/HIV Lipids Risk of herpes zoster re-activation. Consider herpes Zoster vaccine in patients at least 2 weeks, ideally 4 weeks, before starting this DMARD Consider pregnancy test Routine Monitoring: As per concurrent DMARD. If monotherapy: FBC, U&Es, LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months and then 6 monthly Check lipids 8-12 weeks after commencement - treat according to current guidance and monitor accordingly CK levels may be elevated – the clinical significance of this is unknown Indications for Stopping Therapy: Hb <8g/dL ALC <0.5 x 10 9 cells/L ANC <1.0 x 10 9 cells/L ALT/AST > x3 ULN CrCl <30ml/min Suspected DVT/PE, MACE or cancer Herpes Zoster/Simplex infection Active infection not responding to standard treatment Pregnancy Please refer to licensed datasheet for more comprehensive prescribing information: Olumiant 2 mg Film-Coated Tablets - Summary of Product Characteristics (SmPC) - (emc) (medicines.org.uk)"},{"id":"filgotinib","title":"Filgotinib","subtitle":"Jyseleca®","group":"Targeted synthetic (tsDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 41%\" />\n<col style=\"width: 58%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th>Selective inhibitor of Janus- associated tyrosine kinase JAK 1.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td><strong>Moderate to Severe RA (DAS28 ≥3.2)<\/strong> - 200mg od with\nor without mtx (100mg od if aged over 65 or other risk factors\npresent)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td>Overview | Filgotinib for treating moderate to severe rheumatoid\narthritis | Guidance | NICE<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal Impairment<\/td>\n<td>Reduce dose to 100mg OD if moderate or severe renal impairment.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic Impairment<\/td>\n<td><p>Mild/mod - no dose ↓<\/p>\n<p>Severe - do not use – (Child Pugh C)<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><p>MHRA have issued warnings of the association with JAK inhibitors\nand VTE, MACE and cancer.<\/p>\n<p>Unless there are no suitable alternative DMARDs, MHRA advises avoid\nin patients who:<\/p>\n<ul>\n<li><p>Are aged 65 years or olde<\/p><\/li>\n<li><p>Are current or past long-time smokers<\/p><\/li>\n<li><p>Have other cardiovascular disease or malignancy risk\nfactors<\/p><\/li>\n<\/ul>\n<p>Advised use with caution in patients with risk factors for VTE<\/p>\n<p>Use lower doses in patients with risk factors<\/p>\n<p>Use with caution in patients with diverticular disease, and those on\nlong-term medicines associated with increased risk of diverticulitis\n(NSAIDs, corticosteroids, and opioids).<\/p>\n<p>Contraindication absolute lymphocytes count &lt;0.5 x\n10<sup>9<\/sup>cells/L, ANC &lt;1.0 x 10<sup>9<\/sup>cells/L, Hb\n&lt;8g/dL<\/p>\n<p>Contraindicated in active TB and other serious infection.<\/p>\n<p>Risk of herpes virus reactivation<\/p>\n<p>Contains lactose<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td><p>Manufacturer advises women of child-bearing potential to use\ncontraception during treatment and at least 1 week after stopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td>NICE - moderate EULAR response at 6 months<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>FBC, U&amp;E, LFT<\/p>\n<p>Quantiferon or T-spot<\/p>\n<p>Hepatitis B and C (Patients with active hepatitis B or C infection\nwere excluded from clinical trials. Monitor for expression of Hep B\nvirus DNA – consult hepatologist)/HIV<\/p>\n<p>Lipids<\/p>\n<p>Screen for Herpes Zoster<\/p>\n<p>Consider pregnancy test<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months for\n1<sup>st<\/sup> year then 6 monthly<\/p>\n<p>Check lipids 12 weeks after commencement - treat according to current\nguidance and monitor accordingly<\/p>\n<p>MHRA recommends periodically examine all patients' skin for\nmalignancy<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>Stop if Hb is 8 g/dL. Can be restarted once Hb returns above this\nvalue.<\/p>\n<p>Stop if ANC is &lt; 1 × 109 cells/L. Can be restarted once ANC\nreturns above this value<\/p>\n<p>Stop if ALC is &lt; 0.5 × 109 cells/L. Treatment may be restarted\nonce ALC returns above this value<\/p>\n<p>ALT/AST &gt; x3 ULN<\/p>\n<p>CrCl &lt;30ml/min<\/p>\n<p>Suspected DVT/PE, MACE or cancer<\/p>\n<p>Herpes Zoster/Simplex infection<\/p>\n<p>Active infection not responding to standard treatment<\/p>\n<p>Pregnancy<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>Jyseleca 100 mg film-coated tablets - Summary of Product\nCharacteristics (SmPC) - (emc) (medicines.org.uk)<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"Selective inhibitor of Janus- associated tyrosine kinase JAK 1."},"licensed-dose":{"label":"Licensed Dose","html":"<strong>Moderate to Severe RA (DAS28 ≥3.2)<\/strong> - 200mg od with\nor without mtx (100mg od if aged over 65 or other risk factors\npresent)"},"nice-guidance":{"label":"NICE Guidance","html":"Overview | Filgotinib for treating moderate to severe rheumatoid\narthritis | Guidance | NICE"},"renal-impairment":{"label":"Renal Impairment","html":"Reduce dose to 100mg OD if moderate or severe renal impairment."},"hepatic-impairment":{"label":"Hepatic Impairment","html":"<p>Mild/mod - no dose ↓<\/p>\n<p>Severe - do not use – (Child Pugh C)<\/p>"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<p>MHRA have issued warnings of the association with JAK inhibitors\nand VTE, MACE and cancer.<\/p>\n<p>Unless there are no suitable alternative DMARDs, MHRA advises avoid\nin patients who:<\/p>\n<ul>\n<li><p>Are aged 65 years or olde<\/p><\/li>\n<li><p>Are current or past long-time smokers<\/p><\/li>\n<li><p>Have other cardiovascular disease or malignancy risk\nfactors<\/p><\/li>\n<\/ul>\n<p>Advised use with caution in patients with risk factors for VTE<\/p>\n<p>Use lower doses in patients with risk factors<\/p>\n<p>Use with caution in patients with diverticular disease, and those on\nlong-term medicines associated with increased risk of diverticulitis\n(NSAIDs, corticosteroids, and opioids).<\/p>\n<p>Contraindication absolute lymphocytes count &lt;0.5 x\n10<sup>9<\/sup>cells/L, ANC &lt;1.0 x 10<sup>9<\/sup>cells/L, Hb\n&lt;8g/dL<\/p>\n<p>Contraindicated in active TB and other serious infection.<\/p>\n<p>Risk of herpes virus reactivation<\/p>\n<p>Contains lactose<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"<p>Manufacturer advises women of child-bearing potential to use\ncontraception during treatment and at least 1 week after stopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"NICE - moderate EULAR response at 6 months"},"baseline-tests":{"label":"Baseline Tests","html":"<p>FBC, U&amp;E, LFT<\/p>\n<p>Quantiferon or T-spot<\/p>\n<p>Hepatitis B and C (Patients with active hepatitis B or C infection\nwere excluded from clinical trials. Monitor for expression of Hep B\nvirus DNA – consult hepatologist)/HIV<\/p>\n<p>Lipids<\/p>\n<p>Screen for Herpes Zoster<\/p>\n<p>Consider pregnancy test<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months for\n1<sup>st<\/sup> year then 6 monthly<\/p>\n<p>Check lipids 12 weeks after commencement - treat according to current\nguidance and monitor accordingly<\/p>\n<p>MHRA recommends periodically examine all patients' skin for\nmalignancy<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>Stop if Hb is 8 g/dL. Can be restarted once Hb returns above this\nvalue.<\/p>\n<p>Stop if ANC is &lt; 1 × 109 cells/L. Can be restarted once ANC\nreturns above this value<\/p>\n<p>Stop if ALC is &lt; 0.5 × 109 cells/L. Treatment may be restarted\nonce ALC returns above this value<\/p>\n<p>ALT/AST &gt; x3 ULN<\/p>\n<p>CrCl &lt;30ml/min<\/p>\n<p>Suspected DVT/PE, MACE or cancer<\/p>\n<p>Herpes Zoster/Simplex infection<\/p>\n<p>Active infection not responding to standard treatment<\/p>\n<p>Pregnancy<\/p>"}},"text":"Therapeutic class: Selective inhibitor of Janus- associated tyrosine kinase JAK 1. Licensed Dose: Moderate to Severe RA (DAS28 ≥3.2) - 200mg od with or without mtx (100mg od if aged over 65 or other risk factors present) NICE Guidance: Overview | Filgotinib for treating moderate to severe rheumatoid arthritis | Guidance | NICE Renal Impairment Reduce dose to 100mg OD if moderate or severe renal impairment. Hepatic Impairment Mild/mod - no dose ↓ Severe - do not use – (Child Pugh C) Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) MHRA have issued warnings of the association with JAK inhibitors and VTE, MACE and cancer. Unless there are no suitable alternative DMARDs, MHRA advises avoid in patients who: Are aged 65 years or olde Are current or past long-time smokers Have other cardiovascular disease or malignancy risk factors Advised use with caution in patients with risk factors for VTE Use lower doses in patients with risk factors Use with caution in patients with diverticular disease, and those on long-term medicines associated with increased risk of diverticulitis (NSAIDs, corticosteroids, and opioids). Contraindication absolute lymphocytes count <0.5 x 10 9 cells/L, ANC <1.0 x 10 9 cells/L, Hb <8g/dL Contraindicated in active TB and other serious infection. Risk of herpes virus reactivation Contains lactose Pregnancy & Breastfeeding: Manufacturer advises women of child-bearing potential to use contraception during treatment and at least 1 week after stopping. Avoid in pregnancy and breast-feeding Assessment of Response: NICE - moderate EULAR response at 6 months Baseline Tests: FBC, U&E, LFT Quantiferon or T-spot Hepatitis B and C (Patients with active hepatitis B or C infection were excluded from clinical trials. Monitor for expression of Hep B virus DNA – consult hepatologist)/HIV Lipids Screen for Herpes Zoster Consider pregnancy test Routine Monitoring: FBC, U&Es, LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months and then every 3 months for 1 st year then 6 monthly Check lipids 12 weeks after commencement - treat according to current guidance and monitor accordingly MHRA recommends periodically examine all patients' skin for malignancy Indications for Stopping Therapy: Stop if Hb is 8 g/dL. Can be restarted once Hb returns above this value. Stop if ANC is < 1 × 109 cells/L. Can be restarted once ANC returns above this value Stop if ALC is < 0.5 × 109 cells/L. Treatment may be restarted once ALC returns above this value ALT/AST > x3 ULN CrCl <30ml/min Suspected DVT/PE, MACE or cancer Herpes Zoster/Simplex infection Active infection not responding to standard treatment Pregnancy Please refer to licensed datasheet for more comprehensive prescribing information: Jyseleca 100 mg film-coated tablets - Summary of Product Characteristics (SmPC) - (emc) (medicines.org.uk)"},{"id":"tofacitinib","title":"Tofacitinib","subtitle":"Citrate (Xeljanz®","group":"Targeted synthetic (tsDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th>JAK inhibitor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td><p><strong>Moderate to severe RA (DAS 28 &gt;5.1) and PSA- 5mg BD\nwith or without MTX (film coated tablets), alternatively 11mg OD\n(modified release tablets).<\/strong><\/p>\n<p><strong>SPA 5mg BD<\/strong> <\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><p>RA: TA480<\/p>\n<p>SPA<u>:<\/u> TA920<\/p>\n<p>PsA: TA543 <\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal Impairment<\/td>\n<td>Dose adjustment only when CrCl &lt;30ml/min: max dose 5mg od<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic Impairment<\/td>\n<td>Avoid in patients with cirrhosis<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><p>C/I ALC &lt;0.75 x 10<sup>9<\/sup>cells/L, ANC &lt;1.0 x\n10<sup>9<\/sup>cells/L, Hb &lt;9g/dL<\/p>\n<p>Gastrointestinal perforation – possible increased risk. Use with\ncaution in those with increased risk (e.g. diverticulosis); promptly\nevaluate abdominal symptoms<\/p>\n<p>Interstitial lung disease – possible increased risk. Increased risk\nof infections in people with underlying lung disease.<\/p>\n<p>Fractures have been observed in patients treated with tofacitinib-\nconsider other risk fractures for fracture.<\/p>\n<p>Hypoglycaemia following initiation of tofacitinib in patients on\nmedication for diabetes.<\/p>\n<p>Reactivation of herpes virus<\/p>\n<p>Contains lactose - avoid <mark>in Lapp lactase deficiency or\nglucose-galactose malabsorption<\/mark><\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td><p>No data. Manufacturer recommends women of child-bearing potential\nto use contraception during treatment and at least 4 weeks after\nstopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td>NICE - moderate EULAR response at 6 months<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>FBC, U&amp;Es, LFTs<\/p>\n<p>Lipids<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, quantiferon ( or T-spot if appropriate),\nHIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Risk of herpes zoster re-activation. Consider herpes Zoster vaccine\nin patients at least 2 weeks, ideally 4 weeks, before starting DMARD<\/p>\n<p>*Consider pregnancy test FBC<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>As per concurrent DMARD. If monotherapy:<\/p>\n<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months<\/p>\n<p>Lipids - at 8-12 weeks, treat according to current guidance<\/p>\n<p>Periodic skin examination (risk non-melanoma skin cancer)<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>Absolute lymphocyte count - 2 sequential routine monitoring\nvalues between 0.5 and 0.75 x 10<sup>9<\/sup> cells/L , stop and restart\nwhen &gt;0.75 x 10<sup>9<\/sup> cells/L . If value &lt;0.5 x\n10<sup>9<\/sup> cells/L repeat test within 7 days and stop if still\n&lt;0.5<\/p>\n<p>ANC - 2 sequential routine monitoring values between 0.5 and 1.0 x\n10<sup>9<\/sup>cells/L , stop and restart when &gt;1.0. If value &lt;0.5\nx 10<sup>9<\/sup>cells/L repeat test within 7 days and stop if still\n&lt;0.5.<\/p>\n<p>Hb - &gt;2g/dL decrease or &lt;8.0g/dL, stop and await normalisation\nof Hb<\/p>\n<p>Serious infection<\/p>\n<p>Pregnancy<\/p>\n<p>Abdominal symptoms suggesting perforation<\/p>\n<p>Increased SOB – concerns regarding possible lung fibrosis<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>XELJANZ 5 mg film-coated tablets - Summary of Product Characteristics\n(SmPC) - (emc) (medicines.org.uk) <\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"JAK inhibitor"},"licensed-dose":{"label":"Licensed Dose","html":"<p><strong>Moderate to severe RA (DA

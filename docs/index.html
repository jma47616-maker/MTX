tudied - no dose recommendation can be made<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advice":{"label":"Pregnancy & breastfeeding (Manufacturer advice)","html":"<blockquote>\n<p>Women of childbearing potential must use effective contraception\nduring treatment and up to 6 months after last dose.<\/p>\n<p>Can be used in pregnancy if indicated. Administration of live\nvaccines to infants exposed in-utero for 6 months after the mother’s\nlast dose of golimumab<\/p>\n<p>Breastfeeding: not recommended<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Assessment of assessment after 3 -4 months , to reconsidertherapy if\nno response<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<ul>\n<li><p>Full clinical/infection screen<\/p><\/li>\n<li><p>Urinalysis &amp; BP<\/p><\/li>\n<li><p>FBC/U&amp;E/LFT/ANA/DNA<\/p><\/li>\n<li><p>CXR (evidence TB/fibrosis)<\/p><\/li>\n<li><p>Quantiferon or T-spot (as indicated)<\/p><\/li>\n<li><p>Hepatitis B and C + consider HIV<\/p><\/li>\n<li><p>Pregnancy test if indicated (though considered safe for\nconception)<\/p><\/li>\n<\/ul>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>Evidence of infection<\/p>\n<p>New onset or exacerbation of demyelination<\/p>\n<p>Lupus like syndrome / autoimmune syndrome<\/p>\n<blockquote>\n<p>Severe injection site reaction (If minor reaction try oral\nanti-histamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote>"}},"text":"Therapeutic Class: Human monoclonal antibody that binds and inhibits soluble and transmembrane human TNF alpha Licensed Indications: Moderate to severe RA (in combination with methotrexate), Psoriatic arthritis (Alone or in combination with MTX) Ankylosing spondylitis /Non-radiographic axial spondyloarthritis Licensed Dose: RA, PsA & AS - 50 mg given once a month by sc injection, on the same date each month. Increased dose: Patients weighing more than 100 kg who do not achieve an adequate clinical response after 3 or 4 doses of 50mg, should have their dose increased to 100 mg once a month. Continued therapy should be reconsidered in patients who show no evidence of therapeutic benefit after receiving 3 to 4 additional doses of 100 mg. Licensed preparation: Prefilled pen and prefilled syringe in 50mg and 100mg strength NICE Guidance: RA: TA375; TA225 (after TNF failure if rituximab CI/failed) PsA: TA220 AS: TA383 nrAS: TA497 Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to the active substance or to any of the excipients - including latex sensitivity (golimumab pen) Active tuberculosis (TB) or other severe infections such as sepsis, and opportunistic infections Moderate or severe heart failure (NYHA class III/IV) Contains Sorbitol - not in hereditary problems with fructose intolerance. Caution in patients with previous malignancy or new malignancy Manufacturer advises avoid use with live vaccines Elderly No dose adjustment Hepatic/Renal impairment Not studied - no dose recommendation can be made Pregnancy & breastfeeding (Manufacturer advice) Women of childbearing potential must use effective contraception during treatment and up to 6 months after last dose. Can be used in pregnancy if indicated. Administration of live vaccines to infants exposed in-utero for 6 months after the mother’s last dose of golimumab Breastfeeding: not recommended Assessment of Response: Assessment of assessment after 3 -4 months , to reconsidertherapy if no response Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA CXR (evidence TB/fibrosis) Quantiferon or T-spot (as indicated) Hepatitis B and C + consider HIV Pregnancy test if indicated (though considered safe for conception) Routine Monitoring: Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Evidence of infection New onset or exacerbation of demyelination Lupus like syndrome / autoimmune syndrome Severe injection site reaction (If minor reaction try oral anti-histamine or topical corticosteroids) Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range AST or ALT > 3 times normal range (iu/L) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/emc/product/5133/smpc"},{"id":"guselkumab","title":"Guselkumab","subtitle":"Tremfya®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Fully humanized IgG1 lamda monoclonal antibody to IL-23 )<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed indication<\/td>\n<td><blockquote>\n<p>PsA (Alone or in combination with methotrexate ) (have had atleast\none biological DMARD or TNF-I CI)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed dose<\/td>\n<td><blockquote>\n<p>100mg at weeks 0 and 4, followed by a maintenance every 8 weeks, sub\ncutaneous . For high risk patients for joint damage according to\nclinical judgement, a dose of 100mg every 4 weeks may be considered<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Licensed Preparation<\/td>\n<td><blockquote>\n<p>Pre-filled pen in 100 mg<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td>PSA: TA815<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal/hepatic impairment<\/td>\n<td><blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Serious hypersensitivity to active substance<\/p>\n<p>Active Infection /Tuberculosis<\/p>\n<p>Caution if history of chronic infection<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; Breastfeeding:<\/p>\n<p>(Manufacture advise)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 12 weeks after treatment.<\/p>\n<p>No data for pregnancy, to avoid<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Assess response from 16 weeks . Stop at 24 weeks if PsARC 2 out of 4\nincluding joint tenderness or swelling score<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Monitor liver enzymes<\/p>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Raised liver enzymes (transaminases)<\/p>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Injection site reaction (redness or burning of the skin)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/9587/smpc\">https://www.medicines.org.uk/emc/product/9587/smpc<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong><br />\n<\/strong><\/p>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Fully humanized IgG1 lamda monoclonal antibody to IL-23 )<\/p>\n<\/blockquote>"},"licensed-indication":{"label":"Licensed indication","html":"<blockquote>\n<p>PsA (Alone or in combination with methotrexate ) (have had atleast\none biological DMARD or TNF-I CI)<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed dose","html":"<blockquote>\n<p>100mg at weeks 0 and 4, followed by a maintenance every 8 weeks, sub\ncutaneous . For high risk patients for joint damage according to\nclinical judgement, a dose of 100mg every 4 weeks may be considered<\/p>\n<\/blockquote>"},"licensed-preparation":{"label":"Licensed Preparation","html":"<blockquote>\n<p>Pre-filled pen in 100 mg<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"PSA: TA815"},"renal-hepatic-impairment":{"label":"Renal/hepatic impairment","html":"<blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Serious hypersensitivity to active substance<\/p>\n<p>Active Infection /Tuberculosis<\/p>\n<p>Caution if history of chronic infection<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacture-advise":{"label":"Pregnancy & Breastfeeding: (Manufacture advise)","html":"<blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 12 weeks after treatment.<\/p>\n<p>No data for pregnancy, to avoid<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Assess response from 16 weeks . Stop at 24 weeks if PsARC 2 out of 4\nincluding joint tenderness or swelling score<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Monitor liver enzymes<\/p>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Raised liver enzymes (transaminases)<\/p>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Injection site reaction (redness or burning of the skin)<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Fully humanized IgG1 lamda monoclonal antibody to IL-23 ) Licensed indication PsA (Alone or in combination with methotrexate ) (have had atleast one biological DMARD or TNF-I CI) Licensed dose 100mg at weeks 0 and 4, followed by a maintenance every 8 weeks, sub cutaneous . For high risk patients for joint damage according to clinical judgement, a dose of 100mg every 4 weeks may be considered Licensed Preparation Pre-filled pen in 100 mg NICE Guidance: PSA: TA815 Renal/hepatic impairment Not studied - no dose recommendation can be made Elderly No dose adjustment Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Serious hypersensitivity to active substance Active Infection /Tuberculosis Caution if history of chronic infection Manufacturer advises avoid use with live vaccines Pregnancy & Breastfeeding: (Manufacture advise) Women of childbearing potential to use an effective contraception during treatment and for at least 12 weeks after treatment. No data for pregnancy, to avoid Breastfeeding safety unknown Assessment of Response: Assess response from 16 weeks . Stop at 24 weeks if PsARC 2 out of 4 including joint tenderness or swelling score Baseline Tests: FBC LFT’s U&E Consider CXR Consider Hepatitis B and C, QuantiFERON or T-spot, and HIV testing Consider Urinalysis *Consider pregnancy test Routine Monitoring: Monitor liver enzymes Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Raised liver enzymes (transaminases) ANC <1.0 x 10 9 cells/L Serious infection or chronic infection not responding to standard treatment Suspected hypersensitivity reaction (injection site rash, rash, urticaria, dyspnoea) Injection site reaction (redness or burning of the skin) Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/9587/smpc"},{"id":"infliximab","title":"Infliximab","subtitle":"Remicade®; Inflectra®; Remsima®; Flixabi®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 39%\" />\n<col style=\"width: 60%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic Class:<\/th>\n<th><blockquote>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAI0AAABmCAYAAAD23RLkAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAADSSURBVHhe7d0xDoRADATB5f7/Z0j2AdeIAIuqZGJLnXsBAAAAAAAAAAAAAAAAwHTH3urcO83de3nAxGimhv46v73wN9GQiYZMNGSiIRMNmWjIREMmGjLRkImGTDRkoiETDZloyERDJhoy0ZCJhkw0ZKIhEw2ZaMhEQyYaMtGQiYZMNGSiIRMNmWjIREMmGjLRkImGTDRkoiETDZloyERDJhoy0ZCJhkw0ZKIhEw2ZaMhEQyYaMtGQiYZMNGSiIRMNmb/cAAAAAAAAAAAAAACfttYF4u8EbdsX4x8AAAAASUVORK5CYII=\"\nstyle=\"width:0.23667in;height:0.17in\" />Chimeric human-murine IgG1\nmonoclonal antibody inhibiting TNF alpha<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p>RA (in combination with methotrexate)<\/p>\n<p>AS<\/p>\n<p>PsA (alone or in combination of Methotrexate)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p><strong>RA<\/strong> -I.V. - 3mg/kg given as an intravenous infusion\nfollowed by additional 3 mg/kg infusion doses at 2 and 6 weeks after the\nfirst infusion, then every 8 weeks thereafter (refer to datasheet\nregarding non-standard increased doses and reduced dosage intervals in\nRA). For disease that has an inadequate response or loss of response\nafter 12 weeks of treatment, consideration may be given to increasing\nthe dose step‑wise by approximately 1.5 mg/kg up to a maximum of 7.5\nmg/kg every 8 weeks. Alternatively, administration of 3 mg/kg as often\nas every 4 weeks may be considered.<\/p>\n<p><strong>S<\/strong>.C.- 120 mg at 1, 2, 3 , 4 weeks after first\ninjection , then every 2 weeks<\/p>\n<p><strong>AS<\/strong> -5 mg/kg given as an intravenous infusion\nfollowed by additional 5 mg/kg infusion doses at 2 and 6 weeks after the\nfirst infusion, then every 8 weeks.<\/p>\n<p><strong>SC<\/strong>: 120 mg every 2 weeks as maintenance therapy 4\nweeks after last administration of 2 IV infusions<\/p>\n<p><strong>PsA<\/strong> - 5mg/kg given as an intravenous infusion\nfollowed by additional 5 mg/kg infusion doses at 2 and 6 weeks after the\nfirst infusion, then every 8 weeks thereafter.<\/p>\n<p>Dosing may be informed by measuring pre-treatment levels<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Preparations:<\/td>\n<td><blockquote>\n<p>100 mg powder vial (Administered in 250ml 0.9% sodium chloride, first\n3 infusions over 2 hours, infusion 4 to 10 over 60 minutes )<\/p>\n<p>120 mg prefilled pen<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u> , <u>TA715<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\"><u>TA199<\/u><\/a><\/p>\n<p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Hypersensitivity to the active substance or to any of the excipients\n(including other murine proteins)<\/p>\n<p>.Active tuberculosis or other severe infections such as sepsis, and\nopportunistic infections<\/p>\n<\/blockquote>\n<p>Moderate to severe heart failure (NYHA class III/IV)<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>Risk of invasive fungal infection<\/p>\n<p>Caution in patients with previous malignancy<\/p>\n<blockquote>\n<p>*Patients treated with infliximab should be given the package leaflet\nand the special Alert card.<\/p>\n<p>Infusion reactions may be increased when combined with\nleflunomide<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hepatic/Renal Impairment<\/td>\n<td><blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; Breastfeeding:<\/p>\n<p>(manufacturer advise)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 6 months after last dose.<\/p>\n<p>Can be used in pregnancy if indicated. Administration of live\nvaccines to infants exposed in-utero for 6 months after the mother’s\nlast dose of infliximab<\/p>\n<p>Breastfeeding: not recommended<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Full assessment of response at weeks 12 and 24, with treatment\nwithdrawal if response is inadequate within 6 months. Response to be\nmonitored atlest every 6 months<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>Quantiferon or T-spot (as indicated)<\/p>\n<p>Hepatitis B&amp;C + consider HIV<\/p>\n<p>Pregnancy test if indicated (though considered safe for\nconception)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard DMARD monitoring FBC/LFT/U&amp;E or 2 monthly\n(before each infusion) + Urinalysis before each infusion Consider\nmeasuring drug levels especially if evidence of secondary non\nresponse<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Evidence of infection<\/p>\n<p>New onset or exacerbation of demyelination<\/p>\n<p>Lupus like syndrome or other autoimmune syndrome<\/p>\n<p>Severe injection site reaction (If minor reaction try oral\nantihistamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<p>Serum Sickness (delayed hypersentivity reaction)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:\n<u>https://www.medicines.org.uk/emc/product/3831/smpc<\/u> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/3710/smpc\"><u>https://www.medicines.org.uk/emc/product/3710/smpc<\/u><\/a>\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/7265/smpc\"><u>https://www.medicines.org.uk/emc/product/7265/smpc<\/u><\/a>\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/3709/smpc\"><u>https://www.medicines.org.uk/emc/product/3709/smpc<\/u><\/a><\/p>\n<p>https://www.medicines.org.uk/emc/product/11101/smpc<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic Class","html":"<blockquote>\n<p><img src=\"content/media/image1.png\"\nstyle=\"width:0.23667in;height:0.17in\" />Chimeric human-murine IgG1\nmonoclonal antibody inhibiting TNF alpha<\/p>\n<\/blockquote>"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p>RA (in combination with methotrexate)<\/p>\n<p>AS<\/p>\n<p>PsA (alone or in combination of Methotrexate)<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p><strong>RA<\/strong> -I.V. - 3mg/kg given as an intravenous infusion\nfollowed by additional 3 mg/kg infusion doses at 2 and 6 weeks after the\nfirst infusion, then every 8 weeks thereafter (refer to datasheet\nregarding non-standard increased doses and reduced dosage intervals in\nRA). For disease that has an inadequate response or loss of response\nafter 12 weeks of treatment, consideration may be given to increasing\nthe dose step‑wise by approximately 1.5 mg/kg up to a maximum of 7.5\nmg/kg every 8 weeks. Alternatively, administration of 3 mg/kg as often\nas every 4 weeks may be considered.<\/p>\n<p><strong>S<\/strong>.C.- 120 mg at 1, 2, 3 , 4 weeks after first\ninjection , then every 2 weeks<\/p>\n<p><strong>AS<\/strong> -5 mg/kg given as an intravenous infusion\nfollowed by additional 5 mg/kg infusion doses at 2 and 6 weeks after the\nfirst infusion, then every 8 weeks.<\/p>\n<p><strong>SC<\/strong>: 120 mg every 2 weeks as maintenance therapy 4\nweeks after last administration of 2 IV infusions<\/p>\n<p><strong>PsA<\/strong> - 5mg/kg given as an intravenous infusion\nfollowed by additional 5 mg/kg infusion doses at 2 and 6 weeks after the\nfirst infusion, then every 8 weeks thereafter.<\/p>\n<p>Dosing may be informed by measuring pre-treatment levels<\/p>\n<\/blockquote>"},"preparations":{"label":"Preparations","html":"<blockquote>\n<p>100 mg powder vial (Administered in 250ml 0.9% sodium chloride, first\n3 infusions over 2 hours, infusion 4 to 10 over 60 minutes )<\/p>\n<p>120 mg prefilled pen<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u> , <u>TA715<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\"><u>TA199<\/u><\/a><\/p>\n<p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<\/blockquote>"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to the active substance or to any of the excipients\n(including other murine proteins)<\/p>\n<p>.Active tuberculosis or other severe infections such as sepsis, and\nopportunistic infections<\/p>\n<\/blockquote>\n<p>Moderate to severe heart failure (NYHA class III/IV)<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>Risk of invasive fungal infection<\/p>\n<p>Caution in patients with previous malignancy<\/p>\n<blockquote>\n<p>*Patients treated with infliximab should be given the package leaflet\nand the special Alert card.<\/p>\n<p>Infusion reactions may be increased when combined with\nleflunomide<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"hepatic-renal-impairment":{"label":"Hepatic/Renal Impairment","html":"<blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advise":{"label":"Pregnancy & Breastfeeding: (manufacturer advise)","html":"<blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 6 months after last dose.<\/p>\n<p>Can be used in pregnancy if indicated. Administration of live\nvaccines to infants exposed in-utero for 6 months after the mother’s\nlast dose of infliximab<\/p>\n<p>Breastfeeding: not recommended<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Full assessment of response at weeks 12 and 24, with treatment\nwithdrawal if response is inadequate within 6 months. Response to be\nmonitored atlest every 6 months<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>Quantiferon or T-spot (as indicated)<\/p>\n<p>Hepatitis B&amp;C + consider HIV<\/p>\n<p>Pregnancy test if indicated (though considered safe for\nconception)<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard DMARD monitoring FBC/LFT/U&amp;E or 2 monthly\n(before each infusion) + Urinalysis before each infusion Consider\nmeasuring drug levels especially if evidence of secondary non\nresponse<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Evidence of infection<\/p>\n<p>New onset or exacerbation of demyelination<\/p>\n<p>Lupus like syndrome or other autoimmune syndrome<\/p>\n<p>Severe injection site reaction (If minor reaction try oral\nantihistamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<p>Serum Sickness (delayed hypersentivity reaction)<\/p>\n<\/blockquote>"}},"text":"Therapeutic Class: Chimeric human-murine IgG1 monoclonal antibody inhibiting TNF alpha Licensed Indications: RA (in combination with methotrexate) AS PsA (alone or in combination of Methotrexate) Licensed Dose: RA -I.V. - 3mg/kg given as an intravenous infusion followed by additional 3 mg/kg infusion doses at 2 and 6 weeks after the first infusion, then every 8 weeks thereafter (refer to datasheet regarding non-standard increased doses and reduced dosage intervals in RA). For disease that has an inadequate response or loss of response after 12 weeks of treatment, consideration may be given to increasing the dose step‑wise by approximately 1.5 mg/kg up to a maximum of 7.5 mg/kg every 8 weeks. Alternatively, administration of 3 mg/kg as often as every 4 weeks may be considered. S .C.- 120 mg at 1, 2, 3 , 4 weeks after first injection , then every 2 weeks AS -5 mg/kg given as an intravenous infusion followed by additional 5 mg/kg infusion doses at 2 and 6 weeks after the first infusion, then every 8 weeks. SC : 120 mg every 2 weeks as maintenance therapy 4 weeks after last administration of 2 IV infusions PsA - 5mg/kg given as an intravenous infusion followed by additional 5 mg/kg infusion doses at 2 and 6 weeks after the first infusion, then every 8 weeks thereafter. Dosing may be informed by measuring pre-treatment levels Preparations: 100 mg powder vial (Administered in 250ml 0.9% sodium chloride, first 3 infusions over 2 hours, infusion 4 to 10 over 60 minutes ) 120 mg prefilled pen NICE Guidance: RA: TA375 and TA195 (after TNF failure if rituximab CI/failed) , TA715 PsA: TA199 AS: TA383 Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to the active substance or to any of the excipients (including other murine proteins) .Active tuberculosis or other severe infections such as sepsis, and opportunistic infections Moderate to severe heart failure (NYHA class III/IV) Manufacturer advises avoid use with live vaccines Risk of invasive fungal infection Caution in patients with previous malignancy *Patients treated with infliximab should be given the package leaflet and the special Alert card. Infusion reactions may be increased when combined with leflunomide Elderly No dose adjustment Hepatic/Renal Impairment Not studied - no dose recommendation can be made Pregnancy & Breastfeeding: (manufacturer advise) Women of childbearing potential to use an effective contraception during treatment and for at least 6 months after last dose. Can be used in pregnancy if indicated. Administration of live vaccines to infants exposed in-utero for 6 months after the mother’s last dose of infliximab Breastfeeding: not recommended Assessment of Response: Full assessment of response at weeks 12 and 24, with treatment withdrawal if response is inadequate within 6 months. Response to be monitored atlest every 6 months Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA CXR (evidence TB/fibrosis) Quantiferon or T-spot (as indicated) Hepatitis B&C + consider HIV Pregnancy test if indicated (though considered safe for conception) Routine Monitoring: Continue standard DMARD monitoring FBC/LFT/U&E or 2 monthly (before each infusion) + Urinalysis before each infusion Consider measuring drug levels especially if evidence of secondary non response Indications for Stopping Therapy: Evidence of infection New onset or exacerbation of demyelination Lupus like syndrome or other autoimmune syndrome Severe injection site reaction (If minor reaction try oral antihistamine or topical corticosteroids) Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range AST or ALT > 3 times normal range (iu/L) Serum Sickness (delayed hypersentivity reaction) Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/3831/smpc https://www.medicines.org.uk/emc/product/3710/smpc https://www.medicines.org.uk/emc/product/7265/smpc https://www.medicines.org.uk/emc/product/3709/smpc https://www.medicines.org.uk/emc/product/11101/smpc"},{"id":"ixekizumab","title":"Ixekizumab","subtitle":"Taltz®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Humanized IgG4 monoclonal antibody that selectively bindsIL-17A and\ninhibits its interaction with IL-17 receptor )<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p><strong>PsA/AS/Nr-ax SPA<\/strong> - 160mg sc for 1 dose then\nmaintenance 80 mg every 4 weeks week<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Preparation<\/td>\n<td><blockquote>\n<p>Pre-filled pen and syringe in 80 mg dose<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>NICE Guidance:<\/td>\n<td><p>PSA: TA537<\/p>\n<p>AxSPA: TA718<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Renal/hepatic impairment<\/td>\n<td><blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>C/I Active Infection /Tuberculosis<\/p>\n<p>Increased risk infection - URTI, candidiasis and conjunctivitis<\/p>\n<p>Caution if history of chronic infection<\/p>\n<p>Risk hypersensitivity reactions (can be 10-14 days post\ninjection)<\/p>\n<p>May cause or exacerbate Inflammatory bowel disease<\/p>\n<p>May cause neutropenia and/or thrombocytopenia<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Pregnancy &amp; Breastfeeding:<\/p>\n<p>(Manufacture advise)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 10 weeks after treatment.<\/p>\n<p>Limited evidence for pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>NICE - PsARC 16 wk, 2 out of 4 including joint tenderness and\nswelling<\/p>\n<p>SPA- 16 wk BASDAI 50% reduction or at least 2 units plus at least 2cm\nimprovement in VAS<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Platelets 50-100 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Worsening of inflammatory bowel disease .<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/7233/smpc\"><u>https://www.medicines.org.uk/emc/product/7233/smpc<\/u><\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Humanized IgG4 monoclonal antibody that selectively bindsIL-17A and\ninhibits its interaction with IL-17 receptor )<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p><strong>PsA/AS/Nr-ax SPA<\/strong> - 160mg sc for 1 dose then\nmaintenance 80 mg every 4 weeks week<\/p>\n<\/blockquote>"},"licensed-preparation":{"label":"Licensed Preparation","html":"<blockquote>\n<p>Pre-filled pen and syringe in 80 mg dose<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<p>PSA: TA537<\/p>\n<p>AxSPA: TA718<\/p>"},"renal-hepatic-impairment":{"label":"Renal/hepatic impairment","html":"<blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>C/I Active Infection /Tuberculosis<\/p>\n<p>Increased risk infection - URTI, candidiasis and conjunctivitis<\/p>\n<p>Caution if history of chronic infection<\/p>\n<p>Risk hypersensitivity reactions (can be 10-14 days post\ninjection)<\/p>\n<p>May cause or exacerbate Inflammatory bowel disease<\/p>\n<p>May cause neutropenia and/or thrombocytopenia<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacture-advise":{"label":"Pregnancy & Breastfeeding: (Manufacture advise)","html":"<blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 10 weeks after treatment.<\/p>\n<p>Limited evidence for pregnancy<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>NICE - PsARC 16 wk, 2 out of 4 including joint tenderness and\nswelling<\/p>\n<p>SPA- 16 wk BASDAI 50% reduction or at least 2 units plus at least 2cm\nimprovement in VAS<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Platelets 50-100 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Worsening of inflammatory bowel disease .<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Humanized IgG4 monoclonal antibody that selectively bindsIL-17A and inhibits its interaction with IL-17 receptor ) Licensed Dose: PsA/AS/Nr-ax SPA - 160mg sc for 1 dose then maintenance 80 mg every 4 weeks week Licensed Preparation Pre-filled pen and syringe in 80 mg dose NICE Guidance: PSA: TA537 AxSPA: TA718 Renal/hepatic impairment Not studied - no dose recommendation can be made Elderly No dose adjustment Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) C/I Active Infection /Tuberculosis Increased risk infection - URTI, candidiasis and conjunctivitis Caution if history of chronic infection Risk hypersensitivity reactions (can be 10-14 days post injection) May cause or exacerbate Inflammatory bowel disease May cause neutropenia and/or thrombocytopenia Manufacturer advises avoid use with live vaccines Pregnancy & Breastfeeding: (Manufacture advise) Women of childbearing potential to use an effective contraception during treatment and for at least 10 weeks after treatment. Limited evidence for pregnancy Breastfeeding safety unknown Assessment of Response: NICE - PsARC 16 wk, 2 out of 4 including joint tenderness and swelling SPA- 16 wk BASDAI 50% reduction or at least 2 units plus at least 2cm improvement in VAS Baseline Tests: FBC LFT’s U&E Consider CXR Consider Hepatitis B and C, QuantiFERON or T-spot, and HIV testing Consider Urinalysis *Consider pregnancy test Routine Monitoring: Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: ANC <1.0 x 10 9 cells/L Platelets 50-100 x 10 9 cells/L Serious infection or chronic infection not responding to standard treatment Suspected hypersensitivity reaction (injection site rash, rash, urticaria, dyspnoea) Worsening of inflammatory bowel disease . Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/7233/smpc"},{"id":"risankizumab","title":"Risankizumab","subtitle":"Skyrizi®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Humanized IgG1 monoclonal antibody to IL-23<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed indication<\/td>\n<td><blockquote>\n<p>PsA (Alone or in combination with methotrexate) (have peripheral\narthritis with 3 or more tender joints and 3 or more swollen joints.\nmoderate to severe psoriasis , had 2 conventional DMARDS and at least 1\nbiological DMARDS)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed dose<\/td>\n<td><blockquote>\n<p>150 mg at weeks 0 then week 4 and every 12 weeks , sub cutaneous<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Licensed Preparation<\/td>\n<td><blockquote>\n<p>Pre-filled pen in 150 mg<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td>PSA: <u>TA803<\/u><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal/hepatic impairment<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Serious hypersensitivity to active substance<\/p>\n<p>Active Infection /Tuberculosis<\/p>\n<p>Caution if history of chronic infection /recurrent infection<\/p>\n<p>Manufacturer advises avoid use with live vaccines , to wait 4 weeks\nprior to treatment and at least 21 weeks after treatment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; Breastfeeding:<\/p>\n<p>(Manufacture advise)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 21 weeks after treatment.<\/p>\n<p>No data for pregnancy, to avoid<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Assess response from 16 weeks . Stop if PsARC (2 out of 4 criteria\nincluding joint tenderness or swelling score )<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>As for DMARD therapy<\/p>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Injection site reaction (redness or bruising)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/12625/smpc\">https://www.medicines.org.uk/emc/product/12625/smpc<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Humanized IgG1 monoclonal antibody to IL-23<\/p>\n<\/blockquote>"},"licensed-indication":{"label":"Licensed indication","html":"<blockquote>\n<p>PsA (Alone or in combination with methotrexate) (have peripheral\narthritis with 3 or more tender joints and 3 or more swollen joints.\nmoderate to severe psoriasis , had 2 conventional DMARDS and at least 1\nbiological DMARDS)<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed dose","html":"<blockquote>\n<p>150 mg at weeks 0 then week 4 and every 12 weeks , sub cutaneous<\/p>\n<\/blockquote>"},"licensed-preparation":{"label":"Licensed Preparation","html":"<blockquote>\n<p>Pre-filled pen in 150 mg<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"PSA: <u>TA803<\/u>"},"renal-hepatic-impairment":{"label":"Renal/hepatic impairment","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Serious hypersensitivity to active substance<\/p>\n<p>Active Infection /Tuberculosis<\/p>\n<p>Caution if history of chronic infection /recurrent infection<\/p>\n<p>Manufacturer advises avoid use with live vaccines , to wait 4 weeks\nprior to treatment and at least 21 weeks after treatment<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacture-advise":{"label":"Pregnancy & Breastfeeding: (Manufacture advise)","html":"<blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for at least 21 weeks after treatment.<\/p>\n<p>No data for pregnancy, to avoid<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Assess response from 16 weeks . Stop if PsARC (2 out of 4 criteria\nincluding joint tenderness or swelling score )<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>As for DMARD therapy<\/p>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Injection site reaction (redness or bruising)<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Humanized IgG1 monoclonal antibody to IL-23 Licensed indication PsA (Alone or in combination with methotrexate) (have peripheral arthritis with 3 or more tender joints and 3 or more swollen joints. moderate to severe psoriasis , had 2 conventional DMARDS and at least 1 biological DMARDS) Licensed dose 150 mg at weeks 0 then week 4 and every 12 weeks , sub cutaneous Licensed Preparation Pre-filled pen in 150 mg NICE Guidance: PSA: TA803 Renal/hepatic impairment No dose adjustment Elderly No dose adjustment Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Serious hypersensitivity to active substance Active Infection /Tuberculosis Caution if history of chronic infection /recurrent infection Manufacturer advises avoid use with live vaccines , to wait 4 weeks prior to treatment and at least 21 weeks after treatment Pregnancy & Breastfeeding: (Manufacture advise) Women of childbearing potential to use an effective contraception during treatment and for at least 21 weeks after treatment. No data for pregnancy, to avoid Breastfeeding safety unknown Assessment of Response: Assess response from 16 weeks . Stop if PsARC (2 out of 4 criteria including joint tenderness or swelling score ) Baseline Tests: FBC LFT’s U&E Consider CXR Consider Hepatitis B and C, QuantiFERON or T-spot, and HIV testing Consider Urinalysis *Consider pregnancy test Routine Monitoring: As for DMARD therapy Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Serious infection or chronic infection not responding to standard treatment Suspected hypersensitivity reaction (injection site rash, rash, urticaria, dyspnoea) Injection site reaction (redness or bruising) Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/12625/smpc"},{"id":"rituximab","title":"Rituximab","subtitle":"Mabthera®; Truxima®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 41%\" />\n<col style=\"width: 58%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Rituximab - chimeric mouse/human monoclonal antibody, binds to\ntransmembrane antigen CD20 resulting in B cell lysis<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p><strong>RA<\/strong> - (with methotrexate) adult patients with severe\nactive RA who have had an inadequate response or intolerance to other\nDMARD’s, including one or more tumour necrosis factor (TNF) inhibitor\ntherapies.(*Used off license as monotherapy or in combination with an\nalternative DMARD or without prior treatment with a TNF inhibitor for\nRA)<\/p>\n<p><strong>CTD<\/strong> - used for a number of autoimmune disorders\nincluding SLE, Vasculitis, Antiphospholipid Syndrome, Myositis and\nScleritis. (Holds a licence for Granulomatosis with polyangiitis (GPA)\nand Microscopic polyangiitis (MPA). If used in CTD consider the need for\noral steroids between the first and second infusion e.g. prednisolone\n30mg od 2 weeks. Patients receiving Rituximab under NHS Clinical<\/p>\n<p>Commissioning Policies should be enrolled in a regional or national\ndatabase.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p><strong>RA<\/strong> - 1g iv infusion followed by a second 1g iv\ninfusion two weeks later. Pre-treatment with methylprednisolone 100mg 30\nminutes prior to infusion plus paracetamol and an anti-histamine\nrecommended (*also a reduce dosage regime - two doses of 500mg two weeks\napart in patients who have received repeated cycles and have achieved\nadequate clinical response and B cell depletion).<\/p>\n<p><strong>GPA and MPA<\/strong> - 375 mg/m2 body surface area, once\nweekly iv infusion for 4 weeks (four infusions in total – though some\nspecialists use the RA protocol). Consider IV Methylprednisolone for 1\nto 3 days at a dose of 250-500mg per day prior to the first infusion of\nrituximab. This should be followed by oral prednisone 1 mg/kg/day (not\nto exceed 80mg/day, and tapered as rapidly as possible based on clinical\nneed) during and after rituximab treatment. (*PCP prophylaxis is\nrecommended for patients with GPA or MPA). RA dosing has also been\nwidely used to treat AAV and CTD’s.<\/p>\n<p><strong>Repeat Dosing<\/strong> – Usually this is done on the basis of\nclinical relapse in<\/p>\n<p>RA and CTD, but in some areas has been at fixed 6 monthly cycles\n(notably in AAV). RA non-responders (especially when non depleted) may\nrespond to retreatment at 6 months.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Infusion details:<\/td>\n<td><blockquote>\n<p>1g dose infused in 250ml 0.9% sodium chloride, 1st infusion start at\n50mg/hr increasing at 50mg/hr increments every 30 minutes to a maximum\nof 400mg/hr, 2nd infusion initial rate 100mg/hr increasing at 100mg/hr\nincrements every 30 minutes up to a maximum of 400mg/hr). Where RA\npatients have had no prior reactions an accelerated 2 hour infusional\nregimen can be employed (refer to current product SPC)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance/NHS Commission:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\"><u>TA195<\/u><\/a><\/p>\n<p>Vasculitis: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta308\"><u>TA308<\/u><\/a><\/p>\n<p>SLE: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.england.nhs.uk/wp-content/uploads/2013/09/a13-psa.pdf\"><u>Clinical\nCommissioning Policy: Rituximab for the treatment of<\/u><\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.england.nhs.uk/wp-content/uploads/2013/09/a13-psa.pdf\"><u>Systemic\nLupus Erythematosus (SLE),<\/u><\/a> September 2013: NHS England<\/p>\n<p><u>NHSE Clinical Commissioning policy: Rituximab for refractory\nsystemic lupus Erythematosus (SLE) in adults and post pubescent children\n(200402P)<\/u><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Warnings/Contraindications/Significant drug interactions: (*Refer to\nlicensed datasheet for special warnings)<\/td>\n<td><blockquote>\n<p>Hypersensitivity to the active substance/excipients (incl. murine\nproteins)<\/p>\n<p>Severe heart failure (NYHA IV) or severe, uncontrolled cardiac\ndisease<\/p>\n<p>Active, severe infections<\/p>\n<p>Severely immunocompromised<\/p>\n<p>Prophylaxis requirements for <em>Pneumocyctis jirovecii<\/em><\/p>\n<p>Live vaccination 4 weeks prior to commencing therapy<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Pregnancy &amp; Breast feeding<\/p>\n<p>(manufacturer advice)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for 12 months following treatment<\/p>\n<p>Should not be administered in pregnant women, unless benefits\noutweigh risk<\/p>\n<p>Breastfeeding is not recommended optimally for 12 months following\nrituximab treatment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Review 16-20 weeks after each cycle. Not all patients achieve\nadequate<\/p>\n<p>B cell depletion after the first cycle. (Inadequate depletion after\ncycle 1 = consider a repeat cycle at 3-6 months if available). Leeds\nHMDS B cell subsets at day 15 predict response in RA and at 6 weeks in\nSLE.<\/p>\n<p>Equally subsets at 6 months can help predict relapse in SLE and\nAAV.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>Full clinical/infection screen - CXR, urinalysis, hepatitis B&amp;C,\nconsider HIV and TB screening.<\/p>\n<p>FBC/U&amp;E/LFT<\/p>\n<p>B Cell FACS analysis &amp; Immunoglobulins (when IgG &lt;6g/l\nincreased risk of serious infections) Pregnancy test if indicated<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>If receiving csDMARD continue routine monitoring for concomitant\ntherapy. Before first infusion of each cycle<\/p>\n<p>●Urinalysis<\/p>\n<p>●BP<\/p>\n<p>●FBC/U&amp;E’s<\/p>\n<p>For repeat cycles of rituximab:<\/p>\n<p>●Clinical review ●Immunoglobulins<\/p>\n<p>HMDS subsets at 0, day 15, 6 weeks and 3 monthly can help with\nplanning management (as above)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Patient to be closely monitored for cytokine release syndrome (\nsevere dyspnea, hypoxia, bronchospasm Neurological/cognitive/psychiatric\nsymptoms – refer immediately to Rheumatology Service (very rarely\nPML)<\/p>\n<p>Facial flushing and sore throat are common minor infusion reactions\nwhich often occur during infusion, but may occur 24-48 hours after\ntreatment<\/p>\n<p>If significant infusion reaction occurs stop infusion, administer IV\nantihistamine and restart as per protocol. More severe or persistent\ninfusion reactions may require discontinuation. Prolonged reactions with\nflu like symptoms, headache, vasculitic rash and low complement may\nindicate immunogenicity. This is most common in CTD and may respond to\nprophylactic corticosteroids<\/p>\n<p>Significant rash or any evidence of infection occurs stop\ntreatment<\/p>\n<p>Sore throat/ulceration can be a late complication related to\nneutropenia (6/52 – 6/12) so check FBC.<\/p>\n<p>Neutropenia<\/p>\n<p>Thrombocytopenia &lt;75000<\/p>\n<p>Immunoglobulin IgG level &lt;6g/l – consider discussion with Leeds\nService<strong>.<\/strong><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/3801/smpc\"><u>https://www.medicines.org.uk/emc/product/3801/smpc<\/u><\/a>\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/8878/smpc\"><u>https://www.medicines.org.uk/emc/product/8878/smpc<\/u><\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Rituximab - chimeric mouse/human monoclonal antibody, binds to\ntransmembrane antigen CD20 resulting in B cell lysis<\/p>\n<\/blockquote>"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p><strong>RA<\/strong> - (with methotrexate) adult patients with severe\nactive RA who have had an inadequate response or intolerance to other\nDMARD’s, including one or more tumour necrosis factor (TNF) inhibitor\ntherapies.(*Used off license as monotherapy or in combination with an\nalternative DMARD or without prior treatment with a TNF inhibitor for\nRA)<\/p>\n<p><strong>CTD<\/strong> - used for a number of autoimmune disorders\nincluding SLE, Vasculitis, Antiphospholipid Syndrome, Myositis and\nScleritis. (Holds a licence for Granulomatosis with polyangiitis (GPA)\nand Microscopic polyangiitis (MPA). If used in CTD consider the need for\noral steroids between the first and second infusion e.g. prednisolone\n30mg od 2 weeks. Patients receiving Rituximab under NHS Clinical<\/p>\n<p>Commissioning Policies should be enrolled in a regional or national\ndatabase.<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p><strong>RA<\/strong> - 1g iv infusion followed by a second 1g iv\ninfusion two weeks later. Pre-treatment with methylprednisolone 100mg 30\nminutes prior to infusion plus paracetamol and an anti-histamine\nrecommended (*also a reduce dosage regime - two doses of 500mg two weeks\napart in patients who have received repeated cycles and have achieved\nadequate clinical response and B cell depletion).<\/p>\n<p><strong>GPA and MPA<\/strong> - 375 mg/m2 body surface area, once\nweekly iv infusion for 4 weeks (four infusions in total – though some\nspecialists use the RA protocol). Consider IV Methylprednisolone for 1\nto 3 days at a dose of 250-500mg per day prior to the first infusion of\nrituximab. This should be followed by oral prednisone 1 mg/kg/day (not\nto exceed 80mg/day, and tapered as rapidly as possible based on clinical\nneed) during and after rituximab treatment. (*PCP prophylaxis is\nrecommended for patients with GPA or MPA). RA dosing has also been\nwidely used to treat AAV and CTD’s.<\/p>\n<p><strong>Repeat Dosing<\/strong> – Usually this is done on the basis of\nclinical relapse in<\/p>\n<p>RA and CTD, but in some areas has been at fixed 6 monthly cycles\n(notably in AAV). RA non-responders (especially when non depleted) may\nrespond to retreatment at 6 months.<\/p>\n<\/blockquote>"},"infusion-details":{"label":"Infusion details","html":"<blockquote>\n<p>1g dose infused in 250ml 0.9% sodium chloride, 1st infusion start at\n50mg/hr increasing at 50mg/hr increments every 30 minutes to a maximum\nof 400mg/hr, 2nd infusion initial rate 100mg/hr increasing at 100mg/hr\nincrements every 30 minutes up to a maximum of 400mg/hr). Where RA\npatients have had no prior reactions an accelerated 2 hour infusional\nregimen can be employed (refer to current product SPC)<\/p>\n<\/blockquote>"},"nice-guidance-nhs-commission":{"label":"NICE Guidance/NHS Commission","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\"><u>TA195<\/u><\/a><\/p>\n<p>Vasculitis: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta308\"><u>TA308<\/u><\/a><\/p>\n<p>SLE: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.england.nhs.uk/wp-content/uploads/2013/09/a13-psa.pdf\"><u>Clinical\nCommissioning Policy: Rituximab for the treatment of<\/u><\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.england.nhs.uk/wp-content/uploads/2013/09/a13-psa.pdf\"><u>Systemic\nLupus Erythematosus (SLE),<\/u><\/a> September 2013: NHS England<\/p>\n<p><u>NHSE Clinical Commissioning policy: Rituximab for refractory\nsystemic lupus Erythematosus (SLE) in adults and post pubescent children\n(200402P)<\/u><\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to the active substance/excipients (incl. murine\nproteins)<\/p>\n<p>Severe heart failure (NYHA IV) or severe, uncontrolled cardiac\ndisease<\/p>\n<p>Active, severe infections<\/p>\n<p>Severely immunocompromised<\/p>\n<p>Prophylaxis requirements for <em>Pneumocyctis jirovecii<\/em><\/p>\n<p>Live vaccination 4 weeks prior to commencing therapy<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"pregnancy-breast-feeding-manufacturer-advice":{"label":"Pregnancy & Breast feeding (manufacturer advice)","html":"<blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and for 12 months following treatment<\/p>\n<p>Should not be administered in pregnant women, unless benefits\noutweigh risk<\/p>\n<p>Breastfeeding is not recommended optimally for 12 months following\nrituximab treatment<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Review 16-20 weeks after each cycle. Not all patients achieve\nadequate<\/p>\n<p>B cell depletion after the first cycle. (Inadequate depletion after\ncycle 1 = consider a repeat cycle at 3-6 months if available). Leeds\nHMDS B cell subsets at day 15 predict response in RA and at 6 weeks in\nSLE.<\/p>\n<p>Equally subsets at 6 months can help predict relapse in SLE and\nAAV.<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>Full clinical/infection screen - CXR, urinalysis, hepatitis B&amp;C,\nconsider HIV and TB screening.<\/p>\n<p>FBC/U&amp;E/LFT<\/p>\n<p>B Cell FACS analysis &amp; Immunoglobulins (when IgG &lt;6g/l\nincreased risk of serious infections) Pregnancy test if indicated<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>If receiving csDMARD continue routine monitoring for concomitant\ntherapy. Before first infusion of each cycle<\/p>\n<p>●Urinalysis<\/p>\n<p>●BP<\/p>\n<p>●FBC/U&amp;E’s<\/p>\n<p>For repeat cycles of rituximab:<\/p>\n<p>●Clinical review ●Immunoglobulins<\/p>\n<p>HMDS subsets at 0, day 15, 6 weeks and 3 monthly can help with\nplanning management (as above)<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Patient to be closely monitored for cytokine release syndrome (\nsevere dyspnea, hypoxia, bronchospasm Neurological/cognitive/psychiatric\nsymptoms – refer immediately to Rheumatology Service (very rarely\nPML)<\/p>\n<p>Facial flushing and sore throat are common minor infusion reactions\nwhich often occur during infusion, but may occur 24-48 hours after\ntreatment<\/p>\n<p>If significant infusion reaction occurs stop infusion, administer IV\nantihistamine and restart as per protocol. More severe or persistent\ninfusion reactions may require discontinuation. Prolonged reactions with\nflu like symptoms, headache, vasculitic rash and low complement may\nindicate immunogenicity. This is most common in CTD and may respond to\nprophylactic corticosteroids<\/p>\n<p>Significant rash or any evidence of infection occurs stop\ntreatment<\/p>\n<p>Sore throat/ulceration can be a late complication related to\nneutropenia (6/52 – 6/12) so check FBC.<\/p>\n<p>Neutropenia<\/p>\n<p>Thrombocytopenia &lt;75000<\/p>\n<p>Immunoglobulin IgG level &lt;6g/l – consider discussion with Leeds\nService<strong>.<\/strong><\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Rituximab - chimeric mouse/human monoclonal antibody, binds to transmembrane antigen CD20 resulting in B cell lysis Licensed Indications: RA - (with methotrexate) adult patients with severe active RA who have had an inadequate response or intolerance to other DMARD’s, including one or more tumour necrosis factor (TNF) inhibitor therapies.(*Used off license as monotherapy or in combination with an alternative DMARD or without prior treatment with a TNF inhibitor for RA) CTD - used for a number of autoimmune disorders including SLE, Vasculitis, Antiphospholipid Syndrome, Myositis and Scleritis. (Holds a licence for Granulomatosis with polyangiitis (GPA) and Microscopic polyangiitis (MPA). If used in CTD consider the need for oral steroids between the first and second infusion e.g. prednisolone 30mg od 2 weeks. Patients receiving Rituximab under NHS Clinical Commissioning Policies should be enrolled in a regional or national database. Licensed Dose: RA - 1g iv infusion followed by a second 1g iv infusion two weeks later. Pre-treatment with methylprednisolone 100mg 30 minutes prior to infusion plus paracetamol and an anti-histamine recommended (*also a reduce dosage regime - two doses of 500mg two weeks apart in patients who have received repeated cycles and have achieved adequate clinical response and B cell depletion). GPA and MPA - 375 mg/m2 body surface area, once weekly iv infusion for 4 weeks (four infusions in total – though some specialists use the RA protocol). Consider IV Methylprednisolone for 1 to 3 days at a dose of 250-500mg per day prior to the first infusion of rituximab. This should be followed by oral prednisone 1 mg/kg/day (not to exceed 80mg/day, and tapered as rapidly as possible based on clinical need) during and after rituximab treatment. (*PCP prophylaxis is recommended for patients with GPA or MPA). RA dosing has also been widely used to treat AAV and CTD’s. Repeat Dosing – Usually this is done on the basis of clinical relapse in RA and CTD, but in some areas has been at fixed 6 monthly cycles (notably in AAV). RA non-responders (especially when non depleted) may respond to retreatment at 6 months. Infusion details: 1g dose infused in 250ml 0.9% sodium chloride, 1st infusion start at 50mg/hr increasing at 50mg/hr increments every 30 minutes to a maximum of 400mg/hr, 2nd infusion initial rate 100mg/hr increasing at 100mg/hr increments every 30 minutes up to a maximum of 400mg/hr). Where RA patients have had no prior reactions an accelerated 2 hour infusional regimen can be employed (refer to current product SPC) NICE Guidance/NHS Commission: RA: TA195 Vasculitis: TA308 SLE: Clinical Commissioning Policy: Rituximab for the treatment of Systemic Lupus Erythematosus (SLE), September 2013: NHS England NHSE Clinical Commissioning policy: Rituximab for refractory systemic lupus Erythematosus (SLE) in adults and post pubescent children (200402P) Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to the active substance/excipients (incl. murine proteins) Severe heart failure (NYHA IV) or severe, uncontrolled cardiac disease Active, severe infections Severely immunocompromised Prophylaxis requirements for Pneumocyctis jirovecii Live vaccination 4 weeks prior to commencing therapy Elderly No dose adjustment Pregnancy & Breast feeding (manufacturer advice) Women of childbearing potential to use an effective contraception during treatment and for 12 months following treatment Should not be administered in pregnant women, unless benefits outweigh risk Breastfeeding is not recommended optimally for 12 months following rituximab treatment Assessment of Response: Review 16-20 weeks after each cycle. Not all patients achieve adequate B cell depletion after the first cycle. (Inadequate depletion after cycle 1 = consider a repeat cycle at 3-6 months if available). Leeds HMDS B cell subsets at day 15 predict response in RA and at 6 weeks in SLE. Equally subsets at 6 months can help predict relapse in SLE and AAV. Baseline Tests: Full clinical/infection screen - CXR, urinalysis, hepatitis B&C, consider HIV and TB screening. FBC/U&E/LFT B Cell FACS analysis & Immunoglobulins (when IgG <6g/l increased risk of serious infections) Pregnancy test if indicated Routine Monitoring: If receiving csDMARD continue routine monitoring for concomitant therapy. Before first infusion of each cycle ●Urinalysis ●BP ●FBC/U&E’s For repeat cycles of rituximab: ●Clinical review ●Immunoglobulins HMDS subsets at 0, day 15, 6 weeks and 3 monthly can help with planning management (as above) Indications for Stopping Therapy: Patient to be closely monitored for cytokine release syndrome ( severe dyspnea, hypoxia, bronchospasm Neurological/cognitive/psychiatric symptoms – refer immediately to Rheumatology Service (very rarely PML) Facial flushing and sore throat are common minor infusion reactions which often occur during infusion, but may occur 24-48 hours after treatment If significant infusion reaction occurs stop infusion, administer IV antihistamine and restart as per protocol. More severe or persistent infusion reactions may require discontinuation. Prolonged reactions with flu like symptoms, headache, vasculitic rash and low complement may indicate immunogenicity. This is most common in CTD and may respond to prophylactic corticosteroids Significant rash or any evidence of infection occurs stop treatment Sore throat/ulceration can be a late complication related to neutropenia (6/52 – 6/12) so check FBC. Neutropenia Thrombocytopenia <75000 Immunoglobulin IgG level <6g/l – consider discussion with Leeds Service . Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/3801/smpc https://www.medicines.org.uk/emc/product/8878/smpc"},{"id":"sarilumab","title":"Sarilumab","subtitle":"Kevzara®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>IgG1 subtype that specifically binds to both soluble and\nmembrane-bound IL-6 receptors (IL-6Rα)<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed indication:<\/td>\n<td><blockquote>\n<p>Moderate to severe rheumatoid arthritis (with methotrexate or alone\n)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose :<\/td>\n<td><blockquote>\n<p>200mg every 2 weeks as a subcutaneous injection , for dose\nadjustments due to neutropenia , thrombocytopenia or liver enzymes\nelevations<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Licensed Preparation<\/td>\n<td><blockquote>\n<p>Prefilled pen in 200 gm and 150 mg dose<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta537\">RA\n:<u>TA485<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Renal/Hepatic impairment<\/td>\n<td><blockquote>\n<p>No dose adjustment with mild to moderate renal impairment<\/p>\n<p>Not recommended in Hepatic Impairment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Risk of hypersensitivity reaction - counsel patients<\/p>\n<p>Not in active infection (incl. localised)<\/p>\n<p>Serious infection risk (bacterial, fungal, viral &amp; opportunistic)\n- caution chronic/recurrent infection hx. Risk colonic perforation\n(caution diverticulitis) - promptly evaluate abdominal symptoms<\/p>\n<p>Is associated with low ANC and/or platelets plus abnormal LFT’s – use\ncontraindicated if ANC &lt;2.0 x<\/p>\n<p>10<sup>9<\/sup>cells/L, Platelets &lt; 150 x 10<sup>9<\/sup>cells/L,\ninitiating<\/p>\n<p>AST/ALT 1.5 X ULN or halting at x5 ULN)<\/p>\n<p>Manufacturer advises avoid with live vaccines<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td><blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and upto 3 months after treatment<\/p>\n<p>Should not be used unless clinical condition of the women requires\ntreatment with sarilumab<\/p>\n<p>Breastfeeding Benefit to mother vs risk to infant<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>To continue treatment if there is moderate EULAR response at 6 months\nafter starting therapy<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>FBC,<\/p>\n<p>U&amp;E, LFTs<\/p>\n<p>Lipids<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, Quantiferon or T-spot (if appropriate),\nand HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>FBC and LFT’s - at 4 to 8 weeks then suggest 3 monthly Lipids - at 4\nto 8 weeks then 6 monthly (<strong>*Take bloods at the end of the dosing\ninterval when considering dose modification)<\/strong><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Platelets &lt;50 x 10<sup>9<\/sup>cells/L<\/p>\n<p>LFT’s 3 to 5 x ULN (Treatment with Kevzara should be withheld until\n&lt; 3 x ULN then be resumed at 150 mg every 2 weeks and increased to\n200 mg every 2 weeks as clinically appropriate; treatment with Kevzara\nshould be<\/p>\n<p>discontinued if ALT &gt; 5 x ULN)<\/p>\n<p>Serious infection/Opportunistic infection<\/p>\n<p>New onset abdominal symptoms<\/p>\n<p>Suspected Hypersensitivity reaction - Injection site rash, rash,\nurticaria<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><u>https://www.medicines.org.uk/emc/product/8145/smpc<\/u><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>IgG1 subtype that specifically binds to both soluble and\nmembrane-bound IL-6 receptors (IL-6Rα)<\/p>\n<\/blockquote>"},"licensed-indication":{"label":"Licensed indication","html":"<blockquote>\n<p>Moderate to severe rheumatoid arthritis (with methotrexate or alone\n)<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p>200mg every 2 weeks as a subcutaneous injection , for dose\nadjustments due to neutropenia , thrombocytopenia or liver enzymes\nelevations<\/p>\n<\/blockquote>"},"licensed-preparation":{"label":"Licensed Preparation","html":"<blockquote>\n<p>Prefilled pen in 200 gm and 150 mg dose<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta537\">RA\n:<u>TA485<\/u><\/a><\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"renal-hepatic-impairment":{"label":"Renal/Hepatic impairment","html":"<blockquote>\n<p>No dose adjustment with mild to moderate renal impairment<\/p>\n<p>Not recommended in Hepatic Impairment<\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Risk of hypersensitivity reaction - counsel patients<\/p>\n<p>Not in active infection (incl. localised)<\/p>\n<p>Serious infection risk (bacterial, fungal, viral &amp; opportunistic)\n- caution chronic/recurrent infection hx. Risk colonic perforation\n(caution diverticulitis) - promptly evaluate abdominal symptoms<\/p>\n<p>Is associated with low ANC and/or platelets plus abnormal LFT’s – use\ncontraindicated if ANC &lt;2.0 x<\/p>\n<p>10<sup>9<\/sup>cells/L, Platelets &lt; 150 x 10<sup>9<\/sup>cells/L,\ninitiating<\/p>\n<p>AST/ALT 1.5 X ULN or halting at x5 ULN)<\/p>\n<p>Manufacturer advises avoid with live vaccines<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"<blockquote>\n<p>Women of childbearing potential to use an effective contraception\nduring treatment and upto 3 months after treatment<\/p>\n<p>Should not be used unless clinical condition of the women requires\ntreatment with sarilumab<\/p>\n<p>Breastfeeding Benefit to mother vs risk to infant<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>To continue treatment if there is moderate EULAR response at 6 months\nafter starting therapy<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>FBC,<\/p>\n<p>U&amp;E, LFTs<\/p>\n<p>Lipids<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, Quantiferon or T-spot (if appropriate),\nand HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>FBC and LFT’s - at 4 to 8 weeks then suggest 3 monthly Lipids - at 4\nto 8 weeks then 6 monthly (<strong>*Take bloods at the end of the dosing\ninterval when considering dose modification)<\/strong><\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Platelets &lt;50 x 10<sup>9<\/sup>cells/L<\/p>\n<p>LFT’s 3 to 5 x ULN (Treatment with Kevzara should be withheld until\n&lt; 3 x ULN then be resumed at 150 mg every 2 weeks and increased to\n200 mg every 2 weeks as clinically appropriate; treatment with Kevzara\nshould be<\/p>\n<p>discontinued if ALT &gt; 5 x ULN)<\/p>\n<p>Serious infection/Opportunistic infection<\/p>\n<p>New onset abdominal symptoms<\/p>\n<p>Suspected Hypersensitivity reaction - Injection site rash, rash,\nurticaria<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: IgG1 subtype that specifically binds to both soluble and membrane-bound IL-6 receptors (IL-6Rα) Licensed indication: Moderate to severe rheumatoid arthritis (with methotrexate or alone ) Licensed Dose : 200mg every 2 weeks as a subcutaneous injection , for dose adjustments due to neutropenia , thrombocytopenia or liver enzymes elevations Licensed Preparation Prefilled pen in 200 gm and 150 mg dose NICE Guidance: RA : TA485 Elderly No dose adjustment Renal/Hepatic impairment No dose adjustment with mild to moderate renal impairment Not recommended in Hepatic Impair

eating active psoriatic arthritis after inadequate response to DMARDs (TA815, 2022)","url":"https://www.nice.org.uk/guidance/ta815","accessed":"2026-11-03"},"nice-ta916":{"org":"NICE","short":"TA916","title":"Bimekizumab for treating active psoriatic arthritis after inadequate response to DMARDs (TA916, 2023)","url":"https://www.nice.org.uk/guidance/ta916","accessed":"2026-11-03"},"nice-ng65":{"org":"NICE","short":"NICE NG65","title":"Spondyloarthritis in over 16s: diagnosis and management (NG65, 2017)","url":"https://www.nice.org.uk/guidance/ng65","accessed":"2026-11-03"},"nice-ta383":{"org":"NICE","short":"TA383","title":"TNF-alpha inhibitors for ankylosing spondylitis and non-radiographic axial spondyloarthritis (TA383, 2016)","url":"https://www.nice.org.uk/guidance/ta383","accessed":"2026-11-03"},"nice-ta407":{"org":"NICE","short":"TA407","title":"Secukinumab for active ankylosing spondylitis after treatment with NSAIDs or TNF-alpha inhibitors (TA407, 2016)","url":"https://www.nice.org.uk/guidance/ta407","accessed":"2026-11-03"},"nice-ta718":{"org":"NICE","short":"TA718","title":"Ixekizumab for treating axial spondyloarthritis (TA718, 2021)","url":"https://www.nice.org.uk/guidance/ta718","accessed":"2026-11-03"},"nice-ta861":{"org":"NICE","short":"TA861","title":"Upadacitinib for treating active ankylosing spondylitis / non-radiographic axial spondyloarthritis (TA861, 2023)","url":"https://www.nice.org.uk/guidance/ta861","accessed":"2026-11-03"},"nice-ta920":{"org":"NICE","short":"TA920","title":"Tofacitinib for treating active ankylosing spondylitis (TA920, 2023)","url":"https://www.nice.org.uk/guidance/ta920","accessed":"2026-11-03"},"nice-ta918":{"org":"NICE","short":"TA918","title":"Bimekizumab for treating axial spondyloarthritis (TA918, 2023)","url":"https://www.nice.org.uk/guidance/ta918","accessed":"2026-11-03"},"eular-ra-2022":{"org":"EULAR","short":"EULAR 2022","title":"EULAR recommendations for the management of rheumatoid arthritis with synthetic and biological DMARDs: 2022 update (Smolen et al., Ann Rheum Dis 2023)","url":"https://doi.org/10.1136/ard-2022-223356","accessed":"2026-11-03","licence":"BMJ copyright: paraphrased, not quoted"},"eular-psa-2023":{"org":"EULAR","short":"EULAR 2023","title":"EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update (Gossec et al., Ann Rheum Dis 2024)","url":"https://doi.org/10.1136/ard-2024-225531","accessed":"2026-11-03","licence":"BMJ copyright: paraphrased, not quoted"},"bsr-psa-2022":{"org":"BSR","short":"BSR 2022","title":"BSR guideline for the treatment of psoriatic arthritis with biologic and targeted synthetic DMARDs (Tucker et al., Rheumatology 2022)","url":"https://doi.org/10.1093/rheumatology/keac295","accessed":"2026-11-03","licence":"OUP copyright: paraphrased, not quoted"},"asas-eular-2022":{"org":"ASAS-EULAR","short":"ASAS-EULAR 2022","title":"ASAS-EULAR recommendations for the management of axial spondyloarthritis: 2022 update (Ramiro et al., Ann Rheum Dis 2023)","url":"https://doi.org/10.1136/ard-2022-223296","accessed":"2026-11-03","licence":"BMJ copyright: paraphrased, not quoted"},"mhra-2023":{"org":"MHRA","short":"MHRA 2023","title":"JAK inhibitors: measures to reduce risk of major adverse cardiovascular events, malignancy, VTE, serious infections and mortality (Drug Safety Update, April 2023)","url":"https://www.gov.uk/drug-safety-update/janus-kinase-jak-inhibitors-new-measures-to-reduce-risks-of-major-cardiovascular-events-malignancy-venous-thromboembolism-serious-infections-and-increased-mortality","accessed":"2026-11-03"},"bsr-bio-2019":{"org":"BSR","short":"BSR 2019","title":"BSR biologic DMARD safety guidelines in inflammatory arthritis (Holroyd et al., Rheumatology 2019)","url":"https://doi.org/10.1093/rheumatology/key208","accessed":"2026-11-03","licence":"OUP copyright: paraphrased, not quoted"},"bsr-preg-2023":{"org":"BSR","short":"BSR 2023","title":"BSR guideline on prescribing drugs in pregnancy and breastfeeding (Russell et al., Rheumatology 2023)","url":"https://doi.org/10.1093/rheumatology/keac551","accessed":"2026-11-03","licence":"OUP copyright: paraphrased, not quoted"},"eular-sle-2023":{"org":"EULAR","short":"EULAR 2023","title":"EULAR recommendations for the management of systemic lupus erythematosus: 2023 update (Fanouriakis et al., Ann Rheum Dis 2024)","url":"https://doi.org/10.1136/ard-2023-224762","accessed":"2026-11-03","licence":"BMJ copyright: paraphrased, not quoted"},"bsr-sle-2018":{"org":"BSR","short":"BSR 2018","title":"BSR guideline for the management of systemic lupus erythematosus in adults (Gordon et al., Rheumatology 2018)","url":"https://doi.org/10.1093/rheumatology/kex286","accessed":"2026-11-03","licence":"OUP copyright: paraphrased, not quoted"},"nice-ta752":{"org":"NICE","short":"TA752","title":"Belimumab for treating active autoantibody-positive systemic lupus erythematosus (TA752, 2021)","url":"https://www.nice.org.uk/guidance/ta752","accessed":"2026-11-03"},"bsr-gca-2020":{"org":"BSR","short":"BSR 2020","title":"BSR guideline on diagnosis and treatment of giant cell arteritis (Mackie et al., Rheumatology 2020)","url":"https://doi.org/10.1093/rheumatology/kez672","accessed":"2026-11-03","licence":"OUP copyright: paraphrased, not quoted"},"eular-lvv-2018":{"org":"EULAR","short":"EULAR 2018","title":"2018 update of the EULAR recommendations for the management of large vessel vasculitis (Hellmich et al., Ann Rheum Dis 2020)","url":"https://doi.org/10.1136/annrheumdis-2019-215672","accessed":"2026-11-03","licence":"BMJ copyright: paraphrased, not quoted"},"nice-ta518":{"org":"NICE","short":"TA518","title":"Tocilizumab for treating giant cell arteritis (TA518, 2018)","url":"https://www.nice.org.uk/guidance/ta518","accessed":"2026-11-03"},"eular-aav-2022":{"org":"EULAR","short":"EULAR 2022","title":"EULAR recommendations for the management of ANCA-associated vasculitis: 2022 update (Hellmich et al., Ann Rheum Dis 2024)","url":"https://doi.org/10.1136/ard-2022-223764","accessed":"2026-11-03","licence":"BMJ copyright: paraphrased, not quoted"},"nice-ta308":{"org":"NICE","short":"TA308","title":"Rituximab in combination with glucocorticoids for treating anti-neutrophil cytoplasmic antibody-associated vasculitis (TA308, 2014)","url":"https://www.nice.org.uk/guidance/ta308","accessed":"2026-11-03"},"nice-ta825":{"org":"NICE","short":"TA825","title":"Avacopan for treating severe active granulomatosis with polyangiitis or microscopic polyangiitis (TA825, 2022)","url":"https://www.nice.org.uk/guidance/ta825","accessed":"2026-11-03"},"eular-acr-pmr-2015":{"org":"EULAR","short":"EULAR/ACR 2015","title":"2015 recommendations for the management of polymyalgia rheumatica: a EULAR/ACR collaborative initiative (Dejaco et al., Ann Rheum Dis 2015)","url":"https://doi.org/10.1136/annrheumdis-2015-207492","accessed":"2026-11-03","licence":"BMJ copyright: paraphrased, not quoted"},"bsr-pmr-2010":{"org":"BSR","short":"BSR 2010","title":"BSR and BHPR guidelines for the management of polymyalgia rheumatica (Dasgupta et al., Rheumatology 2010)","url":"https://doi.org/10.1093/rheumatology/kep303a","accessed":"2026-11-03","licence":"OUP copyright: paraphrased, not quoted"}},"conditions":[{"id":"ra","title":"Rheumatoid arthritis","short":"RA","published":true,"decides":"Rheumatology team decision","blurb":"From first csDMARD to biologics and JAK inhibitors: NICE funding criteria with EULAR reasoning","icon":"pill","tone":"blue","reviewDue":"2027-11","steps":[{"id":"first-csdmard","title":"Start a csDMARD as soon as possible","points":[{"source":"nice-ng100","ref":"1.5 Pharmacological management","text":"Offer first-line csDMARD monotherapy with oral methotrexate, leflunomide or sulfasalazine as soon as possible, ideally within 3 months of the onset of persistent symptoms. Hydroxychloroquine is an alternative for mild or palindromic disease. Escalate the dose as tolerated."},{"source":"nice-ng100","ref":"1.5 Glucocorticoids","text":"Consider short-term bridging glucocorticoids (oral, intramuscular or intra-articular) when starting a new csDMARD."},{"source":"eular-ra-2022","ref":"Recommendations 4 to 6","text":"Methotrexate is part of the first treatment strategy; where it is contraindicated or not tolerated, leflunomide or sulfasalazine. Short-term glucocorticoids when starting or changing a csDMARD, tapered and stopped as rapidly as clinically feasible."}],"drugs":["hydroxychloroquine","leflunomide","methotrexate","sulfasalazine"],"calc":"das28","signoff":null},{"id":"treat-to-target","title":"Treat to target: review at 3 months, target by 6 months","points":[{"source":"nice-ng100","ref":"1.7 Monitoring","text":"In active RA, measure CRP and disease activity (using a validated composite score such as DAS28) monthly in specialist care until the agreed treatment target (remission or low disease activity) is reached."},{"source":"eular-ra-2022","ref":"Recommendations 2 and 3","text":"Treatment aims at sustained remission or low disease activity in every patient. If there is no improvement by 3 months after starting treatment, or the target has not been reached by 6 months, therapy should be adjusted."}],"drugs":[],"calc":"das28","signoff":null},{"id":"add-csdmard","title":"Not at target on the first csDMARD: add or change csDMARDs","points":[{"source":"nice-ng100","ref":"1.5 Pharmacological management","text":"Offer additional csDMARDs (oral methotrexate, leflunomide, sulfasalazine or hydroxychloroquine) in combination, in a step-up strategy, when the treatment target has not been achieved despite dose escalation."},{"source":"eular-ra-2022","ref":"Recommendation 7","text":"If the target is not achieved with the first csDMARD strategy and poor prognostic factors are absent, other csDMARDs should be considered."}],"drugs":["hydroxychloroquine","leflunomide","methotrexate","sulfasalazine"],"calc":"das28","signoff":null},{"id":"poor-prognosis","title":"Poor prognostic factors: EULAR allows earlier escalation (not a NICE funding criterion)","points":[{"source":"eular-ra-2022","ref":"Recommendation 8","text":"If poor prognostic factors are present (rheumatoid factor or ACPA, especially at high levels; high disease activity; early erosions; failure of two or more csDMARDs), a bDMARD should be added. A JAK inhibitor may be considered, taking relevant risk factors into account."},{"source":"mhra-2023","ref":"Drug Safety Update","text":"JAK inhibitors should be used only if no suitable alternative is available in people aged 65 or over, current or past long-term smokers, and those with other cardiovascular or malignancy risk factors."},{"source":"nice-ng100","ref":"Context","text":"In the NHS, funding for a biologic or JAK inhibitor follows the NICE technology appraisal criteria in the next two steps, which require inadequate response to intensive csDMARD therapy."}],"drugs":[],"calc":"das28","signoff":null},{"id":"severe-biologic","title":"Severe RA (DAS28 above 5.1) after intensive csDMARD therapy: biologic or JAK inhibitor","points":[{"source":"nice-ta375","ref":"1.1 to 1.3","text":"Adalimumab, etanercept, infliximab, certolizumab pegol, golimumab, tocilizumab and abatacept, each with methotrexate, are options for severe active RA (DAS28 greater than 5.1) that has not responded to intensive therapy with a combination of csDMARDs. Adalimumab, etanercept, certolizumab pegol or tocilizumab can be used as monotherapy if methotrexate is contraindicated or not tolerated. Start with the least expensive drug, taking into account administration costs, dose and price per dose."},{"source":"nice-ta485","ref":"1.1","text":"Sarilumab, with methotrexate (or alone if methotrexate is not suitable), is an option for severe active RA that has responded inadequately to intensive csDMARD therapy."},{"source":"nice-ta466","ref":"1.1","text":"Baricitinib, with methotrexate (or alone), is an option for severe active RA after inadequate response to intensive csDMARD therapy."},{"source":"nice-ta480","ref":"1.1","text":"Tofacitinib, with methotrexate (or alone), is an option for severe active RA after inadequate response to intensive csDMARD therapy."},{"source":"nice-ta665","ref":"1.1","text":"Upadacitinib, with methotrexate (or alone), is an option for severe active RA after inadequate response to intensive csDMARD therapy."},{"source":"nice-ta676","ref":"1.1","text":"Filgotinib, with methotrexate (or alone), is an option for moderate to severe active RA after inadequate response to intensive csDMARD therapy."},{"source":"mhra-2023","ref":"Drug Safety Update","text":"For all JAK inhibitors: use only if no suitable alternative in people aged 65 or over, smokers or long-term ex-smokers, and those with cardiovascular or malignancy risk factors; use the lowest effective dose."}],"drugs":["abatacept","adalimumab","baricitinib","certolizumab-pegol","etanercept","filgotinib","golimumab","infliximab","sarilumab","tocilizumab","tofacitinib","upadacitinib"],"calc":"das28","signoff":null},{"id":"moderate-biologic","title":"Moderate RA (DAS28 3.2 to 5.1) after intensive csDMARD therapy","points":[{"source":"nice-ta715","ref":"1.1 to 1.3","text":"Adalimumab, etanercept, infliximab and abatacept, each with methotrexate, are options for moderate active RA (DAS28 3.2 to 5.1) that has not responded to intensive therapy with a combination of csDMARDs. Adalimumab or etanercept can be used alone if methotrexate is not suitable. Start with the least expensive drug."},{"source":"nice-ta676","ref":"1.1","text":"Filgotinib is an option for moderate active RA after inadequate response to intensive csDMARD therapy, when the company's commercial arrangement applies."},{"source":"nice-ta744","ref":"1.1","text":"Upadacitinib is an option for moderate active RA after inadequate response to intensive csDMARD therapy, when the company's commercial arrangement applies."}],"drugs":["abatacept","adalimumab","etanercept","filgotinib","infliximab","upadacitinib"],"calc":"das28","signoff":null},{"id":"choosing","title":"Choosing between eligible drugs","points":[{"source":"nice-ta375","ref":"1.3","text":"Where more than one drug is suitable, start with the least expensive (including administration costs, dose and price per dose), taking patient preference and adherence into account."},{"source":"eular-ra-2022","ref":"Recommendation 9","text":"bDMARDs and JAK inhibitors should be combined with a csDMARD. In people who cannot use a csDMARD as co-medication, IL-6 pathway inhibitors and JAK inhibitors may have some advantages over other bDMARDs."},{"source":"bsr-bio-2019","ref":"Safety recommendations","text":"Screen for tuberculosis, hepatitis B and C before starting; TNF inhibitors are not recommended in moderate to severe heart failure or in demyelinating disease; take previous malignancy and infection history into account."},{"source":"mhra-2023","ref":"Drug Safety Update","text":"JAK inhibitors: only if no suitable alternative in people aged 65 or over, smokers or long-term ex-smokers, or with cardiovascular or malignancy risk factors."},{"source":"bsr-preg-2023","ref":"Biologics in pregnancy","text":"Where pregnancy is planned, certolizumab pegol has minimal placental transfer and can be continued throughout pregnancy; other TNF inhibitors can be continued into the second or third trimester (see each drug's pregnancy section)."}],"drugs":[],"calc":null,"signoff":null},{"id":"response-6-months","title":"Assess response at 6 months: continue only on a moderate EULAR response","points":[{"source":"nice-ta375","ref":"1.4 and 1.5","text":"Continue treatment only if there is a moderate EULAR response at 6 months after starting. After an initial response, monitor at least every 6 months and withdraw treatment if a moderate EULAR response is not maintained."},{"source":"nice-ta375","ref":"EULAR response","text":"EULAR response is judged from the fall in DAS28 and the level reached: a moderate response needs a fall of more than 0.6 with a DAS28 of 5.1 or below, or a fall of more than 1.2."},{"source":"eular-ra-2022","ref":"Recommendation 3","text":"If there is no improvement by 3 months, or the target is not reached by 6 months, change therapy."}],"drugs":[],"calc":"das28","signoff":null},{"id":"after-tnf","title":"After a TNF inhibitor fails: rituximab or another mechanism","points":[{"source":"nice-ta195","ref":"1.1 and 1.2","text":"Rituximab with methotrexate is an option for severe active RA that has responded inadequately to, or not tolerated, other DMARDs including at least one TNF inhibitor. If rituximab is contraindicated or withdrawn because of an adverse event, adalimumab, etanercept, infliximab or abatacept (each with methotrexate) are options."},{"source":"nice-ta225","ref":"1.1","text":"Golimumab with methotrexate is an option after TNF inhibitor failure on the same terms as the drugs in TA195."},{"source":"nice-ta247","ref":"1.1","text":"Tocilizumab with methotrexate is an option when RA has not responded to one or more TNF inhibitors and rituximab is contraindicated or withdrawn, or has not responded to rituximab."},{"source":"nice-ta485","ref":"1.1","text":"Sarilumab is also an option after TNF inhibitor failure when rituximab is contraindicated or not tolerated, or after rituximab."},{"source":"nice-ta466","ref":"1.1","text":"Baricitinib, tofacitinib (TA480), upadacitinib (TA665) and filgotinib (TA676) are also options after inadequate response to one or more bDMARDs, subject to the terms in each appraisal."},{"source":"eular-ra-2022","ref":"Recommendation 10","text":"If a bDMARD or JAK inhibitor has failed, another bDMARD or JAK inhibitor should be considered; after one TNF inhibitor failure, either a drug with a different mode of action or a second TNF inhibitor."}],"drugs":["abatacept","adalimumab","baricitinib","etanercept","filgotinib","golimumab","infliximab","rituximab","sarilumab","tocilizumab","tofacitinib","upadacitinib"],"calc":null,"signoff":null},{"id":"remission-taper","title":"Sustained remission: taper cautiously","points":[{"source":"nice-ng100","ref":"1.5 Pharmacological management","text":"Consider cautiously reducing drug doses, or stopping drugs, in people who have maintained the treatment target for at least 1 year without glucocorticoids. Return promptly to the previous regimen if the target is no longer met."},{"source":"eular-ra-2022","ref":"Recommendations 11 and 12","text":"Taper glucocorticoids first. In sustained remission after glucocorticoids have been stopped, dose reduction of the bDMARD or JAK inhibitor can be considered, especially when combined with a csDMARD; csDMARD reduction may follow."}],"drugs":[],"calc":"das28","signoff":null}]},{"id":"psa","title":"Psoriatic arthritis","short":"PsA","published":true,"decides":"Rheumatology team decision","blurb":"Domain-based choice: peripheral joints, skin, axial disease, enthesitis; NICE criteria for biologics and JAK inhibitors","icon":"flask","tone":"red","reviewDue":"2027-11","steps":[{"id":"domains","title":"Assess which domains are active","points":[{"source":"eular-psa-2023","ref":"Overarching principles","text":"Treatment is chosen by the domains involved: peripheral arthritis, axial disease, enthesitis, dactylitis, skin and nail psoriasis, and related conditions (uveitis, inflammatory bowel disease). NSAIDs and local glucocorticoid injections can relieve musculoskeletal symptoms."},{"source":"bsr-psa-2022","ref":"Assessment","text":"Record tender and swollen joint counts, enthesitis, dactylitis, skin and nail involvement, and axial symptoms at baseline, since eligibility and response are judged on them."}],"drugs":[],"calc":null,"signoff":null},{"id":"csdmard","title":"Peripheral arthritis: start a csDMARD","points":[{"source":"eular-psa-2023","ref":"Recommendation 3","text":"In polyarthritis, start a csDMARD rapidly; methotrexate is preferred, especially with relevant skin involvement. Also consider a csDMARD in oligoarthritis with poor prognostic factors (structural damage, raised ESR or CRP, dactylitis, nail involvement)."},{"source":"bsr-psa-2022","ref":"Conventional therapy","text":"Methotrexate, sulfasalazine or leflunomide are the usual csDMARDs for peripheral arthritis; csDMARDs are not effective for axial disease."},{"source":"nice-ta199","ref":"1.1","text":"NICE requires an inadequate response to adequate trials of at least two standard DMARDs, individually or in combination, before a biologic or JAK inhibitor is funded."}],"drugs":["leflunomide","methotrexate","sulfasalazine"],"calc":null,"signoff":null},{"id":"biologic-eligibility","title":"After two csDMARDs with 3 or more tender and 3 or more swollen joints: biologic or JAK inhibitor","points":[{"source":"nice-ta199","ref":"1.1 and 1.2","text":"Etanercept, infliximab and adalimumab are options for active and progressive PsA with peripheral arthritis of 3 or more tender joints and 3 or more swollen joints, after inadequate response to at least two standard DMARDs. Start with the least expensive drug."},{"source":"nice-ta220","ref":"1.1","text":"Golimumab is an option on the same criteria as TA199."},{"source":"nice-ta445","ref":"1.1","text":"Certolizumab pegol and secukinumab are options on the same criteria; secukinumab also after a TNF inhibitor has failed or is contraindicated."},{"source":"nice-ta537","ref":"1.1","text":"Ixekizumab is an option after inadequate response to at least two csDMARDs and one or more TNF inhibitors, or when TNF inhibitors are contraindicated."},{"source":"nice-ta340","ref":"1.1","text":"Ustekinumab is an option when TNF inhibitors are contraindicated or have failed, on the two-csDMARD and joint-count criteria."},{"source":"nice-ta711","ref":"1.1","text":"Guselkumab and risankizumab (TA815) are options after inadequate response to at least two csDMARDs, with the joint-count criteria; see each appraisal for the biologic-experienced terms."},{"source":"nice-ta916","ref":"1.1","text":"Bimekizumab is an option after inadequate response to at least two csDMARDs, with the joint-count criteria."},{"source":"nice-ta543","ref":"1.1","text":"Tofacitinib (with methotrexate) and upadacitinib (TA768) are options after inadequate response to at least two csDMARDs, with the joint-count criteria, subject to MHRA JAK inhibitor advice."},{"source":"nice-ta433","ref":"1.1","text":"Apremilast, alone or with a DMARD, is an option after inadequate response to at least two csDMARDs, with the joint-count criteria."}],"drugs":["adalimumab","apremilast","bimekizumab","certolizumab-pegol","etanercept","golimumab","guselkumab","infliximab","ixekizumab","risankizumab","secukinumab","tofacitinib","upadacitinib","ustekinumab"],"calc":null,"signoff":null},{"id":"choosing-by-domain","title":"Choosing by domain","points":[{"source":"eular-psa-2023","ref":"Recommendations 5 to 8","text":"Peripheral arthritis not responding to a csDMARD: a bDMARD (TNF, IL-17, IL-12/23 or IL-23 inhibitor). With relevant skin involvement, an IL-17 or IL-23 inhibitor may be preferred. Axial disease: a TNF or IL-17 inhibitor (IL-23 inhibitors are not effective for axial disease). A JAK inhibitor may be considered when a bDMARD is not appropriate, taking safety into account."},{"source":"bsr-psa-2022","ref":"Choice of agent","text":"With uveitis or inflammatory bowel disease prefer a monoclonal TNF inhibitor (not etanercept); IL-17 inhibitors are avoided in inflammatory bowel disease. Enthesitis and dactylitis respond to bDMARDs."},{"source":"eular-psa-2023","ref":"Recommendation 9","text":"Apremilast may be considered for mild disease when a bDMARD or JAK inhibitor is not appropriate."},{"source":"mhra-2023","ref":"Drug Safety Update","text":"JAK inhibitors only if no suitable alternative in people aged 65 or over, smokers or long-term ex-smokers, or with cardiovascular or malignancy risk factors."}],"drugs":[],"calc":null,"signoff":null},{"id":"response-12-weeks","title":"Assess response at 12 weeks (PsARC)","points":[{"source":"nice-ta199","ref":"1.3","text":"Assess response 12 weeks after starting (16 weeks for certolizumab pegol). Continue only with an adequate response on the PsARC: improvement in at least 2 of the 4 criteria (tender joint score, swollen joint score, patient global, physician global), one of which must be a joint score, with no worsening in any criterion."},{"source":"nice-ta199","ref":"1.4","text":"Where the PsARC response is not met but there is a PASI 75 skin response, a dermatologist may advise that treatment continues for the skin."}],"drugs":[],"calc":null,"signoff":null},{"id":"after-failure","title":"After a biologic fails","points":[{"source":"eular-psa-2023","ref":"Recommendation 11","text":"If a bDMARD fails, switch to another bDMARD or a JAK inhibitor, including a switch within the same class."},{"source":"nice-ta445","ref":"Biologic-experienced terms","text":"Each appraisal sets its own terms after a TNF inhibitor has failed or is contraindicated (secukinumab TA445, ixekizumab TA537, ustekinumab TA340, guselkumab TA711, risankizumab TA815, bimekizumab TA916, tofacitinib TA543, upadacitinib TA768). Check the appraisal before applying."}],"drugs":["bimekizumab","guselkumab","ixekizumab","risankizumab","secukinumab","tofacitinib","upadacitinib","ustekinumab"],"calc":null,"signoff":null}]},{"id":"axspa","title":"Axial spondyloarthritis","short":"axSpA","published":true,"decides":"Rheumatology team decision","blurb":"NSAIDs first; TNF, IL-17 and JAK inhibitors on the NICE criteria; BASDAI and spinal pain for response","icon":"target","tone":"violet","reviewDue":"2027-11","steps":[{"id":"nsaids","title":"First line: NSAIDs, exercise and physiotherapy","points":[{"source":"nice-ng65","ref":"1.5 Pharmacological management","text":"Offer an NSAID at the lowest effective dose. If one NSAID at the maximum tolerated dose does not give adequate relief after 2 to 4 weeks, switch to another. Refer for a structured exercise programme with physiotherapy."},{"source":"asas-eular-2022","ref":"Recommendations 4 to 7","text":"NSAIDs are first-line drug treatment up to the maximum dose, weighing risks. Local glucocorticoid injections may be used for peripheral or entheseal sites; long-term systemic glucocorticoids are not used for axial disease. csDMARDs are not used for axial disease; sulfasalazine may be considered for peripheral arthritis."}],"drugs":["sulfasalazine"],"calc":"basdai","signoff":null},{"id":"biologic-eligibility","title":"Inadequate response to two NSAIDs with active disease: TNF, IL-17 or JAK inhibitor","points":[{"source":"nice-ta383","ref":"1.1 to 1.3","text":"Adalimumab, certolizumab pegol, etanercept, golimumab and infliximab are options for severe active ankylosing spondylitis, and (except infliximab) for severe non-radiographic axial spondyloarthritis with MRI evidence of inflammation or raised CRP, in adults whose disease has responded inadequately to, or who cannot tolerate, NSAIDs. 'Inadequate response' means at least two NSAIDs each tried at the maximum tolerated dose for at least 4 weeks. Start with the least expensive drug."},{"source":"nice-ta383","ref":"Definition of severe active disease","text":"Severe active disease is defined by a BASDAI score of 4 or more and a spinal pain VAS of 4 cm or more."},{"source":"nice-ta407","ref":"1.1","text":"Secukinumab is an option for active ankylosing spondylitis after inadequate response to NSAIDs or a TNF inhibitor."},{"source":"nice-ta718","ref":"1.1","text":"Ixekizumab is an option for ankylosing spondylitis or non-radiographic axial spondyloarthritis after inadequate response to NSAIDs or a TNF inhibitor."},{"source":"nice-ta918","ref":"1.1","text":"Bimekizumab is an option for axial spondyloarthritis after inadequate response to NSAIDs or a TNF inhibitor."},{"source":"nice-ta861","ref":"1.1","text":"Upadacitinib and tofacitinib (TA920) are options after inadequate response to NSAIDs or a TNF inhibitor, subject to MHRA JAK inhibitor advice."}],"drugs":["adalimumab","bimekizumab","certolizumab-pegol","etanercept","golimumab","infliximab","ixekizumab","secukinumab","tofacitinib","upadacitinib"],"calc":"basdai","signoff":null},{"id":"choosing","title":"Choosing between eligible drugs","points":[{"source":"asas-eular-2022","ref":"Recommendations 9 and 10","text":"Current practice is to start a TNF or IL-17 inhibitor. With recurrent uveitis or inflammatory bowel disease, a monoclonal TNF inhibitor is preferred; with significant psoriasis, an IL-17 inhibitor. A JAK inhibitor may be considered after weighing the risks."},{"source":"nice-ta383","ref":"1.3","text":"Where more than one drug is suitable, start with the least expensive, taking administration costs, dose and price per dose into account."},{"source":"mhra-2023","ref":"Drug Safety Update","text":"JAK inhibitors only if no suitable alternative in people aged 65 or over, smokers or long-term ex-smokers, or with cardiovascular or malignancy risk factors."}],"drugs":[],"calc":null,"signoff":null},{"id":"response-12-weeks","title":"Assess response at 12 weeks (BASDAI and spinal pain)","points":[{"source":"nice-ta383","ref":"1.4","text":"Assess response 12 weeks after starting. Continue only with clear evidence of response: BASDAI reduced to 50% of the pre-treatment value or by 2 or more units, and spinal pain VAS reduced by 2 cm or more."},{"source":"asas-eular-2022","ref":"Recommendation 11","text":"Continue only if there is a meaningful improvement after at least 12 weeks (ASDAS improvement of 1.1 or more)."}],"drugs":[],"calc":"basdai","signoff":null},{"id":"after-failure","title":"After the first TNF inhibitor fails","points":[{"source":"nice-ta383","ref":"1.5","text":"Treatment with another TNF inhibitor is an option for people whose disease has not responded to, or has stopped responding to, the first TNF inhibitor, or who cannot tolerate it."},{"source":"asas-eular-2022","ref":"Recommendation 12","text":"After the first bDMARD or JAK inhibitor fails, switch to another bDMARD (TNF or IL-17 inhibitor) or a JAK inhibitor."},{"source":"nice-ta407","ref":"1.1","text":"Secukinumab, ixekizumab (TA718), bimekizumab (TA918), upadacitinib (TA861) and tofacitinib (TA920) are each options after a TNF inhibitor, on the terms in their appraisals."}],"drugs":["adalimumab","bimekizumab","certolizumab-pegol","etanercept","golimumab","infliximab","ixekizumab","secukinumab","tofacitinib","upadacitinib"],"calc":null,"signoff":null},{"id":"remission-taper","title":"Sustained remission: consider tapering","points":[{"source":"asas-eular-2022","ref":"Recommendation 14","text":"In sustained remission, tapering of the bDMARD can be considered."}],"drugs":[],"calc":"basdai","signoff":null}]},{"id":"sle","title":"Systemic lupus erythematosus","short":"SLE","published":true,"decides":"Rheumatology team decision","blurb":"Hydroxychloroquine for all, glucocorticoids minimised, immunosuppressants, then belimumab or anifrolumab; lupus nephritis","icon":"heart","tone":"rose","reviewDue":"2027-11","steps":[{"id":"hcq","title":"Hydroxychloroquine for everyone unless contraindicated","points":[{"source":"eular-sle-2023","ref":"Recommendation 1","text":"Hydroxychloroquine is recommended for all patients unless contraindicated, at a target dose of 5 mg/kg actual body weight per day or less, individualised by flare risk and retinal toxicity risk, with retinal screening."},{"source":"bsr-sle-2018","ref":"Mild disease","text":"Hydroxychloroquine is the first-line treatment for mild disease (skin, joints, fatigue) and reduces flares, damage and mortality."}],"drugs":["hydroxychloroquine"],"calc":null,"signoff":null},{"id":"glucocorticoids","title":"Glucocorticoids: lowest dose, shortest time","points":[{"source":"eular-sle-2023","ref":"Recommendation 2","text":"When glucocorticoids are needed, dose by the type and severity of organ involvement, aim for a maintenance dose of 5 mg per day prednisolone-equivalent or less, and withdraw when possible. Pulses of intravenous methylprednisolone allow a lower starting oral dose and faster taper."},{"source":"bsr-sle-2018","ref":"Moderate disease","text":"Short courses of oral or intramuscular glucocorticoids for flares; avoid long-term doses above 7.5 mg per day by adding a steroid-sparing agent."}],"drugs":[],"calc":null,"signoff":null},{"id":"immunosuppressant","title":"Not controlled on hydroxychloroquine, or steroid-sparing: add an immunosuppressant","points":[{"source":"eular-sle-2023","ref":"Recommendation 3","text":"In patients not responding to hydroxychloroquine (alone or with glucocorticoids), or unable to reduce glucocorticoids below an acceptable long-term dose, add methotrexate, azathioprine or mycophenolate; calcineurin inhibitors are alternatives."},{"source":"bsr-sle-2018","ref":"Moderate disease","text":"Methotrexate for arthritis and skin disease; azathioprine or mycophenolate mofetil for organ involvement or steroid-sparing; ciclosporin and tacrolimus as alternatives. Check TPMT before azathioprine."}],"drugs":["azathioprine","cyclosporine","methotrexate","mycophenolate-mofetil","tacrolimus"],"calc":null,"signoff":null},{"id":"biologic","title":"Inadequate response: add belimumab or anifrolumab","points":[{"source":"eular-sle-2023","ref":"Recommendation 4","text":"In patients not responding to hydroxychloroquine with or without an immunosuppressant, or unable to taper glucocorticoids, add belimumab or anifrolumab. These biologics can also be considered earlier, before a conventional immunosuppressant."},{"source":"nice-ta752","ref":"1.1","text":"Belimumab is an option as add-on to standard treatment for active autoantibody-positive SLE in adults with a high degree of disease activity (SELENA-SLEDAI score of 10 or more) despite standard treatment, under the company's commercial arrangement. Continue only if a response is seen by 24 weeks."},{"source":"bsr-sle-2018","ref":"Refractory disease","text":"Rituximab may be considered for refractory moderate or severe disease that has not responded to standard immunosuppression, under the NHS England commissioning policy."}],"drugs":["anifrolumab","belimumab","rituximab"],"calc":null,"signoff":null},{"id":"organ-threatening","title":"Severe or organ-threatening disease: induction then maintenance","points":[{"source":"eular-sle-2023","ref":"Recommendation 5","text":"For organ-threatening or life-threatening disease, induce with intravenous cyclophosphamide and high-dose glucocorticoids (including methylprednisolone pulses); rituximab may be considered in refractory disease. Maintain with azathioprine, mycophenolate or methotrexate once controlled."}],"drugs":["azathioprine","cyclophosphamide","methotrexate","mycophenolate-mofetil","rituximab"],"calc":null,"signoff":null},{"id":"lupus-nephritis","title":"Lupus nephritis","points":[{"source":"eular-sle-2023","ref":"Recommendations 6 to 9","text":"Active class III or IV (with or without V) lupus nephritis: induce with low-dose intravenous cyclophosphamide or mycophenolate, combined with belimumab or a calcineurin inhibitor (voclosporin or tacrolimus) and glucocorticoids; continue mycophenolate or azathioprine for maintenance for at least 3 years after response, with hydroxychloroquine throughout."},{"source":"bsr-sle-2018","ref":"Renal involvement","text":"Lupus nephritis is managed jointly with nephrology; biopsy guides induction with mycophenolate or cyclophosphamide."}],"drugs":["azathioprine","belimumab","cyclophosphamide","hydroxychloroquine","mycophenolate-mofetil","tacrolimus","voclosporin"],"calc":null,"signoff":null}]},{"id":"gca","title":"Giant cell arteritis","short":"GCA","published":true,"decides":"Rheumatology team decision; GPs start steroids and refer the same day","blurb":"Same-day high-dose glucocorticoids, a planned taper, and tocilizumab for relapsing or refractory disease","icon":"drop","tone":"red","reviewDue":"2027-11","steps":[{"id":"start-steroids","title":"Suspected GCA: start high-dose glucocorticoids and refer urgently","points":[{"source":"bsr-gca-2020","ref":"Initial treatment","text":"Start prednisolone 40 to 60 mg daily immediately on clinical suspicion, before confirmation, and refer for specialist assessment (ideally within 3 working days) with ultrasound or temporal artery biopsy. With visual symptoms, give intravenous methylprednisolone (500 mg to 1 g daily for up to 3 days) and seek same-day ophthalmology review."},{"source":"eular-lvv-2018","ref":"Recommendations 1 to 4","text":"High-dose glucocorticoids are started as soon as GCA is suspected, with prompt referral to a specialist team; diagnosis is confirmed by imaging or biopsy without delaying treatment."}],"drugs":[],"calc":null,"signoff":null},{"id":"taper","title":"Taper glucocorticoids on a planned schedule","points":[{"source":"bsr-gca-2020","ref":"Glucocorticoid tapering","text":"Once symptoms and inflammatory markers are controlled, reduce the dose: a typical scheme reaches 15 to 20 mg daily by 3 months and about 5 mg daily by 1 year, with treatment usually lasting 1 to 2 years. Prescribe bone protection and consider gastroprotection; issue a steroid emergency card."},{"source":"eular-lvv-2018","ref":"Recommendation 5","text":"Taper to 15 to 20 mg per day within 2 to 3 months and to 5 mg or less by 1 year, provided the disease stays controlled."}],"drugs":[],"calc":null,"signoff":null},{"id":"relapse","title":"Relapse: increase and treat by the type of relapse","points":[{"source":"bsr-gca-2020","ref":"Relapse","text":"For a relapse with ischaemic features, return to the initial high dose; for other relapses, increase to the last effective dose and consider a glucocorticoid-sparing agent. Investigate for large-vessel involvement and aortitis."},{"source":"eular-lvv-2018","ref":"Recommendation 6","text":"Major relapse (ischaemic symptoms): restart induction-dose glucocorticoids; minor relapse: increase to at least the last effective dose."}],"drugs":[],"calc":null,"signoff":null},{"id":"sparing","title":"Relapsing, refractory or glucocorticoid-toxic disease: tocilizumab or methotrexate","points":[{"source":"nice-ta518","ref":"1.1","text":"Tocilizumab is an option for giant cell arteritis in adults, only if the disease is relapsing or refractory, the person has not already had tocilizumab, and treatment is stopped after 1 year at most, under the company's commercial arrangement."},{"source":"bsr-gca-2020","ref":"Adjunctive therapy","text":"Consider tocilizumab for relapsing or refractory GCA or where glucocorticoid toxicity is a concern; methotrexate may be considered as an alternative glucocorticoid-sparing agent."},{"source":"eular-lvv-2018","ref":"Recommendation 7","text":"Add tocilizumab in refractory or relapsing disease, or in patients at high risk of glucocorticoid adverse effects; methotrexate may be used as an alternative."}],"drugs":["methotrexate","tocilizumab"],"calc":null,"signoff":null},{"id":"monitoring","title":"Monitoring and complications","points":[{"source":"bsr-gca-2020","ref":"Follow-up","text":"Review symptoms, ESR and CRP at each visit; check for aortic aneurysm and large-vessel disease during follow-up; monitor for glucocorticoid complications (bone, glucose, blood pressure, infection, adrenal suppression)."}],"drugs":[],"calc":null,"signoff":null}]},{"id":"aav","title":"ANCA-associated vasculitis","short":"AAV","published":true,"decides":"Specialist vasculitis team decision","blurb":"Induction with rituximab or cyclophosphamide, avacopan, a reduced-dose steroid taper, then maintenance rituximab","icon":"kidney","tone":"teal","reviewDue":"2027-11","steps":[{"id":"induction","title":"Organ- or life-threatening GPA or MPA: induce remission","points":[{"source":"eular-aav-2022","ref":"Recommendations 3 to 5","text":"For new-onset organ- or life-threatening GPA or MPA, induce remission with rituximab or cyclophosphamide combined with glucocorticoids; rituximab is preferred for relapsing disease. For non-organ-threatening disease, rituximab or methotrexate (or mycophenolate) with glucocorticoids."},{"source":"nice-ta308","ref":"1.1","text":"Rituximab with glucocorticoids is an option for inducing remission in severe active GPA or MPA when further cyclophosphamide would exceed the maximum cumulative dose, cyclophosphamide is contraindicated or not tolerated, fertility is to be preserved, disease has relapsed after cyclophosphamide, or there is uroepithelial malignancy."},{"source":"nice-ta825","ref":"1.1","text":"Avacopan, with cyclophosphamide or rituximab, is an option for severe active GPA or MPA in adults, under the company's commercial arrangement."}],"drugs":["avacopan","cyclophosphamide","methotrexate","mycophenolate-mofetil","rituximab"],"calc":null,"signoff":null},{"id":"steroid-taper","title":"Glucocorticoids: reduced-dose regimen and taper","points":[{"source":"eular-aav-2022","ref":"Recommendation 6","text":"Use a reduced-dose glucocorticoid regimen for induction (as in the PEXIVAS trial), tapering to about 5 mg prednisolone daily by 4 to 5 months. Avacopan can be used to further reduce glucocorticoid exposure."},{"source":"eular-aav-2022","ref":"Recommendation 7","text":"Plasma exchange may be considered in patients with serum creatinine above 300 micromol/L from active glomerulonephritis; it is not routinely used for alveolar haemorrhage."}],"drugs":["avacopan"],"calc":null,"signoff":null},{"id":"maintenance","title":"Maintain remission","points":[{"source":"eular-aav-2022","ref":"Recommendations 9 to 11","text":"After induction, maintain with rituximab (preferred); azathioprine or methotrexate are alternatives, and mycophenolate where these are unsuitable. Continue maintenance for 24 to 48 months after induction of remission in new-onset disease, longer after relapse or in high-risk patients."}],"drugs":["azathioprine","methotrexate","mycophenolate-mofetil","rituximab"],"calc":null,"signoff":null},{"id":"relapse","title":"Relapse","points":[{"source":"eular-aav-2022","ref":"Recommendation 5","text":"Treat major relapse like new organ-threatening disease, preferring rituximab for re-induction; minor relapse may be managed by optimising maintenance therapy and a temporary glucocorticoid increase."}],"drugs":["rituximab"],"calc":null,"signoff":null},{"id":"egpa","title":"Eosinophilic granulomatosis with polyangiitis","points":[{"source":"eular-aav-2022","ref":"Recommendations 13 to 15","text":"Organ- or life-threatening EGPA: cyclophosphamide or rituximab with glucocorticoids; non-organ-threatening EGPA: glucocorticoids, with mepolizumab for relapsing or refractory disease; maintenance with mepolizumab, azathioprine, methotrexate or rituximab."}],"drugs":["azathioprine","cyclophosphamide","methotrexate","rituximab"],"calc":null,"signoff":null}]},{"id":"pmr","title":"Polymyalgia rheumatica","short":"PMR","published":true,"decides":"Usually managed in primary care; refer atypical, relapsing or GCA features","blurb":"Low-dose prednisolone with a slow taper, relapse management and when methotrexate or referral is needed","icon":"layers","tone":"amber","reviewDue":"2027-11","steps":[{"id":"diagnosis","title":"Confirm the diagnosis and exclude mimics before steroids","points":[{"source":"bsr-pmr-2010","ref":"Diagnosis","text":"Core features: age over 50, bilateral shoulder or pelvic girdle ache, morning stiffness over 45 minutes, raised ESR or CRP. Exclude infection, malignancy, inflammatory arthritis, thyroid disease and GCA before starting. Assess for GCA symptoms at every visit."},{"source":"eular-acr-pmr-2015","ref":"Overarching principles","text":"Baseline assessment before treatment, and specialist referral for atypical features, younger age, very high or normal inflammatory markers, or poor response to glucocorticoids."}],"drugs":[],"calc":null,"signoff":null},{"id":"start","title":"Start prednisolone 12.5 to 25 mg daily","points":[{"source":"eular-acr-pmr-2015","ref":"Recommendations 2 and 3","text":"Use the minimum effective individualised dose of prednisolone-equivalent in the range 12.5 to 25 mg daily; avoid initial doses of 7.5 mg or less and above 30 mg. Expect a clear response within a week; if not, review the diagnosis."},{"source":"bsr-pmr-2010","ref":"Treatment","text":"Prednisolone 15 mg daily for 3 weeks, then 12.5 mg for 3 weeks, then 10 mg for 4 to 6 weeks, then reduce by 1 mg every 4 to 8 weeks. Give bone protection."}],"drugs":[],"calc":null,"signoff":null},{"id":"taper","title":"Taper slowly","points":[{"source":"eular-acr-pmr-2015","ref":"Recommendation 5","text":"Taper to 10 mg daily within 4 to 8 weeks, then by about 1 mg every 4 weeks (or 1.25 mg alternating schedules) until stopped, provided remission is maintained. Most courses last 1 to 2 years."}],"drugs":[],"calc":null,"signoff":null},{"id":"relapse","title":"Relapse","points":[{"source":"eular-acr-pmr-2015","ref":"Recommendation 5","text":"On relapse, increase prednisolone to the pre-relapse dose and reduce gradually within 4 to 8 weeks back to the dose at which the relapse occurred."},{"source":"bsr-pmr-2010","ref":"Relapse","text":"Treat relapse with a dose increase; two or more relapses, prolonged treatment or glucocorticoid toxicity are reasons to refer and consider a steroid-sparing agent."}],"drugs":[],"calc":null,"signoff":null},{"id":"sparing","title":"Methotrexate and referral","points":[{"source":"eular-acr-pmr-2015","ref":"Recommendation 7","text":"Consider early methotrexate (7.5 to 10 mg weekly in trials) in addition to glucocorticoids in patients at high risk of relapse or prolonged therapy, or with glucocorticoid-related adverse effects or comorbidities. TNF inhibitors are not recommended."},{"source":"bsr-pmr-2010","ref":"Referral","text":"Refer to rheumatology when the diagnosis is uncertain, response is incomplete, relapses are frequent, treatment exceeds 2 years, or GCA features appear (same-day referral for GCA)."}],"drugs":["methotrexate"],"calc":null,"signoff":null}]}]}};</script>
<script>
const __mod_calc_core = (() => {

// Pure calculation functions for the calculator add-on.

/** Cockcroft–Gault creatinine clearance (mL/min), creatinine in µmol/L. */
function crclCockcroftGault({ age, weightKg, creatinineUmol, sex }) {
  if (!(age > 0 && weightKg > 0 && creatinineUmol > 0)) return null;
  const k = sex === "F" ? 1.04 : 1.23;
  return ((140 - age) * weightKg * k) / creatinineUmol;
}

/** CKD-EPI 2021 (race-free) eGFR (mL/min/1.73m²), creatinine in µmol/L. */
function egfrCkdEpi2021({ age, creatinineUmol, sex }) {
  if (!(age > 0 && creatinineUmol > 0)) return null;
  const scr = creatinineUmol / 88.4;
  const female = sex === "F";
  const kappa = female ? 0.7 : 0.9;
  const alpha = female ? -0.241 : -0.302;
  const r = scr / kappa;
  return 142 * Math.min(r, 1) ** alpha * Math.max(r, 1) ** -1.2 * 0.9938 ** age * (female ? 1.012 : 1);
}

// Renal dosing rules transcribed from each drug's "Renal impairment" or

// first match applies. Drugs not listed here show the guideline text only.

function renalAdvice(drugId, crcl) {
  const entry = RENAL_RULES[drugId];
  if (!entry || crcl == null) return null;
  for (const r of entry.rules) if (crcl < r.below) return { level: r.level, text: r.text };
  return { level: "ok", text: entry.none || "No renal dose adjustment triggered by this value." };
}

// Standard csDMARD stop thresholds (YG: azathioprine, methotrexate,
// leflunomide, mycophenolate, sulfasalazine, ciclosporin pages).
const STANDARD = [

  { id: "neut", label: "Neutrophils", unit: "×10⁹/L", stopIf: (v) => v < 1.6, rule: "<1.6 (or below local range)" },

const BP = { id: "bp", label: "Blood pressure", unit: "mmHg", kind: "bp", rule: ">160/95",

const BLOOD_RULESETS = {

  "mycophenolate-mofetil": { name: "Mycophenolate mofetil", params: STANDARD,

    { id: "crclPct", label: "Creatinine clearance", unit: "mL/min", stopIf: (v, b) => b && v <= 0.7 * b,

    { id: "hb", label: "Haemoglobin", unit: "g/L", rule: "<80 g/L or fall >20 g/L", baseline: true,

/**
 * values: { [paramId]: number | {sys, dia} }, baselines: same shape.
 * Returns { overall, results: [{id,label,status,detail}] } where
 * status is "stop" | "caution" | "ok" | "missing".
 */
function checkBloods(drugId, values = {}, baselines = {}) {
  const set = BLOOD_RULESETS[drugId];
  if (!set) throw new Error(`No blood ruleset for ${drugId}`);
  const results = set.params.map((p) => {
    const v = values[p.id];
    const b = baselines[p.id];
    const present = p.kind === "bp" ? v && v.sys > 0 && v.dia > 0 : typeof v === "number" && !Number.isNaN(v);
    if (!present) return { id: p.id, label: p.label, status: "missing", detail: `Threshold: ${p.rule}` };
    if (p.grade) {
      const g = p.grade(v);
      return { id: p.id, label: p.label, status: g ? g[0] : "ok", detail: g ? g[1] : `Not below ${p.rule.split(";")[0]}` };
    }
    if (p.stopIf(v, b)) return { id: p.id, label: p.label, status: "stop", detail: `Meets stop criterion: ${p.rule}` };
    if (p.trend && typeof values[p.trend.id] === "number" && p.trend.stopIf(v, values[p.trend.id])) {
      return { id: p.id, label: p.label, status: "stop", detail: `Sudden increase: ${p.trend.rule}` };
    }
    return { id: p.id, label: p.label, status: "ok", detail: `Within threshold (${p.rule})` };
  });
  const overall = results.some((r) => r.status === "stop") ? "stop"
    : results.some((r) => r.status === "caution") ? "caution"
    : results.every((r) => r.status === "missing") ? "missing" : "ok";
  return { overall, results, note: set.note };
}

// ---------- Weight-based dosing ----------

function roundTo(x, step) {
  return Math.round(x / step) * step;
}

/** Hydroxychloroquine: aim ≤5 mg/kg/day actual body weight (YG). */
function hcqRegimens(weightKg) {
  if (!(weightKg > 0)) return null;
  const maxDaily = 5 * weightKg;
  const options = [
    { label: "200 mg once daily", avg: 200 },
    { label: "200 mg and 400 mg on alternate days", avg: 300 },
    { label: "400 mg once daily (or 200 mg bd)", avg: 400 },
  ].map((o) => ({ ...o, mgPerKg: o.avg / weightKg, withinLimit: o.avg <= maxDaily + 1e-9 }));
  return { maxDaily, options };
}

/** Azathioprine target up to 2.5 mg/kg/day (YG), rounded to 25 mg. */
function azathioprineDose(weightKg) {
  if (!(weightKg > 0)) return null;
  const target = roundTo(2.5 * weightKg, 25);
  return { exact: 2.5 * weightKg, target, liveVaccineThreshold: 3 * weightKg };
}

/** Ciclosporin (RA): start 1–2 mg/kg/day in 2 divided doses, max 3–4 mg/kg/day (YG). */
function ciclosporinDose(weightKg) {
  if (!(weightKg > 0)) return null;
  return {
    startLow: roundTo(1 * weightKg, 25),
    startHigh: roundTo(2 * weightKg, 25),
    max3: roundTo(3 * weightKg, 25),
    max4: roundTo(4 * weightKg, 25),
  };
}

/** Tocilizumab IV (RA): 8 mg/kg every 4 weeks, max 800 mg (YG). */
function tocilizumabIvDose(weightKg) {
  if (!(weightKg > 0)) return null;
  const raw = 8 * weightKg;
  return { raw, dose: Math.min(raw, 800), capped: raw > 800 };
}

/** Infliximab IV: 3 mg/kg (RA) or 5 mg/kg (AS/PsA) (YG). */
function infliximabDose(weightKg, mgPerKg) {
  if (!(weightKg > 0)) return null;
  const dose = weightKg * mgPerKg;
  return { dose, vials: Math.ceil(dose / 100) };
}

/** Methotrexate weekly oral dose as 2.5 mg tablets; max 30 mg weekly (YG). */
function methotrexateTablets(weeklyMg) {
  if (!(weeklyMg > 0)) return null;
  const tablets = weeklyMg / 2.5;
  return {
    tablets,
    wholeTablets: Number.isInteger(Math.round(tablets * 1000) / 1000),
    overMax: weeklyMg > 30,
  };
}

// ---------- Corticosteroids ----------

// Anti-inflammatory equivalence to prednisolone 5 mg (BNF).
const STEROIDS = {
  prednisolone: { name: "Prednisolone", equiv: 5 },
  hydrocortisone: { name: "Hydrocortisone", equiv: 20 },
  methylprednisolone: { name: "Methylprednisolone", equiv: 4 },
  dexamethasone: { name: "Dexamethasone", equiv: 0.75 },
  deflazacort: { name: "Deflazacort", equiv: 6 },
};

function toPrednisolone(drug, mg) {
  const s = STEROIDS[drug];
  if (!s || !(mg >= 0)) return null;
  return (mg / s.equiv) * 5;
}

function convertSteroid(drug, mg) {
  const pred = toPrednisolone(drug, mg);
  if (pred == null) return null;
  return Object.entries(STEROIDS).map(([id, s]) => ({ id, name: s.name, mg: (pred / 5) * s.equiv }));
}

/** Flags for a daily prednisolone-equivalent dose taken for `weeks`. */
function steroidFlags(predMg, weeks, expectedWeeks = weeks) {
  const flags = [];
  if (predMg >= 7.5 && expectedWeeks >= 13) {
    flags.push({ id: "bone", level: "caution", source: "YG Corticosteroids",
      text: "≥7.5 mg/day expected for ≥3 months: consider bone protection. High-risk patients (previous fragility fracture, age >65) start an oral bisphosphonate at steroid initiation." });
  }
  if (weeks > 3) {
    flags.push({ id: "adrenal", level: "caution", source: "YG Corticosteroids",
      text: "Treatment >3 weeks: risk of adrenal suppression. Taper gradually; do not stop abruptly. Issue a blue steroid treatment card." });
  }
  if (predMg >= 5 && weeks >= 4) {
    flags.push({ id: "card", level: "caution", source: "NHS England National Patient Safety Alert (2020)",
      text: "≥5 mg prednisolone-equivalent for ≥4 weeks: issue a Steroid Emergency Card and give sick-day rules advice." });
  }
  if ((predMg >= 40 && weeks > 1) || (predMg >= 20 && weeks > 2)) {
    flags.push({ id: "live", level: "stop", source: "YG Vaccination (Green Book)",
      text: "High-dose steroids: avoid live vaccines until at least 3 months after stopping." });
  }
  if (weeks > 4) {
    flags.push({ id: "periop", level: "info", source: "YG Corticosteroids",
      text: "Glucocorticoids >1 month: may need increased steroid cover for surgery." });
  }
  return flags;
}

/**
 * Example taper schedule. Reduce by `step` mg every `intervalDays` until
 * `slowBelow`, then by `slowStep` mg, down to `target` mg.
 */
function taperSchedule({ start, step, intervalDays, slowBelow = 0, slowStep = step, target = 0, startDate }) {
  if (!(start > 0 && step > 0 && intervalDays > 0) || target < 0 || target >= start) return [];
  const rows = [];
  let dose = start;
  let day = 0;
  const base = startDate ? new Date(startDate + "T00:00:00Z") : null;
  while (rows.length < 200) {
    rows.push({ dose, day, date: base ? addDays(base, day) : null });
    if (dose <= target) break;
    const s = dose <= slowBelow ? slowStep : step;
    dose = Math.max(target, roundTo(dose - s, 0.5));
    day += intervalDays;
  }
  return rows;
}

// ---------- Dates ----------

function addDays(date, n) {
  const d = new Date(date.getTime());
  d.setUTCDate(d.getUTCDate() + n);
  return d;
}

function addMonths(date, n) {
  const d = new Date(date.getTime());
  const day = d.getUTCDate();
  d.setUTCDate(1);
  d.setUTCMonth(d.getUTCMonth() + n);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last));
  return d;
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

// ---------- Peri-operative planner ----------

// YG Section 8, Table 3. `week` = week (after the last dose) in which to
// schedule surgery; `halfLifeDays` null where the table gives none.
const PERIOP = {
  adalimumab: { name: "Adalimumab", interval: "Every 2 weeks", week: 3, halfLifeDays: 14 },
  "abatacept-iv": { name: "Abatacept IV", interval: "Monthly", week: 5, halfLifeDays: 14 },
  "abatacept-sc": { name: "Abatacept SC", interval: "Weekly", week: 2, halfLifeDays: 14 },
  "certolizumab-2": { name: "Certolizumab (2-weekly)", interval: "Every 2 weeks", week: 3, halfLifeDays: 14 },
  "certolizumab-4": { name: "Certolizumab (4-weekly)", interval: "Every 4 weeks", week: 5, halfLifeDays: 14 },
  etanercept: { name: "Etanercept", interval: "Weekly or twice weekly", week: 2, halfLifeDays: 3 },
  golimumab: { name: "Golimumab", interval: "Every 4 weeks", week: 5, halfLifeDays: 14 },
  "infliximab-4": { name: "Infliximab (4-weekly)", interval: "Every 4 weeks", week: 5, halfLifeDays: 9 },
  "infliximab-6": { name: "Infliximab (6-weekly)", interval: "Every 6 weeks", week: 7, halfLifeDays: 9 },
  "infliximab-8": { name: "Infliximab (8-weekly)", interval: "Every 8 weeks", week: 9, halfLifeDays: 9 },
  ixekizumab: { name: "Ixekizumab", interval: "Every 4 weeks", week: 5, halfLifeDays: 13 },
  rituximab: { name: "Rituximab", interval: "Two doses 2 weeks apart, ≥4 months between courses", months: [4, 7], halfLifeDays: 18 },
  sarilumab: { name: "Sarilumab", interval: "Every 2 weeks", week: 3, halfLifeDays: 21 },
  secukinumab: { name: "Secukinumab", interval: "Every 4 weeks", week: 5, halfLifeDays: 27 },
  ustekinumab: { name: "Ustekinumab", interval: "Every 12 weeks", week: 13, halfLifeDays: 21 },
  "tocilizumab-iv": { name: "Tocilizumab IV", interval: "Every 4 weeks", week: 5, halfLifeDays: 13,
    extra: "Stop IV tocilizumab at least 4 weeks before surgery." },
  "tocilizumab-sc": { name: "Tocilizumab SC", interval: "Weekly / alternate weeks", week: 3, halfLifeDays: 13,
    extra: "Stop SC tocilizumab at least 2 weeks before surgery." },
  apremilast: { name: "Apremilast", interval: "Daily", week: 1, halfLifeDays: 9 / 24 },
  baricitinib: { name: "Baricitinib", interval: "Daily", week: 1, halfLifeDays: 12.5 / 24 },
  tofacitinib: { name: "Tofacitinib", interval: "Daily", week: 1, halfLifeDays: 3 / 24 },
  risankizumab: { name: "Risankizumab", gap: true },
  filgotinib: { name: "Filgotinib", gap: true },
  upadacitinib: { name: "Upadacitinib", gap: true },
  avacopan: { name: "Avacopan", gap: true },
};

/** Surgery window relative to the last dose, and whether `surgeryDate` falls in it. */
function periopPlan(drugId, lastDose, surgeryDate) {
  const d = PERIOP[drugId];
  if (!d) return null;
  if (d.gap) return { drug: d, gap: true };
  const last = new Date(lastDose + "T00:00:00Z");
  let from, to;
  if (d.months) {
    from = addMonths(last, d.months[0]);
    to = addMonths(last, d.months[1]);
  } else {
    from = addDays(last, (d.week - 1) * 7);
    to = addDays(last, d.week * 7 - 1);
  }
  const fiveHalfLives = d.halfLifeDays ? addDays(last, Math.ceil(5 * d.halfLifeDays)) : null;
  let fit = null;
  if (surgeryDate) {
    const s = new Date(surgeryDate + "T00:00:00Z");
    fit = s < from ? "early" : s > to ? "late" : "in";
  }
  return { drug: d, from, to, fiveHalfLives, fit };
}

// ---------- Monitoring schedule ----------

// From each drug's "Routine monitoring" row (YG).
const SCHEDULES = {
  standard: { name: "Methotrexate, azathioprine, leflunomide, mycophenolate, sulfasalazine",
    fortnightlyAfterStableDays: 42, monthly: 3, thenEveryDays: 84 },
  cyclosporine: { name: "Ciclosporin", fortnightlyAfterStableDays: 0, monthly: 4, thenEveryDays: 91,
    extra: "Check BP with every blood test." },
  penicillamine: { name: "Penicillamine", fortnightlyUntilMonths: 2, monthlyUntilMonths: 6, thenEveryDays: 91 },
};

/**
 * Blood test dates from `startDate` (start or dose change) given the date
 * the dose became stable, for `months` months.
 */
function monitoringSchedule(kind, startDate, stableDate = startDate, months = 12) {
  const s = SCHEDULES[kind];
  if (!s || !startDate) return [];
  const start = new Date(startDate + "T00:00:00Z");
  const stable = new Date((stableDate || startDate) + "T00:00:00Z");
  const end = addMonths(start, months);
  const rows = [];
  let d = addDays(start, 14);
  let fortnightlyEnd, monthlyCount;
  if (s.fortnightlyUntilMonths) {
    fortnightlyEnd = addMonths(start, s.fortnightlyUntilMonths);
  } else {
    fortnightlyEnd = addDays(stable < start ? start : stable, s.fortnightlyAfterStableDays);
  }
  while (d <= fortnightlyEnd && d <= end) {
    rows.push({ date: d, phase: "Every 2 weeks" });
    d = addDays(d, 14);
  }
  let last = rows.length ? rows[rows.length - 1].date : start;
  if (s.monthlyUntilMonths) {
    const monthlyEnd = addMonths(start, s.monthlyUntilMonths);
    for (let m = addMonths(last, 1); m <= monthlyEnd && m <= end; m = addMonths(m, 1)) {
      rows.push({ date: m, phase: "Monthly" });
      last = m;
    }
  } else {
    monthlyCount = s.monthly;
    for (let i = 1; i <= monthlyCount; i++) {
      const m = addMonths(last, 1);
      if (m > end) break;
      rows.push({ date: m, phase: "Monthly" });
      last = m;
    }
  }
  for (let q = addDays(last, s.thenEveryDays); q <= end; q = addDays(q, s.thenEveryDays)) {
    rows.push({ date: q, phase: s.thenEveryDays === 84 ? "Every 12 weeks" : "Every 3 months" });
  }
  return rows;
}

// ---------- Disease activity scores ----------
// These return the score and the instrument's own published category only.
// They never reference a treatment threshold: eligibility criteria are read
// on the pathway pages, not computed here (docs/designs/pathways.md).

/** DAS28 using ESR (mm/h). Tender and swollen counts out of 28; patient global 0–100 mm. */
function das28Esr({ tender, swollen, esr, global }) {
  if (![tender, swollen, esr, global].every((v) => v >= 0) || !(esr > 0)) return null;
  return 0.56 * Math.sqrt(tender) + 0.28 * Math.sqrt(swollen) + 0.70 * Math.log(esr) + 0.014 * global;
}

/** DAS28 using CRP (mg/L). */
function das28Crp({ tender, swollen, crp, global }) {
  if (![tender, swollen, crp, global].every((v) => v >= 0)) return null;
  return 0.56 * Math.sqrt(tender) + 0.28 * Math.sqrt(swollen) + 0.36 * Math.log(crp + 1) + 0.014 * global + 0.96;
}

/** Published DAS28 categories (Fransen & van Riel 2005). */
function das28Category(score) {
  if (score == null) return null;
  if (score < 2.6) return "Remission";
  if (score <= 3.2) return "Low disease activity";
  if (score <= 5.1) return "Moderate disease activity";
  return "High disease activity";
}

/** BASDAI: six 0–10 items; items 5 and 6 (duration and severity of morning stiffness) are averaged. */
function basdai(items) {

// Presentation-only tidy-up of regional guideline HTML: the same words, laid
// out as points. See docs/designs/readability.md. No DOM use, so Node tests
// can import it.

const BLOCK = /<(p|ul|ol|table)\b[^>]*>[\s\S]*?<\/\1>/gi;
const WHOLE_BOLD = /^<strong>((?:(?!<\/?strong)[\s\S])*)<\/strong>$/i;
// Limits written as symbols ("&lt;140") or words ("greater than 100", "x3 ULN", "3 times normal").
const THRESHOLD = /(?:&lt;|&gt;|≤|≥)\s*=?\s*\d[\d.,]*|\b(?:greater|less|more|lower|higher)\s+than\s+\d[\d.,]*|\bx\s?\d+(?:\.\d+)?\s*ULN\b|\b\d+(?:\.\d+)?\s*(?:x|times)\s*(?:the\s+)?(?:ULN|upper limit|normal)\b/gi;
const GLYPH = /\s*[•●]\s*/g;
const LEAD_GLYPH = /^((?:<[^>]+>)*)\s*[•●]\s*/;
// The PDF conversion sometimes breaks one sentence across two paragraphs.
const CONTINUES = (prev, next) => !/[.:;!?)]$/.test(textOf(prev)) && /^[a-z]/.test(textOf(next));
const textOf = (html) => html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
const mark = (html) => html.replace(THRESHOLD, (m) => `<span class="thr">${m}</span>`);

/** Split field HTML into paragraphs and other blocks, unwrapping blockquotes. */
function blocks(html) {
  const s = html.replace(/<\/?blockquote[^>]*>/gi, "");
  const out = [];
  let last = 0;
  // Some paragraphs carry their own bullet glyphs; split on them and drop the
  // glyph so the list styling does not show a second bullet.
  const loose = (t) => {
    const parts = (t.match(GLYPH) || []).length > 1 ? t.split(GLYPH) : [t];
    for (const part of parts) {
      const inner = part.trim().replace(LEAD_GLYPH, "$1");
      if (textOf(inner)) out.push({ kind: "p", inner });
    }
  };
  for (const m of s.matchAll(BLOCK)) {
    loose(s.slice(last, m.index));
    if (m[1].toLowerCase() === "p") loose(m[0].replace(/^<p\b[^>]*>|<\/p>$/gi, ""));
    else out.push({ kind: "raw", html: m[0] });
    last = m.index + m[0].length;
  }
  loose(s.slice(last));
  return out.map((b) => {
    if (b.kind !== "p") return b;
    const bold = b.inner.match(WHOLE_BOLD);
    const text = textOf(b.inner);
    if (bold && text.endsWith(":") && text.length <= 100) return { kind: "head", inner: bold[1] };
    if (bold) return { kind: "note", inner: bold[1] };
    if (text.endsWith(":") && text.length <= 60) return { kind: "head", inner: b.inner };
    return { kind: "point", inner: b.inner };
  });
}

function list(points) {
  return points.length === 1
    ? `<p>${mark(points[0])}</p>`
    : `<ul class="pts">${points.map((p) => `<li>${mark(p)}</li>`).join("")}</ul>`;
}

/** Reformat one guideline field for display. Words and their order are unchanged. */
function tidyField(html) {
  const out = [];
  let run = [];
  const flush = () => { if (run.length) out.push(list(run)); run = []; };
  for (const b of blocks(html)) {
    if (b.kind === "point") {
      if (run.length && CONTINUES(run[run.length - 1], b.inner)) run[run.length - 1] += " " + b.inner;
      else run.push(b.inner);
      continue;
    }
    flush();
    if (b.kind === "head") out.push(`<h4 class="subhead">${b.inner}</h4>`);
    else if (b.kind === "note") out.push(`<p class="note-b">${mark(b.inner)}</p>`);
    else out.push(b.html);
  }
  flush();
  return out.join("");
}

return { tidyField };

  const legacy = new Set(state.res.status.legacy);

  const items = list.map((p) => {

// ---------- Monograph ----------

/** Place regional fields into BNF-ordered sections. */
function sectionsFor(p) {
  const out = SECTIONS.map((s) => ({ ...s, items: [] }));
  const other = { id: "other", title: "Other information", items: [] };
  for (const [key, f] of Object.entries(p.fields || {})) (out.find((x) => x.match.test(key)) || other).items.push(f);
  const list = out.filter((s) => s.items.length);
  if (other.items.length) list.push(other);
  return list;
}

function nationalFor(p) {
  const notes = [];
  const nat = state.nat;
  const add = (src, items) => (items || []).forEach((i) => notes.push({ src, ...i }));
  if (p.group === "csDMARDs" && nat.bsr2025) add(nat.bsr2025, nat.bsr2025.drugs?.[p.id]);
  if (p.group === "Biologics (bDMARDs)" && nat.bsr2019) add(nat.bsr2019, nat.bsr2019.general?.slice(0, 5));
  if (JAKS.has(p.id) && nat.mhra2023) add(nat.mhra2023, nat.mhra2023.general);
  if ((p.id === "methotrexate" || p.id === "azathioprine") && nat.greenBook) add(nat.greenBook, nat.greenBook.general);
  return notes;
}

function pregnancyRow(id) {
  const d = state.preg?.drugs?.[id];
  if (!d) return "";
  const cell = (v) => (v == null ? '<span class="muted">No statement</span>' : esc(v));
  return `<div class="table-wrap" style="margin-top:6px"><table class="data" style="min-width:0"><tbody>
    <tr><th style="width:38%">Peri-conception</th><td>${cell(d.preconception)}</td></tr>
    <tr><th>First trimester</th><td>${cell(d.trimester1)}</td></tr>
    <tr><th>Second and third trimester</th><td>${cell(d.trimester23)}</td></tr>
    <tr><th>Breastfeeding</th><td>${cell(d.breastfeeding)}</td></tr>
    <tr><th>Paternal exposure</th><td>${cell(d.paternal)}</td></tr>
  </tbody></table></div>
  ${d.note ? `<p class="small muted">${esc(d.note)}</p>` : ""}
  <p class="small"><span class="pill blue">BSR 2023</span> <a target="_blank" rel="noopener" href="https://doi.org/${esc(state.preg.source?.doi || "10.1093/rheumatology/keac551")}">Prescribing in pregnancy and breastfeeding</a> · <a href="#page--pregnancy">full table</a></p>`;
}

// Only hints quoted straight from the text; no counts or previews.
function hintFor(sec) {
  const t = textOf(sec.items.map((i) => i.html).join(" "));
  if (sec.id === "monitoring") { const m = t.match(/every \d+ weeks?/i); return m ? m[0] : ""; }
  if (sec.id === "nice") { const m = t.match(/TA\d+/g); return m ? [...new Set(m)].slice(0, 3).join(", ") : ""; }
  return "";
}

      </div></details>` : "";

  const infoHtml = `<details class="sec" id="s-info" open>
      <summary><span>Prescribing information</span><span class="row" style="gap:8px">${ICONS.chevron}</span></summary>
      <div class="body"><ul class="list">
        <li><a target="_blank" rel="noopener" href="${emcLink(p.title)}"><span class="grow"><strong>SmPC</strong><small>Full licensed information (eMC)</small></span><span class="chev">↗</span></a></li>
        <li><a href="#links"><span class="grow"><strong>Shared care protocol</strong><small>Local area prescribing committee documents</small></span><span class="chev">›</span></a></li>
        ${p.group === "csDMARDs" ? '<li><a href="#national"><span class="grow"><strong>BSR 2025 guideline</strong><small>National csDMARD guidance</small></span><span class="chev">›</span></a></li>' : '<li><a href="#national"><span class="grow"><strong>BSR biologic safety</strong><small>National guidance, update due 2026/27</small></span><span class="chev">›</span></a></li>'}
        ${(state.pathsFor.get(id) || []).map(({ cond, step }) => `<li><a href="#pathway--${cond.id}--${esc(step.id)}"><span class="grow"><strong>${esc(cond.short)} pathway</strong><small>${esc(step.title)}</small></span><span class="chev">›</span></a></li>`).join("")}
      </ul><p class="small muted" style="margin-top:12px">${p.kind === "gap" ? "Placeholder page." : "Source: " + sourceLine()}</p></div></details>`;

  const allSecs = [...sections.map((s) => ({ id: s.id, title: s.title, danger: s.danger })), ...(natHtml ? [{ id: "national", title: "National guidance" }] : []), { id: "info", title: "Prescribing information" }];

// ---------- Treatment pathways ----------
// Linear, cited steps. Nothing here evaluates a patient value; drug lists
// are rendered by class then name whatever order the file holds.

const signoffPill = (s) => s.signoff

function drugChips(ids) {
  const pages = ids.map((id) => state.pages.get(id) || { id, title: id, group: "", kind: "gap" });
  return GROUP_ORDER.flatMap((g) => pages.filter((p) => p.group === g).sort((a, b) => a.title.localeCompare(b.title)))
    .concat(pages.filter((p) => !GROUPS[p.group]))
    .map((p) => `<a class="chip" href="#page--${esc(p.id)}"><span class="dot ${dotFor(p)}"></span>${esc(p.title)}${p.kind === "gap" ? ' <span class="pill grey">Soon</span>' : ""}</a>`).join("");

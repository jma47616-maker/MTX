ote":"Supersedes the regional csDMARD monitoring content where they differ. Adds voclosporin and risk-adapted methotrexate liver monitoring. Covers children and adults; excludes biologics and JAK inhibitors."},{"title":"BSR biologic DMARD safety guidelines in inflammatory arthritis","org":"British Society for Rheumatology","year":"2019","url":"https://academic.oup.com/rheumatology/article/58/2/e3/5076446","status":"update-due","note":"Update expected in 2026. Watch this space."},{"title":"BSR guideline on prescribing drugs in pregnancy and breastfeeding","org":"British Society for Rheumatology","year":"2022/23","url":"https://academic.oup.com/rheumatology/article/62/4/e48/6783012","status":"current","note":"Source for the pregnancy compatibility table."},{"title":"Immunisation against infectious disease (the Green Book)","org":"UK Health Security Agency","year":"live","url":"https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book","status":"current","note":"Live vaccine contraindications in immunosuppression; shingles, pneumococcal, influenza and COVID-19 chapters."},{"title":"JAK inhibitors: measures to reduce risk of MACE, malignancy, VTE, serious infections and mortality","org":"MHRA Drug Safety Update","year":"April 2023","url":"https://www.gov.uk/drug-safety-update/janus-kinase-jak-inhibitors-new-measures-to-reduce-risks-of-major-cardiovascular-events-malignancy-venous-thromboembolism-serious-infections-and-increased-mortality","status":"current","note":"Use only if no suitable alternative in patients ≥65, current or past long-time smokers, or with other CV or malignancy risk factors."},{"title":"Steroid Emergency Card: early recognition and treatment of adrenal crisis","org":"NHS England / Specialist Pharmacy Service","year":"2020","url":"https://www.sps.nhs.uk/articles/steroid-emergency-card-to-support-early-recognition-and-treatment-of-adrenal-crisis-in-adults/","status":"current","note":"National Patient Safety Alert."},{"title":"Summaries of Product Characteristics (SmPC)","org":"electronic medicines compendium (eMC)","year":"live","url":"https://www.medicines.org.uk/emc/","status":"current","note":"Full licensed prescribing information for every drug."},{"title":"NICE technology appraisals","org":"NICE","year":"live","url":"https://www.nice.org.uk/guidance/published?ngt=Technology%20appraisal%20guidance","status":"current","note":"Funding criteria for biologic and targeted synthetic DMARDs."}],"sharedCare":[{"region":"Humber & North Yorkshire","body":"HNY Area Prescribing Committee","url":"https://humberandnorthyorkshire.org.uk/area-prescribing-committee-apc/area-prescribing-committee-apc-approved-documents/","how":"Open the page and expand the “Shared care” section.","known":["Azathioprine / mercaptopurine: RDTC shared care protocol v1.1 (July 2024)","Hydroxychloroquine: RDTC shared care protocol (HNY ICB, draft)"]},{"region":"West Yorkshire","body":"West Yorkshire ICB: medicines guidelines","url":"https://www.westyorkshire.icb.nhs.uk/documents/medicines-guidelines","how":"West Yorkshire APC is harmonising guidance. Until that's done, use the legacy APC site for your area (Leeds, or South West Yorkshire: Bradford & Craven, Calderdale, Kirklees, Wakefield).","known":[],"todo":"Confirm the West Yorkshire DMARD shared care link."}],"gaps":[{"id":"deucravacitinib","title":"Deucravacitinib","subtitle":"Sotyktu®","group":"Targeted synthetic (tsDMARDs)","why":"TYK2 inhibitor (psoriasis; PsA trials ongoing). Not in the regional guideline."},{"id":"bimekizumab","title":"Bimekizumab","subtitle":"Bimzelx®","group":"Biologics (bDMARDs)","why":"IL-17A/F inhibitor licensed for PsA and axSpA. Not in the regional guideline."},{"id":"voclosporin","title":"Voclosporin","subtitle":"Lupkynis®","group":"csDMARDs","why":"Calcineurin inhibitor for lupus nephritis. Newly covered by the BSR 2025 csDMARD guideline."},{"id":"anifrolumab","title":"Anifrolumab","subtitle":"Saphnelo®","group":"Biologics (bDMARDs)","why":"Type I interferon receptor antibody for SLE. Not in the regional guideline."},{"id":"tacrolimus","title":"Tacrolimus","subtitle":"","group":"csDMARDs","why":"Covered by the BSR 2025 csDMARD guideline. No regional page."}],"evidence":{"statement":"Studies are selected by the clinical editorial group. The funder has no input into which studies are listed or how they are summarised.","items":[{"title":"ORAL Surveillance: tofacitinib vs TNF inhibitor safety in RA (Ytterberg et al., NEJM 2022)","why":"The basis for the MHRA/EMA JAK inhibitor restrictions.","url":"https://pubmed.ncbi.nlm.nih.gov/?term=Ytterberg+Cardiovascular+and+Cancer+Risk+with+Tofacitinib+in+Rheumatoid+Arthritis"},{"title":"Slot 2: to be chosen by the editorial group","why":"","url":""},{"title":"Slot 3: to be chosen by the editorial group","why":"","url":""}]},"status":{"csDMARDs":"Regional guideline 2024. Being checked against BSR 2025, which takes precedence where they differ.","Biologics (bDMARDs)":"Regional guideline 2024, based on BSR biologic safety guidance. BSR update expected 2026.","Targeted synthetic (tsDMARDs)":"Regional guideline 2024. Not covered by BSR guidance; locally written content. Check MHRA JAK safety advice.","legacy":["injectable-gold","penicillamine"]}},"national":{"_about":"National guidance layer shown alongside the regional monograph text. Each item carries `verified`: true when the wording was checked against the source text or an official summary; false when it comes from secondary reporting and must be checked against the full guideline by the editorial group before clinical use.","bsr2025":{"title":"BSR guideline for the prescription and monitoring of csDMARDs","short":"BSR 2025","org":"British Society for Rheumatology","year":"2025","doi":"10.1093/rheumatology/keaf522","url":"https://doi.org/10.1093/rheumatology/keaf522","status":"Published 2025 (Rheumatology 65(2), keaf522). Replaces the 2017 BSR/BHPR guideline. Takes precedence over the regional text where they differ.","general":[{"text":"Covers the whole life course (children, young people and adults). Biologics, JAK inhibitors and apremilast are out of scope and sit in the separate b/tsDMARD safety guideline.","verified":true},{"text":"Five sections: pre-treatment evaluation, drug-specific recommendations, comorbidities, blood-test monitoring, and shared care.","verified":true},{"text":"Blood monitoring is risk-adaptive rather than one schedule for everyone. Risk factors for csDMARD toxicity should be reassessed at least annually and the monitoring interval adjusted.","verified":true},{"text":"Baseline full blood count, renal profile and liver profile are strongly recommended before starting a csDMARD, to detect pre-existing cytopenia and organ impairment.","verified":true},{"text":"Monitoring in the first six months is less frequent than under the 2017 guidance. Secondary summaries describe a check at week 2 then monthly for the first 3 to 6 months in patients without added risk factors; confirm against Table 3 of the full text.","verified":false},{"text":"On a stable dose without risk factors: FBC, renal function, ALT/AST and albumin about every 3 months, with the interval extendable after an individual benefit–risk assessment (some stable low-risk patients may need only one or two tests a year).","verified":false},{"text":"Liver biochemical abnormalities are not an absolute contra-indication to any csDMARD, but a less hepatotoxic drug (for example sulfasalazine) is preferred and monitoring should be more cautious. Established fibrosis or cirrhosis: avoid hepatotoxic csDMARDs.","verified":true},{"text":"During a severe infection (needing intravenous therapy or admission) csDMARDs should be stopped temporarily until the patient has recovered.","verified":true},{"text":"Shared care: coordinated arrangements between rheumatology and primary care, with clear responsibilities for prescribing, monitoring and acting on results.","verified":true},{"text":"Voclosporin is newly included as a csDMARD (lupus nephritis).","verified":true}],"drugs":{"methotrexate":[{"text":"Adults with risk factors for liver disease: calculate a FIB-4 score before starting, followed by elastography (e.g. FibroScan) if indicated. This should not delay starting methotrexate.","verified":true},{"text":"After influenza or COVID-19 vaccination in adults, methotrexate may be withheld for up to two weeks if disease activity and flare risk allow. In children this is at the clinician's discretion.","verified":true},{"text":"Agree a fixed weekly dosing day and co-prescribe folic acid.","verified":true}],"hydroxychloroquine":[{"text":"No routine blood monitoring is required (as in 2017). Monitoring is for retinopathy.","verified":true},{"text":"Everyone who has taken hydroxychloroquine for the equivalent of 5 years' continuous treatment or more should have annual retinopathy monitoring (GRADE 1B, 100% agreement).","verified":true},{"text":"Patients at high risk of retinopathy should have annual monitoring after 1 year of use.","verified":true}],"sulfasalazine":[{"text":"Preferred where liver biochemistry is abnormal, as a less hepatotoxic csDMARD.","verified":true},{"text":"Sulfasalazine, mepacrine and apremilast join hydroxychloroquine as drugs where long-term routine blood monitoring is reduced or not required once stable; confirm the exact wording in the full text.","verified":false}],"leflunomide":[{"text":"Blood pressure and weight monitoring continue alongside blood tests; confirm the intervals in Table 3 of the full text.","verified":false}],"azathioprine":[{"text":"TPMT activity or genotype before starting remains recommended; confirm wording in the full text.","verified":false}],"mycophenolate-mofetil":[{"text":"Standard risk-adaptive blood schedule applies; confirm any drug-specific points in the full text.","verified":false}],"cyclosporine":[{"text":"Renal function and blood pressure are the key monitoring parameters; confirm the intervals in Table 3 of the full text.","verified":false}],"tacrolimus":[{"text":"Included in the 2025 guideline. No regional page exists yet.","verified":true}],"voclosporin":[{"text":"Newly included in the 2025 guideline (lupus nephritis). No regional page exists yet.","verified":true}]}},"bsr2019":{"title":"BSR biologic DMARD safety guidelines in inflammatory arthritis","short":"BSR 2019","org":"British Society for Rheumatology","year":"2019","doi":"10.1093/rheumatology/key208","url":"https://academic.oup.com/rheumatology/article/58/2/e3/5076446","status":"Current national guidance for biologics. An update covering JAK inhibitors, IL-17 and IL-23 inhibitors and children/young people is in progress; the published scope (Ling et al., Rheumatol Adv Pract 2025, doi 10.1093/rap/rkaf104) says publication is expected 2026/27.","general":[{"text":"Screen for tuberculosis (history, examination, chest radiograph and an interferon-gamma release assay or tuberculin test) before starting; treat latent TB before or alongside the biologic.","verified":true},{"text":"Screen for hepatitis B (surface antigen and core antibody), hepatitis C and, where risk factors exist, HIV before starting.","verified":true},{"text":"Check vaccination status before starting. Live vaccines are contra-indicated on treatment; give them at least 2 and ideally 4 weeks before starting. Inactivated vaccines (influenza, pneumococcal, COVID-19) are recommended.","verified":true},{"text":"Peri-operative: for elective surgery, plan the operation at the end of the dosing interval and restart once the wound has healed and there is no infection.","verified":true},{"text":"Biologics should be stopped during serious infection and withheld in active infection.","verified":true},{"text":"Patients with a previous malignancy: individual benefit–risk decision; rituximab may be preferred in some situations. Regular skin checks are advised.","verified":true},{"text":"The 2026/27 update will add: ANA testing before a first TNF inhibitor, prescribing choices in people at high infection, VTE or cardiovascular risk, CTD-ILD, drug-induced uveitis, psoriasis and IBD, updated peri-operative guidance (one dosing interval off; restart about 14 days after surgery) and vaccination intervals.","verified":true}],"drugs":{}},"mhra2023":{"title":"MHRA Drug Safety Update: JAK inhibitors, new measures to reduce risks of MACE, malignancy, VTE, serious infections and mortality","short":"MHRA 2023","org":"Medicines and Healthcare products Regulatory Agency","year":"April 2023","url":"https://www.gov.uk/drug-safety-update","status":"Applies to baricitinib, filgotinib, tofacitinib and upadacitinib (and abrocitinib). Based on the ORAL Surveillance trial of tofacitinib against TNF inhibitors.","general":[{"text":"Use a JAK inhibitor only if no suitable alternative is available in patients aged 65 or over, current or past long-time smokers, and those with other risk factors for cardiovascular disease or malignancy.","verified":true},{"text":"Use with caution in patients with risk factors for venous thromboembolism other than those above.","verified":true},{"text":"Consider a reduced dose in patients at risk where the product information allows (for example tofacitinib 5 mg twice daily, baricitinib 2 mg).","verified":true},{"text":"Periodic skin examination is recommended for all patients, particularly those at increased risk of skin cancer.","verified":true},{"text":"Counsel patients on the symptoms of blood clots, cardiovascular events and cancer and to seek help promptly.","verified":true}],"drugs":{}},"greenBook":{"title":"Immunisation against infectious disease (the Green Book)","short":"Green Book","org":"UK Health Security Agency","url":"https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book","general":[{"text":"Live vaccines are contra-indicated in significant immunosuppression (for example methotrexate above 25 mg/week, azathioprine above 3 mg/kg/day, high-dose steroids, biologics and JAK inhibitors). Shingrix (recombinant, non-live) can be used instead of the live shingles vaccine.","verified":true}],"drugs":{}}},"pregnancy":{"source":{"title":"British Society for Rheumatology guideline on prescribing drugs in pregnancy and breastfeeding: immunomodulatory anti-rheumatic drugs and corticosteroids","doi":"10.1093/rheumatology/keac551","year":"2023","org":"British Society for Rheumatology"},"drugs":{"prednisolone":{"name":"Prednisolone","preconception":"Compatible (GRADE 1B)","trimester1":"Compatible; preferred corticosteroid in pregnancy (GRADE 1B); dose <20 mg/day where possible, tapered to minimum effective dose (GRADE 1C)","trimester23":"Compatible; preferred corticosteroid in pregnancy (GRADE 1B); dose <20 mg/day where possible, tapered to minimum effective dose (GRADE 1C)","breastfeeding":"Compatible (GRADE 1B)","paternal":"Compatible (GRADE 1B)","note":"Requires shared care with obstetric teams to monitor maternal blood pressure and blood glucose; use with pregnancy-compatible steroid-sparing drugs. Methylprednisolone has similar placental transfer and would be expected to be compatible with pregnancy and breastmilk exposure (GRADE 2C)."},"methotrexate":{"name":"Methotrexate","preconception":"Avoid; stop at least 1 month before planned conception and switch to a pregnancy-compatible drug (GRADE 1A)","trimester1":"Avoid at any dose (GRADE 1A); in unintended pregnancy on low-dose (<=25 mg/week) MTX there is minimal risk to the foetus: stop immediately, continue folic acid 5 mg/day and consider early referral to foetal medicine (GRADE 1C)","trimester23":"Avoid at any dose (GRADE 1A)","breastfeeding":"Not recommended; theoretical risks and insufficient data (GRADE 2C)","paternal":"Compatible at low dose (<=25 mg/week) (GRADE 1B)","note":"If low-dose MTX taken within 1 month before conception, continue folic acid 5 mg/day up to 12 weeks of pregnancy (GRADE 1B). Termination of pregnancy is not routinely recommended for low-dose MTX exposure."},"sulfasalazine":{"name":"Sulfasalazine","preconception":"Compatible, with folic acid 5 mg/day in the periconception period (GRADE 1B)","trimester1":"Compatible, with folic acid 5 mg/day during the first trimester (GRADE 1B)","trimester23":"Compatible (GRADE 1B)","breastfeeding":"Compatible in healthy, full-term infants (GRADE 1C)","paternal":"Compatible; may reduce male fertility - consider stopping only if conception delayed >12 months, alongside investigation of other causes of infertility (GRADE 1C)","note":"Avoid breastmilk exposure in ill, stressed or premature infants, and in infants with hyperbilirubinaemia or G6PD deficiency."},"hydroxychloroquine":{"name":"Hydroxychloroquine","preconception":"Compatible; antimalarial of choice in women planning pregnancy (GRADE 1B)","trimester1":"Compatible; continue at dose <=400 mg/day (GRADE 1B)","trimester23":"Compatible; continue at dose <=400 mg/day (GRADE 1B)","breastfeeding":"Compatible (GRADE 1B)","paternal":"Compatible (GRADE 2C)","note":"Discontinuation in pregnancy may increase risk of disease flares and foetal loss."},"leflunomide":{"name":"Leflunomide","preconception":"Avoid; stop, undergo standard cholestyramine washout and switch to a pregnancy-compatible alternative (GRADE 1B)","trimester1":"Not recommended; insufficient evidence to support use (GRADE 1B); if unintended conception, stop immediately, give cholestyramine washout and consider early referral to foetal medicine (GRADE 1B)","trimester23":"Not recommended; insufficient evidence to support use (GRADE 1B)","breastfeeding":"Not recommended (GRADE 1C)","paternal":"Compatible (GRADE 2C)","note":"LEF may not be a human teratogen, but there remains insufficient evidence to support use at conception or during pregnancy."},"azathioprine":{"name":"Azathioprine","preconception":"Compatible (GRADE 1B)","trimester1":"Compatible (GRADE 1B)","trimester23":"Compatible (GRADE 1B)","breastfeeding":"Compatible (GRADE 2C)","paternal":"Compatible (GRADE 1B)","note":"No clear evidence for a dose limit; use at an effective dose with blood monitoring per local guidelines."},"mycophenolate-mofetil":{"name":"Mycophenolate mofetil","preconception":"Contraindicated; avoid in women planning pregnancy or switch to a pregnancy-compatible alternative at least 6 weeks before attempting to conceive (GRADE 1B)","trimester1":"Contraindicated (GRADE 1B); if unintended conception, switch to a pregnancy-compatible alternative and refer to local experts for risk assessment (GRADE 1B)","trimester23":"Contraindicated (GRADE 1B)","breastfeeding":"Not recommended (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Known teratogen (MMF embryopathy) with increased risk of miscarriage; women of childbearing potential need adequate contraception."},"cyclosporine":{"name":"Ciclosporin (cyclosporine)","preconception":"Compatible (GRADE 1B)","trimester1":"Compatible, with monitoring of maternal blood pressure, renal function, blood glucose and drug levels (GRADE 1B)","trimester23":"Compatible, with monitoring of maternal blood pressure, renal function, blood glucose and drug levels (GRADE 1B)","breastfeeding":"Compatible (GRADE 2C)","paternal":"Compatible (GRADE 1C)","note":"Use the lowest effective dose."},"tacrolimus":{"name":"Tacrolimus","preconception":"Compatible (GRADE 2B)","trimester1":"Compatible, with monitoring of maternal blood pressure, renal function, blood glucose and drug levels (GRADE 2B)","trimester23":"Compatible, with monitoring of maternal blood pressure, renal function, blood glucose and drug levels (GRADE 2B)","breastfeeding":"Compatible (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":null},"cyclophosphamide":{"name":"Cyclophosphamide","preconception":"Exceptional circumstances only (known teratogen and gonadotoxic) (GRADE 1B)","trimester1":"Only in severe life/organ-threatening maternal disease with appreciable risk of maternal and foetal morbidity and mortality without this therapy (GRADE 1B)","trimester23":"Only in severe life/organ-threatening maternal disease with appreciable risk of maternal and foetal morbidity and mortality without this therapy (GRADE 1B)","breastfeeding":"Not recommended (GRADE 2C)","paternal":"Not recommended; semen cryopreservation recommended for men before exposure because of adverse effect on male fertility (GRADE 1C)","note":null},"infliximab":{"name":"Infliximab","preconception":"Compatible (GRADE 1B); women with no/low disease activity on INF/ADA/GOL do not need to switch to certolizumab before or during pregnancy","trimester1":"Compatible (GRADE 1B)","trimester23":"Compatible (GRADE 1B); if low risk of flare, could stop at 20 weeks so a full-term infant can have a normal vaccination schedule, otherwise continue and avoid infant live vaccines until 6 months","breastfeeding":"Compatible (GRADE 1C)","paternal":"Compatible (GRADE 1C)","note":"May be continued throughout pregnancy to maintain maternal disease control; if continued, avoid live vaccines in infant until 6 months of age (GRADE 1B). If stopped in pregnancy, restart as soon as practical post-partum regardless of breastfeeding status (GRADE 1C). Recommendations apply to equivalent licensed biosimilars."},"etanercept":{"name":"Etanercept","preconception":"Compatible (GRADE 1B); women with no/low disease activity on INF/ADA/GOL do not need to switch to certolizumab before or during pregnancy","trimester1":"Compatible (GRADE 1B)","trimester23":"Compatible (GRADE 1B); if low risk of flare, could stop at 32 weeks so a full-term infant can have a normal vaccination schedule, otherwise continue and avoid infant live vaccines until 6 months","breastfeeding":"Compatible (GRADE 1C)","paternal":"Compatible (GRADE 1C)","note":"May be continued throughout pregnancy to maintain maternal disease control; if continued, avoid live vaccines in infant until 6 months of age (GRADE 1B). If stopped in pregnancy, restart as soon as practical post-partum regardless of breastfeeding status (GRADE 1C). Recommendations apply to equivalent licensed biosimilars."},"adalimumab":{"name":"Adalimumab","preconception":"Compatible (GRADE 1B); women with no/low disease activity on INF/ADA/GOL do not need to switch to certolizumab before or during pregnancy","trimester1":"Compatible (GRADE 1B)","trimester23":"Compatible (GRADE 1B); if low risk of flare, could stop at 28 weeks so a full-term infant can have a normal vaccination schedule, otherwise continue and avoid infant live vaccines until 6 months","breastfeeding":"Compatible (GRADE 1C)","paternal":"Compatible (GRADE 1C)","note":"May be continued throughout pregnancy to maintain maternal disease control; if continued, avoid live vaccines in infant until 6 months of age (GRADE 1B). If stopped in pregnancy, restart as soon as practical post-partum regardless of breastfeeding status (GRADE 1C). Recommendations apply to equivalent licensed biosimilars."},"certolizumab-pegol":{"name":"Certolizumab pegol","preconception":"Compatible (GRADE 1B)","trimester1":"Compatible (GRADE 1B)","trimester23":"Compatible in all three trimesters; no to minimal placental transfer; no alteration to infant vaccination schedule required (GRADE 1B)","breastfeeding":"Compatible (GRADE 1C)","paternal":"Compatible (GRADE 1C)","note":"Women established on INF/ADA/GOL with no/low disease activity do not need to be switched to certolizumab before or during pregnancy (GRADE 1B). May be continued throughout pregnancy to maintain maternal disease control; if continued, avoid live vaccines in infant until 6 months of age (GRADE 1B). If stopped in pregnancy, restart as soon as practical post-partum regardless of breastfeeding status (GRADE 1C). Recommendations apply to equivalent licensed biosimilars."},"golimumab":{"name":"Golimumab","preconception":"Compatible (GRADE 1B); women with no/low disease activity on INF/ADA/GOL do not need to switch to certolizumab before or during pregnancy","trimester1":"Compatible (GRADE 1B)","trimester23":"Compatible (GRADE 1B); if low risk of flare, could stop at 28 weeks so a full-term infant can have a normal vaccination schedule, otherwise continue and avoid infant live vaccines until 6 months","breastfeeding":"Compatible (GRADE 1C)","paternal":"Compatible (GRADE 1C)","note":"May be continued throughout pregnancy to maintain maternal disease control; if continued, avoid live vaccines in infant until 6 months of age (GRADE 1B). If stopped in pregnancy, restart as soon as practical post-partum regardless of breastfeeding status (GRADE 1C). Recommendations apply to equivalent licensed biosimilars."},"rituximab":{"name":"Rituximab","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C)","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (rituximab-specific recommendations). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B)."},"tocilizumab":{"name":"Tocilizumab","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (IL-6 inhibitors). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B)."},"sarilumab":{"name":"Sarilumab","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (IL-6 inhibitors). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B). No published papers on sarilumab met inclusion criteria; manufacturer data only (13 pregnancies, 7 miscarriages)."},"abatacept":{"name":"Abatacept","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (abatacept-specific recommendations). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B)."},"anakinra":{"name":"Anakinra","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (IL-1 inhibitors). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B). Two congenital renal anomalies and two cases of oligohydramnios reported; unclear whether related to anakinra or maternal hyperthermia."},"belimumab":{"name":"Belimumab","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (belimumab-specific recommendations). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B)."},"secukinumab":{"name":"Secukinumab","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (IL-17 inhibitors). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B)."},"ixekizumab":{"name":"Ixekizumab","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Guideline recommendations are made at class level (IL-17 inhibitors). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B). Information on ixekizumab specifically remains very limited (18 pregnancy exposures)."},"ustekinumab":{"name":"Ustekinumab","preconception":"Consider stopping at conception (GRADE 2C); limited evidence has not shown teratogenicity but insufficient evidence to be confident it is compatible with pregnancy","trimester1":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); any exposure during pregnancy is unlikely to be harmful","trimester23":"Severe disease only if no other pregnancy-compatible drugs are suitable (GRADE 2C); if used in third trimester, avoid live vaccines in infant until 6 months of age","breastfeeding":"Compatible, based on limited evidence (GRADE 2C)","paternal":"Compatible (GRADE 2C); no paternal exposure data found for ustekinumab, class-level recommendation","note":"Guideline recommendations are made at class level (IL-12/23 inhibitors; ustekinumab is the only IL-12/23 inhibitor reviewed). All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B)."},"guselkumab":{"name":"Guselkumab","preconception":null,"trimester1":null,"trimester23":null,"breastfeeding":null,"paternal":null,"note":"Not addressed in the guideline; the IL-12/23 inhibitor recommendations refer to ustekinumab only."},"risankizumab":{"name":"Risankizumab","preconception":null,"trimester1":null,"trimester23":null,"breastfeeding":null,"paternal":null,"note":"Not addressed in the guideline; the IL-12/23 inhibitor recommendations refer to ustekinumab only."},"apremilast":{"name":"Apremilast","preconception":null,"trimester1":null,"trimester23":null,"breastfeeding":null,"paternal":null,"note":"No studies found on apremilast in pregnancy; the guideline was unable to make any recommendations."},"tofacitinib":{"name":"Tofacitinib","preconception":"Stop at least 2 weeks before planned conception (GRADE 2C); insufficient data to make a recommendation on use in pregnancy","trimester1":"Not recommended; insufficient data (GRADE 2C)","trimester23":"Not recommended; insufficient data (GRADE 2C)","breastfeeding":"Avoid; insufficient data and likely to transfer into breastmilk (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Class-level JAK inhibitor recommendation. Tofacitinib has the most data (116 pregnancy exposures; malformation rate in line with background risk)."},"baricitinib":{"name":"Baricitinib","preconception":"Stop at least 2 weeks before planned conception (GRADE 2C); insufficient data to make a recommendation on use in pregnancy","trimester1":"Not recommended; insufficient data (GRADE 2C)","trimester23":"Not recommended; insufficient data (GRADE 2C)","breastfeeding":"Avoid; insufficient data and likely to transfer into breastmilk (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Class-level JAK inhibitor recommendation; baricitinib data limited to one case report and manufacturer trial data."},"upadacitinib":{"name":"Upadacitinib","preconception":"Stop at least 2 weeks before planned conception (GRADE 2C); insufficient data to make a recommendation on use in pregnancy","trimester1":"Not recommended; insufficient data (GRADE 2C)","trimester23":"Not recommended; insufficient data (GRADE 2C)","breastfeeding":"Avoid; insufficient data and likely to transfer into breastmilk (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":"Class-level JAK inhibitor recommendation; no upadacitinib studies met inclusion criteria, manufacturer trial data only."},"filgotinib":{"name":"Filgotinib","preconception":null,"trimester1":null,"trimester23":null,"breastfeeding":null,"paternal":null,"note":"Not included in the guideline search (NICE-approved after the search window). The class-level JAK inhibitor recommendation (stop >=2 weeks before conception; avoid in pregnancy and breastfeeding; paternal exposure compatible) was based on tofacitinib, baricitinib and upadacitinib."},"ivig":{"name":"Intravenous immunoglobulin","preconception":"Compatible (GRADE 1B)","trimester1":"Compatible (GRADE 1B)","trimester23":"Compatible (GRADE 1B)","breastfeeding":"Compatible (GRADE 2C)","paternal":"Compatible (GRADE 2C)","note":null},"nsaids":{"name":"NSAIDs","preconception":null,"trimester1":null,"trimester23":null,"breastfeeding":null,"paternal":null,"note":"Outside the scope of this guideline; NSAIDs and low-dose aspirin are covered in the companion BSR guideline on comorbidity medications used in rheumatology practice."},"colchicine":{"name":"Colchicine","preconception":null,"trimester1":null,"trimester23":null,"breastfeeding":null,"paternal":null,"note":"Not addressed in this guideline."}},"general":["Pre-conception counselling should be addressed by all healthcare professionals, with referral to those with relevant expertise, to optimise disease control before pregnancy and advise on timing of pregnancy, drug therapy before/during/after pregnancy and contraception (GRADE 1A, SOA 99.5%).","If a woman is planning pregnancy, avoid pregnancy-incompatible drugs (GRADE 1A, SOA 100%).","The risks and benefits to mother and foetus of drug treatment to control maternal disease should be discussed and clearly documented by all healthcare professionals involved (GRADE 1A, SOA 99.5%).","Immunomodulatory drugs contraindicated in pregnancy should be switched to a pregnancy-compatible alternative in advance of conception to ensure disease control is maintained on the new medication (GRADE 1A, SOA 100%).","When no pregnancy-compatible drugs are suitable, control of severe/life-threatening maternal disease should take priority over concerns for potential foetal outcomes (GRADE 1B, SOA 99.0%).","All biologic DMARDs may be continued throughout pregnancy if required to control active/severe maternal disease (GRADE 1B, SOA 98.5%).","Infant immunisation schedules after in utero exposure to biologic DMARDs depend on timing of exposure, bioavailability and persistence of the drug, its mechanism of action, and live vaccines (GRADE 1C, SOA 99.5%).","Where possible, use the minimum effective dose of immunomodulatory drug or corticosteroid to maintain disease suppression; stopping the drug during pregnancy may be considered in women at low risk of flare on withdrawal (GRADE 1B, SOA 100%).","Paternal drug exposure has not convincingly been associated with adverse foetal development or pregnancy outcome; although evidence is weak, men taking rheumatological medicines should be reassured about the safety of conceiving (GRADE 2C, SOA 98.4%).","Recommendations use GRADE: strength 1 (strong) or 2 (weak); quality of evidence A (high), B (moderate) or C (low/very low); each with a strength of agreement (SOA) score. Recommendations were based on published evidence (search to January 2021), not licensing information, and apply to equivalent licensed biosimilars."]},"pathways":{"_about":"Treatment-escalation pathways. Each step paraphrases the cited guideline and links to the drug monographs it names. The app never takes a patient value into a pathway: steps are read, not evaluated. Drug lists are unordered sets stored alphabetically by id and rendered by class then name; file order carries no meaning. Drafted from the cited guidelines on 2026-11-03 by the app's authoring assistant; no step has yet been checked by a clinician (signoff: null). See docs/designs/pathways.md.","orderRule":"Drugs within a step are listed by class (csDMARD, biologic, JAK inhibitor) and then alphabetically. The order carries no recommendation.","sources":{"nice-ng100":{"org":"NICE","short":"NICE NG100","title":"Rheumatoid arthritis in adults: management (NG100, 2018, updated 2020)","url":"https://www.nice.org.uk/guidance/ng100","accessed":"2026-11-03","licence":"NICE UK Open Content Licence; re-use in a sponsored product to be confirmed with NICE"},"nice-ta375":{"org":"NICE","short":"TA375","title":"Adalimumab, etanercept, infliximab, certolizumab pegol, golimumab, tocilizumab and abatacept for rheumatoid arthritis not previously treated with DMARDs or after conventional DMARDs only have failed (TA375, 2016)","url":"https://www.nice.org.uk/guidance/ta375","accessed":"2026-11-03"},"nice-ta715":{"org":"NICE","short":"TA715","title":"Adalimumab, etanercept, infliximab and abatacept for treating moderate rheumatoid arthritis after conventional DMARDs have failed (TA715, 2021)","url":"https://www.nice.org.uk/guidance/ta715","accessed":"2026-11-03"},"nice-ta195":{"org":"NICE","short":"TA195","title":"Adalimumab, etanercept, infliximab, rituximab and abatacept for the treatment of rheumatoid arthritis after the failure of a TNF inhibitor (TA195, 2010)","url":"https://www.nice.org.uk/guidance/ta195","accessed":"2026-11-03"},"nice-ta225":{"org":"NICE","short":"TA225","title":"Golimumab for the treatment of rheumatoid arthritis after the failure of previous disease-modifying anti-rheumatic drugs (TA225, 2011)","url":"https://www.nice.org.uk/guidance/ta225","accessed":"2026-11-03"},"nice-ta247":{"org":"NICE","short":"TA247","title":"Tocilizumab for the treatment of rheumatoid arthritis (TA247, 2012)","url":"https://www.nice.org.uk/guidance/ta247","accessed":"2026-11-03"},"nice-ta485":{"org":"NICE","short":"TA485","title":"Sarilumab for moderate to severe rheumatoid arthritis (TA485, 2017)","url":"https://www.nice.org.uk/guidance/ta485","accessed":"2026-11-03"},"nice-ta466":{"org":"NICE","short":"TA466","title":"Baricitinib for moderate to severe rheumatoid arthritis (TA466, 2017)","url":"https://www.nice.org.uk/guidance/ta466","accessed":"2026-11-03"},"nice-ta480":{"org":"NICE","short":"TA480","title":"Tofacitinib for moderate to severe rheumatoid arthritis (TA480, 2017)","url":"https://www.nice.org.uk/guidance/ta480","accessed":"2026-11-03"},"nice-ta665":{"org":"NICE","short":"TA665","title":"Upadacitinib for treating severe rheumatoid arthritis (TA665, 2020)","url":"https://www.nice.org.uk/guidance/ta665","accessed":"2026-11-03"},"nice-ta676":{"org":"NICE","short":"TA676","title":"Filgotinib for treating moderate to severe rheumatoid arthritis (TA676, 2021)","url":"https://www.nice.org.uk/guidance/ta676","accessed":"2026-11-03"},"nice-ta744":{"org":"NICE","short":"TA744","title":"Upadacitinib for treating moderate rheumatoid arthritis (TA744, 2021)","url":"https://www.nice.org.uk/guidance/ta744","accessed":"2026-11-03"},"nice-ta199":{"org":"NICE","sho

 completely removed) Septic arthritis in last year HIV or Hepatitis B carriers (usually) Previous malignancy within 5 years (usually) NYHA Grade 3 or more heart failure Any history of demyelinating disease 2) Relative contraindications Uncontrolled diabetes Pulmonary fibrosis Bronchiectasis (assess severity) PUVA therapy of >1000 Joules Hepatitis C (absolute if RNA +ve) NYHA heart failure grade 1 or 2 History of TB or positive PPD test (consider using rituxmab or isoniazid and pyridoxine one month before starting and for further 6 months) 3) Potential Problems Atypical or unusual infections Neutropenia / aplasia Pneumonitis / lung fibrosis Infusion / injection site reactions ANA or DNA positivity (especially infliximab), although not usually associated with a clinical problem Induction of autoimmunity AVOID Live Vaccines (SEE VACCINES SECTION)"},{"id":"abatacept","title":"Abatacept","subtitle":"Orencia®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Fusion protein which inhibits Lymphocytes activation by binding to\nCD80 and CD86 on antigen presenting cells (APC) , thus blocking required\nCD28intercation between APCs and T cells<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p>Moderate to severe rheumatoid arthritis (previous failure to one or\nmore DMARDS including methotrexate or a TNF-alpha inhibitor<\/p>\n<p>Moderate to severe active polyarticular JIA in combination with\nmethotrexate<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p>RA (+methotrexate) ● subcutaneous route - consider a single infusion\nloading dose followed by 125mg SC within a day and then 125mg SC weekly\nor SC or weekly at 125 mg SC dose . ●IV infusion at week 0,2 and 4 then\n4 weekly (&lt;60kg give 500mg, 60 to 100kg give 750mg, &gt;100kg give\n1000mg).<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Preparations:<\/td>\n<td><blockquote>\n<p>250mg dry powder vial (administered by IV infusion in 100ml 0.9%\nsodium chloride over 30 minutes)<\/p>\n<p>125mg pre-filled syringe /pen<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and<\/u> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\"><u>TA195<\/u><\/a> <u>(after\nTNF failure if rituximab<\/u> <u>CI/failed)<\/u> , TA715<\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Hypersensitivity to active substance or any excipient<\/p>\n<p>Severe and uncontrolled infections (sepsis/opportunistic)<\/p>\n<p>Manufacturer advise to avoid Live vaccines during and for 3 months\nafter last dose.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; breastfeeding<\/p>\n<p>(Manufacturer advice)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential should use contraception during\ntreatment and up to 14 weeks after the last dose of abatacept<\/p>\n<p>Not to be used in Pregnancy<\/p>\n<p>Breastfeeding to be discontinued while on treatment and up to 14\nweeks of the last dose<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Renal/Hepatic impairment<\/td>\n<td><blockquote>\n<p>Not studied -no recommendation can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Clinical response should be carefully assessed at<\/p>\n<p>6 months. Full clinical response may take longer to occur than with\nother biologic therapies.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>QuantiFERON or T-spot (as indicated)<\/p>\n<p>Consider Hepatitis B&amp;C + HIV<\/p>\n<p>Pregnancy test if indicated<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard DMARD monitoring for methotrexate/other DMARDs the\npatient is taking<\/p>\n<\/blockquote>\n<p>If on monotherapy – FBC &amp; LFT’s at 1, 3 and 6 monthly<\/p>\n<p>Periodic skin examination for all patients with risk of skin\ncancers<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Evidence of active infection<\/p>\n<p>Pruritis/rash or symptoms suggestive of an allergic reaction<\/p>\n<p>Treatment may be associated with PML<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information: <a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/2877/smpc\">http://www.medicines.org.uk/EMC/medicine/2877/smpc<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/334/smpc\">http://www.medicines.org.uk/EMC/medicine/334/smpc<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Fusion protein which inhibits Lymphocytes activation by binding to\nCD80 and CD86 on antigen presenting cells (APC) , thus blocking required\nCD28intercation between APCs and T cells<\/p>\n<\/blockquote>"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p>Moderate to severe rheumatoid arthritis (previous failure to one or\nmore DMARDS including methotrexate or a TNF-alpha inhibitor<\/p>\n<p>Moderate to severe active polyarticular JIA in combination with\nmethotrexate<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p>RA (+methotrexate) ● subcutaneous route - consider a single infusion\nloading dose followed by 125mg SC within a day and then 125mg SC weekly\nor SC or weekly at 125 mg SC dose . ●IV infusion at week 0,2 and 4 then\n4 weekly (&lt;60kg give 500mg, 60 to 100kg give 750mg, &gt;100kg give\n1000mg).<\/p>\n<\/blockquote>"},"preparations":{"label":"Preparations","html":"<blockquote>\n<p>250mg dry powder vial (administered by IV infusion in 100ml 0.9%\nsodium chloride over 30 minutes)<\/p>\n<p>125mg pre-filled syringe /pen<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and<\/u> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\"><u>TA195<\/u><\/a> <u>(after\nTNF failure if rituximab<\/u> <u>CI/failed)<\/u> , TA715<\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a><\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to active substance or any excipient<\/p>\n<p>Severe and uncontrolled infections (sepsis/opportunistic)<\/p>\n<p>Manufacturer advise to avoid Live vaccines during and for 3 months\nafter last dose.<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advice":{"label":"Pregnancy & breastfeeding (Manufacturer advice)","html":"<blockquote>\n<p>Women of childbearing potential should use contraception during\ntreatment and up to 14 weeks after the last dose of abatacept<\/p>\n<p>Not to be used in Pregnancy<\/p>\n<p>Breastfeeding to be discontinued while on treatment and up to 14\nweeks of the last dose<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"renal-hepatic-impairment":{"label":"Renal/Hepatic impairment","html":"<blockquote>\n<p>Not studied -no recommendation can be made<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Clinical response should be carefully assessed at<\/p>\n<p>6 months. Full clinical response may take longer to occur than with\nother biologic therapies.<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>QuantiFERON or T-spot (as indicated)<\/p>\n<p>Consider Hepatitis B&amp;C + HIV<\/p>\n<p>Pregnancy test if indicated<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard DMARD monitoring for methotrexate/other DMARDs the\npatient is taking<\/p>\n<\/blockquote>\n<p>If on monotherapy – FBC &amp; LFT’s at 1, 3 and 6 monthly<\/p>\n<p>Periodic skin examination for all patients with risk of skin\ncancers<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Evidence of active infection<\/p>\n<p>Pruritis/rash or symptoms suggestive of an allergic reaction<\/p>\n<p>Treatment may be associated with PML<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Fusion protein which inhibits Lymphocytes activation by binding to CD80 and CD86 on antigen presenting cells (APC) , thus blocking required CD28intercation between APCs and T cells Licensed Indications: Moderate to severe rheumatoid arthritis (previous failure to one or more DMARDS including methotrexate or a TNF-alpha inhibitor Moderate to severe active polyarticular JIA in combination with methotrexate Licensed Dose: RA (+methotrexate) ● subcutaneous route - consider a single infusion loading dose followed by 125mg SC within a day and then 125mg SC weekly or SC or weekly at 125 mg SC dose . ●IV infusion at week 0,2 and 4 then 4 weekly (<60kg give 500mg, 60 to 100kg give 750mg, >100kg give 1000mg). Preparations: 250mg dry powder vial (administered by IV infusion in 100ml 0.9% sodium chloride over 30 minutes) 125mg pre-filled syringe /pen NICE Guidance: RA: TA375 and TA195 (after TNF failure if rituximab CI/failed) , TA715 JIA: TA373 Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to active substance or any excipient Severe and uncontrolled infections (sepsis/opportunistic) Manufacturer advise to avoid Live vaccines during and for 3 months after last dose. Pregnancy & breastfeeding (Manufacturer advice) Women of childbearing potential should use contraception during treatment and up to 14 weeks after the last dose of abatacept Not to be used in Pregnancy Breastfeeding to be discontinued while on treatment and up to 14 weeks of the last dose Elderly No dose adjustment Renal/Hepatic impairment Not studied -no recommendation can be made Assessment of Response: Clinical response should be carefully assessed at 6 months. Full clinical response may take longer to occur than with other biologic therapies. Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA CXR (evidence TB/fibrosis) QuantiFERON or T-spot (as indicated) Consider Hepatitis B&C + HIV Pregnancy test if indicated Routine Monitoring: Continue standard DMARD monitoring for methotrexate/other DMARDs the patient is taking If on monotherapy – FBC & LFT’s at 1, 3 and 6 monthly Periodic skin examination for all patients with risk of skin cancers Indications for Stopping Therapy: Evidence of active infection Pruritis/rash or symptoms suggestive of an allergic reaction Treatment may be associated with PML Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range AST or ALT > 3 times normal range (iu/L) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/2877/smpc http://www.medicines.org.uk/EMC/medicine/334/smpc"},{"id":"adalimumab","title":"Adalimumab","subtitle":"Humira®; AmgevitaTM","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 38%\" />\n<col style=\"width: 61%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic Class:<\/th>\n<th><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAI0AAABmCAYAAAD23RLkAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAADSSURBVHhe7d0xDoRADATB5f7/Z0j2AdeIAIuqZGJLnXsBAAAAAAAAAAAAAAAAwHTH3urcO83de3nAxGimhv46v73wN9GQiYZMNGSiIRMNmWjIREMmGjLRkImGTDRkoiETDZloyERDJhoy0ZCJhkw0ZKIhEw2ZaMhEQyYaMtGQiYZMNGSiIRMNmWjIREMmGjLRkImGTDRkoiETDZloyERDJhoy0ZCJhkw0ZKIhEw2ZaMhEQyYaMtGQiYZMNGSiIRMNmb/cAAAAAAAAAAAAAACfttYF4u8EbdsX4x8AAAAASUVORK5CYII=\"\nstyle=\"width:0.23667in;height:0.17in\" />Monoclonal IgG1 directed against\nTNF – alpha<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p>RA (with or without methotrexate, but combination preferred)<\/p>\n<\/blockquote>\n<p>Polyarticular Juvenile Idiopathic Arthritis (with or without\nmethotrexate, but combination preferred)<\/p>\n<p>Ankylosing spondylitis /nr axSPA<\/p>\n<p>Psoriatic arthritis<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p>40 mg every other week as a single dose via subcutaneous injection\n(*The licensed datasheet states that RA patients receiving adalimumab\nmonotherapy may benefit from 40mg once week or 80 mg other week).<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Preparations:<\/td>\n<td><blockquote>\n<p>Pre-filled pen 40mg, prefilled syringe 40mg and single dose vial\n40mg<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u> , <u>TA715<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\"><u>TA199<\/u><\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Active tuberculosis or other severe infections such as sepsis, and\nopportunistic infections<\/p>\n<p>Moderate to severe heart failure (NYHA class III/IV)<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>* Patients treated with adalimumab should be given the special alert\ncard.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly:<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal and Hepatic impairment<\/td>\n<td><blockquote>\n<p>Not studied – no dose recommendations can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; Breastfeeding<\/p>\n<p>(Manufacturer advise)<\/p><\/td>\n<td><p>No increase in rate of malformation in newborn (Should only be\nused during pregnancy if needed). Infants born with in-utero exposure to\nadalimumab – administration of live vaccination is not recommended for 5\nmonths following mother’s last adalimumab injection during pregnancy<\/p>\n<p>Cab be used in breastfeeding -No effects on breast fed\ninfants<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Full assessment of response at 12 weeks with treatment withdrawal if\nresponse is inadequate<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>QuantiFERON or T-spot when indicated<\/p>\n<p>Hepatitis B and C + consider HIV<\/p>\n<p>Pregnancy test if indicated (although considered safe for\nconception)<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>Usual tests for methotrexate or other DMARD<\/p>\n<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly <\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Evidence of infection<\/p>\n<p>Risk of new onset or exacerbation of demyelinating disease<\/p>\n<p>Development of malignancy /skin cancer excluding melonoma<\/p>\n<p>Lupus like syndrome<\/p>\n<p>Severe injection site reaction (If minor reaction try oral\nanti-histamine or topical corticosteroids)<\/p>\n<p>Rash - caution very rarely Steven Johnsons Syndrome<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<blockquote>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/2150/smpc\"><u>https://www.medicines.org.uk/emc/product/2150/smpc<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic Class","html":"<img src=\"content/media/image1.png\"\nstyle=\"width:0.23667in;height:0.17in\" />Monoclonal IgG1 directed against\nTNF – alpha"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p>RA (with or without methotrexate, but combination preferred)<\/p>\n<\/blockquote>\n<p>Polyarticular Juvenile Idiopathic Arthritis (with or without\nmethotrexate, but combination preferred)<\/p>\n<p>Ankylosing spondylitis /nr axSPA<\/p>\n<p>Psoriatic arthritis<\/p>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p>40 mg every other week as a single dose via subcutaneous injection\n(*The licensed datasheet states that RA patients receiving adalimumab\nmonotherapy may benefit from 40mg once week or 80 mg other week).<\/p>\n<\/blockquote>"},"preparations":{"label":"Preparations","html":"<blockquote>\n<p>Pre-filled pen 40mg, prefilled syringe 40mg and single dose vial\n40mg<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u> , <u>TA715<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\"><u>TA199<\/u><\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a><\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Active tuberculosis or other severe infections such as sepsis, and\nopportunistic infections<\/p>\n<p>Moderate to severe heart failure (NYHA class III/IV)<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>* Patients treated with adalimumab should be given the special alert\ncard.<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"renal-and-hepatic-impairment":{"label":"Renal and Hepatic impairment","html":"<blockquote>\n<p>Not studied – no dose recommendations can be made<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advise":{"label":"Pregnancy & Breastfeeding (Manufacturer advise)","html":"<p>No increase in rate of malformation in newborn (Should only be\nused during pregnancy if needed). Infants born with in-utero exposure to\nadalimumab – administration of live vaccination is not recommended for 5\nmonths following mother’s last adalimumab injection during pregnancy<\/p>\n<p>Cab be used in breastfeeding -No effects on breast fed\ninfants<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Full assessment of response at 12 weeks with treatment withdrawal if\nresponse is inadequate<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>QuantiFERON or T-spot when indicated<\/p>\n<p>Hepatitis B and C + consider HIV<\/p>\n<p>Pregnancy test if indicated (although considered safe for\nconception)<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>Usual tests for methotrexate or other DMARD<\/p>\n<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly <\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Evidence of infection<\/p>\n<p>Risk of new onset or exacerbation of demyelinating disease<\/p>\n<p>Development of malignancy /skin cancer excluding melonoma<\/p>\n<p>Lupus like syndrome<\/p>\n<p>Severe injection site reaction (If minor reaction try oral\nanti-histamine or topical corticosteroids)<\/p>\n<p>Rash - caution very rarely Steven Johnsons Syndrome<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote>"}},"text":"Therapeutic Class: Monoclonal IgG1 directed against TNF – alpha Licensed Indications: RA (with or without methotrexate, but combination preferred) Polyarticular Juvenile Idiopathic Arthritis (with or without methotrexate, but combination preferred) Ankylosing spondylitis /nr axSPA Psoriatic arthritis Licensed Dose: 40 mg every other week as a single dose via subcutaneous injection (*The licensed datasheet states that RA patients receiving adalimumab monotherapy may benefit from 40mg once week or 80 mg other week). Preparations: Pre-filled pen 40mg, prefilled syringe 40mg and single dose vial 40mg NICE Guidance: RA: TA375 and TA195 (after TNF failure if rituximab CI/failed) , TA715 PsA: TA199 AS and nrAS: TA383 JIA: TA373 Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to the active substance or to any of the excipients Active tuberculosis or other severe infections such as sepsis, and opportunistic infections Moderate to severe heart failure (NYHA class III/IV) Manufacturer advises avoid use with live vaccines * Patients treated with adalimumab should be given the special alert card. Elderly: No dose adjustment Renal and Hepatic impairment Not studied – no dose recommendations can be made Pregnancy & Breastfeeding (Manufacturer advise) No increase in rate of malformation in newborn (Should only be used during pregnancy if needed). Infants born with in-utero exposure to adalimumab – administration of live vaccination is not recommended for 5 months following mother’s last adalimumab injection during pregnancy Cab be used in breastfeeding -No effects on breast fed infants Assessment of Response: Full assessment of response at 12 weeks with treatment withdrawal if response is inadequate Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA CXR (evidence TB/fibrosis) QuantiFERON or T-spot when indicated Hepatitis B and C + consider HIV Pregnancy test if indicated (although considered safe for conception) Routine Monitoring: Usual tests for methotrexate or other DMARD Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Evidence of infection Risk of new onset or exacerbation of demyelinating disease Development of malignancy /skin cancer excluding melonoma Lupus like syndrome Severe injection site reaction (If minor reaction try oral anti-histamine or topical corticosteroids) Rash - caution very rarely Steven Johnsons Syndrome Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range AST or ALT > 3 times normal range (iu/L) Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/2150/smpc"},{"id":"anakinra","title":"Anakinra","subtitle":"","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Human IL-1 receptor antagonist<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed indication<\/td>\n<td><blockquote>\n<p>Still’s disease with moderate to severe disease activity not\nresponding to 2 or more conventional DMARDs including systemic JIA<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed dose<\/td>\n<td>1-2 mg/kg (If body weight upto 49kg ) or 100mg /day (if body weight\nabove 50kg)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Licensed Preparation<\/td>\n<td><blockquote>\n<p>Pre-filled pen in 100 mg<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><u>NICE TA685<\/u><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal/hepatic impairment<\/td>\n<td><blockquote>\n<p>No dose adjustment in moderate hepatic impairment<\/p>\n<p>No dose adjustment in mild hepatic impairment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No data available<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Serious hypersensitivity to active substance<\/p>\n<p>Active Infection /Tuberculosis<\/p>\n<p>Not to be initiated in neutropenia (ANC &lt;1.5 x\n10<sup>9<\/sup>/l)<\/p>\n<p>Not recommended in pre-existing malignancy<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>*Drugs such as warfarin/phenytoin metabolized by CYP450 should\nconsider therapeutic monitoring or dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; Breastfeeding:<\/p>\n<p>(Manufacture advise)<\/p><\/td>\n<td><blockquote>\n<p>No data for pregnancy, to avoid<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Raised liver enzymes (transaminases)<\/p>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Injection site reaction (redness or burning of the skin)<\/p>\n<p>Risk of ILD, pulmonary alveolar proteinosis and pulmonary\nhypertension<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/\">https://www.medicines.org.uk/emc/product/<\/a>559<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><br />\n<\/strong><\/p>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Human IL-1 receptor antagonist<\/p>\n<\/blockquote>"},"licensed-indication":{"label":"Licensed indication","html":"<blockquote>\n<p>Still’s disease with moderate to severe disease activity not\nresponding to 2 or more conventional DMARDs including systemic JIA<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed dose","html":"1-2 mg/kg (If body weight upto 49kg ) or 100mg /day (if body weight\nabove 50kg)"},"licensed-preparation":{"label":"Licensed Preparation","html":"<blockquote>\n<p>Pre-filled pen in 100 mg<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<u>NICE TA685<\/u>"},"renal-hepatic-impairment":{"label":"Renal/hepatic impairment","html":"<blockquote>\n<p>No dose adjustment in moderate hepatic impairment<\/p>\n<p>No dose adjustment in mild hepatic impairment<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No data available<\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Serious hypersensitivity to active substance<\/p>\n<p>Active Infection /Tuberculosis<\/p>\n<p>Not to be initiated in neutropenia (ANC &lt;1.5 x\n10<sup>9<\/sup>/l)<\/p>\n<p>Not recommended in pre-existing malignancy<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>*Drugs such as warfarin/phenytoin metabolized by CYP450 should\nconsider therapeutic monitoring or dose adjustment<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacture-advise":{"label":"Pregnancy & Breastfeeding: (Manufacture advise)","html":"<blockquote>\n<p>No data for pregnancy, to avoid<\/p>\n<p>Breastfeeding safety unknown<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>FBC<\/p>\n<p>LFT’s<\/p>\n<p>U&amp;E<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, QuantiFERON or T-spot, and<\/p>\n<p>HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>*Consider pregnancy test<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Raised liver enzymes (transaminases)<\/p>\n<p>ANC &lt;1.0 x 10<sup>9<\/sup>cells/L<\/p>\n<p>Serious infection or chronic infection not responding to standard\ntreatment<\/p>\n<p>Suspected hypersensitivity reaction (injection site rash, rash,\nurticaria, dyspnoea)<\/p>\n<p>Injection site reaction (redness or burning of the skin)<\/p>\n<p>Risk of ILD, pulmonary alveolar proteinosis and pulmonary\nhypertension<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Human IL-1 receptor antagonist Licensed indication Still’s disease with moderate to severe disease activity not responding to 2 or more conventional DMARDs including systemic JIA Licensed dose 1-2 mg/kg (If body weight upto 49kg ) or 100mg /day (if body weight above 50kg) Licensed Preparation Pre-filled pen in 100 mg NICE Guidance: NICE TA685 Renal/hepatic impairment No dose adjustment in moderate hepatic impairment No dose adjustment in mild hepatic impairment Elderly No data available Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Serious hypersensitivity to active substance Active Infection /Tuberculosis Not to be initiated in neutropenia (ANC <1.5 x 10 9 /l) Not recommended in pre-existing malignancy Manufacturer advises avoid use with live vaccines *Drugs such as warfarin/phenytoin metabolized by CYP450 should consider therapeutic monitoring or dose adjustment Pregnancy & Breastfeeding: (Manufacture advise) No data for pregnancy, to avoid Breastfeeding safety unknown Baseline Tests: FBC LFT’s U&E Consider CXR Consider Hepatitis B and C, QuantiFERON or T-spot, and HIV testing Consider Urinalysis *Consider pregnancy test Routine Monitoring: Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Raised liver enzymes (transaminases) ANC <1.0 x 10 9 cells/L Serious infection or chronic infection not responding to standard treatment Suspected hypersensitivity reaction (injection site rash, rash, urticaria, dyspnoea) Injection site reaction (redness or burning of the skin) Risk of ILD, pulmonary alveolar proteinosis and pulmonary hypertension Please refer to licensed datasheet for more comprehensive prescribing information: https://www.medicines.org.uk/emc/product/ 559"},{"id":"belimumab","title":"Belimumab","subtitle":"Benlysta®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 52%\" />\n<col style=\"width: 47%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th><blockquote>\n<p>Belimumab is a human, IgG1λ monoclonal antibody - blocks action of\nBLyS (B Lymphocyte Stimulator Protein) also known as B-cell Activating\nfactor (BAFF)<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p>Add on therapy in adult patients with active, autoantibody positive\nSLE with a high degree of disease activity despite standard therapy\n(defined as at least 1 serological biomarker and SELENA-SLEDAI score\ngreater than equal to 10) (usually in a tertiary center setting)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p>I.V: 10 mg/kg on Days 0, 14 and 28, and at 4-week intervals\nthereafter<\/p>\n<p>SC :200 mg once weekly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Licensed preparation:<\/td>\n<td><blockquote>\n<p>120mg vial (80mg/ml) &amp; 400mg vial (80mg/ml) - in 250ml 0.9%\nsodium chloride over 60 minutes<\/p>\n<p>200 mg solution for injection in pre-filled pen/ syringe<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>SLE: <u>TA752<\/u><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Live vaccines must not be given during or 30 days before commencing\ntreatment<\/p>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Chronic or severe or opportunistic infections (risk in active or\nlatent TB unknown)<\/p>\n<p>Malignant neoplasm within last 5 years.<\/p>\n<p>Acute hypersensitivity reactions reported to occur several hours\nafter completion and even the day after infusion.<\/p>\n<p>Do-not support co-administration of rituximab . Caution with\nco-administration with other B cell targeted therapy.<\/p>\n<p>Not recommended in active CNS lupus, hypogammaglobulinemia, history\nof organ transplant<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>Used with caution in elderly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal/hepatic impairment<\/td>\n<td><blockquote>\n<p>Dose adjustment is not required in patients with mild, moderate or\nsevere renal impairment<\/p>\n<p>Unlikely dose adjustment in hepatic impairment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; Breastfeeding:<\/p>\n<p>(manufacturer advice)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential must use effective contraception\nduring treatment and up to 4 months after the last treatment.<\/p>\n<p>Should not be used during pregnancy<\/p>\n<p>Breastfeeding : risk/ benefit ratio between infant and mother<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Discontinuation of treatment should be considered if there is no\nimprovement in disease control after 6 months of treatment.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><blockquote>\n<p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>B Cell analysis<\/p>\n<p>Immunoglobulins<\/p>\n<p>CXR<\/p>\n<p>Consider Hepatitis B&amp;C, HIV<\/p>\n<p>Pregnancy test if indicated<\/p>\n<p>Consider TB screening (not done routinely)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue routine DMARD monitoring for concomitant therapies.<\/p>\n<p>Exclude presence of infection prior to each infusion<\/p>\n<p>Urinalysis before each infusion<\/p>\n<p>FBC/U&amp;E’s before each infusion<\/p>\n<p>BP prior to infusion, 30 minutes after the start, at the end of the\ninfusion and 30 minutes post<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Evidence of active infection<\/p>\n<p>Hypersensitivity reaction<\/p>\n<p>Neutrophils &lt; 1.6 10<sup>9/<\/sup>L<\/p>\n<p>Psychiatric disorders frequently reported (depression, suicidal\nideation and behavior<\/p>\n<p>Progressive multifocal leuko-encephalopathy reported – alert to\nsymptoms of cognitive, neurological or psychiatric signs<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/7616/smpc\">http://www.medicines.org.uk/EMC/medicine/7616/smpc<\/a><\/p>\n<p><u>http://www.medicines.org.uk/emc/product/11398/smpc<\/u><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"<blockquote>\n<p>Belimumab is a human, IgG1λ monoclonal antibody - blocks action of\nBLyS (B Lymphocyte Stimulator Protein) also known as B-cell Activating\nfactor (BAFF)<\/p>\n<\/blockquote>"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p>Add on therapy in adult patients with active, autoantibody positive\nSLE with a high degree of disease activity despite standard therapy\n(defined as at least 1 serological biomarker and SELENA-SLEDAI score\ngreater than equal to 10) (usually in a tertiary center setting)<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p>I.V: 10 mg/kg on Days 0, 14 and 28, and at 4-week intervals\nthereafter<\/p>\n<p>SC :200 mg once weekly<\/p>\n<\/blockquote>"},"licensed-preparation":{"label":"Licensed preparation","html":"<blockquote>\n<p>120mg vial (80mg/ml) &amp; 400mg vial (80mg/ml) - in 250ml 0.9%\nsodium chloride over 60 minutes<\/p>\n<p>200 mg solution for injection in pre-filled pen/ syringe<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>SLE: <u>TA752<\/u><\/p>\n<\/blockquote>"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<blockquote>\n<p>Live vaccines must not be given during or 30 days before commencing\ntreatment<\/p>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Chronic or severe or opportunistic infections (risk in active or\nlatent TB unknown)<\/p>\n<p>Malignant neoplasm within last 5 years.<\/p>\n<p>Acute hypersensitivity reactions reported to occur several hours\nafter completion and even the day after infusion.<\/p>\n<p>Do-not support co-administration of rituximab . Caution with\nco-administration with other B cell targeted therapy.<\/p>\n<p>Not recommended in active CNS lupus, hypogammaglobulinemia, history\nof organ transplant<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>Used with caution in elderly<\/p>\n<\/blockquote>"},"renal-hepatic-impairment":{"label":"Renal/hepatic impairment","html":"<blockquote>\n<p>Dose adjustment is not required in patients with mild, moderate or\nsevere renal impairment<\/p>\n<p>Unlikely dose adjustment in hepatic impairment<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advice":{"label":"Pregnancy & Breastfeeding: (manufacturer advice)","html":"<blockquote>\n<p>Women of childbearing potential must use effective contraception\nduring treatment and up to 4 months after the last treatment.<\/p>\n<p>Should not be used during pregnancy<\/p>\n<p>Breastfeeding : risk/ benefit ratio between infant and mother<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Discontinuation of treatment should be considered if there is no\nimprovement in disease control after 6 months of treatment.<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<blockquote>\n<p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>B Cell analysis<\/p>\n<p>Immunoglobulins<\/p>\n<p>CXR<\/p>\n<p>Consider Hepatitis B&amp;C, HIV<\/p>\n<p>Pregnancy test if indicated<\/p>\n<p>Consider TB screening (not done routinely)<\/p>\n<\/blockquote>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue routine DMARD monitoring for concomitant therapies.<\/p>\n<p>Exclude presence of infection prior to each infusion<\/p>\n<p>Urinalysis before each infusion<\/p>\n<p>FBC/U&amp;E’s before each infusion<\/p>\n<p>BP prior to infusion, 30 minutes after the start, at the end of the\ninfusion and 30 minutes post<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Evidence of active infection<\/p>\n<p>Hypersensitivity reaction<\/p>\n<p>Neutrophils &lt; 1.6 10<sup>9/<\/sup>L<\/p>\n<p>Psychiatric disorders frequently reported (depression, suicidal\nideation and behavior<\/p>\n<p>Progressive multifocal leuko-encephalopathy reported – alert to\nsymptoms of cognitive, neurological or psychiatric signs<\/p>\n<\/blockquote>"}},"text":"Therapeutic class: Belimumab is a human, IgG1λ monoclonal antibody - blocks action of BLyS (B Lymphocyte Stimulator Protein) also known as B-cell Activating factor (BAFF) Licensed Indications: Add on therapy in adult patients with active, autoantibody positive SLE with a high degree of disease activity despite standard therapy (defined as at least 1 serological biomarker and SELENA-SLEDAI score greater than equal to 10) (usually in a tertiary center setting) Licensed Dose: I.V: 10 mg/kg on Days 0, 14 and 28, and at 4-week intervals thereafter SC :200 mg once weekly Licensed preparation: 120mg vial (80mg/ml) & 400mg vial (80mg/ml) - in 250ml 0.9% sodium chloride over 60 minutes 200 mg solution for injection in pre-filled pen/ syringe NICE Guidance: SLE: TA752 Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Live vaccines must not be given during or 30 days before commencing treatment Hypersensitivity to the active substance or to any of the excipients Chronic or severe or opportunistic infections (risk in active or latent TB unknown) Malignant neoplasm within last 5 years. Acute hypersensitivity reactions reported to occur several hours after completion and even the day after infusion. Do-not support co-administration of rituximab . Caution with co-administration with other B cell targeted therapy. Not recommended in active CNS lupus, hypogammaglobulinemia, history of organ transplant Elderly Used with caution in elderly Renal/hepatic impairment Dose adjustment is not required in patients with mild, moderate or severe renal impairment Unlikely dose adjustment in hepatic impairment Pregnancy & Breastfeeding: (manufacturer advice) Women of childbearing potential must use effective contraception during treatment and up to 4 months after the last treatment. Should not be used during pregnancy Breastfeeding : risk/ benefit ratio between infant and mother Assessment of Response: Discontinuation of treatment should be considered if there is no improvement in disease control after 6 months of treatment. Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA B Cell analysis Immunoglobulins CXR Consider Hepatitis B&C, HIV Pregnancy test if indicated Consider TB screening (not done routinely) Routine Monitoring: Continue routine DMARD monitoring for concomitant therapies. Exclude presence of infection prior to each infusion Urinalysis before each infusion FBC/U&E’s before each infusion BP prior to infusion, 30 minutes after the start, at the end of the infusion and 30 minutes post Indications for Stopping Therapy: Evidence of active infection Hypersensitivity reaction Neutrophils < 1.6 10 9/ L Psychiatric disorders frequently reported (depression, suicidal ideation and behavior Progressive multifocal leuko-encephalopathy reported – alert to symptoms of cognitive, neurological or psychiatric signs Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/7616/smpc http://www.medicines.org.uk/emc/product/11398/smpc"},{"id":"certolizumab-pegol","title":"Certolizumab Pegol","subtitle":"Cimzia®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 62%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic Class:<\/th>\n<th><blockquote>\n<p>Pegylated monoclonal antibody against TNF alpha which lacks<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p>Moderate to severe active RA in combination with methotrexate<\/p>\n<p>Active Psoriatic Arthritis<\/p>\n<\/blockquote>\n<p>Severe active AS or Nr-Ax SPA<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p>400 mg (as two s/c injections of 200 mg each on one day) at weeks 0,\n2 and 4, followed by a maintenance dose of 200 mg every 2 weeks<\/p>\n<p><u>Missed dose<\/u>: Patients who miss a dose should be advised to\ninject the next dose as soon as they remember and then continue\ninjecting subsequent doses every 2 weeks as originally instructed<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Preparations:<\/td>\n<td><blockquote>\n<p>200mg prefilled syringe, pre-filled pen, solution for injection in\ndose dispenser cartridge<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta415\">TA415<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA445\"><u>TA445<\/u><\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Active tuberculosis (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Moderate or severe heart failure (NYHA class III/IV)<\/p>\n<p>Latex allergy (needle shield inside the removable cap )<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>*The datasheet contains a warning regarding a minor influence on the\nability to drive and use machines, (including vertigo, vision disorder\nand fatigue) may occur following administration<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; Breastfeeding<\/p>\n<p>(manufacturer advice)<\/p><\/td>\n<td><blockquote>\n<p>Compatible with all trimester of pregnancy, has no to minimal\nplacental transfer<\/p>\n<p>Can be used in breastfeeding<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic /renal impairment<\/td>\n<td><blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Available data suggest that clinical response is usually achieved\nwithin 12 weeks of treatment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>Quantiferon or T-spot (as indicated)<\/p>\n<p>Hepatitis B and C + consider HIV<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Evidence of infection / tuberculosis<\/p>\n<p>Risk of new onset or exacerbation of demyelinating disease<\/p>\n<p>SLE or new autoimmune syndrome<\/p>\n<p>Severe injection site reaction (If minor reaction try oral/topical\nanti-histamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>/4450/smpc<a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/product\">http://www.medicines.org.uk/EMC/product<\/a><u>/4450/smpc<\/u><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic Class","html":"<blockquote>\n<p>Pegylated monoclonal antibody against TNF alpha which lacks<\/p>\n<\/blockquote>"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p>Moderate to severe active RA in combination with methotrexate<\/p>\n<p>Active Psoriatic Arthritis<\/p>\n<\/blockquote>\n<p>Severe active AS or Nr-Ax SPA<\/p>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p>400 mg (as two s/c injections of 200 mg each on one day) at weeks 0,\n2 and 4, followed by a maintenance dose of 200 mg every 2 weeks<\/p>\n<p><u>Missed dose<\/u>: Patients who miss a dose should be advised to\ninject the next dose as soon as they remember and then continue\ninjecting subsequent doses every 2 weeks as originally instructed<\/p>\n<\/blockquote>"},"preparations":{"label":"Preparations","html":"<blockquote>\n<p>200mg prefilled syringe, pre-filled pen, solution for injection in\ndose dispenser cartridge<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta415\">TA415<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA445\"><u>TA445<\/u><\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to the active substance or to any of the\nexcipients<\/p>\n<p>Active tuberculosis (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Moderate or severe heart failure (NYHA class III/IV)<\/p>\n<p>Latex allergy (needle shield inside the removable cap )<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<p>*The datasheet contains a warning regarding a minor influence on the\nability to drive and use machines, (including vertigo, vision disorder\nand fatigue) may occur following administration<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advice":{"label":"Pregnancy & Breastfeeding (manufacturer advice)","html":"<blockquote>\n<p>Compatible with all trimester of pregnancy, has no to minimal\nplacental transfer<\/p>\n<p>Can be used in breastfeeding<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"hepatic-renal-impairment":{"label":"Hepatic /renal impairment","html":"<blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Available data suggest that clinical response is usually achieved\nwithin 12 weeks of treatment<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<p>Full clinical/infection screen<\/p>\n<p>Urinalysis &amp; BP<\/p>\n<p>FBC/U&amp;E/LFT/ANA/DNA<\/p>\n<p>CXR (evidence TB/fibrosis)<\/p>\n<p>Quantiferon or T-spot (as indicated)<\/p>\n<p>Hepatitis B and C + consider HIV<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Evidence of infection / tuberculosis<\/p>\n<p>Risk of new onset or exacerbation of demyelinating disease<\/p>\n<p>SLE or new autoimmune syndrome<\/p>\n<p>Severe injection site reaction (If minor reaction try oral/topical\nanti-histamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote>"}},"text":"Therapeutic Class: Pegylated monoclonal antibody against TNF alpha which lacks Licensed Indications: Moderate to severe active RA in combination with methotrexate Active Psoriatic Arthritis Severe active AS or Nr-Ax SPA Licensed Dose: 400 mg (as two s/c injections of 200 mg each on one day) at weeks 0, 2 and 4, followed by a maintenance dose of 200 mg every 2 weeks Missed dose : Patients who miss a dose should be advised to inject the next dose as soon as they remember and then continue injecting subsequent doses every 2 weeks as originally instructed Preparations: 200mg prefilled syringe, pre-filled pen, solution for injection in dose dispenser cartridge NICE Guidance: RA: TA375 and TA415 (after TNF failure if rituximab CI/failed) PsA: TA445 AS and nrAS: TA383 Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to the active substance or to any of the excipients Active tuberculosis (TB) or other severe infections such as sepsis, and opportunistic infections Moderate or severe heart failure (NYHA class III/IV) Latex allergy (needle shield inside the removable cap ) Manufacturer advises avoid use with live vaccines *The datasheet contains a warning regarding a minor influence on the ability to drive and use machines, (including vertigo, vision disorder and fatigue) may occur following administration Pregnancy & Breastfeeding (manufacturer advice) Compatible with all trimester of pregnancy, has no to minimal placental transfer Can be used in breastfeeding Elderly No dose adjustment Hepatic /renal impairment Not studied - no dose recommendation can be made Assessment of Response: Available data suggest that clinical response is usually achieved within 12 weeks of treatment Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA CXR (evidence TB/fibrosis) Quantiferon or T-spot (as indicated) Hepatitis B and C + consider HIV Routine Monitoring: Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Evidence of infection / tuberculosis Risk of new onset or exacerbation of demyelinating disease SLE or new autoimmune syndrome Severe injection site reaction (If minor reaction try oral/topical anti-histamine or topical corticosteroids) Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range AST or ALT > 3 times normal range (iu/L) Please refer to licensed datasheet for more comprehensive prescribing information: /4450/smpc http://www.medicines.org.uk/EMC/product /4450/smpc"},{"id":"etanercept","title":"Etanercept","subtitle":"Enbrel®; Benepali®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 62%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic Class:<\/th>\n<th><blockquote>\n<p>TNF inhibitor, acts as a soluble TNF receptor and binds TNF-alpha and\nTNF-beta<\/p>\n<\/blockquote><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><p>RA (with or without methotrexate, but combination preferred)<\/p>\n<p>JIA (with or without methotrexate, but combination preferred)<\/p>\n<p>Psoriatic Arthritis<\/p>\n<p>Ankylosing spondylitis /Non-radiographic axial\nspondyloarthritis<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p>50mg weekly or 25mg twice a week by subcutaneous injection<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Preparations:<\/td>\n<td><blockquote>\n<p>50mg &amp; 25mg prefilled syringe, 50mg prefilled pen, 25mg &amp;\n10mg dry powder vial.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u> , <u>TA715<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\"><u>TA199<\/u><\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Hypersensitivity to the active substance or to any of the excipient\n(needle cover of prefilled syringe contains latex)<\/p>\n<p>Active tuberculosis** (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Caution in patients with congestive cardiac failure.<\/p>\n<p>Caution in moderate to severe alcoholic hepatitis<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote>\n<p>*Patients treated with etanercept should be given the Patient Alert\nCard.<\/p>\n<blockquote>\n<p>**May be preferred TNFi where previous TB contact but no active\ninfection.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; breastfeeding<\/p>\n<p>(Manufacturer advice)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential must use effective contraception\nduring treatment and up to 3 weeks discontinuation of therapy.<\/p>\n<p>Can be used in pregnancy if indicated. Administration of live\nvaccines to infants for 16 weeks after the mother’s last dose of<\/p>\n<p>Breastfeeding: risk/ benefit ratio between infant and mother<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic/Renal impairment<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Full assessment of response at weeks 12 , of no response then\nreconsider<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><ul>\n<li><p>Full clinical/infection screen<\/p><\/li>\n<li><p>Urinalysis &amp; BP<\/p><\/li>\n<li><p>FBC/U&amp;E/LFT/ANA/DNA<\/p><\/li>\n<li><p>CXR (evidence TB/fibrosis)<\/p><\/li>\n<li><p>Quantiferon or T-spot (as indicated)<\/p><\/li>\n<li><p>Hepatitis B and C + consider HIV<\/p><\/li>\n<li><p>Pregnancy test if indicated (although considered safe for\nconception)<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><blockquote>\n<p>Evidence of infection<\/p>\n<p>New onset or exacerbation of demyelinating disorder<\/p>\n<p>SLE or other autoimmune syndrome<\/p>\n<p>Development of ILD<\/p>\n<p>Severe injection site reaction (If minor reaction try oral\nanti-histamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/product\">http://www.medicines.org.uk/EMC/product<\/a>/11739/smpc<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.medicines.org.uk/emc/product/1987/smpc\"><u>https://www.medicines.org.uk/emc/product/1987/smpc<\/u><\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic Class","html":"<blockquote>\n<p>TNF inhibitor, acts as a soluble TNF receptor and binds TNF-alpha and\nTNF-beta<\/p>\n<\/blockquote>"},"licensed-indications":{"label":"Licensed Indications","html":"<p>RA (with or without methotrexate, but combination preferred)<\/p>\n<p>JIA (with or without methotrexate, but combination preferred)<\/p>\n<p>Psoriatic Arthritis<\/p>\n<p>Ankylosing spondylitis /Non-radiographic axial\nspondyloarthritis<\/p>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p>50mg weekly or 25mg twice a week by subcutaneous injection<\/p>\n<\/blockquote>"},"preparations":{"label":"Preparations","html":"<blockquote>\n<p>50mg &amp; 25mg prefilled syringe, 50mg prefilled pen, 25mg &amp;\n10mg dry powder vial.<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375<\/u><\/a>\n<u>and <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/u>\n<u>(after TNF failure if rituximab CI/failed)<\/u> , <u>TA715<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\"><u>TA199<\/u><\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a><\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\"><u>TA373<\/u><\/a><\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to the active substance or to any of the excipient\n(needle cover of prefilled syringe contains latex)<\/p>\n<p>Active tuberculosis** (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Caution in patients with congestive cardiac failure.<\/p>\n<p>Caution in moderate to severe alcoholic hepatitis<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote>\n<p>*Patients treated with etanercept should be given the Patient Alert\nCard.<\/p>\n<blockquote>\n<p>**May be preferred TNFi where previous TB contact but no active\ninfection.<\/p>\n<\/blockquote>"},"pregnancy-breastfeeding-manufacturer-advice":{"label":"Pregnancy & breastfeeding (Manufacturer advice)","html":"<blockquote>\n<p>Women of childbearing potential must use effective contraception\nduring treatment and up to 3 weeks discontinuation of therapy.<\/p>\n<p>Can be used in pregnancy if indicated. Administration of live\nvaccines to infants for 16 weeks after the mother’s last dose of<\/p>\n<p>Breastfeeding: risk/ benefit ratio between infant and mother<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"hepatic-renal-impairment":{"label":"Hepatic/Renal impairment","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"assessment-of-response":{"label":"Assessment of Response","html":"<blockquote>\n<p>Full assessment of response at weeks 12 , of no response then\nreconsider<\/p>\n<\/blockquote>"},"baseline-tests":{"label":"Baseline Tests","html":"<ul>\n<li><p>Full clinical/infection screen<\/p><\/li>\n<li><p>Urinalysis &amp; BP<\/p><\/li>\n<li><p>FBC/U&amp;E/LFT/ANA/DNA<\/p><\/li>\n<li><p>CXR (evidence TB/fibrosis)<\/p><\/li>\n<li><p>Quantiferon or T-spot (as indicated)<\/p><\/li>\n<li><p>Hepatitis B and C + consider HIV<\/p><\/li>\n<li><p>Pregnancy test if indicated (although considered safe for\nconception)<\/p><\/li>\n<\/ul>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<blockquote>\n<p>Evidence of infection<\/p>\n<p>New onset or exacerbation of demyelinating disorder<\/p>\n<p>SLE or other autoimmune syndrome<\/p>\n<p>Development of ILD<\/p>\n<p>Severe injection site reaction (If minor reaction try oral\nanti-histamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote>"}},"text":"Therapeutic Class: TNF inhibitor, acts as a soluble TNF receptor and binds TNF-alpha and TNF-beta Licensed Indications: RA (with or without methotrexate, but combination preferred) JIA (with or without methotrexate, but combination preferred) Psoriatic Arthritis Ankylosing spondylitis /Non-radiographic axial spondyloarthritis Licensed Dose: 50mg weekly or 25mg twice a week by subcutaneous injection Preparations: 50mg & 25mg prefilled syringe, 50mg prefilled pen, 25mg & 10mg dry powder vial. NICE Guidance: RA: TA375 and TA195 (after TNF failure if rituximab CI/failed) , TA715 PsA: TA199 AS and nrAS: TA383 JIA: TA373 Warnings/Contraindications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) Hypersensitivity to the active substance or to any of the excipient (needle cover of prefilled syringe contains latex) Active tuberculosis** (TB) or other severe infections such as sepsis, and opportunistic infections Caution in patients with congestive cardiac failure. Caution in moderate to severe alcoholic hepatitis Manufacturer advises avoid use with live vaccines *Patients treated with etanercept should be given the Patient Alert Card. **May be preferred TNFi where previous TB contact but no active infection. Pregnancy & breastfeeding (Manufacturer advice) Women of childbearing potential must use effective contraception during treatment and up to 3 weeks discontinuation of therapy. Can be used in pregnancy if indicated. Administration of live vaccines to infants for 16 weeks after the mother’s last dose of Breastfeeding: risk/ benefit ratio between infant and mother Elderly No dose adjustment Hepatic/Renal impairment No dose adjustment Assessment of Response: Full assessment of response at weeks 12 , of no response then reconsider Baseline Tests: Full clinical/infection screen Urinalysis & BP FBC/U&E/LFT/ANA/DNA CXR (evidence TB/fibrosis) Quantiferon or T-spot (as indicated) Hepatitis B and C + consider HIV Pregnancy test if indicated (although considered safe for conception) Routine Monitoring: Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6 months then FBC, U&Es and LFTs 6 monthly Indications for Stopping Therapy: Evidence of infection New onset or exacerbation of demyelinating disorder SLE or other autoimmune syndrome Development of ILD Severe injection site reaction (If minor reaction try oral anti-histamine or topical corticosteroids) Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range AST or ALT > 3 times normal range (iu/L) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/product /11739/smpc https://www.medicines.org.uk/emc/product/1987/smpc"},{"id":"golimumab","title":"Golimumab","subtitle":"Simponi®","group":"Biologics (bDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 62%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic Class:<\/th>\n<th><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAI0AAABmCAYAAAD23RLkAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAADSSURBVHhe7d0xDoRADATB5f7/Z0j2AdeIAIuqZGJLnXsBAAAAAAAAAAAAAAAAwHTH3urcO83de3nAxGimhv46v73wN9GQiYZMNGSiIRMNmWjIREMmGjLRkImGTDRkoiETDZloyERDJhoy0ZCJhkw0ZKIhEw2ZaMhEQyYaMtGQiYZMNGSiIRMNmWjIREMmGjLRkImGTDRkoiETDZloyERDJhoy0ZCJhkw0ZKIhEw2ZaMhEQyYaMtGQiYZMNGSiIRMNmb/cAAAAAAAAAAAAAACfttYF4u8EbdsX4x8AAAAASUVORK5CYII=\"\nstyle=\"width:0.23667in;height:0.17in\" />Human monoclonal antibody that\nbinds and inhibits soluble and transmembrane human TNF alpha<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Indications:<\/td>\n<td><blockquote>\n<p>Moderate to severe RA (in combination with methotrexate),<\/p>\n<p>Psoriatic arthritis (Alone or in combination with MTX)<\/p>\n<p>Ankylosing spondylitis /Non-radiographic axial spondyloarthritis<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Licensed Dose:<\/td>\n<td><blockquote>\n<p>RA, PsA &amp; AS - 50 mg given once a month by sc injection, on the\nsame date each month.<\/p>\n<p><u>Increased dose:<\/u> Patients weighing more than 100 kg who do not\nachieve an adequate clinical response after 3 or 4 doses of 50mg, should\nhave their dose increased to 100 mg once a month. Continued therapy\nshould be reconsidered in patients who show no evidence of therapeutic\nbenefit after receiving 3 to 4 additional doses of 100 mg.<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Licensed preparation:<\/td>\n<td><blockquote>\n<p>Prefilled pen and prefilled syringe in 50mg and 100mg strength<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375;<\/u><\/a> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta225\"><u>TA225<\/u><\/a> <u>(after\nTNF failure if rituximab CI/failed)<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA220\"><u>TA220<\/u><\/a> AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a> nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta497\"><u>TA497<\/u><\/a><\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contraindications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><blockquote>\n<p>Hypersensitivity to the active substance or to any of the excipients\n- including latex sensitivity (golimumab pen)<\/p>\n<p>Active tuberculosis (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Moderate or severe heart failure (NYHA class III/IV)<\/p>\n<p>Contains Sorbitol - not in hereditary problems with fructose\nintolerance.<\/p>\n<p>Caution in patients with previous malignancy or new malignancy<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elderly<\/td>\n<td><blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hepatic/Renal impairment<\/td>\n<td><blockquote>\n<p>Not studied - no dose recommendation can be made<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p>Pregnancy &amp; breastfeeding<\/p>\n<p>(Manufacturer advice)<\/p><\/td>\n<td><blockquote>\n<p>Women of childbearing potential must use effective contraception\nduring treatment and up to 6 months after last dose.<\/p>\n<p>Can be used in pregnancy if indicated. Administration of live\nvaccines to infants exposed in-utero for 6 months after the mother’s\nlast dose of golimumab<\/p>\n<p>Breastfeeding: not recommended<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td><blockquote>\n<p>Assessment of assessment after 3 -4 months , to reconsidertherapy if\nno response<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><ul>\n<li><p>Full clinical/infection screen<\/p><\/li>\n<li><p>Urinalysis &amp; BP<\/p><\/li>\n<li><p>FBC/U&amp;E/LFT/ANA/DNA<\/p><\/li>\n<li><p>CXR (evidence TB/fibrosis)<\/p><\/li>\n<li><p>Quantiferon or T-spot (as indicated)<\/p><\/li>\n<li><p>Hepatitis B and C + consider HIV<\/p><\/li>\n<li><p>Pregnancy test if indicated (though considered safe for\nconception)<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><blockquote>\n<p>Continue standard csDMARD monitoring, if monotherapy 1, 3 and 6\nmonths then FBC, U&amp;Es and LFTs 6 monthly<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>Evidence of infection<\/p>\n<p>New onset or exacerbation of demyelination<\/p>\n<p>Lupus like syndrome / autoimmune syndrome<\/p>\n<blockquote>\n<p>Severe injection site reaction (If minor reaction try oral\nanti-histamine or topical corticosteroids)<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<\/blockquote><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/emc/product/5133/smpc\">http://www.medicines.org.uk/emc/product/5133/smpc<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><br />\n<\/strong><\/p>","fields":{"therapeutic-class":{"label":"Therapeutic Class","html":"<img src=\"content/media/image1.png\"\nstyle=\"width:0.23667in;height:0.17in\" />Human monoclonal antibody that\nbinds and inhibits soluble and transmembrane human TNF alpha"},"licensed-indications":{"label":"Licensed Indications","html":"<blockquote>\n<p>Moderate to severe RA (in combination with methotrexate),<\/p>\n<p>Psoriatic arthritis (Alone or in combination with MTX)<\/p>\n<p>Ankylosing spondylitis /Non-radiographic axial spondyloarthritis<\/p>\n<\/blockquote>"},"licensed-dose":{"label":"Licensed Dose","html":"<blockquote>\n<p>RA, PsA &amp; AS - 50 mg given once a month by sc injection, on the\nsame date each month.<\/p>\n<p><u>Increased dose:<\/u> Patients weighing more than 100 kg who do not\nachieve an adequate clinical response after 3 or 4 doses of 50mg, should\nhave their dose increased to 100 mg once a month. Continued therapy\nshould be reconsidered in patients who show no evidence of therapeutic\nbenefit after receiving 3 to 4 additional doses of 100 mg.<\/p>\n<\/blockquote>"},"licensed-preparation":{"label":"Licensed preparation","html":"<blockquote>\n<p>Prefilled pen and prefilled syringe in 50mg and 100mg strength<\/p>\n<\/blockquote>"},"nice-guidance":{"label":"NICE Guidance","html":"<blockquote>\n<p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\"><u>TA375;<\/u><\/a> <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta225\"><u>TA225<\/u><\/a> <u>(after\nTNF failure if rituximab CI/failed)<\/u><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA220\"><u>TA220<\/u><\/a> AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\"><u>TA383<\/u><\/a> nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta497\"><u>TA497<\/u><\/a><\/p>\n<\/blockquote>"},"warnings-contraindications-significant-drug-interactions":{"label":"Warnings/Contraindications/Significant drug interactions","html":"<blockquote>\n<p>Hypersensitivity to the active substance or to any of the excipients\n- including latex sensitivity (golimumab pen)<\/p>\n<p>Active tuberculosis (TB) or other severe infections such as sepsis,\nand opportunistic infections<\/p>\n<p>Moderate or severe heart failure (NYHA class III/IV)<\/p>\n<p>Contains Sorbitol - not in hereditary problems with fructose\nintolerance.<\/p>\n<p>Caution in patients with previous malignancy or new malignancy<\/p>\n<p>Manufacturer advises avoid use with live vaccines<\/p>\n<\/blockquote>"},"elderly":{"label":"Elderly","html":"<blockquote>\n<p>No dose adjustment<\/p>\n<\/blockquote>"},"hepatic-renal-impairment":{"label":"Hepatic/Renal impairment","html":"<blockquote>\n<p>Not s

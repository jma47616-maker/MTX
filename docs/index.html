S 28 &gt;5.1) and PSA- 5mg BD\nwith or without MTX (film coated tablets), alternatively 11mg OD\n(modified release tablets).<\/strong><\/p>\n<p><strong>SPA 5mg BD<\/strong> <\/p>"},"nice-guidance":{"label":"NICE Guidance","html":"<p>RA: TA480<\/p>\n<p>SPA<u>:<\/u> TA920<\/p>\n<p>PsA: TA543 <\/p>"},"renal-impairment":{"label":"Renal Impairment","html":"Dose adjustment only when CrCl &lt;30ml/min: max dose 5mg od"},"hepatic-impairment":{"label":"Hepatic Impairment","html":"Avoid in patients with cirrhosis"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<p>C/I ALC &lt;0.75 x 10<sup>9<\/sup>cells/L, ANC &lt;1.0 x\n10<sup>9<\/sup>cells/L, Hb &lt;9g/dL<\/p>\n<p>Gastrointestinal perforation – possible increased risk. Use with\ncaution in those with increased risk (e.g. diverticulosis); promptly\nevaluate abdominal symptoms<\/p>\n<p>Interstitial lung disease – possible increased risk. Increased risk\nof infections in people with underlying lung disease.<\/p>\n<p>Fractures have been observed in patients treated with tofacitinib-\nconsider other risk fractures for fracture.<\/p>\n<p>Hypoglycaemia following initiation of tofacitinib in patients on\nmedication for diabetes.<\/p>\n<p>Reactivation of herpes virus<\/p>\n<p>Contains lactose - avoid <mark>in Lapp lactase deficiency or\nglucose-galactose malabsorption<\/mark><\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"<p>No data. Manufacturer recommends women of child-bearing potential\nto use contraception during treatment and at least 4 weeks after\nstopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"NICE - moderate EULAR response at 6 months"},"baseline-tests":{"label":"Baseline Tests","html":"<p>FBC, U&amp;Es, LFTs<\/p>\n<p>Lipids<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C, quantiferon ( or T-spot if appropriate),\nHIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Risk of herpes zoster re-activation. Consider herpes Zoster vaccine\nin patients at least 2 weeks, ideally 4 weeks, before starting DMARD<\/p>\n<p>*Consider pregnancy test FBC<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>As per concurrent DMARD. If monotherapy:<\/p>\n<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months<\/p>\n<p>Lipids - at 8-12 weeks, treat according to current guidance<\/p>\n<p>Periodic skin examination (risk non-melanoma skin cancer)<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>Absolute lymphocyte count - 2 sequential routine monitoring\nvalues between 0.5 and 0.75 x 10<sup>9<\/sup> cells/L , stop and restart\nwhen &gt;0.75 x 10<sup>9<\/sup> cells/L . If value &lt;0.5 x\n10<sup>9<\/sup> cells/L repeat test within 7 days and stop if still\n&lt;0.5<\/p>\n<p>ANC - 2 sequential routine monitoring values between 0.5 and 1.0 x\n10<sup>9<\/sup>cells/L , stop and restart when &gt;1.0. If value &lt;0.5\nx 10<sup>9<\/sup>cells/L repeat test within 7 days and stop if still\n&lt;0.5.<\/p>\n<p>Hb - &gt;2g/dL decrease or &lt;8.0g/dL, stop and await normalisation\nof Hb<\/p>\n<p>Serious infection<\/p>\n<p>Pregnancy<\/p>\n<p>Abdominal symptoms suggesting perforation<\/p>\n<p>Increased SOB – concerns regarding possible lung fibrosis<\/p>"}},"text":"Therapeutic class: JAK inhibitor Licensed Dose: Moderate to severe RA (DAS 28 >5.1) and PSA- 5mg BD with or without MTX (film coated tablets), alternatively 11mg OD (modified release tablets). SPA 5mg BD NICE Guidance: RA: TA480 SPA : TA920 PsA: TA543 Renal Impairment Dose adjustment only when CrCl <30ml/min: max dose 5mg od Hepatic Impairment Avoid in patients with cirrhosis Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) C/I ALC <0.75 x 10 9 cells/L, ANC <1.0 x 10 9 cells/L, Hb <9g/dL Gastrointestinal perforation – possible increased risk. Use with caution in those with increased risk (e.g. diverticulosis); promptly evaluate abdominal symptoms Interstitial lung disease – possible increased risk. Increased risk of infections in people with underlying lung disease. Fractures have been observed in patients treated with tofacitinib- consider other risk fractures for fracture. Hypoglycaemia following initiation of tofacitinib in patients on medication for diabetes. Reactivation of herpes virus Contains lactose - avoid in Lapp lactase deficiency or glucose-galactose malabsorption Pregnancy & Breastfeeding: No data. Manufacturer recommends women of child-bearing potential to use contraception during treatment and at least 4 weeks after stopping. Avoid in pregnancy and breast-feeding Assessment of Response: NICE - moderate EULAR response at 6 months Baseline Tests: FBC, U&Es, LFTs Lipids Consider CXR Consider Hepatitis B and C, quantiferon ( or T-spot if appropriate), HIV testing Consider Urinalysis Risk of herpes zoster re-activation. Consider herpes Zoster vaccine in patients at least 2 weeks, ideally 4 weeks, before starting DMARD *Consider pregnancy test FBC Routine Monitoring: As per concurrent DMARD. If monotherapy: FBC, U&Es, LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months and then every 3 months Lipids - at 8-12 weeks, treat according to current guidance Periodic skin examination (risk non-melanoma skin cancer) Indications for Stopping Therapy: Absolute lymphocyte count - 2 sequential routine monitoring values between 0.5 and 0.75 x 10 9 cells/L , stop and restart when >0.75 x 10 9 cells/L . If value <0.5 x 10 9 cells/L repeat test within 7 days and stop if still <0.5 ANC - 2 sequential routine monitoring values between 0.5 and 1.0 x 10 9 cells/L , stop and restart when >1.0. If value <0.5 x 10 9 cells/L repeat test within 7 days and stop if still <0.5. Hb - >2g/dL decrease or <8.0g/dL, stop and await normalisation of Hb Serious infection Pregnancy Abdominal symptoms suggesting perforation Increased SOB – concerns regarding possible lung fibrosis Please refer to licensed datasheet for more comprehensive prescribing information: XELJANZ 5 mg film-coated tablets - Summary of Product Characteristics (SmPC) - (emc) (medicines.org.uk)"},{"id":"upadacitinib","title":"Upadacitinib","subtitle":"Citrate (Rinvoq®","group":"Targeted synthetic (tsDMARDs)","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 38%\" />\n<col style=\"width: 61%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Therapeutic class:<\/th>\n<th>Selective and reversible inhibitor of Janus- associated tyrosine\nkinase JAK 1.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Licensed Dose:<\/td>\n<td>Moderate to severe RA (DAS 28 &gt;3.2), PSA and SPA- 15mg OD with or\nwithout MTX<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NICE Guidance:<\/td>\n<td><p>RA: https://www.nice.org.uk/guidance/ta665,\nhttps://www.nice.org.uk/guidance/ta744<\/p>\n<p>SPA<u>:<\/u> https://www.nice.org.uk/guidance/ta829<u>,<\/u>\n<u>https://www.nice.org.uk/guidance/ta861<\/u><\/p>\n<p>PsA: https://www.nice.org.uk/guidance/ta768<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Renal Impairment<\/td>\n<td>No dose adjustment.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatic Impairment<\/td>\n<td><p>No dose adjustment for mild or moderate impairment.<\/p>\n<p>Avoid in severe impairment ( Child Pugh C).<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Warnings/Contra-indications/Significant drug interactions:<\/p>\n<p>(*Refer to licensed datasheet for special warnings)<\/p><\/td>\n<td><p>MHRA have issued warnings of the association with JAK inhibitors\nand VTE, MACE and cancer.<\/p>\n<p>Unless there are no suitable alternative DMARDs, MHRA advises avoid\nin patients who:<\/p>\n<ul>\n<li><p>Are aged 65 years or older<\/p><\/li>\n<li><p>Are current or past long-time smokers<\/p><\/li>\n<li><p>Have other cardiovascular disease or malignancy risk\nfactors<\/p><\/li>\n<\/ul>\n<p>Advised use with caution in patients with risk factors for VTE<\/p>\n<p>Contraindicated if ALC &lt; 0.5 x 10<sup>9<\/sup> cells/litre; ANC\n&lt; 1 x 10<sup>9<\/sup> cells/litre; Hb&lt; 8 g/dL; active serious\ninfection including localised infection; active tuberculosis.<\/p>\n<p>Gastrointestinal perforation – possible increased risk. Use with\ncaution in those with increased risk (e.g. diverticulosis); promptly\nevaluate abdominal symptoms<\/p>\n<p>Elevation of liver enzymes reported.<\/p>\n<p>Reactivation of herpes virus<\/p>\n<p>Contains lactose - avoid <mark>in Lapp lactase deficiency or\nglucose-galactose malabsorption<\/mark><\/p>\n<p>Food or drink containing grapefruit should be avoided during\ntreatment with upadacitinib<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td><p>No data. Manufacturer recommends women of child-bearing potential\nto use contraception during treatment and at least 4 weeks after\nstopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Assessment of Response:<\/td>\n<td>NICE - moderate EULAR response at 6 months<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Baseline Tests:<\/td>\n<td><p>FBC, U&amp;Es, LFTs<\/p>\n<p>Lipids<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C. Quantiferon, HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Screen for Herpes Zoster<\/p>\n<p>*Consider pregnancy test FBC<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routine Monitoring:<\/td>\n<td><p>FBC, U&amp;E, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months<\/p>\n<p>Lipids - at 12 weeks, treat according to current guidance<\/p>\n<p>Periodic skin examination (risk non-melanoma skin cancer)<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>Stop if ANC &lt; 1 x 109 cells/litre, ALC &lt; 0.5 x 109\ncells/litre, or Hb&lt; 8 g/dL—treatment may be restarted when levels\nreturn above these values.<\/p>\n<p>Serious infection<\/p>\n<p>Pregnancy<\/p>\n<p>Abdominal symptoms suggesting perforation.<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>RINVOQ 15 mg prolonged-release tablets - Summary of Product\nCharacteristics (SmPC) - (emc) (medicines.org.uk)<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"therapeutic-class":{"label":"Therapeutic class","html":"Selective and reversible inhibitor of Janus- associated tyrosine\nkinase JAK 1."},"licensed-dose":{"label":"Licensed Dose","html":"Moderate to severe RA (DAS 28 &gt;3.2), PSA and SPA- 15mg OD with or\nwithout MTX"},"nice-guidance":{"label":"NICE Guidance","html":"<p>RA: https://www.nice.org.uk/guidance/ta665,\nhttps://www.nice.org.uk/guidance/ta744<\/p>\n<p>SPA<u>:<\/u> https://www.nice.org.uk/guidance/ta829<u>,<\/u>\n<u>https://www.nice.org.uk/guidance/ta861<\/u><\/p>\n<p>PsA: https://www.nice.org.uk/guidance/ta768<\/p>"},"renal-impairment":{"label":"Renal Impairment","html":"No dose adjustment."},"hepatic-impairment":{"label":"Hepatic Impairment","html":"<p>No dose adjustment for mild or moderate impairment.<\/p>\n<p>Avoid in severe impairment ( Child Pugh C).<\/p>"},"warnings-contra-indications-significant-drug-interactions":{"label":"Warnings/Contra-indications/Significant drug interactions","html":"<p>MHRA have issued warnings of the association with JAK inhibitors\nand VTE, MACE and cancer.<\/p>\n<p>Unless there are no suitable alternative DMARDs, MHRA advises avoid\nin patients who:<\/p>\n<ul>\n<li><p>Are aged 65 years or older<\/p><\/li>\n<li><p>Are current or past long-time smokers<\/p><\/li>\n<li><p>Have other cardiovascular disease or malignancy risk\nfactors<\/p><\/li>\n<\/ul>\n<p>Advised use with caution in patients with risk factors for VTE<\/p>\n<p>Contraindicated if ALC &lt; 0.5 x 10<sup>9<\/sup> cells/litre; ANC\n&lt; 1 x 10<sup>9<\/sup> cells/litre; Hb&lt; 8 g/dL; active serious\ninfection including localised infection; active tuberculosis.<\/p>\n<p>Gastrointestinal perforation – possible increased risk. Use with\ncaution in those with increased risk (e.g. diverticulosis); promptly\nevaluate abdominal symptoms<\/p>\n<p>Elevation of liver enzymes reported.<\/p>\n<p>Reactivation of herpes virus<\/p>\n<p>Contains lactose - avoid <mark>in Lapp lactase deficiency or\nglucose-galactose malabsorption<\/mark><\/p>\n<p>Food or drink containing grapefruit should be avoided during\ntreatment with upadacitinib<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"<p>No data. Manufacturer recommends women of child-bearing potential\nto use contraception during treatment and at least 4 weeks after\nstopping.<\/p>\n<p>Avoid in pregnancy and breast-feeding<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"NICE - moderate EULAR response at 6 months"},"baseline-tests":{"label":"Baseline Tests","html":"<p>FBC, U&amp;Es, LFTs<\/p>\n<p>Lipids<\/p>\n<p>Consider CXR<\/p>\n<p>Consider Hepatitis B and C. Quantiferon, HIV testing<\/p>\n<p>Consider Urinalysis<\/p>\n<p>Screen for Herpes Zoster<\/p>\n<p>*Consider pregnancy test FBC<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>FBC, U&amp;E, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months<\/p>\n<p>Lipids - at 12 weeks, treat according to current guidance<\/p>\n<p>Periodic skin examination (risk non-melanoma skin cancer)<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>Stop if ANC &lt; 1 x 109 cells/litre, ALC &lt; 0.5 x 109\ncells/litre, or Hb&lt; 8 g/dL—treatment may be restarted when levels\nreturn above these values.<\/p>\n<p>Serious infection<\/p>\n<p>Pregnancy<\/p>\n<p>Abdominal symptoms suggesting perforation.<\/p>"}},"text":"Therapeutic class: Selective and reversible inhibitor of Janus- associated tyrosine kinase JAK 1. Licensed Dose: Moderate to severe RA (DAS 28 >3.2), PSA and SPA- 15mg OD with or without MTX NICE Guidance: RA: https://www.nice.org.uk/guidance/ta665, https://www.nice.org.uk/guidance/ta744 SPA : https://www.nice.org.uk/guidance/ta829 , https://www.nice.org.uk/guidance/ta861 PsA: https://www.nice.org.uk/guidance/ta768 Renal Impairment No dose adjustment. Hepatic Impairment No dose adjustment for mild or moderate impairment. Avoid in severe impairment ( Child Pugh C). Warnings/Contra-indications/Significant drug interactions: (*Refer to licensed datasheet for special warnings) MHRA have issued warnings of the association with JAK inhibitors and VTE, MACE and cancer. Unless there are no suitable alternative DMARDs, MHRA advises avoid in patients who: Are aged 65 years or older Are current or past long-time smokers Have other cardiovascular disease or malignancy risk factors Advised use with caution in patients with risk factors for VTE Contraindicated if ALC < 0.5 x 10 9 cells/litre; ANC < 1 x 10 9 cells/litre; Hb< 8 g/dL; active serious infection including localised infection; active tuberculosis. Gastrointestinal perforation – possible increased risk. Use with caution in those with increased risk (e.g. diverticulosis); promptly evaluate abdominal symptoms Elevation of liver enzymes reported. Reactivation of herpes virus Contains lactose - avoid in Lapp lactase deficiency or glucose-galactose malabsorption Food or drink containing grapefruit should be avoided during treatment with upadacitinib Pregnancy & Breastfeeding: No data. Manufacturer recommends women of child-bearing potential to use contraception during treatment and at least 4 weeks after stopping. Avoid in pregnancy and breast-feeding Assessment of Response: NICE - moderate EULAR response at 6 months Baseline Tests: FBC, U&Es, LFTs Lipids Consider CXR Consider Hepatitis B and C. Quantiferon, HIV testing Consider Urinalysis Screen for Herpes Zoster *Consider pregnancy test FBC Routine Monitoring: FBC, U&E, LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months and then every 3 months Lipids - at 12 weeks, treat according to current guidance Periodic skin examination (risk non-melanoma skin cancer) Indications for Stopping Therapy: Stop if ANC < 1 x 109 cells/litre, ALC < 0.5 x 109 cells/litre, or Hb< 8 g/dL—treatment may be restarted when levels return above these values. Serious infection Pregnancy Abdominal symptoms suggesting perforation. Please refer to licensed datasheet for more comprehensive prescribing information: RINVOQ 15 mg prolonged-release tablets - Summary of Product Characteristics (SmPC) - (emc) (medicines.org.uk)"},{"id":"vaccination","title":"Vaccination & travel","group":"Topics","kind":"chapter","html":"<p>The Department of Health Green Book states that patients taking\nimmunosuppressive agents such as azathioprine &gt;3mg/kg, cyclosporin,\nmethotrexate &gt;25mg, leflunomide, high-dose corticosteroids (&gt;40mg\nprednisolone per day for more than 1 week or &gt;20mg prednisolone per\nday or 1mg/kg/day in children under 20kg) for more than 14 days) should\navoid live vaccines until at least three months after stopping treatment\nwith these agents.<\/p>\n<p>Live vaccines can cause severe or fatal infections in\nimmunocompromised individuals. If a live vaccination is required it\nshould be performed at least 2, and ideally 4 weeks, prior to starting\ntreatment with most synthetic and all bDMARDs. It should be given at\nleast 3 weeks before immunoglobulins.<\/p>\n<p>Vaccination status should be evaluated before commencing treatment\nwith most DMARDs (except HCQ, SSA and Gold), and especially bDMARDs.<\/p>\n<p>Patients on stable long term low dose corticosteroid therapy (defined\nas up to 20mg prednisolone per day for more than 14 days in adult)\neither alone or in combination with low dose non-biological oral immune\nmodulating drugs (e.g. methotrexate 25mg per week in adult or\nazathioprine 3.0mg/ kg/day) can receive live vaccines. In the case of\nyellow fever vaccine data is limited, and a cautious approach is\nrecommended<\/p>\n<p>Herpes Zoster vaccine (Shingles vaccine)<\/p>\n<p>2 types of shingles vaccine given in the UK- Zostavax (Single dose\nlive vaccine – not suitable for immunosuppressed) and Shingrix Vaccine\n(2 doses of non-live recombinant vaccine and can be given in\nimmunosuppressed patients- available since 2021 September in UK).<\/p>\n<p>From September 2023, Shingrix is replacing Zostavax in the routine\nimmunisation programme. The course consists of two doses of Shingrix:\nfor severely immunosuppressed adults, the second dose should ideally be\ngiven 8 weeks to 6 months after the first dose. If there is no\ncontraindication (such as allergy), people over 60 years and those aged\n50 and over with a severely weakened immune system.<\/p>\n<p>This is defined as<\/p>\n<ul>\n<li><p>moderate to high dose corticosteroids (equivalent ≥20mg\nprednisolone per day) for more<\/p><\/li>\n<\/ul>\n<p>than 10 days in the previous month<\/p>\n<ul>\n<li><p>long term moderate dose corticosteroids (equivalent to ≥10mg\nprednisolone per day for<\/p><\/li>\n<\/ul>\n<p>more than 4 weeks) in the previous 3 months<\/p>\n<ul>\n<li><p>Individuals who have received a short course of high dose\nsteroids (equivalent &gt;40mg<\/p><\/li>\n<\/ul>\n<p>prednisolone per day for more than a week) for any reason in the\nprevious month.<\/p>\n<ul>\n<li><p>any non-biological oral immune modulating drugs e.g. methotrexate\n&gt;20mg per week<\/p><\/li>\n<\/ul>\n<p>(oral and subcutaneous), azathioprine &gt;3.0mg/kg/day; mycophenolate\n&gt;1g/day) in the previous 3 months<\/p>\n<ul>\n<li><p>certain combination therapies at individual doses lower than\nstated above, including<\/p><\/li>\n<\/ul>\n<p>those on ≥7.5mg prednisolone per day in combination with other\nimmunosuppressants<\/p>\n<p>(other than hydroxychloroquine or sulfasalazine) and those receiving\nmethotrexate (any<\/p>\n<p>dose) with leflunomide in the previous 3 months<\/p>\n<ul>\n<li><p>Those who have received biologics in last 3 months<\/p><\/li>\n<\/ul>\n<p>Neither Zostavax nor Shingrix® is not indicated for prevention of\nprimary VZV infection (chickenpox) and should not be used in children\nand adolescents.<\/p>\n<p>For individuals lacking a history of varicella exposure, then primary\nimmunization with the live varicella vaccine can be considered, assuming\nthere are no contraindications (Contraindications include: treatment\nwithin the past 3 months with &gt;40 mg prednisolone per day for\n&gt;1week, &gt;20 mg prednisolone per day for &gt;14 days, MTX &gt;25\nmg/week, AZA &gt;3.0 mg/kg/day, or the use of biologic therapy or JAK\ninhibitors. The vaccine should be given at least 2-4 weeks prior to\ncommencement of biologics or JAK inhibitors. )<\/p>\n<p>Primary varicella exposure<\/p>\n<p>There are national <a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.uk/government/publications/post-exposure-prophylaxis-for-chickenpox-and-shingles\">guidelines<\/a>\nregarding this, published in 2023.<\/p>\n<p>Treatment should be considered in those with significant exposure to\nchicken pox. This is defined as below:<\/p>\n<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Table 1 – Significant exposure to chicken pox<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><p>PEP should be offered to contacts in a specified risk group\n(immunosuppressed on biologics)<\/p>\n<ul>\n<li><p>Where there is continuous exposure to a case of chickenpox/\nshingles (ie disseminated shingles; immunocompetent individuals with\nexposed shingles lesions (for example ophthalmic shingles);\nimmunosuppressed individuals with localised shingles on any part of the\nbody in whom viral shedding may be greater), for example household\nmember, nursery or care worker<\/p><\/li>\n<li><p>Where there has been more than one exposure to a case of\nchickenpox/ shingles (for example family friend who visited on more than\none occasion during the infectious period)<\/p><\/li>\n<li><p>Where there has been a single exposure to a case of chickenpox\nduring the infectious period from 24 hours before onset of rash until 5\ndays after rash appearance in immunocompetent individuals and until all\nlesions have crusted over for immunosuppressed individuals<\/p><\/li>\n<li><p>Where there has been a single exposure to a case of shingles (see\ndefinitions in ‘Type of VZV infection in index case’ above) during the\ninfectious period from onset of rash until the lesions have crusted over\n(in immunocompetent individuals, this is usually 5 days after rash\nappearance)<\/p><\/li>\n<li><p>Those in the same small room (for example in a house or classroom\nor a 2 to 4 bed hospital bay) for a significant period of time (15\nminutes or more)<\/p><\/li>\n<li><p>Face to face contact, for example while having a\nconversation<\/p><\/li>\n<li><p>Immunosuppressed contacts on large open wards, where air-borne\ntransmission at a distance has occasionally been reported, particularly\nin paediatric wards where the degree of contact may be difficult to\ndefine<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Treatment consists of either oral anto-virals, VZIG or IVIG.<\/p>\n<p>Oral aciclovir (or valaciclovir) is now the first choice of PEP for\nsusceptible immunosuppressed<\/p>\n<p>Individuals and should be given from day 7 to day 14 after exposure.\nThe day of exposure is<\/p>\n<p>defined as the date of onset of the rash if the index is a household\ncontact and date of first or<\/p>\n<p>only contact if the exposure is on multiple or single occasions\nrespectively<\/p>\n<p>The dosing is taken from the following recommendation found <a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.uk/government/publications/post-exposure-prophylaxis-for-chickenpox-and-shingles\">here<\/a>,\nand copied below for ease of referencing:<\/p>\n<p><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABT8AAAHMCAIAAACcG0vJAAAAAXNSR0IArs4c6QAA/8pJREFUeF7snXtcVcXa+He/187uhCZ4QjsBeUFDQ8QLGWLe0LS8oJiKmpSJmlTaUVNPdvLWqx0sKUvTNLHCk6mYeIHSBFFTzERD5YgXxAQ7oCWacA771PvhN+s+s9astddae+3NBp71T8leM/PMd555Zp6ZWc/cVVNTY4MHCAABIAAEgAAQAAJAAAgAASAABIAAEPBiAv/Pi2UD0YAAEAACQAAIAAEgAASAABAAAkAACAABhgB476AHQAAIAAEgAASAABAAAkAACAABIAAEvJ0AeO/e3kIgHxAAAkAACAABIAAEgAAQAAJAAAgAAfDeQQeAABAAAkAACAABIAAEgAAQAAJAAAh4OwHw3r29hUA+IAAEgAAQAAJAAAgAASAABIAAEAAC4L2DDgABIAAEgAAQAAJAAAgAASAABIAAEPB2AuC9e3sLgXxAAAgAASAABIAAEAACQAAIAAEgAATAewcdAAJAAAgAASAABIAAEAACQAAIAAEg4O0EwHv39hYC+YAAEAACQAAIAAEgAASAABAAAkAACID3DjoABIAAEAACQAAIAAEgAASAABAAAkDA2wmA9+7tLQTyAQEgAASAABAAAkAACAABIAAEgAAQAO8ddAAIAAEgAASAABAAAkAACAABIAAEgIC3EwDv3dtbCOQDAkAACAABIAAEgAAQAAJAAAgAASAA3jvoABAAAkAACAABIAAEgAAQAAJAAAgAAW8nAN67t7cQyAcEgAAQAAJAAAgAASAABIAAEAACQAC8d9ABIAAEgAAQAAJAAAgAASAABIAAEAAC3k4AvHdvbyGQDwgAASAABIAAEAACQAAIAAEgAASAAHjvoANAAAgAASAABIAAEAACQAAIAAEgAAS8nQB4797eQiAfEAACQAAIAAEgAASAABAAAkAACACBu2pqaiylcOLjqeuOG8oxcPgbC4YEGUrCvVySseTNnaV8wu5T102O0JWJyWS68tZ4qSJ7xbwvzrMv6JdVq1CiHvQXG7eNimrzUHCPLo8E+NldrQCk9z4CeG8z3Y90VMvqPmN1fjqqUI9ecVScPbIzc8/RS5WoUn/uPLB7l47dO7X396kDVfSUwlqOwkKN9SwDCwW3HCpkCASAABAAAkAACJgggLx3S5/0eKNChCedNSfB2aRwqaz4dL2ZmEymN3v6e9W584NFYfXLqlUoUQ8n0H1aj1iVV+laFSC19xHAe5vpfqSjWlb3Gavz01GFevJKdf7aIQGKlbiI5MK6UT9PKaxrNCrP7f5GNihZqLGeZWCh4K5BhdRAAAgAASAABICAJQTg5LzRxQYT7ztKt0+JWVZkIqVVSaqK01+O6rv8tMOqDCEfIAAEPE8g762R0zKuybuxPTwkxPOy1MMS0amGrbN7B/6pw7DPLtXD6kGVgAAQAAJAAAgAgbpPALx3N7eho/Tgouj2o1JvuLkc59k7Tsx7dmWB8/fgDSAABLyTQEFWurQIaA8Zk7Rx27ZtqxfMjw3zTnnrlFQln8a2+HNYXPJhxeoIqsaDTyYh1PwzrZMrFes0Tcop6ckHXckK0gIBIAAEgAAQAAINjoDl3js+NeEnKXN7SliDxr0vTV24/6u3ExhH6fcbEx9t33fx0Sq361XPuXKs7LQ+Joz4GDb/7x9lu10UKAAIAAH3ELh0Nl/M2G/qh1vmThw1atSLi83FDXGPiHU311/Li2+rHk7y6zQIoeafqNau1LJ1lJTToE5 e blood\nproduct by demonstrating that they are sero-negative with VZV IgG\nantibody levels &lt;150 mIU/ml for immunosuppressed patients. If time\ndoes not permit quantitative testing, a qualitative test must be\nperformed and shown to be negative or equivocal. For individuals who are\nunable to take oral antivirals varicella-zoster immunoglobulin should be\ngiven.<\/p>\n<p>Contacts with bleeding disorders who cannot receive antivirals or be\ngiven an intramuscular injection should be given intravenous human\nnormal immunoglobulin (IVIG) at a dose of 0.2g<\/p>\n<p>per kg body weight (4ml/kg for a 5% solution) instead.<\/p>\n<p>There may be a number of women who have not received their MMR\nvaccine who wish to plan a family. The MMR vaccine is a live vaccine and\nis contra-indicated for most patients on csDMARD and/or bDMARD therapy.\nThe need for immunoglobulin should be considered in immunocompromised\nindividuals exposed to varicella or measles who have not been vaccinated\nor pre-existing immunity cannot be verified (Contact Rheumatology\nService). Patients being commenced on synthetic or biologic DMARDs\nshould be asked about potential travel abroad, particularly to places\nwhere vaccination against Yellow Fever is required.<\/p>\n<p>Those receiving immunoglobulins should be given their vaccinations\nthree months after an infusion of immunoglobulin (donor immunoglobulin\nmay have antibody to measles, varicella and other common viruses and\nthis may prevent replication of the vaccine virus). Exceptions are\nrubella, BCG and Yellow Fever.<\/p>\n<p>Those receiving cyclophosphamide should avoid live vaccines until at\nleast six months after stopping treatment with this agent.<\/p>\n<p>Vaccinations may be given 1 month off TNFi and abatacept and 6months\nafter rituximab [personal communication with Professor K Winthrop]<\/p>\n<p>Where live vaccination is indicated in patients on biologic or\nsynthetic DMARDs or have received high dose/extended courses of\ncorticosteroids, specialist advice should be obtained from the\nConsultant Rheumatologist caring for the patient.<\/p>\n<p><strong>Table 1 lists the current live vaccines available in the\nUK:<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Vaccine<\/strong><\/th>\n<th><strong>Brand Name<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>BCG (including intravesicular use)<\/td>\n<td>Bacillus Calmette-Guerin Vaccine<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nasal Only - Influenza<\/td>\n<td>Note the nasal seasonal influenza vaccine is live - Fluenz®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p>Measles, Mumps and Rubella<\/p>\n<p>Combined Vaccine (MMR)<\/p><\/td>\n<td>MMRvaxPRO®, Priorix®<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Poliomyeltis (<u>Live oral vaccine<\/u>)<\/td>\n<td>Poliomyeltis Vaccine, live (oral) GSK OPV<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rotavirus <u>(Live oral vaccine<\/u>)<\/td>\n<td>Rotarix®<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Typhoid <u>(Live oral vaccine)<\/u><\/td>\n<td>Vivotif®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Varicella-Zoster Vaccine<\/td>\n<td>Varilrix®, Varivax®, Zostavax® Shingrix®<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Yellow Fever<\/td>\n<td>Stamaril®<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><u>Non-live Vaccines<\/u><\/strong><\/p>\n<p><strong>Note : Inactivated vaccines cannot replicate and so may be\nadministered to immunosuppressed individuals, although they may elicit a\nlower response than in immunocompetent individuals.<\/strong><\/p>\n<p><strong>Table 2, Non-live vaccines<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Vaccine<\/strong><\/th>\n<th><strong>Brand Name<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cholera Vaccine <u>(Oral preparation only)<\/u><\/td>\n<td>Dukural®<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Diptheria<\/td>\n<td>Given as combined adsorbed diphtheria (low dose), tetanus and\ninactivated poliomyelitis preparation (Revaxis®).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hepatitis A<\/td>\n<td><p>Avaxim®, Epaxal®, Havrix Monodose®, Vaqta Paediatric®<\/p>\n<p>With Hepatitis B - Ambirix® and Twinrix®<\/p>\n<p>With typhoid - Hepatyrix® and ViATIM®<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hepatitis B<\/td>\n<td>Engerix®, Fendrix®, HBvaxPRO®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hepatitis A and B Combined<\/td>\n<td>Ambirix®, Twinrix®<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Influenza<\/td>\n<td>Aggrippal®, Enzira®, Fluarix®, Fluvirin®, Imuvac®, Influvac®\nSub-unit, and Viroflu®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Japanese Encephalitis<\/td>\n<td>Ixiaro®<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Meningococcal Group C<\/td>\n<td>Meningitec®, Menjugate Kit®, NeisVac-C®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Meningococcal A,C, W135 and Y conjugate vaccine<\/td>\n<td>Menveo®, Nimenrix®<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Meningococcal polysaccharide A,C, W135 and Y vaccine<\/td>\n<td>ACWY Vax®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pertussis<\/td>\n<td><p>Diptheria containing vaccine for immunisation of pregnant women\nagainst pertussis:<\/p>\n<p>Absorbed diphtheria, tetanus, pertussis and poliomyelitis vaccine -\nRepevax®<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pneumococcal<\/td>\n<td>Pneumovax II® (Adults and Children over 5 years), Prevenar 13®,\nSynflorix® (Primary childhood immunisation)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Poliomyeltis (<u>Injection<\/u>)<\/td>\n<td>See under Diptheria vaccine<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rabies<\/td>\n<td>Rabies vaccine - Rab, Rabipur®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tetanus<\/td>\n<td>*Single preparation no longer available. Combined Adsorbed\ndiphtheria (low dose), tetanus and inactivated poliomyelitis preparation\ngiven.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tick-borne encephalitis<\/td>\n<td>TicoVac®<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Typhoid (<u>Polysaccharide injection for vaccination)<\/u><\/td>\n<td>Typherix®, Typhim Vi®<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Recommended<\/strong><\/p>\n<ul>\n<li><p><strong>Annual flu vaccine<\/strong><\/p><\/li>\n<li><p><strong>Pneumococcal vaccine<\/strong>\n<strong>once<\/strong><\/p><\/li>\n<\/ul>\n<p>There are several types of pneumococcal vaccines available. PPV23\ncontains purified capsular polysaccharide from 23 common capsular types\nof pneumococcus. In the UK, PPV23 has been recommended for risk groups\nsince 1992 and for all people aged 65 years and over since 2003. The\nGreen Book chapter 25, states that <strong><u>revaccination<\/u><\/strong>\nwith PPV23 is currently <strong><u>not<\/u><\/strong> recommended for any\nother clinical risk groups (except asplenia, splenic dysfunction<\/p>\n<p>or chronic renal disease) or age groups. Other pneumococcal vaccines\nexist – PCV 13 and PCV 15. The vaccination schedule needed for PCV 13\nand PCV 15 in those who are immunocompromised can be found <a target=\"_blank\" rel=\"noopener\" href=\"https://www.gov.uk/government/publications/pneumococcal-the-green-book-chapter-25\">here<\/a>,\ntable 25.3<\/p>\n<p>Influenza and pneumococcal vaccination should be offered to all\npatients receiving immunosuppressant therapy (except those on\nhydroxychloroquine and sulphasalazine).<\/p>\n<p>In patients with recurrent infections, testing of functional\nantbodies (pneumococcus, haemophilus and influenza) may be helpful.\nAdvice from an immunology consultant should be considered.<\/p>\n<p>Recent research has shown that the majority of patients on csDMARDs\nand/or biologics (excluding rituximab) receiving annual influenza\nvaccination will reach sufficient serological immunity to protect\nagainst infection. Patients on rituximab (and possibly abatacept) may\nhave a reduced response to influenza vaccine (Kapetanovic et al.\n2014).<\/p>\n<p>For more detailed information on immunisation and contra-indications\nrefer to the Department of Health Green Book Website:<\/p>\n<p>https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book<\/p>\n<p>Biologics<\/p>\n<p>• A full assessment of vaccination status should be made before\ncommencing treatment with a biologic agent.<\/p>\n<p>• Live vaccines should not be given to patients receiving treatment\nwith biologic agents. Where live vaccination is required it should be\ngiven at least 2-4 weeks prior to commencing treatment with a\nbiologic.<\/p>\n<p>• Non–live vaccines may be given, but the immunological response may\nbe reduced. It is therefore recommended that pneumococcal vaccine should\nbe given 2-4 weeks before starting a biologic as response after starting\ntreatment is thought to be reduced.<\/p>\n<p>• Vaccinations may be given 1 month off TNFi and abatacept and\n6months after rituximab [personal communication with Professor K\nWinthrop]<\/p>\n<p>• The datasheet for rituximab recommends avoidance of live\nvaccination in individuals who are still B cell depleted. Non-live\nvaccines should ideally be given pre-treatment, as they will be less\neffective during therapy, and 6 months post infusion where necessary<\/p>\n<p>• Rituximab may reduce titres of protective antibodies so consider\nchecking these, especially in presence of hypogammaglobulinaemia and\nwhen otherwise clinically indicated (discuss with Leeds Immunology /\nRheumatology if needed)<\/p>\n<p><strong>General Travel Advice<\/strong><\/p>\n<p>All non-live vaccines should be given as appropriate.<\/p>\n<p>The administration of yellow fever vaccine is contra-indicated in\nimmunosuppressed patients making travel to endemic areas, including\ntropical Africa and South America inadvisable. A certificate saying\nYellow Fever vaccine cannot be given on medical grounds may be\nacceptable to some immigration authorities in special circumstances.\nCountry requirements are published annually by WHO in International\ntravel and health (available at www.who.int/ith) (WHO, 2004), and are\nincluded in Health information for overseas travel (Department of\nHealth, 2001) and may be found on the NaTHNaC, www.nathnac.org.<\/p>\n<p>The parenteral typhoid vaccine offers only 70-80% protection, so\npersonal, food and water hygiene must be emphasised to travellers in\nendemic areas.<\/p>\n<p>Immunisation with the oral cholera vaccine (Dukoral®) does not\nprovide complete protection. Scrupulous attention to food, water, and\npersonal hygiene is essential when travelling to areas where cholera\nexists.<\/p>\n<p>Malaria prophylaxis is essential when travelling to countries where\nthere is a risk of developing malaria. Prophylaxis is not absolute and\npersonal protection against being bitten is very important. Patients\ntaking hydroxychloroquine should not take chloroquine as part of their\nmalaria prophylaxis regime. Check for drug interactions with the local\nHospital Pharmacy Department.<\/p>","text":"The Department of Health Green Book states that patients taking immunosuppressive agents such as azathioprine >3mg/kg, cyclosporin, methotrexate >25mg, leflunomide, high-dose corticosteroids (>40mg prednisolone per day for more than 1 week or >20mg prednisolone per day or 1mg/kg/day in children under 20kg) for more than 14 days) should avoid live vaccines until at least three months after stopping treatment with these agents. Live vaccines can cause severe or fatal infections in immunocompromised individuals. If a live vaccination is required it should be performed at least 2, and ideally 4 weeks, prior to starting treatment with most synthetic and all bDMARDs. It should be given at least 3 weeks before immunoglobulins. Vaccination status should be evaluated before commencing treatment with most DMARDs (except HCQ, SSA and Gold), and especially bDMARDs. Patients on stable long term low dose corticosteroid therapy (defined as up to 20mg prednisolone per day for more than 14 days in adult) either alone or in combination with low dose non-biological oral immune modulating drugs (e.g. methotrexate 25mg per week in adult or azathioprine 3.0mg/ kg/day) can receive live vaccines. In the case of yellow fever vaccine data is limited, and a cautious approach is recommended Herpes Zoster vaccine (Shingles vaccine) 2 types of shingles vaccine given in the UK- Zostavax (Single dose live vaccine – not suitable for immunosuppressed) and Shingrix Vaccine (2 doses of non-live recombinant vaccine and can be given in immunosuppressed patients- available since 2021 September in UK). From September 2023, Shingrix is replacing Zostavax in the routine immunisation programme. The course consists of two doses of Shingrix: for severely immunosuppressed adults, the second dose should ideally be given 8 weeks to 6 months after the first dose. If there is no contraindication (such as allergy), people over 60 years and those aged 50 and over with a severely weakened immune system. This is defined as moderate to high dose corticosteroids (equivalent ≥20mg prednisolone per day) for more than 10 days in the previous month long term moderate dose corticosteroids (equivalent to ≥10mg prednisolone per day for more than 4 weeks) in the previous 3 months Individuals who have received a short course of high dose steroids (equivalent >40mg prednisolone per day for more than a week) for any reason in the previous month. any non-biological oral immune modulating drugs e.g. methotrexate >20mg per week (oral and subcutaneous), azathioprine >3.0mg/kg/day; mycophenolate >1g/day) in the previous 3 months certain combination therapies at individual doses lower than stated above, including those on ≥7.5mg prednisolone per day in combination with other immunosuppressants (other than hydroxychloroquine or sulfasalazine) and those receiving methotrexate (any dose) with leflunomide in the previous 3 months Those who have received biologics in last 3 months Neither Zostavax nor Shingrix® is not indicated for prevention of primary VZV infection (chickenpox) and should not be used in children and adolescents. For individuals lacking a history of varicella exposure, then primary immunization with the live varicella vaccine can be considered, assuming there are no contraindications (Contraindications include: treatment within the past 3 months with >40 mg prednisolone per day for >1week, >20 mg prednisolone per day for >14 days, MTX >25 mg/week, AZA >3.0 mg/kg/day, or the use of biologic therapy or JAK inhibitors. The vaccine should be given at least 2-4 weeks prior to commencement of biologics or JAK inhibitors. ) Primary varicella exposure There are national guidelines regarding this, published in 2023. Treatment should be considered in those with significant exposure to chicken pox. This is defined as below: Table 1 – Significant exposure to chicken pox PEP should be offered to contacts in a specified risk group (immunosuppressed on biologics) Where there is continuous exposure to a case of chickenpox/ shingles (ie disseminated shingles; immunocompetent individuals with exposed shingles lesions (for example ophthalmic shingles); immunosuppressed individuals with localised shingles on any part of the body in whom viral shedding may be greater), for example household member, nursery or care worker Where there has been more than one exposure to a case of chickenpox/ shingles (for example family friend who visited on more than one occasion during the infectious period) Where there has been a single exposure to a case of chickenpox during the infectious period from 24 hours before onset of rash until 5 days after rash appearance in immunocompetent individuals and until all lesions have crusted over for immunosuppressed individuals Where there has been a single exposure to a case of shingles (see definitions in ‘Type of VZV infection in index case’ above) during the infectious period from onset of rash until the lesions have crusted over (in immunocompetent individuals, this is usually 5 days after rash appearance) Those in the same small room (for example in a house or classroom or a 2 to 4 bed hospital bay) for a significant period of time (15 minutes or more) Face to face contact, for example while having a conversation Immunosuppressed contacts on large open wards, where air-borne transmission at a distance has occasionally been reported, particularly in paediatric wards where the degree of contact may be difficult to define Treatment consists of either oral anto-virals, VZIG or IVIG. Oral aciclovir (or valaciclovir) is now the first choice of PEP for susceptible immunosuppressed Individuals and should be given from day 7 to day 14 after exposure. The day of exposure is defined as the date of onset of the rash if the index is a household contact and date of first or only contact if the exposure is on multiple or single occasions respectively The dosing is taken from the following recommendation found here , and copied below for ease of referencing: In individuals with renal impairment or intestinal malabsorption, for example inflammatory bowel disease, VZIG may be considered. If VZIG is considered, it is important to demonstrate that the patient will benefit from the blood product by demonstrating that they are sero-negative with VZV IgG antibody levels <150 mIU/ml for immunosuppressed patients. If time does not permit quantitative testing, a qualitative test must be performed and shown to be negative or equivocal. For individuals who are unable to take oral antivirals varicella-zoster immunoglobulin should be given. Contacts with bleeding disorders who cannot receive antivirals or be given an intramuscular injection should be given intravenous human normal immunoglobulin (IVIG) at a dose of 0.2g per kg body weight (4ml/kg for a 5% solution) instead. There may be a number of women who have not received their MMR vaccine who wish to plan a family. The MMR vaccine is a live vaccine and is contra-indicated for most patients on csDMARD and/or bDMARD therapy. The need for immunoglobulin should be considered in immunocompromised individuals exposed to varicella or measles who have not been vaccinated or pre-existing immunity cannot be verified (Contact Rheumatology Service). Patients being commenced on synthetic or biologic DMARDs should be asked about potential travel abroad, particularly to places where vaccination against Yellow Fever is required. Those receiving immunoglobulins should be given their vaccinations three months after an infusion of immunoglobulin (donor immunoglobulin may have antibody to measles, varicella and other common viruses and this may prevent replication of the vaccine virus). Exceptions are rubella, BCG and Yellow Fever. Those receiving cyclophosphamide should avoid live vaccines until at least six months after stopping treatment with this agent. Vaccinations may be given 1 month off TNFi and abatacept and 6months after rituximab [personal communication with Professor K Winthrop] Where live vaccination is indicated in patients on biologic or synthetic DMARDs or have received high dose/extended courses of corticosteroids, specialist advice should be obtained from the Consultant Rheumatologist caring for the patient. Table 1 lists the current live vaccines available in the UK: Vaccine Brand Name BCG (including intravesicular use) Bacillus Calmette-Guerin Vaccine Nasal Only - Influenza Note the nasal seasonal influenza vaccine is live - Fluenz® Measles, Mumps and Rubella Combined Vaccine (MMR) MMRvaxPRO®, Priorix® Poliomyeltis ( Live oral vaccine ) Poliomyeltis Vaccine, live (oral) GSK OPV Rotavirus (Live oral vaccine ) Rotarix® Typhoid (Live oral vaccine) Vivotif® Varicella-Zoster Vaccine Varilrix®, Varivax®, Zostavax® Shingrix® Yellow Fever Stamaril® Non-live Vaccines Note : Inactivated vaccines cannot replicate and so may be administered to immunosuppressed individuals, although they may elicit a lower response than in immunocompetent individuals. Table 2, Non-live vaccines Vaccine Brand Name Cholera Vaccine (Oral preparation only) Dukural® Diptheria Given as combined adsorbed diphtheria (low dose), tetanus and inactivated poliomyelitis preparation (Revaxis®). Hepatitis A Avaxim®, Epaxal®, Havrix Monodose®, Vaqta Paediatric® With Hepatitis B - Ambirix® and Twinrix® With typhoid - Hepatyrix® and ViATIM® Hepatitis B Engerix®, Fendrix®, HBvaxPRO® Hepatitis A and B Combined Ambirix®, Twinrix® Influenza Aggrippal®, Enzira®, Fluarix®, Fluvirin®, Imuvac®, Influvac® Sub-unit, and Viroflu® Japanese Encephalitis Ixiaro® Meningococcal Group C Meningitec®, Menjugate Kit®, NeisVac-C® Meningococcal A,C, W135 and Y conjugate vaccine Menveo®, Nimenrix® Meningococcal polysaccharide A,C, W135 and Y vaccine ACWY Vax® Pertussis Diptheria containing vaccine for immunisation of pregnant women against pertussis: Absorbed diphtheria, tetanus, pertussis and poliomyelitis vaccine - Repevax® Pneumococcal Pneumovax II® (Adults and Children over 5 years), Prevenar 13®, Synflorix® (Primary childhood immunisation) Poliomyeltis ( Injection ) See under Diptheria vaccine Rabies Rabies vaccine - Rab, Rabipur® Tetanus *Single preparation no longer available. Combined Adsorbed diphtheria (low dose), tetanus and inactivated poliomyelitis preparation given. Tick-borne encephalitis TicoVac® Typhoid ( Polysaccharide injection for vaccination) Typherix®, Typhim Vi® Recommended Annual flu vaccine Pneumococcal vaccine once There are several types of pneumococcal vaccines available. PPV23 contains purified capsular polysaccharide from 23 common capsular types of pneumococcus. In the UK, PPV23 has been recommended for risk groups since 1992 and for all people aged 65 years and over since 2003. The Green Book chapter 25, states that revaccination with PPV23 is currently not recommended for any other clinical risk groups (except asplenia, splenic dysfunction or chronic renal disease) or age groups. Other pneumococcal vaccines exist – PCV 13 and PCV 15. The vaccination schedule needed for PCV 13 and PCV 15 in those who are immunocompromised can be found here , table 25.3 Influenza and pneumococcal vaccination should be offered to all patients receiving immunosuppressant therapy (except those on hydroxychloroquine and sulphasalazine). In patients with recurrent infections, testing of functional antbodies (pneumococcus, haemophilus and influenza) may be helpful. Advice from an immunology consultant should be considered. Recent research has shown that the majority of patients on csDMARDs and/or biologics (excluding rituximab) receiving annual influenza vaccination will reach sufficient serological immunity to protect against infection. Patients on rituximab (and possibly abatacept) may have a reduced response to influenza vaccine (Kapetanovic et al. 2014). For more detailed information on immunisation and contra-indications refer to the Department of Health Green Book Website: https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book Biologics • A full assessment of vaccination status should be made before commencing treatment with a biologic agent. • Live vaccines should not be given to patients receiving treatment with biologic agents. Where live vaccination is required it should be given at least 2-4 weeks prior to commencing treatment with a biologic. • Non–live vaccines may be given, but the immunological response may be reduced. It is therefore recommended that pneumococcal vaccine should be given 2-4 weeks before starting a biologic as response after starting treatment is thought to be reduced. • Vaccinations may be given 1 month off TNFi and abatacept and 6months after rituximab [personal communication with Professor K Winthrop] • The datasheet for rituximab recommends avoidance of live vaccination in individuals who are still B cell depleted. Non-live vaccines should ideally be given pre-treatment, as they will be less effective during therapy, and 6 months post infusion where necessary • Rituximab may reduce titres of protective antibodies so consider checking these, especially in presence of hypogammaglobulinaemia and when otherwise clinically indicated (discuss with Leeds Immunology / Rheumatology if needed) General Travel Advice All non-live vaccines should be given as appropriate. The administration of yellow fever vaccine is contra-indicated in immunosuppressed patients making travel to endemic areas, including tropical Africa and South America inadvisable. A certificate saying Yellow Fever vaccine cannot be given on medical grounds may be acceptable to some immigration authorities in special circumstances. Country requirements are published annually by WHO in International travel and health (available at www.who.int/ith) (WHO, 2004), and are included in Health information for overseas travel (Department of Health, 2001) and may be found on the NaTHNaC, www.nathnac.org. The parenteral typhoid vaccine offers only 70-80% protection, so personal, food and water hygiene must be emphasised to travellers in endemic areas. Immunisation with the oral cholera vaccine (Dukoral®) does not provide complete protection. Scrupulous attention to food, water, and personal hygiene is essential when travelling to areas where cholera exists. Malaria prophylaxis is essential when travelling to countries where there is a risk of developing malaria. Prophylaxis is not absolute and personal protection against being bitten is very important. Patients taking hydroxychloroquine should not take chloroquine as part of their malaria prophylaxis regime. Check for drug interactions with the local Hospital Pharmacy Department."},{"id":"surgery","title":"Surgery (peri-operative)","group":"Topics","kind":"chapter","html":"<p>Generally, csDMARDs do not need to be stopped per-operatively, but\nplease discuss with the patient’s rheumatology consultant if any\nconcerns.<\/p>\n<p>When elective surgery is planned it has been recommended that a\n<strong>biological<\/strong> DMARD should ideally be stopped for a period\nof 2 to 5 times the half-life prior to the surgical procedure. Rituximab\nshould ideally be stopped 3-6 months prior to elective surgery; i.v.\ntocilizumab should be stopped at least 4 weeks before surgery; s.c. TCZ\nshould be stopped at least 2 weeks before surgery.<\/p>\n<p>Table 3 provides information on the approximate half-lives of\ncurrently used biologic medicines. The suggested period for stopping\ntreatment prior to surgery has been agreed as reasonable, given the\nbalance of risk of surgical infection versus the risk of disease flare.\nThe times given are generally agreed to be as short as is safe, with\nlonger periods where there is greater concern. Some surgery may involve\nmuch greater risk of infection (eg colonic) whereas others are very low\n(eg ophthalmic).<\/p>\n<p>Due to inter-patient variability, co-morbidities and the need for\nrehabilitation post-surgery the period required for interruption of\nbiologic therapy should be discussed with the Rheumatologist well in\nadvance of the planned surgery. The wound should be fully healed and\nshow no evidence infection before the biologic medicine is\nrestarted.<\/p>\n<p><strong><br />\n<\/strong><\/p>\n<p><strong>Table 3, Current licensed biological DMARDs half-life’s plus\nsuggested stopping period prior to surgery<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 21%\" />\n<col style=\"width: 26%\" />\n<col style=\"width: 32%\" />\n<col style=\"width: 9%\" />\n<col style=\"width: 10%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Drug (bDMARDs)<\/strong><\/th>\n<th><strong>Dosing interval <\/strong><\/th>\n<th><strong>Period in which surgery should be scheduled (relative to\nlast biologic dose administered) <\/strong><\/th>\n<th><strong>One half-life, days <\/strong><\/th>\n<th><strong>Five half-lives, days <\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Adalimumab <\/td>\n<td>Every 2 weeks <\/td>\n<td>Week 3 <\/td>\n<td>14 <\/td>\n<td>70 <\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Abatacept i.v./s.c. <\/td>\n<td>Monthly (i.v.) weekly (s.c.) <\/td>\n<td>Week 5/week 2 <\/td>\n<td>14 <\/td>\n<td>70 <\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Certolizumab <\/td>\n<td>Every 2 weeks <\/td>\n<td>Week 3 <\/td>\n<td>14 <\/td>\n<td>70 <\/td>\n<\/tr>\n<tr class=\"even\">\n<td> <\/td>\n<td>Every 4 weeks <\/td>\n<td>Week 5 <\/td>\n<td> <\/td>\n<td> <\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Etanercept <\/td>\n<td>Weekly or twice weekly <\/td>\n<td>Week 2 <\/td>\n<td>3 <\/td>\n<td>15 <\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Golimumab <\/td>\n<td>Every 4 weeks <\/td>\n<td>Week 5 <\/td>\n<td>14 <\/td>\n<td>70 <\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Infliximab <\/td>\n<td>Every 4, 6 or 8 weeks <\/td>\n<td>Week 5, 7 or 9 <\/td>\n<td>9 <\/td>\n<td>45 <\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ixekizumab<\/td>\n<td>Every 4 weeks<\/td>\n<td>Week 5<\/td>\n<td>13<\/td>\n<td>65<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rituximab <\/td>\n<td>Two doses 2 weeks apart, and no more frequent than every 4\nmonths <\/td>\n<td>Months 4–7 <\/td>\n<td>18 <\/td>\n<td>90 <\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rizankizumab<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sarilumab<\/td>\n<td>Every 2 weeks<\/td>\n<td>Week 3<\/td>\n<td>21<\/td>\n<td>105<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Secukinumab<\/td>\n<td>Every 4 weeks<\/td>\n<td>Week 5<\/td>\n<td>27<\/td>\n<td>135<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ustekinumab<\/td>\n<td>Every 12 weeks<\/td>\n<td>Week 13<\/td>\n<td>21<\/td>\n<td>105<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tocilizumab i.v. <\/td>\n<td>Every 4 weeks <\/td>\n<td>Week 5 <\/td>\n<td> <\/td>\n<td> <\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>    4mg/kg <\/td>\n<td> <\/td>\n<td> <\/td>\n<td>11 <\/td>\n<td>55 <\/td>\n<\/tr>\n<tr class

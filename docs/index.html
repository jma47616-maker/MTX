ance dose if effective (aim for\n5mg/kg/day)<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline tests:<\/td>\n<td><p>Baseline blood monitoring test:<\/p>\n<ul>\n<li><p>FBC/U&amp;E/LFT<\/p><\/li>\n<li><p>Note: baseline optician assessment NOT needed<\/p><\/li>\n<\/ul>\n<p>Full ophthalmological screening after 5 years of treatment and\nannually thereafter. After 1 year of drug therapy and nnually if\n<strong>high<\/strong> risk:<\/p>\n<ul>\n<li><p>≥5mg/kg/day<\/p><\/li>\n<\/ul>\n<ul>\n<li><p>SLE<\/p><\/li>\n<li><p>Impaired renal function (eGFR&lt;30)<\/p><\/li>\n<li><p>If concurrent use of tamoxifen<\/p><\/li>\n<li><p>If using chloroquine at any dose<\/p><\/li>\n<\/ul>\n<p>Full ophthalmological screening after 5 years if <strong>low<\/strong>\nrisk (&lt;5mg/kg/day and none of the above<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine monitoring:<\/td>\n<td><p>Renal function annually in over 70’s or if pre-existing renal\nimpairment or when known hypertension / diabetes<\/p>\n<p>Optician screening: recommend pre-treatment assessment and then\nannual unless formal ophthalmological screening is undertaken (in years\n1, 2 and 4 in low-risk patients)<\/p>\n<p>Routine ophthalmology monitoring for:<\/p>\n<p>High risk screening = annually from year 1<\/p>\n<p>Low risk starts from 5 years and continues annually<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for stopping therapy:<\/td>\n<td><p><strong>Stop medication and contact local rheumatology service\nif:<\/strong><\/p>\n<p>Photophobia/Haloes/Visual field defects/reduced acuity/abnormal\ncolour vision/ pigmentary abnormality/ muscle weakness<\/p>\n<p>Not considered a risk factor for infection so safe to\ncontinue<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td>For rheumatic disease treatment should be discontinued if there is\nno significant improvement by 4-6 months.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><p>Use in caution in patients with:<\/p>\n<ul>\n<li><p>Psoriasis - increased risk of flare<\/p><\/li>\n<li><p>Patients taking medicines which may cause adverse ocular/skin\nreactions<\/p><\/li>\n<li><p>Patients with quinine sensitivity.<\/p><\/li>\n<\/ul>\n<p><strong>Severe hypoglycaemia<\/strong> has been reported, even in the\nabsence of anti-diabetic medication.<\/p>\n<p>Hepatic or renal disease, and in those taking drugs known to affect\nthose organs - dosage adjusted accordingly (seek advice from\nPharmacy)<\/p>\n<p>Important drug interactions: amiodarone, moxifloxacin, ciclosporin,\ndigoxin<\/p>\n<p>Antacids (advise a 4 hour interval)<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>http://www.medicines.org.uk/EMC/medicine/6977/SPC/Plaquenil+Tablets/<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>Considered for treatment of rheumatoid arthritis, juvenile\nidiopathic arthritis, systemic lupus erythematosus and other CTDs<\/p>\n<p>Usually started at a dose of 200mg bd for the first 3 months and then\nreduce to 200mg daily as a maintenance dose if effective (aim for\n5mg/kg/day)<\/p>"},"baseline-tests":{"label":"Baseline tests","html":"<p>Baseline blood monitoring test:<\/p>\n<ul>\n<li><p>FBC/U&amp;E/LFT<\/p><\/li>\n<li><p>Note: baseline optician assessment NOT needed<\/p><\/li>\n<\/ul>\n<p>Full ophthalmological screening after 5 years of treatment and\nannually thereafter. After 1 year of drug therapy and nnually if\n<strong>high<\/strong> risk:<\/p>\n<ul>\n<li><p>≥5mg/kg/day<\/p><\/li>\n<\/ul>\n<ul>\n<li><p>SLE<\/p><\/li>\n<li><p>Impaired renal function (eGFR&lt;30)<\/p><\/li>\n<li><p>If concurrent use of tamoxifen<\/p><\/li>\n<li><p>If using chloroquine at any dose<\/p><\/li>\n<\/ul>\n<p>Full ophthalmological screening after 5 years if <strong>low<\/strong>\nrisk (&lt;5mg/kg/day and none of the above<\/p>"},"routine-monitoring":{"label":"Routine monitoring","html":"<p>Renal function annually in over 70’s or if pre-existing renal\nimpairment or when known hypertension / diabetes<\/p>\n<p>Optician screening: recommend pre-treatment assessment and then\nannual unless formal ophthalmological screening is undertaken (in years\n1, 2 and 4 in low-risk patients)<\/p>\n<p>Routine ophthalmology monitoring for:<\/p>\n<p>High risk screening = annually from year 1<\/p>\n<p>Low risk starts from 5 years and continues annually<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for stopping therapy","html":"<p><strong>Stop medication and contact local rheumatology service\nif:<\/strong><\/p>\n<p>Photophobia/Haloes/Visual field defects/reduced acuity/abnormal\ncolour vision/ pigmentary abnormality/ muscle weakness<\/p>\n<p>Not considered a risk factor for infection so safe to\ncontinue<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"For rheumatic disease treatment should be discontinued if there is\nno significant improvement by 4-6 months."},"additional-information":{"label":"Additional information","html":"<p>Use in caution in patients with:<\/p>\n<ul>\n<li><p>Psoriasis - increased risk of flare<\/p><\/li>\n<li><p>Patients taking medicines which may cause adverse ocular/skin\nreactions<\/p><\/li>\n<li><p>Patients with quinine sensitivity.<\/p><\/li>\n<\/ul>\n<p><strong>Severe hypoglycaemia<\/strong> has been reported, even in the\nabsence of anti-diabetic medication.<\/p>\n<p>Hepatic or renal disease, and in those taking drugs known to affect\nthose organs - dosage adjusted accordingly (seek advice from\nPharmacy)<\/p>\n<p>Important drug interactions: amiodarone, moxifloxacin, ciclosporin,\ndigoxin<\/p>\n<p>Antacids (advise a 4 hour interval)<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: Considered for treatment of rheumatoid arthritis, juvenile idiopathic arthritis, systemic lupus erythematosus and other CTDs Usually started at a dose of 200mg bd for the first 3 months and then reduce to 200mg daily as a maintenance dose if effective (aim for 5mg/kg/day) Baseline tests: Baseline blood monitoring test: FBC/U&E/LFT Note: baseline optician assessment NOT needed Full ophthalmological screening after 5 years of treatment and annually thereafter. After 1 year of drug therapy and nnually if high risk: ≥5mg/kg/day SLE Impaired renal function (eGFR<30) If concurrent use of tamoxifen If using chloroquine at any dose Full ophthalmological screening after 5 years if low risk (<5mg/kg/day and none of the above Routine monitoring: Renal function annually in over 70’s or if pre-existing renal impairment or when known hypertension / diabetes Optician screening: recommend pre-treatment assessment and then annual unless formal ophthalmological screening is undertaken (in years 1, 2 and 4 in low-risk patients) Routine ophthalmology monitoring for: High risk screening = annually from year 1 Low risk starts from 5 years and continues annually Indications for stopping therapy: Stop medication and contact local rheumatology service if: Photophobia/Haloes/Visual field defects/reduced acuity/abnormal colour vision/ pigmentary abnormality/ muscle weakness Not considered a risk factor for infection so safe to continue Assessment of Response: For rheumatic disease treatment should be discontinued if there is no significant improvement by 4-6 months. Additional information: Use in caution in patients with: Psoriasis - increased risk of flare Patients taking medicines which may cause adverse ocular/skin reactions Patients with quinine sensitivity. Severe hypoglycaemia has been reported, even in the absence of anti-diabetic medication. Hepatic or renal disease, and in those taking drugs known to affect those organs - dosage adjusted accordingly (seek advice from Pharmacy) Important drug interactions: amiodarone, moxifloxacin, ciclosporin, digoxin Antacids (advise a 4 hour interval) Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/6977/SPC/Plaquenil+Tablets/"},{"id":"leflunomide","title":"Leflunomide","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>Usually considered for patients with active RA/ PsA/vasculitis\nwho have failed methotrexate and/or sulphasalazine<u>.<\/u><\/p>\n<p>Loading dose of 100mg daily for three days IS NOT recommended<\/p>\n<p>10-20 mg daily as a single tablet should be used. Timing of dose is\nnot important. Patients with uncertain alcohol intake or other\nhepatotoxic drugs may warrant increased vigilance.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline tests:<\/td>\n<td><p>FBC/U&amp;E and LFT<\/p>\n<p>BP<\/p>\n<p>Consider Pregnancy test<\/p>\n<p>Consider Chest X-ray and PFTs<\/p>\n<p>Consider Hep B/C/ HIV<\/p>\n<p>Note: use is contra-indicated in hepatic impairment, severe\nimmunodeficiency states (AIDS), moderate to severe renal impairment,\nsevere hypoproteinaemia (nephrotic syndrome) and impaired bone marrow\nfunction.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine monitoring:<\/td>\n<td><p>BP at each visit<\/p>\n<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months<\/p>\n<p>Thereafter, at least every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated<\/p>\n<p>Dose increases should be monitored by FBC, U&amp;Es and LFTs every 2\nweeks until on stable dose for 6 weeks then revert to previous\nschedule<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for stopping treatment:<\/td>\n<td><ul>\n<li><p>Ulcerative stomatitis – stop and contact specialist<\/p><\/li>\n<li><p>Skin/mucosal reaction (risk of Stephen Johnson) – stop and\ncontact specialist (washout recommended – cholestyramine 8g tds for 11\ndays or charcoal).<\/p><\/li>\n<li><p>Peripheral neuropathy – consider stop and contact hospital\nspecialist.<\/p><\/li>\n<\/ul>\n<p>In addition, Stop medication and hospital specialist if :<\/p>\n<ul>\n<li><p>White blood cells &lt;3.5x109/L<\/p><\/li>\n<li><p>Neutrophils &lt; 1.6 x 109/L or below local normal range<\/p><\/li>\n<li><p>Platelets &lt;140 x109/L or below local normal range<\/p><\/li>\n<li><p>Eosinophilia &gt; 0.5x109/L<\/p><\/li>\n<li><p>ALT or AST greater than 100 units/L, or any sudden increases\n(e.g. double of baseline), OR Unexplained fall in serum albumin to less\nthan 30g/L<\/p><\/li>\n<li><p>MCV &gt;105fL<\/p><\/li>\n<li><p>Significant BP rise or &gt; 160/95<\/p><\/li>\n<\/ul>\n<ul>\n<li><p>Abdominal pain/Nausea/Diarrhoea/Weight\nloss/Pruritis/Rash/<\/p><\/li>\n<li><p>Breathlessness or infection - perform CXR +/- PFT<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td>Clinical effect usually within 2 to 4 months.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><p>Can be associated with pulmonary toxicity (?more in East Asian\nGroups)<\/p>\n<p>Avoidance of alcohol recommended<\/p>\n<p><u>Important drug interactions:<\/u> hepatoxic/haemotoxic drugs,\ncholestyramine, rifampicin, warfarin, tolbutamide and phenytoin.<\/p>\n<p>Contains lactose and soya lecithin – avoid in lactose, soya or peanut\nallergy.<\/p>\n<p>Infusion reactions may be increased when combined with\ninfliximab<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/7480/SPC/Arava+10%2c+20+and+100mg+Tablets/\">http://www.medicines.org.uk/EMC/medicine/7480/SPC/Arava+10%2c+20+and+100mg+Tablets/<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>Usually considered for patients with active RA/ PsA/vasculitis\nwho have failed methotrexate and/or sulphasalazine<u>.<\/u><\/p>\n<p>Loading dose of 100mg daily for three days IS NOT recommended<\/p>\n<p>10-20 mg daily as a single tablet should be used. Timing of dose is\nnot important. Patients with uncertain alcohol intake or other\nhepatotoxic drugs may warrant increased vigilance.<\/p>"},"baseline-tests":{"label":"Baseline tests","html":"<p>FBC/U&amp;E and LFT<\/p>\n<p>BP<\/p>\n<p>Consider Pregnancy test<\/p>\n<p>Consider Chest X-ray and PFTs<\/p>\n<p>Consider Hep B/C/ HIV<\/p>\n<p>Note: use is contra-indicated in hepatic impairment, severe\nimmunodeficiency states (AIDS), moderate to severe renal impairment,\nsevere hypoproteinaemia (nephrotic syndrome) and impaired bone marrow\nfunction.<\/p>"},"routine-monitoring":{"label":"Routine monitoring","html":"<p>BP at each visit<\/p>\n<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months<\/p>\n<p>Thereafter, at least every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated<\/p>\n<p>Dose increases should be monitored by FBC, U&amp;Es and LFTs every 2\nweeks until on stable dose for 6 weeks then revert to previous\nschedule<\/p>"},"indications-for-stopping-treatment":{"label":"Indications for stopping treatment","html":"<ul>\n<li><p>Ulcerative stomatitis – stop and contact specialist<\/p><\/li>\n<li><p>Skin/mucosal reaction (risk of Stephen Johnson) – stop and\ncontact specialist (washout recommended – cholestyramine 8g tds for 11\ndays or charcoal).<\/p><\/li>\n<li><p>Peripheral neuropathy – consider stop and contact hospital\nspecialist.<\/p><\/li>\n<\/ul>\n<p>In addition, Stop medication and hospital specialist if :<\/p>\n<ul>\n<li><p>White blood cells &lt;3.5x109/L<\/p><\/li>\n<li><p>Neutrophils &lt; 1.6 x 109/L or below local normal range<\/p><\/li>\n<li><p>Platelets &lt;140 x109/L or below local normal range<\/p><\/li>\n<li><p>Eosinophilia &gt; 0.5x109/L<\/p><\/li>\n<li><p>ALT or AST greater than 100 units/L, or any sudden increases\n(e.g. double of baseline), OR Unexplained fall in serum albumin to less\nthan 30g/L<\/p><\/li>\n<li><p>MCV &gt;105fL<\/p><\/li>\n<li><p>Significant BP rise or &gt; 160/95<\/p><\/li>\n<\/ul>\n<ul>\n<li><p>Abdominal pain/Nausea/Diarrhoea/Weight\nloss/Pruritis/Rash/<\/p><\/li>\n<li><p>Breathlessness or infection - perform CXR +/- PFT<\/p><\/li>\n<\/ul>"},"assessment-of-response":{"label":"Assessment of Response","html":"Clinical effect usually within 2 to 4 months."},"additional-information":{"label":"Additional information","html":"<p>Can be associated with pulmonary toxicity (?more in East Asian\nGroups)<\/p>\n<p>Avoidance of alcohol recommended<\/p>\n<p><u>Important drug interactions:<\/u> hepatoxic/haemotoxic drugs,\ncholestyramine, rifampicin, warfarin, tolbutamide and phenytoin.<\/p>\n<p>Contains lactose and soya lecithin – avoid in lactose, soya or peanut\nallergy.<\/p>\n<p>Infusion reactions may be increased when combined with\ninfliximab<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: Usually considered for patients with active RA/ PsA/vasculitis who have failed methotrexate and/or sulphasalazine . Loading dose of 100mg daily for three days IS NOT recommended 10-20 mg daily as a single tablet should be used. Timing of dose is not important. Patients with uncertain alcohol intake or other hepatotoxic drugs may warrant increased vigilance. Baseline tests: FBC/U&E and LFT BP Consider Pregnancy test Consider Chest X-ray and PFTs Consider Hep B/C/ HIV Note: use is contra-indicated in hepatic impairment, severe immunodeficiency states (AIDS), moderate to severe renal impairment, severe hypoproteinaemia (nephrotic syndrome) and impaired bone marrow function. Routine monitoring: BP at each visit FBC, U&Es, LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months Thereafter, at least every 12 weeks. More frequent monitoring is appropriate in patients at higher risk of toxicity, or when clinically indicated Dose increases should be monitored by FBC, U&Es and LFTs every 2 weeks until on stable dose for 6 weeks then revert to previous schedule Indications for stopping treatment: Ulcerative stomatitis – stop and contact specialist Skin/mucosal reaction (risk of Stephen Johnson) – stop and contact specialist (washout recommended – cholestyramine 8g tds for 11 days or charcoal). Peripheral neuropathy – consider stop and contact hospital specialist. In addition, Stop medication and hospital specialist if : White blood cells <3.5x109/L Neutrophils < 1.6 x 109/L or below local normal range Platelets <140 x109/L or below local normal range Eosinophilia > 0.5x109/L ALT or AST greater than 100 units/L, or any sudden increases (e.g. double of baseline), OR Unexplained fall in serum albumin to less than 30g/L MCV >105fL Significant BP rise or > 160/95 Abdominal pain/Nausea/Diarrhoea/Weight loss/Pruritis/Rash/ Breathlessness or infection - perform CXR +/- PFT Assessment of Response: Clinical effect usually within 2 to 4 months. Additional information: Can be associated with pulmonary toxicity (?more in East Asian Groups) Avoidance of alcohol recommended Important drug interactions: hepatoxic/haemotoxic drugs, cholestyramine, rifampicin, warfarin, tolbutamide and phenytoin. Contains lactose and soya lecithin – avoid in lactose, soya or peanut allergy. Infusion reactions may be increased when combined with infliximab Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/7480/SPC/Arava+10%2c+20+and+100mg+Tablets/"},{"id":"methotrexate","title":"Methotrexate","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>Treatment may begin at a dose of 10-20mg WEEKLY using 2.5mg\ntablets and increased to 20mg after 2-4 weeks. Folic acid should be\nco-prescribed, but patients should be advised not to take it on the day\nthey take their methotrexate.<\/p>\n<p>The <u>day<\/u> of administration plus <u>strength<\/u> of tablet\nshould be specified.<\/p>\n<p>Consider changing to the subcutaneous route if there is gastric\nintolerance or a lack of efficacy at the higher end of the dose\nrange.<\/p>\n<p>Maximum recommended dose oral or SC = 30mg weekly.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><p>FBC/U&amp;E/LFT<\/p>\n<p>Consider pregnancy test<\/p>\n<p>All patients should have a pre-treatment CXR and consider PFT (in\nRA). Where TLCO less than 70% or clinical concern a baseline HRCT chest\nmay be advisable (lung toxicity may be increased when fibrosis is\npresent)<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><p>FBC, U&amp;Es and LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months<\/p>\n<p>Patients at risk of renal impairment may need U&amp;Es checked\nregularly or if not annually<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated. NPSA still recommend MTX\nmonitoring books for patients<\/p>\n<p>Following a dose change repeat every 2 weeks until the dose has been\nstable for 6 weeks, then revert to previous schedule<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p><strong>Stop medication and contact local rheumatology service\nif:<\/strong><\/p>\n<p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>Oral ulceration/Unusual bruising/Rash/Nausea/Alopecia<\/p>\n<p>Any new respiratory symptoms including cough<\/p>\n<p>Fever<\/p>\n<p><strong>Consider the need for folinic acid rescue - refer to BNF for\ndosage recommendations and discuss with Rheumatology\nService<\/strong><\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td>Clinical effect usually within 2 to 4 months.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><p><strong>Warnings/Caution:<\/strong><\/p>\n<p>Avoid in significant hepatic impairment<\/p>\n<p>Not recommended in severe renal impairment (creatinine clearance\n&lt;10ml/min) the dose should be reduced by 50% if the CrCl is between\n10-20ml/min. Also consider dose reduction if CrCl 20-50ml/min.<\/p>\n<p>Pre-existing haematological condition<\/p>\n<p>Underlying chest disease<\/p>\n<p>Where history of excessive alcohol intake<\/p>\n<p><strong>Drug interactions:<\/strong><\/p>\n<p>Concomitant administration of folate antagonists such as trimethoprim\nand nitrous oxide should be avoided. Use of co-trimoxazole may occur in\npatients with GPA, under specialist supervision<\/p>\n<p>Penicillins may potentiate levels of methotrexate (Patients should\nstop taking methotrexate if they have any infection/require antibiotics,\nand restart once the antibiotic course is completed / the infection has\nresolved)<\/p>\n<p>Acitretin - severe hepatitis reported when combined with MTX<\/p>\n<p>Vitamin preparations containing folic acid<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/6005/SPC/Maxtrex+Tablets+10+mg/\">http://www.medicines.org.uk/EMC/medicine/6005/SPC/Maxtrex+Tablets+10+mg/<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>Treatment may begin at a dose of 10-20mg WEEKLY using 2.5mg\ntablets and increased to 20mg after 2-4 weeks. Folic acid should be\nco-prescribed, but patients should be advised not to take it on the day\nthey take their methotrexate.<\/p>\n<p>The <u>day<\/u> of administration plus <u>strength<\/u> of tablet\nshould be specified.<\/p>\n<p>Consider changing to the subcutaneous route if there is gastric\nintolerance or a lack of efficacy at the higher end of the dose\nrange.<\/p>\n<p>Maximum recommended dose oral or SC = 30mg weekly.<\/p>"},"baseline-tests":{"label":"Baseline Tests","html":"<p>FBC/U&amp;E/LFT<\/p>\n<p>Consider pregnancy test<\/p>\n<p>All patients should have a pre-treatment CXR and consider PFT (in\nRA). Where TLCO less than 70% or clinical concern a baseline HRCT chest\nmay be advisable (lung toxicity may be increased when fibrosis is\npresent)<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>FBC, U&amp;Es and LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months and then every 3 months<\/p>\n<p>Patients at risk of renal impairment may need U&amp;Es checked\nregularly or if not annually<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated. NPSA still recommend MTX\nmonitoring books for patients<\/p>\n<p>Following a dose change repeat every 2 weeks until the dose has been\nstable for 6 weeks, then revert to previous schedule<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p><strong>Stop medication and contact local rheumatology service\nif:<\/strong><\/p>\n<p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>Oral ulceration/Unusual bruising/Rash/Nausea/Alopecia<\/p>\n<p>Any new respiratory symptoms including cough<\/p>\n<p>Fever<\/p>\n<p><strong>Consider the need for folinic acid rescue - refer to BNF for\ndosage recommendations and discuss with Rheumatology\nService<\/strong><\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"Clinical effect usually within 2 to 4 months."},"additional-information":{"label":"Additional information","html":"<p><strong>Warnings/Caution:<\/strong><\/p>\n<p>Avoid in significant hepatic impairment<\/p>\n<p>Not recommended in severe renal impairment (creatinine clearance\n&lt;10ml/min) the dose should be reduced by 50% if the CrCl is between\n10-20ml/min. Also consider dose reduction if CrCl 20-50ml/min.<\/p>\n<p>Pre-existing haematological condition<\/p>\n<p>Underlying chest disease<\/p>\n<p>Where history of excessive alcohol intake<\/p>\n<p><strong>Drug interactions:<\/strong><\/p>\n<p>Concomitant administration of folate antagonists such as trimethoprim\nand nitrous oxide should be avoided. Use of co-trimoxazole may occur in\npatients with GPA, under specialist supervision<\/p>\n<p>Penicillins may potentiate levels of methotrexate (Patients should\nstop taking methotrexate if they have any infection/require antibiotics,\nand restart once the antibiotic course is completed / the infection has\nresolved)<\/p>\n<p>Acitretin - severe hepatitis reported when combined with MTX<\/p>\n<p>Vitamin preparations containing folic acid<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: Treatment may begin at a dose of 10-20mg WEEKLY using 2.5mg tablets and increased to 20mg after 2-4 weeks. Folic acid should be co-prescribed, but patients should be advised not to take it on the day they take their methotrexate. The day of administration plus strength of tablet should be specified. Consider changing to the subcutaneous route if there is gastric intolerance or a lack of efficacy at the higher end of the dose range. Maximum recommended dose oral or SC = 30mg weekly. Baseline Tests: FBC/U&E/LFT Consider pregnancy test All patients should have a pre-treatment CXR and consider PFT (in RA). Where TLCO less than 70% or clinical concern a baseline HRCT chest may be advisable (lung toxicity may be increased when fibrosis is present) Routine Monitoring: FBC, U&Es and LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months and then every 3 months Patients at risk of renal impairment may need U&Es checked regularly or if not annually More frequent monitoring is appropriate in patients at higher risk of toxicity, or when clinically indicated. NPSA still recommend MTX monitoring books for patients Following a dose change repeat every 2 weeks until the dose has been stable for 6 weeks, then revert to previous schedule Indications for Stopping Therapy: Stop medication and contact local rheumatology service if: White blood cells <3.5x10 9 /L Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range Eosinophilia > 0.5x10 9 /L ALT or AST greater than 100 units/L, or any sudden increases (e.g. double of baseline), OR Unexplained fall in serum albumin to less than 30g/L MCV >105fL Oral ulceration/Unusual bruising/Rash/Nausea/Alopecia Any new respiratory symptoms including cough Fever Consider the need for folinic acid rescue - refer to BNF for dosage recommendations and discuss with Rheumatology Service Assessment of Response: Clinical effect usually within 2 to 4 months. Additional information: Warnings/Caution: Avoid in significant hepatic impairment Not recommended in severe renal impairment (creatinine clearance <10ml/min) the dose should be reduced by 50% if the CrCl is between 10-20ml/min. Also consider dose reduction if CrCl 20-50ml/min. Pre-existing haematological condition Underlying chest disease Where history of excessive alcohol intake Drug interactions: Concomitant administration of folate antagonists such as trimethoprim and nitrous oxide should be avoided. Use of co-trimoxazole may occur in patients with GPA, under specialist supervision Penicillins may potentiate levels of methotrexate (Patients should stop taking methotrexate if they have any infection/require antibiotics, and restart once the antibiotic course is completed / the infection has resolved) Acitretin - severe hepatitis reported when combined with MTX Vitamin preparations containing folic acid Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/6005/SPC/Maxtrex+Tablets+10+mg/"},{"id":"mycophenolate-mofetil","title":"Mycophenolate mofetil","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>In connective tissue disease – usual starting dose is 500mg twice\ndaily for 2 weeks and then 1g twice daily. If there is gastric\nintolerance consider giving as 500mg four times a day. If indicated the\ndose may be increased to 1.5g twice a day.<\/p>\n<p><strong>Renal impairment:<\/strong> If GFR &lt;25ml/min commence on\n250mg bd and gradually titrate, not exceeding 1g bd.<\/p>\n<p>Note: The dose of mycophenolic acid (Myfortic®) is not equivalent;\n720mg of mycophenolic acid is approximately equivalent to 1g of\nmycophenolate mofetil. Where possible, maintain the same generic when\nprescribing<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline tests:<\/td>\n<td><p>FBC/U&amp;E/LFT/lipids and BP<\/p>\n<p>Consider Hepatitis B/C/HIV<\/p>\n<p>Varicella immune status (avoid if re-current herpes/shingles)<\/p>\n<p>Consider Pregnancy Test<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine monitoring:<\/td>\n<td><p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months<\/p>\n<p>Thereafter, at least every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated<\/p>\n<p>Dose increases should be monitored by FBC and LFTs at 2 and 6 weeks\nand then revert to previous schedule<\/p>\n<p>Consider measure serum immunoglobulin levels intermittently or if\nrecurrent infections develop<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for stopping therapy:<\/td>\n<td><p>Patients should be warned to report immediately any signs or\nsymptoms of bone marrow suppression e.g. infection or inexplicable\nbruising or bleeding. Perform an immediate blood test and stop\nmedication and contact local rheumatology service if:<\/p>\n<ul>\n<li><p>White blood cells &lt;3.5x109/L<\/p><\/li>\n<li><p>Neutrophils &lt; 1.6 x 109/L or below local normal range<\/p><\/li>\n<li><p>Platelets &lt;140 x109/L or below local normal range<\/p><\/li>\n<li><p>Eosinophilia &gt; 0.5x109/L<\/p><\/li>\n<li><p>ALT or AST greater than 100 units/L, or any sudden increases\n(e.g. double of baseline), OR Unexplained fall in serum albumin to less\nthan 30g/L<\/p><\/li>\n<li><p>MCV &gt;105fL<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of response:<\/td>\n<td>Usually at 3-4 months and defined by the Rheumatology Consultant\naccording to the disease/organ affected<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><p>Advise patients to minimise exposure to sunlight and wear\nsunscreen with a high protection factor.<\/p>\n<p>Avoid in patients with rare hereditary deficiency of\nhypoxanthine-guanine phosphoribosyl-transferase (HGPRT) such as\nLesch-Nyhan and Kelley-Seegmiller syndrome.<\/p>\n<p>Gastric side effects can occur including ulceration, perforation and\nhaemorrhage.<\/p>\n<p><u>Important drug interactions:<\/u> Avoid concomitant use with\nazathioprine, aciclovir/ganciclovir and probenecid. The following\ndecrease levels: antacids , proton pump inhibitors, cholestyramine,\nnorfloxacin/metronidazole, ciprofloxacin/co-amoxiclav and\nrifampicin.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/1679/SPC/Cellcept+250mg+Capsules/\">http://www.medicines.org.uk/EMC/medicine/1679/SPC/Cellcept+250mg+Capsules/<\/a><\/p>\n<p>https://www.gov.uk/drug-safety-update/mycophenolate-mofetil-cellcept-and-mycophenolic-acid-risk-of-hypogammaglobulinaemia-and-risk-of-bronchiectasis<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>In connective tissue disease – usual starting dose is 500mg twice\ndaily for 2 weeks and then 1g twice daily. If there is gastric\nintolerance consider giving as 500mg four times a day. If indicated the\ndose may be increased to 1.5g twice a day.<\/p>\n<p><strong>Renal impairment:<\/strong> If GFR &lt;25ml/min commence on\n250mg bd and gradually titrate, not exceeding 1g bd.<\/p>\n<p>Note: The dose of mycophenolic acid (Myfortic®) is not equivalent;\n720mg of mycophenolic acid is approximately equivalent to 1g of\nmycophenolate mofetil. Where possible, maintain the same generic when\nprescribing<\/p>"},"baseline-tests":{"label":"Baseline tests","html":"<p>FBC/U&amp;E/LFT/lipids and BP<\/p>\n<p>Consider Hepatitis B/C/HIV<\/p>\n<p>Varicella immune status (avoid if re-current herpes/shingles)<\/p>\n<p>Consider Pregnancy Test<\/p>"},"routine-monitoring":{"label":"Routine monitoring","html":"<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months<\/p>\n<p>Thereafter, at least every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated<\/p>\n<p>Dose increases should be monitored by FBC and LFTs at 2 and 6 weeks\nand then revert to previous schedule<\/p>\n<p>Consider measure serum immunoglobulin levels intermittently or if\nrecurrent infections develop<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for stopping therapy","html":"<p>Patients should be warned to report immediately any signs or\nsymptoms of bone marrow suppression e.g. infection or inexplicable\nbruising or bleeding. Perform an immediate blood test and stop\nmedication and contact local rheumatology service if:<\/p>\n<ul>\n<li><p>White blood cells &lt;3.5x109/L<\/p><\/li>\n<li><p>Neutrophils &lt; 1.6 x 109/L or below local normal range<\/p><\/li>\n<li><p>Platelets &lt;140 x109/L or below local normal range<\/p><\/li>\n<li><p>Eosinophilia &gt; 0.5x109/L<\/p><\/li>\n<li><p>ALT or AST greater than 100 units/L, or any sudden increases\n(e.g. double of baseline), OR Unexplained fall in serum albumin to less\nthan 30g/L<\/p><\/li>\n<li><p>MCV &gt;105fL<\/p><\/li>\n<\/ul>"},"assessment-of-response":{"label":"Assessment of response","html":"Usually at 3-4 months and defined by the Rheumatology Consultant\naccording to the disease/organ affected"},"additional-information":{"label":"Additional information","html":"<p>Advise patients to minimise exposure to sunlight and wear\nsunscreen with a high protection factor.<\/p>\n<p>Avoid in patients with rare hereditary deficiency of\nhypoxanthine-guanine phosphoribosyl-transferase (HGPRT) such as\nLesch-Nyhan and Kelley-Seegmiller syndrome.<\/p>\n<p>Gastric side effects can occur including ulceration, perforation and\nhaemorrhage.<\/p>\n<p><u>Important drug interactions:<\/u> Avoid concomitant use with\nazathioprine, aciclovir/ganciclovir and probenecid. The following\ndecrease levels: antacids , proton pump inhibitors, cholestyramine,\nnorfloxacin/metronidazole, ciprofloxacin/co-amoxiclav and\nrifampicin.<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: In connective tissue disease – usual starting dose is 500mg twice daily for 2 weeks and then 1g twice daily. If there is gastric intolerance consider giving as 500mg four times a day. If indicated the dose may be increased to 1.5g twice a day. Renal impairment: If GFR <25ml/min commence on 250mg bd and gradually titrate, not exceeding 1g bd. Note: The dose of mycophenolic acid (Myfortic®) is not equivalent; 720mg of mycophenolic acid is approximately equivalent to 1g of mycophenolate mofetil. Where possible, maintain the same generic when prescribing Baseline tests: FBC/U&E/LFT/lipids and BP Consider Hepatitis B/C/HIV Varicella immune status (avoid if re-current herpes/shingles) Consider Pregnancy Test Routine monitoring: FBC, U&Es, LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months Thereafter, at least every 12 weeks. More frequent monitoring is appropriate in patients at higher risk of toxicity, or when clinically indicated Dose increases should be monitored by FBC and LFTs at 2 and 6 weeks and then revert to previous schedule Consider measure serum immunoglobulin levels intermittently or if recurrent infections develop Indications for stopping therapy: Patients should be warned to report immediately any signs or symptoms of bone marrow suppression e.g. infection or inexplicable bruising or bleeding. Perform an immediate blood test and stop medication and contact local rheumatology service if: White blood cells <3.5x109/L Neutrophils < 1.6 x 109/L or below local normal range Platelets <140 x109/L or below local normal range Eosinophilia > 0.5x109/L ALT or AST greater than 100 units/L, or any sudden increases (e.g. double of baseline), OR Unexplained fall in serum albumin to less than 30g/L MCV >105fL Assessment of response: Usually at 3-4 months and defined by the Rheumatology Consultant according to the disease/organ affected Additional information: Advise patients to minimise exposure to sunlight and wear sunscreen with a high protection factor. Avoid in patients with rare hereditary deficiency of hypoxanthine-guanine phosphoribosyl-transferase (HGPRT) such as Lesch-Nyhan and Kelley-Seegmiller syndrome. Gastric side effects can occur including ulceration, perforation and haemorrhage. Important drug interactions: Avoid concomitant use with azathioprine, aciclovir/ganciclovir and probenecid. The following decrease levels: antacids , proton pump inhibitors, cholestyramine, norfloxacin/metronidazole, ciprofloxacin/co-amoxiclav and rifampicin. Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/1679/SPC/Cellcept+250mg+Capsules/ https://www.gov.uk/drug-safety-update/mycophenolate-mofetil-cellcept-and-mycophenolic-acid-risk-of-hypogammaglobulinaemia-and-risk-of-bronchiectasis"},{"id":"penicillamine","title":"Penicillamine","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>Treatment is usually started at 125mg daily taken at least half\nan hour before food/milk or last thing at night. If no problems occur\nthe dosage may be increased to :<\/p>\n<ul>\n<li><p>250mg tablet daily for 1 week<\/p><\/li>\n<li><p>375mg daily for 1 week<\/p><\/li>\n<li><p>Then two 250mg tablets daily<\/p><\/li>\n<\/ul>\n<p>500mg daily in divided doses for 3 months is recommended. Further\nincreases may be necessary if limited clinical response, with a usual\nmaximum of 750mg daily (rarely more).<\/p>\n<p>Consider co-administration of pyridoxine if treatment is continued\nlong term.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><p>Urinalysis<\/p>\n<p>FBC/U&amp;E<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><p>Two weekly for the first 2 months (0-2 months)<\/p>\n<p>Monthly for 4 months (2-6 months)<\/p>\n<p>Thereafter 3 monthly (unless dose changes)<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>Stop and contact local rheumatology service if :<\/p>\n<ul>\n<li><p>White blood cells &lt;3.5x109/L<\/p><\/li>\n<li><p>Neutrophils &lt; 1.6 x 109/L or below local normal range<\/p><\/li>\n<li><p>Platelets &lt;140 x109/L or below local normal range<\/p><\/li>\n<li><p>Eosinophilia &gt; 0.5x109/L<\/p><\/li>\n<li><p>ALT or AST greater than 100 units/L, or any sudden increases\n(e.g. double of baseline), OR Unexplained fall in serum albumin to less\nthan 30g/L<\/p><\/li>\n<li><p>MCV &gt;105fLProteinuria/Blood &gt;1+<\/p><\/li>\n<\/ul>\n<p>Rash - Antihistamines/steroid cover/temporary reduction in dose can\ncontrol uticarial rash. Unusual bruising/mouth ulceration/loss of taste.\nIf proteinuria and negative MSU, suggest PCI and GFR (or 24 hour urine\nfor CrCl and protein)<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td>4-6 months<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><p><strong>Contra-indicated when:<\/strong><\/p>\n<ul>\n<li><p>SLE<\/p><\/li>\n<li><p>Previous agranulocytosis, aplastic anaemia or severe\nthrombocytopenia in association with penicillamine<\/p><\/li>\n<li><p>Moderate or severe renal impairment<\/p><\/li>\n<\/ul>\n<p><strong>Drug interactions:<\/strong><\/p>\n<ul>\n<li><p>Concomitant use of NSAIDs and other nephrotoxic drugs may\nincrease the risk of renal damage.<\/p><\/li>\n<li><p>Penicillamine should be used with caution in patients who have\nhad adverse reactions to gold.<\/p><\/li>\n<li><p>If concomitant oral iron, digoxin, zinc or antacid therapy is\nindicated, this should not be given within two hours of taking\npenicillamine.<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Please contact the Rheumatologist if patient considering conceiving\nor in case of pregnancy.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/emc/medicine/9211/SPC/Distamine+125mg+Film-coated+tablets/\">http://www.medicines.org.uk/emc/medicine/9211/SPC/Distamine+125mg+Film-coated+tablets/<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>Treatment is usually started at 125mg daily taken at least half\nan hour before food/milk or last thing at night. If no problems occur\nthe dosage may be increased to :<\/p>\n<ul>\n<li><p>250mg tablet daily for 1 week<\/p><\/li>\n<li><p>375mg daily for 1 week<\/p><\/li>\n<li><p>Then two 250mg tablets daily<\/p><\/li>\n<\/ul>\n<p>500mg daily in divided doses for 3 months is recommended. Further\nincreases may be necessary if limited clinical response, with a usual\nmaximum of 750mg daily (rarely more).<\/p>\n<p>Consider co-administration of pyridoxine if treatment is continued\nlong term.<\/p>"},"baseline-tests":{"label":"Baseline Tests","html":"<p>Urinalysis<\/p>\n<p>FBC/U&amp;E<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>Two weekly for the first 2 months (0-2 months)<\/p>\n<p>Monthly for 4 months (2-6 months)<\/p>\n<p>Thereafter 3 monthly (unless dose changes)<\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>Stop and contact local rheumatology service if :<\/p>\n<ul>\n<li><p>White blood cells &lt;3.5x109/L<\/p><\/li>\n<li><p>Neutrophils &lt; 1.6 x 109/L or below local normal range<\/p><\/li>\n<li><p>Platelets &lt;140 x109/L or below local normal range<\/p><\/li>\n<li><p>Eosinophilia &gt; 0.5x109/L<\/p><\/li>\n<li><p>ALT or AST greater than 100 units/L, or any sudden increases\n(e.g. double of baseline), OR Unexplained fall in serum albumin to less\nthan 30g/L<\/p><\/li>\n<li><p>MCV &gt;105fLProteinuria/Blood &gt;1+<\/p><\/li>\n<\/ul>\n<p>Rash - Antihistamines/steroid cover/temporary reduction in dose can\ncontrol uticarial rash. Unusual bruising/mouth ulceration/loss of taste.\nIf proteinuria and negative MSU, suggest PCI and GFR (or 24 hour urine\nfor CrCl and protein)<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"4-6 months"},"additional-information":{"label":"Additional information","html":"<p><strong>Contra-indicated when:<\/strong><\/p>\n<ul>\n<li><p>SLE<\/p><\/li>\n<li><p>Previous agranulocytosis, aplastic anaemia or severe\nthrombocytopenia in association with penicillamine<\/p><\/li>\n<li><p>Moderate or severe renal impairment<\/p><\/li>\n<\/ul>\n<p><strong>Drug interactions:<\/strong><\/p>\n<ul>\n<li><p>Concomitant use of NSAIDs and other nephrotoxic drugs may\nincrease the risk of renal damage.<\/p><\/li>\n<li><p>Penicillamine should be used with caution in patients who have\nhad adverse reactions to gold.<\/p><\/li>\n<li><p>If concomitant oral iron, digoxin, zinc or antacid therapy is\nindicated, this should not be given within two hours of taking\npenicillamine.<\/p><\/li>\n<\/ul>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Please contact the Rheumatologist if patient considering conceiving\nor in case of pregnancy."}},"text":"Dose: Treatment is usually started at 125mg daily taken at least half an hour before food/milk or last thing at night. If no problems occur the dosage may be increased to : 250mg tablet daily for 1 week 375mg daily for 1 week Then two 250mg tablets daily 500mg daily in divided doses for 3 months is recommended. Further increases may be necessary if limited clinical response, with a usual maximum of 750mg daily (rarely more). Consider co-administration of pyridoxine if treatment is continued long term. Baseline Tests: Urinalysis FBC/U&E Routine Monitoring: Two weekly for the first 2 months (0-2 months) Monthly for 4 months (2-6 months) Thereafter 3 monthly (unless dose changes) Indications for Stopping Therapy: Stop and contact local rheumatology service if : White blood cells <3.5x109/L Neutrophils < 1.6 x 109/L or below local normal range Platelets <140 x109/L or below local normal range Eosinophilia > 0.5x109/L ALT or AST greater than 100 units/L, or any sudden increases (e.g. double of baseline), OR Unexplained fall in serum albumin to less than 30g/L MCV >105fLProteinuria/Blood >1+ Rash - Antihistamines/steroid cover/temporary reduction in dose can control uticarial rash. Unusual bruising/mouth ulceration/loss of taste. If proteinuria and negative MSU, suggest PCI and GFR (or 24 hour urine for CrCl and protein) Assessment of Response: 4-6 months Additional information: Contra-indicated when: SLE Previous agranulocytosis, aplastic anaemia or severe thrombocytopenia in association with penicillamine Moderate or severe renal impairment Drug interactions: Concomitant use of NSAIDs and other nephrotoxic drugs may increase the risk of renal damage. Penicillamine should be used with caution in patients who have had adverse reactions to gold. If concomitant oral iron, digoxin, zinc or antacid therapy is indicated, this should not be given within two hours of taking penicillamine. Pregnancy & Breastfeeding: Please contact the Rheumatologist if patient considering conceiving or in case of pregnancy. Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/emc/medicine/9211/SPC/Distamine+125mg+Film-coated+tablets/"},{"id":"sulfasalazine","title":"Sulfasalazine","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>Indications include - Rheumatoid arthritis, psoriatic arthritis\nand IBD related arthritis<\/p>\n<p>Gradual dose titration to avoid gastric intolerance (enteric coated\nprep may be considered) e.g. 500mg BD for 2 weeks, then 1g twice a day.\nIf gastric intolerance consider 500mg four times a day.<\/p>\n<p>If indicated the dose may be increased to 1.5g twice a day.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline tests:<\/td>\n<td><p>FBC<\/p>\n<p>LFTs<\/p>\n<p>U&amp;E<\/p>\n<p>Consider serum folate<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine monitoring:<\/td>\n<td><p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks; then once on stable dose, monthly for 3 months; thereafter, at\nleast every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated<\/p>\n<p>Dose increases should be monitored by FBC and LFTs at 2 and 6 weeks\nand then revert to previous schedule<\/p>\n<p><em>Monitoring may be discontinued after 1 year on direct consultant\nguidance<\/em><\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p>The patient should be counselled to report immediately with any\nsore throat, fever, malaise, pallor, purpura, jaundice or unexpected\nnon-specific illness during sulfasalazine treatment (interrupt therapy\nand perform a blood test).<\/p>\n<p>Stop medication and contact local rheumatology service if:<\/p>\n<p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>Generally not considered a risk factor for infection so remains safe\nto continue<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of response:<\/td>\n<td>At 3-6 months<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><ul>\n<li><p>Contra-indicated in patient with hypersensitivity to\nsulphonamides or salicylates.<\/p><\/li>\n<li><p>Contra-indicated in Porphyria<\/p><\/li>\n<li><p>Avoid in hepatic and/or renal impairment and/or pre-existing\nblood dycrasias unless benefit outweighs risk.<\/p><\/li>\n<li><p>Risk of folic acid deficiency<\/p><\/li>\n<li><p>Oligospermia and infertility may occur in men treated with\nsulfasalazine (reversal within 2 to 3 months of stopping).<\/p><\/li>\n<li><p>Risk of crystalluria – maintain adequate fluid intake.<\/p><\/li>\n<\/ul>\n<p><u>Important drug reactions<\/u>: •azathioprine/mercaptopurine –\nincreased bone marrow suppression •digoxin (decreased absorption)\n•Hypoglycaemic agents – increased hypoglycaemia<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>http://www.medicines.org.uk/EMC/medicine/10722/SPC/Salazopyrin+En-Tabs/<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>Indications include - Rheumatoid arthritis, psoriatic arthritis\nand IBD related arthritis<\/p>\n<p>Gradual dose titration to avoid gastric intolerance (enteric coated\nprep may be considered) e.g. 500mg BD for 2 weeks, then 1g twice a day.\nIf gastric intolerance consider 500mg four times a day.<\/p>\n<p>If indicated the dose may be increased to 1.5g twice a day.<\/p>"},"baseline-tests":{"label":"Baseline tests","html":"<p>FBC<\/p>\n<p>LFTs<\/p>\n<p>U&amp;E<\/p>\n<p>Consider serum folate<\/p>"},"routine-monitoring":{"label":"Routine monitoring","html":"<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks; then once on stable dose, monthly for 3 months; thereafter, at\nleast every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated<\/p>\n<p>Dose increases should be monitored by FBC and LFTs at 2 and 6 weeks\nand then revert to previous schedule<\/p>\n<p><em>Monitoring may be discontinued after 1 year on direct consultant\nguidance<\/em><\/p>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p>The patient should be counselled to report immediately with any\nsore throat, fever, malaise, pallor, purpura, jaundice or unexpected\nnon-specific illness during sulfasalazine treatment (interrupt therapy\nand perform a blood test).<\/p>\n<p>Stop medication and contact local rheumatology service if:<\/p>\n<p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>Generally not considered a risk factor for infection so remains safe\nto continue<\/p>"},"assessment-of-response":{"label":"Assessment of response","html":"At 3-6 months"},"additional-information":{"label":"Additional information","html":"<ul>\n<li><p>Contra-indicated in patient with hypersensitivity to\nsulphonamides or salicylates.<\/p><\/li>\n<li><p>Contra-indicated in Porphyria<\/p><\/li>\n<li><p>Avoid in hepatic and/or renal impairment and/or pre-existing\nblood dycrasias unless benefit outweighs risk.<\/p><\/li>\n<li><p>Risk of folic acid deficiency<\/p><\/li>\n<li><p>Oligospermia and infertility may occur in men treated with\nsulfasalazine (reversal within 2 to 3 months of stopping).<\/p><\/li>\n<li><p>Risk of crystalluria – maintain adequate fluid intake.<\/p><\/li>\n<\/ul>\n<p><u>Important drug reactions<\/u>: •azathioprine/mercaptopurine –\nincreased bone marrow suppression •digoxin (decreased absorption)\n•Hypoglycaemic agents – increased hypoglycaemia<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: Indications include - Rheumatoid arthritis, psoriatic arthritis and IBD related arthritis Gradual dose titration to avoid gastric intolerance (enteric coated prep may be considered) e.g. 500mg BD for 2 weeks, then 1g twice a day. If gastric intolerance consider 500mg four times a day. If indicated the dose may be increased to 1.5g twice a day. Baseline tests: FBC LFTs U&E Consider serum folate Routine monitoring: FBC, U&Es, LFTs every 2 weeks until on stable dose for 6 weeks; then once on stable dose, monthly for 3 months; thereafter, at least every 12 weeks. More frequent monitoring is appropriate in patients at higher risk of toxicity, or when clinically indicated Dose increases should be monitored by FBC and LFTs at 2 and 6 weeks and then revert to previous schedule Monitoring may be discontinued after 1 year on direct consultant guidance Indications for Stopping Therapy: The patient should be counselled to report immediately with any sore throat, fever, malaise, pallor, purpura, jaundice or unexpected non-specific illness during sulfasalazine treatment (interrupt therapy and perform a blood test). Stop medication and contact local rheumatology service if: White blood cells <3.5x10 9 /L Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range Eosinophilia > 0.5x10 9 /L ALT or AST greater than 100 units/L, or any sudden increases (e.g. double of baseline), OR Unexplained fall in serum albumin to less than 30g/L MCV >105fL Generally not considered a risk factor for infection so remains safe to continue Assessment of response: At 3-6 months Additional information: Contra-indicated in patient with hypersensitivity to sulphonamides or salicylates. Contra-indicated in Porphyria Avoid in hepatic and/or renal impairment and/or pre-existing blood dycrasias unless benefit outweighs risk. Risk of folic acid deficiency Oligospermia and infertility may occur in men treated with sulfasalazine (reversal within 2 to 3 months of stopping). Risk of crystalluria – maintain adequate fluid intake. Important drug reactions : •azathioprine/mercaptopurine – increased bone marrow suppression •digoxin (decreased absorption) •Hypoglycaemic agents – increased hypoglycaemia Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/10722/SPC/Salazopyrin+En-Tabs/"},{"id":"biologics","title":"Biologics overview","group":"Biologics (bDMARDs)","kind":"chapter","html":"<p>The use of bDMARDs is now relatively common in the management of a\nnumber of severe rheumatological conditions. Funding of biologic\ntherapies falls outside of the national tariff. However where use is in\naccordance with NICE guidance local Clinical Commissioning Groups\n(CCG’s) are automatically required to fund treatment. The reader should\nrefer to the National Institute for Health and Care Excellence (NICE)\nwebsite for details of NICE supported biologic treatment\n(http://www.nice.org.uk/.)<\/p>\n<p>In addition to NICE, treatments may be commissioned nationally\nthrough the NHS Commissioning Board. <\/p>\n<p>There are a number of conditions where there is an absence of NICE\nguidance or the patient is unable to fulfil the criteria of NICE or the\nNHS Commission Board. If biologic therapy is indicated, funding may be\nobtained through an individual funding request (IFR) or a locally agreed\ncommissioning statement. The reader should refer to local hospital\nformulary and locally agreed treatment pathways/commissioning statements\nto clarify permitted prescribing practice.<\/p>\n<p>There are currently five licensed Tumour Necrosis Factor (TNF)\ninhibitors in the UK: adalimumab, certolizumab pegol, etanercept,\ngolimumab and infliximab of which 3 currently have available biosimilars\n(refer to Table 1). The reader should refer to individual product\ndatasheets for more detailed prescribing guidance and also the NICE\nwebsite with regards to funding status for use in different clinical\nindications. The attached monographs contain key information with\nregards to baseline and routine monitoring which should be performed\nwith these agents.<\/p>\n\n<h2>Table 1 Current licensed TNF inhibitors (TNFi) available in the UK<\/h2>\n<div class=\"table-wrap\"><table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 15%\" />\n<col style=\"width: 15%\" />\n<col style=\"width: 17%\" />\n<col style=\"width: 17%\" />\n<col style=\"width: 17%\" />\n<col style=\"width: 15%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Adalimumab<\/th>\n<th>Etanercept<\/th>\n<th>Certolizumab pegol<\/th>\n<th>Golimumab<\/th>\n<th>Infliximab<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Mechanism of action<\/strong><\/td>\n<td>Humanised monoclonal antibody<\/td>\n<td>P75 fc fusion protein<\/td>\n<td>Fab fragment<\/td>\n<td>Humanised monoclonal antibody<\/td>\n<td><p>Chimeric human/ murine antibody<\/p>\n<p>Intravenous infusion<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Licensing indication<\/strong><\/td>\n<td><p>RA (moderate and severe)<\/p>\n<p>PsA<\/p>\n<p>AS<\/p>\n<p>nrAxial spondyloarthritis<\/p>\n<p>JIA<\/p><\/td>\n<td><p>RA (moderate and severe)<\/p>\n<p>PsA<\/p>\n<p>AS<\/p>\n<p>nrAxial spondyloarthritis<\/p>\n<p>JIA<\/p><\/td>\n<td><p>RA and no response to other TNF inhibitors and no response to\nother TNF inhibitors<\/p>\n<p>PsA and no response to other TNF inhibitors within 12 weeks<\/p>\n<p>AS<\/p>\n<p>nrAxial spondyloarthritis<\/p><\/td>\n<td><p>RA + MTX only<\/p>\n<p>PsA +/- MTX<\/p>\n<p>AS<\/p><\/td>\n<td><p>RA+MTX only (moderate and severe)<\/p>\n<p>PsA +/- MTX<\/p>\n<p>AS<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>NICE guidelines<\/strong><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a>;\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a>; <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta715\">TA715<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\">TA199<\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\">TA383<\/a><\/p><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a>;\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a>; <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta715\">TA715<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\">TA199<\/a>;<\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\">TA383<\/a><\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\">TA373<\/a><\/p><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a>;\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta415\">TA415<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA445\">TA445<\/a><\/p>\n<p>AS and nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\">TA383<\/a><\/p><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a>;\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta225\">TA225<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA220\">TA220<\/a><\/p>\n<p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta383\">TA383<\/a><\/p>\n<p>nrAS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta497\">TA497<\/a><\/p><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a>;\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a>; <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta715\">TA715<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA199\">TA199<\/a><\/p>\n< A<\/td>\n<td>Monoclonal antibody against soluble and membrane IL-6 receptor<\/td>\n<td>IgG1κ monoclonal antibody that binds to the shared p40 protein\nsubunit of IL-12 and IL-23<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Licensing indication<\/strong><\/td>\n<td><p>Moderate to severe RA following DMARD failure (with MTX)<\/p>\n<p>JIA following failure of DMARD incl ≥1 TNFi<\/p><\/td>\n<td>Add on therapy ≥1 serological biomarker (positive\nanti-double-stranded DNA or low complement) with SELENA‑SLEDAI ≥10<\/td>\n<td>PsA (+/- MTX) – had at least 1 bDMARD or TNF α-i are contraindicated\nbut would otherwise be considered<\/td>\n<td><p>PsA, alone or in combination with MTX, when failed ≥2 DMARDS and\n≥3 swollen + ≥ 3 tender joints OR no response to TNFs within 12 weeks\nOR<\/p>\n<p>TNF CI<\/p><\/td>\n<td><p>RA (with MTX) following DMARD + TNFi failure<\/p>\n<p>ANCA associated vasculitis with glucocorticoids<\/p><\/td>\n<td><p>PsA (+/-MTX)<\/p>\n<p>peripheral arthritis with all the following:<\/p>\n<p>≥3 tender joints + ≥3 or more swollen joints<\/p>\n<p>Moderate to severe psoriasis (body surface area ≥3% affected + PASI\n&gt; 10)<\/p>\n<p>Failed 2cDMARDS and 1 bDMARD<\/p><\/td>\n<td>RA +/-MTX following failure of cDMARD<\/td>\n<td><p>AS in patients who responded inadequately to NSAIDs or TNFi<\/p>\n<p>PsA (+/- MTX) when failed ≥2 cDMARDS + ≥3 swollen + ≥ 3 tender joints\nOR no response to TNFs within 12 weeks OR<\/p>\n<p>TNF CI<\/p><\/td>\n<td><p>RA (+/-MTX) following DMARD failure<\/p>\n<p>JIA (+/- MTX)<\/p>\n<p>GCA (relapsing or refractory disease)<\/p><\/td>\n<td>PsA (+/- MTX) when ≥1 TNFi OR TNFi CI<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>NICE guidelines<\/strong><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a>;\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\">TA373<\/a><\/p><\/td>\n<td>SLE: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA752\">TA752<\/a><\/td>\n<td>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta815\">TA815<\/a><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta537\">TA 537<\/a><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta195\">TA195<\/a><\/p>\n<p>Vasculitis: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta308\">TA308<\/a><\/p><\/td>\n<td>PsA:<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta803\">TA803<\/a><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA485\">TA485<\/a><\/td>\n<td><p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA407\">TA\n407<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA445\">TA445<\/a><\/p><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA375\">TA375<\/a>;\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta247\">TA247<\/a><\/p>\n<p>JIA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta373\">TA373<\/a><\/p>\n<p>GCA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta518\">TA518<\/a><\/p><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta340\">TA340<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Table 3: targeted synthetic DMARDS<\/h2>\n<div class=\"table-wrap\"><table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 15%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Drug<\/strong><\/th>\n<th><strong>Apremilast<\/strong><\/th>\n<th><strong>Baricitinib<\/strong><\/th>\n<th><strong>Tofacitinib<\/strong><\/th>\n<th><strong>Upadacitinib<\/strong><\/th>\n<th><strong>Filgotinib<\/strong><\/th>\n<th><strong>Avacopan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Mechanism of action<\/strong><\/td>\n<td>PDE-4 inhibitor<\/td>\n<td>Reversible JAK 1 and JAK 2 inhibitor<\/td>\n<td>JAK inhibitor 1 and 3<\/td>\n<td>Selective JAK1 inhibitor<\/td>\n<td>Selective JAK1 inhibitor<\/td>\n<td>Complement 5a receptor (C5aR) antagonist<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Licensing indication<\/strong><\/td>\n<td>PsA<\/td>\n<td>RA (moderate – severe)<\/td>\n<td><p>RA (moderate -severe)<\/p>\n<p>PsA if TNFi CI or failed after 12 weeks<\/p>\n<p>AS: TNF not suitable/failed<\/p><\/td>\n<td><p>RA (moderate -severe)<\/p>\n<p>PsA: ≥3 swollen and ≥3 tenderjoints and failed 2cDMARDs and 1\nbDMARD<\/p>\n<p>AS: TNF not suitable/failed<\/p><\/td>\n<td>RA (moderate – severe)<\/td>\n<td>Avacopan with a cyclophosphamide or rituximab regimen<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>NICE guidelines<\/strong><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta433\">TA433<\/a><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta466\">TA466<\/a><\/td>\n<td><p>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta480\">TA480<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA543\">TA543<\/a><\/p>\n<p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta920\">TA920<\/a><\/p><\/td>\n<td><p>RA <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta665\">TA665<\/a>; <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta744\">TA744<\/a><\/p>\n<p>PsA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta768\">TA768<\/a><\/p>\n<p>AS: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta829\">TA829<\/a><\/p><\/td>\n<td>RA: <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/TA676\">TA676<\/a><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nice.org.uk/guidance/ta825\">TA825<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Treatment with TNF inhibitors (safety issues)<\/h2>\n<p>Treatment for patients with active RA, PsA or AS where NICE approval\nexists.<\/p>\n<p>For RA:<\/p>\n<ul>\n<li><p>Disease is severe, that is, a disease activity score (DAS28)\ngreater than 5.1<\/p><\/li>\n<li><p>Disease has not responded to intensive therapy with a combination\nof csDMARDs<\/p><\/li>\n<\/ul>\n<p>For PsA:<\/p>\n<ul>\n<li><p>The person has peripheral arthritis with 3 or more tender joints\nand 3 or more swollen joints<\/p><\/li>\n<li><p>The PsA has not responded to adequate trials of at least 2\ncsDMARDs, administered either individually or in combination.<\/p><\/li>\n<\/ul>\n<p>In AS:<\/p>\n<ul>\n<li><p>Patients who have responded inadequately to, or who cannot\ntolerate, nonsteroidal anti-inflammatory drugs<\/p><\/li>\n<\/ul>\n<p><strong>To continue with biologics<\/strong><\/p>\n<p>For RA:<\/p>\n<ul>\n<li><p>At 6 months if there is a moderate response measured using EULAR\ncriteria<\/p><\/li>\n<\/ul>\n<p>For PsA:<\/p>\n<ul>\n<li><p>At 12 weeks (for certolizumab pegol also 16 weeks): an\nimprovement in at least 2 of the 4 PsARC criteria (1 of which has to be\njoint tenderness or swelling score), with no worsening in any of the 4\ncriteria<\/p><\/li>\n<\/ul>\n<p>For AS:<\/p>\n<ul>\n<li><p>At 12 weeks: a reduction in the BASDAI score to 50% of\npre-treatment value or ≥2 units and<\/p><\/li>\n<li><p>A reduction in the spinal pain VAS score by ≥2 cm<\/p><\/li>\n<\/ul>\n<p>1) General contraindications (discuss with relevant specialist)<\/p>\n<p>Active infection<\/p>\n<p>Open leg ulcers<\/p>\n<p>Previously infected prosthetic joint (unless completely removed)<\/p>\n<p>Septic arthritis in last year<\/p>\n<p>HIV or Hepatitis B carriers (usually)<\/p>\n<p>Previous malignancy within 5 years (usually)<\/p>\n<p>NYHA Grade 3 or more heart failure<\/p>\n<p>Any history of demyelinating disease<\/p>\n<p>2) Relative contraindications<\/p>\n<p>Uncontrolled diabetes<\/p>\n<p>Pulmonary fibrosis<\/p>\n<p>Bronchiectasis (assess severity)<\/p>\n<p>PUVA therapy of &gt;1000 Joules<\/p>\n<p>Hepatitis C (absolute if RNA +ve)<\/p>\n<p>NYHA heart failure grade 1 or 2<\/p>\n<blockquote>\n<p>History of TB or positive PPD test (consider using rituxmab or<\/p>\n<\/blockquote>\n<p>isoniazid and pyridoxine one month before starting and for further 6\nmonths)<\/p>\n<p>3) Potential Problems<\/p>\n<p>Atypical or unusual infections<\/p>\n<p>Neutropenia / aplasia<\/p>\n<p>Pneumonitis / lung fibrosis<\/p>\n<p>Infusion / injection site reactions<\/p>\n<blockquote>\n<p>ANA or DNA positivity (especially infliximab), although not usually\nassociated with a clinical problem<\/p>\n<\/blockquote>\n<p>Induction of autoimmunity<\/p>\n<p><strong>AVOID Live Vaccines (SEE VACCINES SECTION)<\/strong><\/p>","text":"The use of bDMARDs is now relatively common in the management of a number of severe rheumatological conditions. Funding of biologic therapies falls outside of the national tariff. However where use is in accordance with NICE guidance local Clinical Commissioning Groups (CCG’s) are automatically required to fund treatment. The reader should refer to the National Institute for Health and Care Excellence (NICE) website for details of NICE supported biologic treatment (http://www.nice.org.uk/.) In addition to NICE, treatments may be commissioned nationally through the NHS Commissioning Board. There are a number of conditions where there is an absence of NICE guidance or the patient is unable to fulfil the criteria of NICE or the NHS Commission Board. If biologic therapy is indicated, funding may be obtained through an individual funding request (IFR) or a locally agreed commissioning statement. The reader should refer to local hospital formulary and locally agreed treatment pathways/commissioning statements to clarify permitted prescribing practice. There are currently five licensed Tumour Necrosis Factor (TNF) inhibitors in the UK: adalimumab, certolizumab pegol, etanercept, golimumab and infliximab of which 3 currently have available biosimilars (refer to Table 1). The reader should refer to individual product datasheets for more detailed prescribing guidance and also the NICE website with regards to funding status for use in different clinical indications. The attached monographs contain key information with regards to baseline and routine monitoring which should be performed with these agents. Table 1 Current licensed TNF inhibitors (TNFi) available in the UK Adalimumab Etanercept Certolizumab pegol Golimumab Infliximab Mechanism of action Humanised monoclonal antibody P75 fc fusion protein Fab fragment Humanised monoclonal antibody Chimeric human/ murine antibody Intravenous infusion Licensing indication RA (moderate and severe) PsA AS nrAxial spondyloarthritis JIA RA (moderate and severe) PsA AS nrAxial spondyloarthritis JIA RA and no response to other TNF inhibitors and no response to other TNF inhibitors PsA and no response to other TNF inhibitors within 12 weeks AS nrAxial spondyloarthritis RA + MTX only PsA +/- MTX AS RA+MTX only (moderate and severe) PsA +/- MTX AS NICE guidelines RA: TA375 ; TA195 ; TA715 PsA: TA199 AS and nrAS: TA383 RA: TA375 ; TA195 ; TA715 PsA: TA199 ; AS and nrAS: TA383 JIA: TA373 RA: TA375 ; TA415 PsA: TA445 AS and nrAS: TA383 RA: TA375 ; TA225 PsA: TA220 AS: TA383 nrAS: TA497 RA: TA375 ; TA195 ; TA715 PsA: TA199 AS: TA383 Table 2 Non-TNF biologic medicines Drug Abatacept (Orencia®) Belimumab (Benlysta®) Guselkumab(®Tremfya) Ixekizumab Taltz®) Rituximab Risankizumab(Skyrizi®) Sarilumab (Kevzara®) Secukinumab (Cosentyx®) Tocilizumab (RoActemra®) Ustekinumab (Stelara®) Mechanism of action Fusion protein – blocks T cell activation human, IgG1λ monoclonal antibody - blocks action of BLyS Humanized IgG1 to IL-23 IgG4 monoclonal antibody that binds 17A (both IL-17A and IL-17A/F) Monoclonal antibody – CD20 B cell depletion Humanized IgG1 to IL-23 IgG1 subtype that specifically binds to both soluble and membrane-bound IL-6 receptors (IL-6Rα) IgG1/κ monoclonal antibody that selectively binds to and neutralises IL-17A Monoclonal antibody against soluble and membrane IL-6 receptor IgG1κ monoclonal antibody that binds to the shared p40 protein subunit of IL-12 and IL-23 Licensing indication Moderate to severe RA following DMARD failure (with MTX) JIA following failure of DMARD incl ≥1 TNFi Add on therapy ≥1 serological biomarker (positive anti-double-stranded DNA or low complement) with SELENA‑SLEDAI ≥10 PsA (+/- MTX) – had at least 1 bDMARD or TNF α-i are contraindicated but would otherwise be considered PsA, alone or in combination with MTX, when failed ≥2 DMARDS and ≥3 swollen + ≥ 3 tender joints OR no response to TNFs within 12 weeks OR TNF CI RA (with MTX) following DMARD + TNFi failure ANCA associated vasculitis with glucocorticoids PsA (+/-MTX) peripheral arthritis with all the following: ≥3 tender joints + ≥3 or more swollen joints Moderate to severe psoriasis (body surface area ≥3% affected + PASI > 10) Failed 2cDMARDS and 1 bDMARD RA +/-MTX following failure of cDMARD AS in patients who responded inadequately to NSAIDs or TNFi PsA (+/- MTX) when failed ≥2 cDMARDS + ≥3 swollen + ≥ 3 tender joints OR no response to TNFs within 12 weeks OR TNF CI RA (+/-MTX) following DMARD failure JIA (+/- MTX) GCA (relapsing or refractory disease) PsA (+/- MTX) when ≥1 TNFi OR TNFi CI NICE guidelines RA: TA375 ; TA195 JIA: TA373 SLE: TA752 PsA: TA815 TA 537 RA: TA195 Vasculitis: TA308 PsA: TA803 TA485 AS: TA 407 PsA: TA445 RA: TA375 ; TA247 JIA: TA373 GCA: TA518 TA340 Table 3: targeted synthetic DMARDS Drug Apremilast Baricitinib Tofacitinib Upadacitinib Filgotinib Avacopan Mechanism of action PDE-4 inhibitor Reversible JAK 1 and JAK 2 inhibitor JAK inhibitor 1 and 3 Selective JAK1 inhibitor Selective JAK1 inhibitor Complement 5a receptor (C5aR) antagonist Licensing indication PsA RA (moderate – severe) RA (moderate -severe) PsA if TNFi CI or failed after 12 weeks AS: TNF not suitable/failed RA (moderate -severe) PsA: ≥3 swollen and ≥3 tenderjoints and failed 2cDMARDs and 1 bDMARD AS: TNF not suitable/failed RA (moderate – severe) Avacopan with a cyclophosphamide or rituximab regimen NICE guidelines TA433 TA466 RA: TA480 PsA: TA543 AS: TA920 RA TA665 ; TA744 PsA: TA768 AS: TA829 RA: TA676 TA825 Treatment with TNF inhibitors (safety issues) Treatment for patients with active RA, PsA or AS where NICE approval exists. For RA: Disease is severe, that is, a disease activity score (DAS28) greater than 5.1 Disease has not responded to intensive therapy with a combination of csDMARDs For PsA: The person has peripheral arthritis with 3 or more tender joints and 3 or more swollen joints The PsA has not responded to adequate trials of at least 2 csDMARDs, administered either individually or in combination. In AS: Patients who have responded inadequately to, or who cannot tolerate, nonsteroidal anti-inflammatory drugs To continue with biologics For RA: At 6 months if there is a moderate response measured using EULAR criteria For PsA: At 12 weeks (for certolizumab pegol also 16 weeks): an improvement in at least 2 of the 4 PsARC criteria (1 of which has to be joint tenderness or swelling score), with no worsening in any of the 4 criteria For AS: At 12 weeks: a reduction in the BASDAI score to 50% of pre-treatment value or ≥2 units and A reduction in the spinal pain VAS score by ≥2 cm 1) General contraindications (discuss with relevant specialist) Active infection Open leg ulcers Previously infected prosthetic joint (unless

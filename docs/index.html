<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dee-Mard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@500;600&display=swap">
<style>
/* Layout: mobile-first app with a floating tab bar; at >=900px a website
   header with inline nav and search replaces the bar. */
:root {
  --ground: #EEF1F5;
  --paper: #FFFFFF;
  --tint: #E4E9F2;
  --tint-2: #F5F7FA;
  --ink: #1B2335;
  --ink-2: #4A556B;
  --muted: #66718A;
  --faint: #8591A8;
  --line: #DDE2EA;
  --blue: #3B5A9A;
  --blue-deep: #3558A8;
  --slate: #4E6392;
  --grey-blue: #6B778A;
  --red: #D12A3A;
  --red-deep: #A81F2D;
  --red-tint: #FCE7EA;
  --amber: #8A5A00;
  --amber-tint: #FFF3DE;
  --green: #1A7A3E;
  --green-tint: #E6F4EA;
  --grad: linear-gradient(135deg, var(--blue-deep) 0%, var(--slate) 55%, var(--grey-blue) 100%);
  --radius: 18px;
  --radius-s: 12px;
  --shadow: 0 8px 24px rgba(27, 35, 53, .10);
  --h-blue-ink: #2F4F96; --h-blue-bg: #E4EBF8;
  --h-red-ink: #B8242F; --h-red-bg: #FBE5E7;
  --h-violet-ink: #5B3FA3; --h-violet-bg: #ECE6F8;
  --h-amber-ink: #8A5A00; --h-amber-bg: #FBEFD6;
  --h-teal-ink: #0F6B6B; --h-teal-bg: #DAF1EE;
  --h-green-ink: #1E7A45; --h-green-bg: #E0F3E6;
  --h-rose-ink: #B0306E; --h-rose-bg: #FBE3EE;
  --h-grey-ink: #4A556B; --h-grey-bg: #EFF2F6;
  --font: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F141C; --paper: #171E2A; --tint: #1F2A3C; --tint-2: #1B2431; --ink: #E7ECF4; --ink-2: #C3CCDB;
    --muted: #98A4B8; --faint: #7B879C; --line: #2A3447; --blue: #8FAAE6; --blue-deep: #2F4F96; --slate: #3E4F75; --grey-blue: #4F5A6C;
    --red: #F0616E; --red-deep: #FF8A93; --red-tint: #3A1A1F; --amber: #F2C777; --amber-tint: #33270C; --green: #7FD49C; --green-tint: #12301D;
    --shadow: 0 8px 24px rgba(0, 0, 0, .4);
    --h-blue-ink: #9DB4EE; --h-blue-bg: #1E2B48; --h-red-ink: #F27B86; --h-red-bg: #3C1D22; --h-violet-ink: #B9A3F0; --h-violet-bg: #2A2247; --h-amber-ink: #F0C572; --h-amber-bg: #3A2B0E;
    --h-teal-ink: #6FD0CB; --h-teal-bg: #0F3331; --h-green-ink: #7FD49C; --h-green-bg: #143322; --h-rose-ink: #F09BC6; --h-rose-bg: #3B1A2C; --h-grey-ink: #C3CCDB; --h-grey-bg: #1F2A3C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0F141C; --paper: #171E2A; --tint: #1F2A3C; --tint-2: #1B2431; --ink: #E7ECF4; --ink-2: #C3CCDB;
  --muted: #98A4B8; --faint: #7B879C; --line: #2A3447; --blue: #8FAAE6; --blue-deep: #2F4F96; --slate: #3E4F75; --grey-blue: #4F5A6C;
  --red: #F0616E; --red-deep: #FF8A93; --red-tint: #3A1A1F; --amber: #F2C777; --amber-tint: #33270C; --green: #7FD49C; --green-tint: #12301D;
  --shadow: 0 8px 24px rgba(0, 0, 0, .4);
  --h-blue-ink: #9DB4EE; --h-blue-bg: #1E2B48; --h-red-ink: #F27B86; --h-red-bg: #3C1D22; --h-violet-ink: #B9A3F0; --h-violet-bg: #2A2247; --h-amber-ink: #F0C572; --h-amber-bg: #3A2B0E;
  --h-teal-ink: #6FD0CB; --h-teal-bg: #0F3331; --h-green-ink: #7FD49C; --h-green-bg: #143322; --h-rose-ink: #F09BC6; --h-rose-bg: #3B1A2C; --h-grey-ink: #C3CCDB; --h-grey-bg: #1F2A3C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; min-height: 100%; background: var(--ground); color: var(--ink); font: 16px/1.5 var(--font); font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; height: auto; }
h1, h2, h3 { margin: 0; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
button { font: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 8px; top: 8px; z-index: 40; background: var(--paper); padding: 8px; border-radius: 8px; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.lab { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.mono { font-family: var(--mono); font-weight: 600; font-size: .92em; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Header (website) ---------- */
.site { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.site-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 20px; height: 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); flex: none; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--red); display: flex; align-items: center; justify-content: center; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text strong { font-size: 1.05rem; }
.brand-text small { font-size: .72rem; color: var(--muted); }
.site-nav { display: none; gap: 22px; }
.site-nav a { color: var(--ink-2); font-weight: 600; font-size: .95rem; padding: 6px 2px; }
.site-nav a:hover { color: var(--ink); text-decoration: none; }
.site-nav a.active { color: var(--blue); box-shadow: inset 0 -2px 0 var(--blue); }
.site-search { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 1; max-width: 360px; height: 42px; padding: 0 14px; background: var(--ground); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
.site-search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: .95rem; color: var(--ink); }
.site-search input:focus { outline: none; }
.proto { background: var(--red-tint); color: var(--red-deep); font-size: .8rem; font-weight: 600; padding: 6px 16px; text-align: center; }
@media (max-width: 899px) {
  .site-search { display: none; }
  .brand-text small { display: none; }
}
@media (min-width: 900px) {
  .site-nav { display: flex; }
}

/* ---------- Main and tab bar ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
main:focus { outline: none; }
.tabbar { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 66px; z-index: 25; display: flex; align-items: center; padding: 0 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); font-size: .68rem; font-weight: 600; text-decoration: none; min-height: 44px; justify-content: center; }
.tabbar a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a.active { color: var(--blue); }
.tabbar a.tab-centre { flex: none; width: 54px; height: 54px; margin: 0 6px; border-radius: 17px; background: var(--red); color: #fff; box-shadow: 0 6px 16px rgba(209, 42, 58, .35); }
.tabbar a.tab-centre.active { background: var(--red-deep); color: #fff; }
.tabbar a.tab-centre svg { width: 24px; height: 24px; }
@media (min-width: 900px) {
  .tabbar { display: none; }
  main { padding-top: 32px; padding-bottom: 64px; }
}

/* ---------- Shared components ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.grad { background: var(--grad); color: #fff; border-radius: 22px; padding: 20px; }
.grad a { color: #fff; }
.grad .lab { color: #C9D4E6; }
.grad .sub { color: #DFE6F1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 600; font-size: .95rem; cursor: pointer; text-decoration: none; }
.btn:hover { text-decoration: none; border-color: var(--blue); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.ghost { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3); color: #fff; }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: .85rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: .74rem; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
.pill.blue { background: var(--tint); color: var(--blue); }
.pill.red { background: var(--red-tint); color: var(--red-deep); }
.pill.grey { background: var(--tint-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.amber { background: var(--amber-tint); color: var(--amber); }
.pill.green { background: var(--green-tint); color: var(--green); }
.pill.white { background: rgba(255,255,255,.18); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); font-size: .85rem; font-weight: 600; white-space: nowrap; text-decoration: none; }
.chip:hover { text-decoration: none; border-color: var(--blue); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.notice { border-radius: var(--radius-s); padding: 10px 14px; font-size: .9rem; display: flex; gap: 10px; align-items: flex-start; }
.notice.amber { background: var(--amber-tint); color: var(--amber); }
.notice.blue { background: var(--tint); color: var(--blue); }
.notice.red { background: var(--red-tint); color: var(--red-deep); }
.notice.grey { background: var(--tint-2); color: var(--ink-2); border: 1px solid var(--line); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.cs { background: var(--blue); }
.dot.bio { background: var(--red); }
.dot.ts { background: var(--grey-blue); }
.dot.gap { background: var(--faint); }

/* List group */
.list { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list a, .list .li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; color: var(--ink); text-decoration: none; min-height: 52px; }
.list a:hover { background: var(--tint-2); text-decoration: none; }
.list .grow { flex: 1; min-width: 0; }
.list small { display: block; font-size: .8rem; color: var(--muted); }
.list .chev { color: var(--faint); font-size: 1.3rem; line-height: 1; }
.list .letter { padding: 6px 16px 4px; font-size: .75rem; font-weight: 700; color: var(--muted); background: var(--ground); }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); text-decoration: none; min-width: 0; }
.tile:hover { text-decoration: none; border-color: var(--blue); }
/* Icon badges: one hue per category; glyphs are stroked with a soft two-tone fill */
.ic { --hue-ink: var(--h-grey-ink); --hue-bg: var(--h-grey-bg); flex: none; width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: var(--hue-ink);
  background: linear-gradient(150deg, var(--hue-bg), color-mix(in srgb, var(--hue-bg) 78%, var(--hue-ink)));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hue-ink) 22%, transparent), inset 0 -2px 0 color-mix(in srgb, var(--hue-ink) 16%, transparent); }
.ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic svg .f { fill: currentColor; opacity: .22; stroke: none; }
.ic.blue { --hue-ink: var(--h-blue-ink); --hue-bg: var(--h-blue-bg); }
.ic.red { --hue-ink: var(--h-red-ink); --hue-bg: var(--h-red-bg); }
.ic.violet { --hue-ink: var(--h-violet-ink); --hue-bg: var(--h-violet-bg); }
.ic.amber { --hue-ink: var(--h-amber-ink); --hue-bg: var(--h-amber-bg); }
.ic.teal { --hue-ink: var(--h-teal-ink); --hue-bg: var(--h-teal-bg); }
.ic.green { --hue-ink: var(--h-green-ink); --hue-bg: var(--h-green-bg); }
.ic.rose { --hue-ink: var(--h-rose-ink); --hue-bg: var(--h-rose-bg); }
.tile strong { font-size: .98rem; }
.tile small { font-size: .8rem; color: var(--muted); line-height: 1.35; }
/* Browse panel: one card with a grid of category badges */
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px 2px; padding: 10px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
.cat { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 4px 8px; border-radius: 14px; color: var(--ink); font-size: .74rem; font-weight: 600; line-height: 1.2; text-align: center; text-decoration: none; }
.cat:hover { text-decoration: none; background: var(--tint-2); }
.cat .ic { width: 52px; height: 52px; border-radius: 17px; transition: transform .15s; transform: rotate(-3deg); }
.cat:nth-child(even) .ic { transform: rotate(3deg); }
.cat:hover .ic { transform: rotate(0) translateY(-2px); }
.cat .ic svg { width: 24px; height: 24px; }
@media (min-width: 900px) {
  .cats { grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 12px 8px; }
}
.drugcard { min-width: 150px; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); text-decoration: none; }
.drugcard:hover { text-decoration: none; border-color: var(--blue); }
.drugcard small { font-size: .78rem; color: var(--muted); }

/* ---------- Home ---------- */
.home-grid { display: flex; flex-direction: column; gap: 24px; }
.searchbar { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; color: var(--muted); text-decoration: none; }
.searchbar:hover { text-decoration: none; border-color: var(--blue); }
.searchbar svg { flex: none; }
.feature { display: flex; gap: 14px; align-items: center; }
.feature .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.feature .body h2 { font-size: 1.05rem; }
.feature .body p { font-size: .85rem; }
.feature svg { flex: none; }
@media (min-width: 900px) {
  .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
  .searchbar { display: none; }
  .hscroll { overflow: visible; flex-wrap: wrap; margin: 0; padding: 0; }
  .hscroll .cat { flex: none; }
  .hscroll .drugcard { flex: 0 1 calc((100% - 30px) / 4); }
  .hscroll .tile { flex: 1 1 0; }
  .grad.hero { padding: 36px 40px; }
  .grad.hero h1 { font-size: 2.3rem; max-width: 18ch; }
}

/* ---------- Drug list ---------- */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; }
.seg a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 999px; font-size: .82rem; font-weight: 600; color: var(--ink-2); text-decoration: none; min-height: 36px; }
.seg a.on { background: var(--ink); color: var(--paper); }
@media (min-width: 900px) { .seg { max-width: 520px; } }

/* ---------- Monograph ---------- */
.mono-head { background: var(--grad); color: #fff; border-radius: 22px 22px 0 0; padding: 20px 20px 36px; display: flex; flex-direction: column; gap: 12px; margin: 0 -4px; }
.mono-head .crumbs { font-size: .8rem; color: #DFE6F1; }
.mono-head .crumbs a { color: #fff; }
.mono-head h1 { font-size: 2rem; }
.mono-sheet { background: var(--paper); border-radius: 24px; margin: -24px 0 0; border: 1px solid var(--line); overflow: hidden; }
.sec { border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.sec > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; font-weight: 600; font-size: 1rem; min-height: 52px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary .hint { font-size: .78rem; color: var(--faint); font-weight: 500; text-align: right; }
.sec > summary svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--faint); stroke-width: 2; stroke-linecap: round; transition: transform .15s; }
.sec[open] > summary svg { transform: rotate(180deg); }
.sec[open] > summary { background: var(--tint-2); }
.sec.danger > summary { color: var(--red-deep); }
.sec.danger { border-top: 2px solid var(--red); }
.sec .body { padding: 6px 20px 18px; font-size: .97rem; }
.sec .body p { margin: .35rem 0; }
.sec .body ul { margin: .35rem 0; padding-left: 1.2rem; }
/* Guideline text laid out as points (js/format.js) */
.sec .body ul.pts { list-style: none; padding: 0; margin: .4rem 0 .6rem; }
.sec .body ul.pts li { position: relative; padding: 7px 0 7px 20px; line-height: 1.45; }
.sec .body ul.pts li + li { border-top: 1px solid var(--line); }
.sec .body ul.pts li::before { content: ""; position: absolute; left: 4px; top: 15px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.sec.danger .body ul.pts li::before { background: var(--red); }
.sec .body .subhead { margin: .9rem 0 .2rem; font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.sec .body .subhead:first-child { margin-top: .3rem; }
.sec .body .note-b { margin: .6rem 0; padding: 10px 14px; border-radius: var(--radius-s); background: var(--tint); color: var(--ink); font-weight: 600; }
.sec.danger .body .note-b { background: var(--red-tint); color: var(--red-deep); }
.thr { font-family: var(--mono); font-weight: 600; font-size: .9em; padding: 0 4px; border-radius: 5px; background: var(--tint); color: var(--blue); white-space: nowrap; }
.sec.danger .thr { background: var(--red-tint); color: var(--red-deep); }
.sec .body .kv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.sec .body .kv .k { padding: 10px 0 2px; }
.sec .body .kv .k .lab { display: block; margin-bottom: 2px; }
.sec .body table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.sec .body th, .sec .body td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
.table-wrap { overflow-x: auto; margin: 10px 0; }

.table-wrap th, .table-wrap td { overflow-wrap: normal; word-break: normal; }
.src { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px dotted var(--line); font-size: .92rem; }
.src:last-child { border-bottom: 0; }
.src .pill { margin-top: 2px; }
.mono-aside { display: none; }
.monitor3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.monitor3 > div { background: var(--tint-2); border-radius: 12px; padding: 10px 12px; }
.monitor3 b { display: block; font-size: .95rem; }

@media (min-width: 900px) {

/* ---------- Guideline chapter pages ---------- */

/* ---------- Calculators ---------- */
.form { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end; }

.field input, .field select { min-height: 46px; padding: 0 12px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 1rem; font-weight: 500; width: 100%; min-width: 0; }
.field select, .field input[type="date"] { font-family: var(--font); font-weight: 600; }
.field.wide { grid-column: 1 / -1; }

.verdict.ok { background: var(--green); }

.big { font-size: 1.5rem; font-weight: 700; }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.kpi { background: var(--tint-2); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 12px; }

.status.caution { background: var(--amber-tint); color: var(--amber); }

.status.info { background: var(--tint); color: var(--blue); }
@media (min-width: 900px) {
  .form { grid-template-columns: repeat(3, minmax(0, 1fr)); }

<script>window.__DMARD_DATA__ = {"guideline":{"source":{"title":"YORKSHIRE RHEUMATOLOGY REGIONAL GUIDELINES FOR THE MONITORING OF ADULT PATIENTS ON CONVENTIONAL DISEASE MODIFYING DRUGS, BIOLOGIC DRUGS AND TARGETED SYNTHETIC DRUGS","edition":"8th Edition","revised":"Revised March 2024","file":"YORKSHIRE DMARD GUIDELINES 2023 v3.docx"},"pages":[{"id":"introduction","title":"Introduction","group":"About","kind":"chapter","html":"<p>The above group of Rheumatologists have, after extensive discussion\nwith reference to the published literature, agreed upon these\nguidelines. There has been recent BSR safety guidance (<a target=\"_blank\" rel=\"noopener\" href=\"https://academic.oup.com/rheumatology/article/56/6/865/3053478\">2017,<\/a>\n<a target=\"_blank\" rel=\"noopener\" href=\"https://academic.oup.com/rheumatology/article/58/2/e3/5076446#google_vignette\">2019<\/a>\nand <a target=\"_blank\" rel=\"noopener\" href=\"https://academic.oup.com/rheumatology/article/62/4/e48/6783012\">2023<\/a>)\non the use of biologics, which has been incorporated. These Yorkshire\nGuidelines are felt to represent, a safe level of clinical care for\npatients requiring Disease Modifying Anti-Rheumatic Drugs (DMARDs)\ntreatment, while keeping monitoring time and expenditure to an\nacceptable level. Initial assessment of patients and the decision to\nstart treatment will continue to be carefully made by Consultants and\nGPs where appropriate. For each drug a single reference sheet outlining\nrecommended drug monitoring tests, which should be done in order to\nminimise the risk of toxicity, is enclosed. These have been standardised\nwhere possible to allow consistency and reduce errors. A link is\nprovided to the electronic compendium of datasheets to allow the\nprescriber to access additional detailed information on\ncontra-indications, side effects and drug interactions for both\nsynthetic and biologic DMARDs (http://www.medicines.org.uk/emc/).<\/p>\n<p>Under most circumstances, conventional standard (cs) DMARD drug\nmonitoring and prescribing is best undertaken in General Practice after\ninitiation and on stable therapy. This is requested by patients and is\nfelt to improve compliance. Monitoring should be in agreement with\nlocally agreed Shared Care Guidance. Where patients have severe disease\nand more toxic drug regimens, hospital monitoring in the initial stages\nwill usually be preferred. Where possible a hospital based rheumatology\nspecialist nurse will be available for advice for patients or medical\nstaff regarding problems with the use of these drugs. Consultant\nRheumatologists are also contactable by telephoneor email for advice\nwhen needed.<\/p>\n<p>We would like to acknowledge Tina Hawkins, specialist pharmacist, who\ninitiated the first draft. We also acknowledge Dr Gui Tran, Helen\nBickerdike, Dr Arora Palak, Dr Naw-Ra and Dr Sarah Twigg who have\nrevised and helped produced these Guidelines. We would also like to\nacknowledge Dr Andrew Gough, retired consultant rheumatologist, without\nwhom these guidelines would never have been produced.<\/p>\n<p>These guidelines have now been revised 8 times and will continue to\nrequire modification. They are dated and will be reviewed in 2028.\nSuggestions for additions or alterations may be forwarded to:<\/p>\n<p>Dr Gui Tran, Consultant Rheumatologist, Harrogate District Hospital,\nLancaster Park Road, Harrogate HG2 7SX. gui.tran@nhs.net <\/p>","text":"The above group of Rheumatologists have, after extensive discussion with reference to the published literature, agreed upon these guidelines. There has been recent BSR safety guidance ( 2017, 2019 and 2023 ) on the use of biologics, which has been incorporated. These Yorkshire Guidelines are felt to represent, a safe level of clinical care for patients requiring Disease Modifying Anti-Rheumatic Drugs (DMARDs) treatment, while keeping monitoring time and expenditure to an acceptable level. Initial assessment of patients and the decision to start treatment will continue to be carefully made by Consultants and GPs where appropriate. For each drug a single reference sheet outlining recommended drug monitoring tests, which should be done in order to minimise the risk of toxicity, is enclosed. These have been standardised where possible to allow consistency and reduce errors. A link is provided to the electronic compendium of datasheets to allow the prescriber to access additional detailed information on contra-indications, side effects and drug interactions for both synthetic and biologic DMARDs (http://www.medicines.org.uk/emc/). Under most circumstances, conventional standard (cs) DMARD drug monitoring and prescribing is best undertaken in General Practice after initiation and on stable therapy. This is requested by patients and is felt to improve compliance. Monitoring should be in agreement with locally agreed Shared Care Guidance. Where patients have severe disease and more toxic drug regimens, hospital monitoring in the initial stages will usually be preferred. Where possible a hospital based rheumatology specialist nurse will be available for advice for patients or medical staff regarding problems with the use of these drugs. Consultant Rheumatologists are also contactable by telephoneor email for advice when needed. We would like to acknowledge Tina Hawkins, specialist pharmacist, who initiated the first draft. We also acknowledge Dr Gui Tran, Helen Bickerdike, Dr Arora Palak, Dr Naw-Ra and Dr Sarah Twigg who have revised and helped produced these Guidelines. We would also like to acknowledge Dr Andrew Gough, retired consultant rheumatologist, without whom these guidelines would never have been produced. These guidelines have now been revised 8 times and will continue to require modification. They are dated and will be reviewed in 2028. Suggestions for additions or alterations may be forwarded to: Dr Gui Tran, Consultant Rheumatologist, Harrogate District Hospital, Lancaster Park Road, Harrogate HG2 7SX. gui.tran@nhs.net"},{"id":"abbreviations","title":"Abbreviations","group":"About","kind":"chapter","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>ALC<\/th>\n<th>Absolute Lymphocyte Count<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ANC<\/td>\n<td>Absolute Neutrophil Count<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>bDMARD<\/td>\n<td>Biologic DMARD<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C/I<\/td>\n<td>Contraindications<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CrCl<\/td>\n<td>Creatinine clearance<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>csDMARD<\/td>\n<td>Conventional synthetic DMARD<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nr<\/td>\n<td>Non radiographic<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SPC<\/td>\n<td>Summary Product Characteristics<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>tsDMARD<\/td>\n<td>Targeted synthetic DMARD<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ULN<\/td>\n<td>Upper Limit of Normal<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"ALC Absolute Lymphocyte Count ANC Absolute Neutrophil Count bDMARD Biologic DMARD C/I Contraindications CrCl Creatinine clearance csDMARD Conventional synthetic DMARD Nr Non radiographic SPC Summary Product Characteristics tsDMARD Targeted synthetic DMARD ULN Upper Limit of Normal"},{"id":"corticosteroids","title":"Corticosteroids","group":"Topics","kind":"chapter","html":"<p>Corticosteroids are commonly used in the management of a number of\nrheumatological conditions. Despite their known benefits, prolonged\ntreatment can be associated with a number of detrimental side effects.\nEULAR guidance recommends that the adverse effects of glucocorticoid\ntherapy should be considered and discussed with the patient before\nglucocorticoid therapy is started (Duru et al. 2013). Risk factors for\nadverse events include hypertension, diabetes, peptic ulcer, recent\nfracture, presence of cataract or glaucoma, presence of chronic\ninfections, dyslipidaemia and co-medication with NSAIDs. For prolonged\ntreatment, the dosage should be kept to a minimum and dose tapering\nattempted in cases of remission or low disease activity. Continued\nprescribing should be reviewed at regular intervals. The patient should\nbe advised to take the tablets in the morning with or after food.\nAlternate day dosing, especially with long half-life NSAIDs, may be\ndeemed appropriate to try and reduce side effects.<\/p>\n<p><strong>Immunosuppression:<\/strong> Prolonged courses of\ncorticosteroids can increase the susceptibility to infection. Immune\nstatus with regards to chickenpox can be checked when indicated. Those\npatients who are not immune should avoid close contact with people who\nhave chickenpox or shingles. If exposed the patient should be advised to\ncontact their Doctor promptly for advice.<\/p>\n<p><strong>Adrenal suppression<\/strong> can occur if corticosteroids are\ngiven for longer than 3 weeks or the patient has received several repeat\ncourses. Under these circumstances the dose of the corticosteroid should\nbe gradually tapered. The speed and magnitude of reduction should be\ntailored according the patient’s disease status and additional\nco-morbidities. All patients receiving prolonged treatment with\ncorticosteroids should be issued with a “BLUE STEROID CARD”, which can\nbe obtained from both hospital and community pharmacies. The card should\nstate the date treatment was commenced, the initial dosage, subsequent\nreductions and maintenance doses. Patients should be advised to carry\nthe card with them and present it to Healthcare professionals in the\ncase of illness. Where surgery is indicated, and the patient has been\nreceiving treatment with glucocorticoids for over 1 month, it may be\nnecessary to increase the glucocorticoid dose. The need for routine\nmonitoring should be considered according to the dose, duration of\ntreatment and the presence of pre-existing risk factors such as obesity,\ndiabetes and cardiovascular disease.<\/p>\n<p><strong>Live vaccination:<\/strong> DOH guidance (Green Book) suggests\ndelaying live vaccination for at least three months in adult patients\nwho have received at least 40mg of prednisolone per day for more than 1\nweek or &gt;20mg for &gt;2 weeks . Individuals receiving prolonged oral\ncorticosteroid treatment at lower doses may also be at risk. Please\ncontact the Rheumatologist if live vaccination is being considered.<\/p>\n<p><strong>Osteoporosis<\/strong>: Patients on doses of greater than\n7.5mg of prednisolone per day, who are likely to need treatment for more\nthan 3 months, should be considered for bone protection therapy.\nPatients at high risk (including previous risk fracture, &gt;65 etc)\nshould start an oral bisphosphonate at the time of commencing steroid\ntherapy usually with determination of bone mineral density status. The\nneed for continuing bisphosphonate therapy, and possibly newer treatment\noptions, should preferably be evaluated by a DEXA scan and according to\nindividual patient risk factors. Physicians should refer to the\nappropriate clinical guideline (Osteoporosis - Clinical Guideline for\nPrevention and Treatment, Executive Summary June 2017, National\nOsteoporosis Guideline Group).<\/p>\n<p>Where patients do not have adequate calcium intake in their diet,\nsupplements should be considered (usually from over the counter).\nSimilarly, where appropriate, over the counter vitamin D (1000 units\ndaily) should be recommended for patients to obtain from pharmacies or\nsupermarkets.<\/p>\n<p><strong>Pregnancy:<\/strong> Please contact the Rheumatologist if a\nfemale patient is receiving oral corticosteroids and is planning to\nconceive.<\/p>\n<p>Peri-op/infections<\/p>","text":"Corticosteroids are commonly used in the management of a number of rheumatological conditions. Despite their known benefits, prolonged treatment can be associated with a number of detrimental side effects. EULAR guidance recommends that the adverse effects of glucocorticoid therapy should be considered and discussed with the patient before glucocorticoid therapy is started (Duru et al. 2013). Risk factors for adverse events include hypertension, diabetes, peptic ulcer, recent fracture, presence of cataract or glaucoma, presence of chronic infections, dyslipidaemia and co-medication with NSAIDs. For prolonged treatment, the dosage should be kept to a minimum and dose tapering attempted in cases of remission or low disease activity. Continued prescribing should be reviewed at regular intervals. The patient should be advised to take the tablets in the morning with or after food. Alternate day dosing, especially with long half-life NSAIDs, may be deemed appropriate to try and reduce side effects. Immunosuppression: Prolonged courses of corticosteroids can increase the susceptibility to infection. Immune status with regards to chickenpox can be checked when indicated. Those patients who are not immune should avoid close contact with people who have chickenpox or shingles. If exposed the patient should be advised to contact their Doctor promptly for advice. Adrenal suppression can occur if corticosteroids are given for longer than 3 weeks or the patient has received several repeat courses. Under these circumstances the dose of the corticosteroid should be gradually tapered. The speed and magnitude of reduction should be tailored according the patient’s disease status and additional co-morbidities. All patients receiving prolonged treatment with corticosteroids should be issued with a “BLUE STEROID CARD”, which can be obtained from both hospital and community pharmacies. The card should state the date treatment was commenced, the initial dosage, subsequent reductions and maintenance doses. Patients should be advised to carry the card with them and present it to Healthcare professionals in the case of illness. Where surgery is indicated, and the patient has been receiving treatment with glucocorticoids for over 1 month, it may be necessary to increase the glucocorticoid dose. The need for routine monitoring should be considered according to the dose, duration of treatment and the presence of pre-existing risk factors such as obesity, diabetes and cardiovascular disease. Live vaccination: DOH guidance (Green Book) suggests delaying live vaccination for at least three months in adult patients who have received at least 40mg of prednisolone per day for more than 1 week or >20mg for >2 weeks . Individuals receiving prolonged oral corticosteroid treatment at lower doses may also be at risk. Please contact the Rheumatologist if live vaccination is being considered. Osteoporosis : Patients on doses of greater than 7.5mg of prednisolone per day, who are likely to need treatment for more than 3 months, should be considered for bone protection therapy. Patients at high risk (including previous risk fracture, >65 etc) should start an oral bisphosphonate at the time of commencing steroid therapy usually with determination of bone mineral density status. The need for continuing bisphosphonate therapy, and possibly newer treatment options, should preferably be evaluated by a DEXA scan and according to individual patient risk factors. Physicians should refer to the appropriate clinical guideline (Osteoporosis - Clinical Guideline for Prevention and Treatment, Executive Summary June 2017, National Osteoporosis Guideline Group). Where patients do not have adequate calcium intake in their diet, supplements should be considered (usually from over the counter). Similarly, where appropriate, over the counter vitamin D (1000 units daily) should be recommended for patients to obtain from pharmacies or supermarkets. Pregnancy: Please contact the Rheumatologist if a female patient is receiving oral corticosteroids and is planning to conceive. Peri-op/infections"},{"id":"csdmards","title":"csDMARDs overview","group":"csDMARDs","kind":"chapter","html":"","text":""},{"id":"azathioprine","title":"Azathioprine","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th>Treatment is usually started at one 50mg tablet daily with or after\nbreakfast for the first week. Subsequently, if no problems occur, the\ndose is usually increased weekly to 100mg daily and then 150mg daily,\ntaken at the same time or in divided doses with meals. The dose is\nusually increased up to 2.5mg/kg per day and occasionally more if\nneeded.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><p>FBC/U&amp;E/LFT<\/p>\n<p>TPMT is recommended<\/p>\n<p>Consider Hepatitis B and C<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months<\/p>\n<p>Thereafter, at least every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated (see below)<\/p>\n<p>Dose increases should be monitored by FBC, U&amp;Es every 2 weeks\nuntil on stable dose for 6 weeks then revert to previous\nschedule<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for stopping:<\/td>\n<td><p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>Mouth or throat ulceration<\/p>\n<p>Unexplained bruising or bleeding<\/p>\n<p>Fever/nausea/vomiting/diarrhoea &amp; in presence of active\ninfection<\/p>\n<p>Diffuse alopecia<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td>Refer to hospital specialist - time to response 6 weeks to 3\nmonths<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><ul>\n<li><p>Patients deficient in thiopurine methyltransferase (TPMT) enzyme\nare at increased risk of haematological toxicity<\/p><\/li>\n<li><p>Renal or hepatic dysfunction – consider need for dose reduction\nto avoid haematological toxicity.<\/p><\/li>\n<li><p>Consider check Varicella Zoster Virus status<\/p><\/li>\n<li><\/li>\n<\/ul>\n<p>Surveillance for skin cancer - monitoring of skin for any new lesions\nand/or changes. Provide advice on sunscreen and protective clothing.\nThose expected to remain on long term therapy (6-12 months) should be\nconsidered for dermatological screening annually. <u>Important drug\nreactions:<\/u><\/p>\n<p>●Allopurinol, oxypurinol and thiopurinol - reduced elimination of\nazathioprine and 6-mercaptopurine, <em><strong>reduce AZA<\/strong><\/em>\n<em><strong>dose by one quarter of original dose<\/strong><\/em>. ●\nWarfarin - reduced anticoagulant effect. ●Captopril and possibly other\nACE inhibitors - increased risk of myelosuppression. ● Co-trimoxazole\nand trimethoprim - increased risk of myelosuppression. ●Clozapine -\nincreased risk of agranulocytosis. ●Sulfasalazine, mesalazine and\nolsalazine - possible increased risk of leucopenia.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/2881/SPC/Imuran+Tablets+25mg/\">http://www.medicines.org.uk/EMC/medicine/2881/SPC/Imuran+Tablets+25mg/<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"Treatment is usually started at one 50mg tablet daily with or after\nbreakfast for the first week. Subsequently, if no problems occur, the\ndose is usually increased weekly to 100mg daily and then 150mg daily,\ntaken at the same time or in divided doses with meals. The dose is\nusually increased up to 2.5mg/kg per day and occasionally more if\nneeded."},"baseline-tests":{"label":"Baseline Tests","html":"<p>FBC/U&amp;E/LFT<\/p>\n<p>TPMT is recommended<\/p>\n<p>Consider Hepatitis B and C<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>FBC, U&amp;Es, LFTs every 2 weeks until on stable dose for 6\nweeks<\/p>\n<p>Once on stable dose, monthly for 3 months<\/p>\n<p>Thereafter, at least every 12 weeks.<\/p>\n<p>More frequent monitoring is appropriate in patients at higher risk of\ntoxicity, or when clinically indicated (see below)<\/p>\n<p>Dose increases should be monitored by FBC, U&amp;Es every 2 weeks\nuntil on stable dose for 6 weeks then revert to previous\nschedule<\/p>"},"indications-for-stopping":{"label":"Indications for stopping","html":"<p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>Mouth or throat ulceration<\/p>\n<p>Unexplained bruising or bleeding<\/p>\n<p>Fever/nausea/vomiting/diarrhoea &amp; in presence of active\ninfection<\/p>\n<p>Diffuse alopecia<\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"Refer to hospital specialist - time to response 6 weeks to 3\nmonths"},"additional-information":{"label":"Additional information","html":"<ul>\n<li><p>Patients deficient in thiopurine methyltransferase (TPMT) enzyme\nare at increased risk of haematological toxicity<\/p><\/li>\n<li><p>Renal or hepatic dysfunction – consider need for dose reduction\nto avoid haematological toxicity.<\/p><\/li>\n<li><p>Consider check Varicella Zoster Virus status<\/p><\/li>\n<li><\/li>\n<\/ul>\n<p>Surveillance for skin cancer - monitoring of skin for any new lesions\nand/or changes. Provide advice on sunscreen and protective clothing.\nThose expected to remain on long term therapy (6-12 months) should be\nconsidered for dermatological screening annually. <u>Important drug\nreactions:<\/u><\/p>\n<p>●Allopurinol, oxypurinol and thiopurinol - reduced elimination of\nazathioprine and 6-mercaptopurine, <em><strong>reduce AZA<\/strong><\/em>\n<em><strong>dose by one quarter of original dose<\/strong><\/em>. ●\nWarfarin - reduced anticoagulant effect. ●Captopril and possibly other\nACE inhibitors - increased risk of myelosuppression. ● Co-trimoxazole\nand trimethoprim - increased risk of myelosuppression. ●Clozapine -\nincreased risk of agranulocytosis. ●Sulfasalazine, mesalazine and\nolsalazine - possible increased risk of leucopenia.<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: Treatment is usually started at one 50mg tablet daily with or after breakfast for the first week. Subsequently, if no problems occur, the dose is usually increased weekly to 100mg daily and then 150mg daily, taken at the same time or in divided doses with meals. The dose is usually increased up to 2.5mg/kg per day and occasionally more if needed. Baseline Tests: FBC/U&E/LFT TPMT is recommended Consider Hepatitis B and C Routine Monitoring: FBC, U&Es, LFTs every 2 weeks until on stable dose for 6 weeks Once on stable dose, monthly for 3 months Thereafter, at least every 12 weeks. More frequent monitoring is appropriate in patients at higher risk of toxicity, or when clinically indicated (see below) Dose increases should be monitored by FBC, U&Es every 2 weeks until on stable dose for 6 weeks then revert to previous schedule Indications for stopping: White blood cells <3.5x10 9 /L Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range Eosinophilia > 0.5x10 9 /L ALT or AST greater than 100 units/L, or any sudden increases (e.g. double of baseline), OR Unexplained fall in serum albumin to less than 30g/L MCV >105fL Mouth or throat ulceration Unexplained bruising or bleeding Fever/nausea/vomiting/diarrhoea & in presence of active infection Diffuse alopecia Assessment of Response: Refer to hospital specialist - time to response 6 weeks to 3 months Additional information: Patients deficient in thiopurine methyltransferase (TPMT) enzyme are at increased risk of haematological toxicity Renal or hepatic dysfunction – consider need for dose reduction to avoid haematological toxicity. Consider check Varicella Zoster Virus status Surveillance for skin cancer - monitoring of skin for any new lesions and/or changes. Provide advice on sunscreen and protective clothing. Those expected to remain on long term therapy (6-12 months) should be considered for dermatological screening annually. Important drug reactions: ●Allopurinol, oxypurinol and thiopurinol - reduced elimination of azathioprine and 6-mercaptopurine, reduce AZA dose by one quarter of original dose . ● Warfarin - reduced anticoagulant effect. ●Captopril and possibly other ACE inhibitors - increased risk of myelosuppression. ● Co-trimoxazole and trimethoprim - increased risk of myelosuppression. ●Clozapine - increased risk of agranulocytosis. ●Sulfasalazine, mesalazine and olsalazine - possible increased risk of leucopenia. Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/2881/SPC/Imuran+Tablets+25mg/"},{"id":"cyclosporine","title":"Cyclosporine","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>RA usual starting dose of 1-2mg/kg daily in 2 divided doses for 6\nweeks. Then small 25mg incremental increases in dose 2 weekly until\nclinically effective or maximum dose 3-4mg/kg or toxicity occurs\n(increase in Creatinine/Potassium).<\/p>\n<p>(See datasheet for dosage reduction in patients with increasing\ncreatinine levels)<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><p>Clinical examination including blood pressure and urinalysis<\/p>\n<p>FBC/U&amp;E/LFT/Urate/Lipids + consider pregnancy test<\/p>\n<p>Note 24 hour urine CrCl or PCI and GFR is suggested<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><p>Blood pressure (with each blood test)<\/p>\n<p>U&amp;Es/LFTs<\/p>\n<p>2 weekly until stable dosage reached<\/p>\n<p>Then monthly for 4 months, then 3 monthly<\/p>\n<p>Check lipids/urate at 2-3 months (optional)<\/p>\n<p>Dose increases should be monitored by FBC, U&amp;Es and LFTs every 2\nweeks until on stable dose for 6 weeks then revert to previous\nschedule<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping:<\/td>\n<td><p>Stop medication and contact the rheumatology service if:<\/p>\n<p>BP &gt;160/95 or risen &gt;20mmHg<\/p>\n<p>Potassium &gt;5.5mmol/l (especially with ACEi)<\/p>\n<p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>If creatinine clearance 30% or more below baseline, reduce dose or\nstop<\/p>\n<p>Ankle swelling/Headache (check BP)/<\/p>\n<p>Tremor/gingival hyperplasia/ hirsutism/confusion<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Additional Information:<\/td>\n<td><p>Contra-indications - abnormal renal function, uncontrolled\nhypertension, uncontrolled infections and malignancy.<\/p>\n<p>Generic formulations are now available – confirm preparation before\nprescribing.<\/p>\n<p><u>Important drug reactions:<\/u><\/p>\n<p>•<strong>Drugs which decrease ciclosporin levels (CYP3A4):<\/strong>\nBarbiturates, carbamazepine, oxcarbazepine, phenytoin; nafcillin,\nintravenous sulfadimidine, probucol, orlistat, ticlopidine,\nsulfinpyrazone, terbinafine, bosentan.<\/p>\n<p><strong>•Drugs which increase ciclosporin levels (CYP3A4):<\/strong>\nMacrolide antibiotics, azole antibiotics, amiodarone, diltiazem,\nverapamil, nicardipine, metoclopramide, oral contraceptives,\nmethylprednisolone (high dose), allopurinol, cholic acid and\nderivatives, protease inhibitors, imatinib, colchicine, nefazodone.<\/p>\n<p>•<strong>NSAIDS<\/strong> - increased risk of abnormal LFTs in\npatients taking NSAIDs (Note the dose of diclofenac should be decreased\nby 50%).<\/p>\n<p>•Statins – Confirm the need for dose reduction or avoidance of\ncertain statins (<u>avoid simvastatin and rosuvastatin<\/u>) in\naccordance with the licensed datasheet.<\/p>\n<p>•Digoxin and colchicine - reduced clearance<\/p>\n<p>•St John’s Wort - significantly decreases ciclosporin levels and\nshould be avoided.<\/p>\n<p>•<strong>Grapefruit and grapefruit juice<\/strong> - avoid an hour\nbefore and after taking ciclosporin.<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p>http://www.medicines.org.uk/EMC/medicine/22945/SPC/Deximune+25mg%2c+50mg%2c+100mg+Capsules/<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>RA usual starting dose of 1-2mg/kg daily in 2 divided doses for 6\nweeks. Then small 25mg incremental increases in dose 2 weekly until\nclinically effective or maximum dose 3-4mg/kg or toxicity occurs\n(increase in Creatinine/Potassium).<\/p>\n<p>(See datasheet for dosage reduction in patients with increasing\ncreatinine levels)<\/p>"},"baseline-tests":{"label":"Baseline Tests","html":"<p>Clinical examination including blood pressure and urinalysis<\/p>\n<p>FBC/U&amp;E/LFT/Urate/Lipids + consider pregnancy test<\/p>\n<p>Note 24 hour urine CrCl or PCI and GFR is suggested<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>Blood pressure (with each blood test)<\/p>\n<p>U&amp;Es/LFTs<\/p>\n<p>2 weekly until stable dosage reached<\/p>\n<p>Then monthly for 4 months, then 3 monthly<\/p>\n<p>Check lipids/urate at 2-3 months (optional)<\/p>\n<p>Dose increases should be monitored by FBC, U&amp;Es and LFTs every 2\nweeks until on stable dose for 6 weeks then revert to previous\nschedule<\/p>"},"indications-for-stopping":{"label":"Indications for Stopping","html":"<p>Stop medication and contact the rheumatology service if:<\/p>\n<p>BP &gt;160/95 or risen &gt;20mmHg<\/p>\n<p>Potassium &gt;5.5mmol/l (especially with ACEi)<\/p>\n<p>White blood cells &lt;3.5x10<sup>9<\/sup>/L<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Eosinophilia &gt; 0.5x10<sup>9<\/sup>/L<\/p>\n<p>ALT or AST greater than 100 units/L, or any sudden increases (e.g.\ndouble of baseline), OR Unexplained fall in serum albumin to less than\n30g/L<\/p>\n<p>MCV &gt;105fL<\/p>\n<p>If creatinine clearance 30% or more below baseline, reduce dose or\nstop<\/p>\n<p>Ankle swelling/Headache (check BP)/<\/p>\n<p>Tremor/gingival hyperplasia/ hirsutism/confusion<\/p>"},"additional-information":{"label":"Additional Information","html":"<p>Contra-indications - abnormal renal function, uncontrolled\nhypertension, uncontrolled infections and malignancy.<\/p>\n<p>Generic formulations are now available – confirm preparation before\nprescribing.<\/p>\n<p><u>Important drug reactions:<\/u><\/p>\n<p>•<strong>Drugs which decrease ciclosporin levels (CYP3A4):<\/strong>\nBarbiturates, carbamazepine, oxcarbazepine, phenytoin; nafcillin,\nintravenous sulfadimidine, probucol, orlistat, ticlopidine,\nsulfinpyrazone, terbinafine, bosentan.<\/p>\n<p><strong>•Drugs which increase ciclosporin levels (CYP3A4):<\/strong>\nMacrolide antibiotics, azole antibiotics, amiodarone, diltiazem,\nverapamil, nicardipine, metoclopramide, oral contraceptives,\nmethylprednisolone (high dose), allopurinol, cholic acid and\nderivatives, protease inhibitors, imatinib, colchicine, nefazodone.<\/p>\n<p>•<strong>NSAIDS<\/strong> - increased risk of abnormal LFTs in\npatients taking NSAIDs (Note the dose of diclofenac should be decreased\nby 50%).<\/p>\n<p>•Statins – Confirm the need for dose reduction or avoidance of\ncertain statins (<u>avoid simvastatin and rosuvastatin<\/u>) in\naccordance with the licensed datasheet.<\/p>\n<p>•Digoxin and colchicine - reduced clearance<\/p>\n<p>•St John’s Wort - significantly decreases ciclosporin levels and\nshould be avoided.<\/p>\n<p>•<strong>Grapefruit and grapefruit juice<\/strong> - avoid an hour\nbefore and after taking ciclosporin.<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: RA usual starting dose of 1-2mg/kg daily in 2 divided doses for 6 weeks. Then small 25mg incremental increases in dose 2 weekly until clinically effective or maximum dose 3-4mg/kg or toxicity occurs (increase in Creatinine/Potassium). (See datasheet for dosage reduction in patients with increasing creatinine levels) Baseline Tests: Clinical examination including blood pressure and urinalysis FBC/U&E/LFT/Urate/Lipids + consider pregnancy test Note 24 hour urine CrCl or PCI and GFR is suggested Routine Monitoring: Blood pressure (with each blood test) U&Es/LFTs 2 weekly until stable dosage reached Then monthly for 4 months, then 3 monthly Check lipids/urate at 2-3 months (optional) Dose increases should be monitored by FBC, U&Es and LFTs every 2 weeks until on stable dose for 6 weeks then revert to previous schedule Indications for Stopping: Stop medication and contact the rheumatology service if: BP >160/95 or risen >20mmHg Potassium >5.5mmol/l (especially with ACEi) White blood cells <3.5x10 9 /L Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range Eosinophilia > 0.5x10 9 /L ALT or AST greater than 100 units/L, or any sudden increases (e.g. double of baseline), OR Unexplained fall in serum albumin to less than 30g/L MCV >105fL If creatinine clearance 30% or more below baseline, reduce dose or stop Ankle swelling/Headache (check BP)/ Tremor/gingival hyperplasia/ hirsutism/confusion Additional Information: Contra-indications - abnormal renal function, uncontrolled hypertension, uncontrolled infections and malignancy. Generic formulations are now available – confirm preparation before prescribing. Important drug reactions: • Drugs which decrease ciclosporin levels (CYP3A4): Barbiturates, carbamazepine, oxcarbazepine, phenytoin; nafcillin, intravenous sulfadimidine, probucol, orlistat, ticlopidine, sulfinpyrazone, terbinafine, bosentan. •Drugs which increase ciclosporin levels (CYP3A4): Macrolide antibiotics, azole antibiotics, amiodarone, diltiazem, verapamil, nicardipine, metoclopramide, oral contraceptives, methylprednisolone (high dose), allopurinol, cholic acid and derivatives, protease inhibitors, imatinib, colchicine, nefazodone. • NSAIDS - increased risk of abnormal LFTs in patients taking NSAIDs (Note the dose of diclofenac should be decreased by 50%). •Statins – Confirm the need for dose reduction or avoidance of certain statins ( avoid simvastatin and rosuvastatin ) in accordance with the licensed datasheet. •Digoxin and colchicine - reduced clearance •St John’s Wort - significantly decreases ciclosporin levels and should be avoided. • Grapefruit and grapefruit juice - avoid an hour before and after taking ciclosporin. Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/22945/SPC/Deximune+25mg%2c+50mg%2c+100mg+Capsules/"},{"id":"cyclophosphamide","title":"Cyclophosphamide","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>The regimen varies according to the clinical indication and\nco-morbidities. An example of one current regime is:<\/p>\n<p>10-15mg /kg IV Cyclophosphamide + 2.5 - 10mg/kg IV\nmethylprednisolone<\/p>\n<p>3 pulses given 2 weekly, then 3 given 3 weekly<\/p>\n<p>Oral mesna should be given in conjunction with cyclophosphamide:\n400mg orally 2 hours before, 2 hours after and 6 hours after. However,\nthe risk of haemorrhagic cystitis is deemed to be low with current\nstandard dosage regimes used in rheumatology.<\/p>\n<p>Although not highly emetogenic some patients may require\npre-treatment with an anti-emetic.<\/p>\n<p>A high fluid intake should be encouraged on the day of\nadministration.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline tests:<\/td>\n<td><p>FBC/U&amp;E/LFT<\/p>\n<p>Urinalysis<\/p>\n<p>Consider pregnancy test<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><p>FBC to be performed 10 days after each pulse (nadir result)<\/p>\n<p>Urinalysis<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal range\n(a nadir of less is fine, provided recovery before the next dose)<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<p>Plus repeat blood results immediately prior to giving next\npulse.<\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for stopping:<\/td>\n<td><p>Contact local rheumatology service if:<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L, Platelets &lt;140\n10<sup>9/<\/sup>L<\/p>\n<p>Oral ulceration/unusual bruising/rash/fever/cough or shortness of\nbreath/nausea/alopecia<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of response:<\/td>\n<td>Defined by the Rheumatology Consultant according to the\ndisease/organ(s) affected. An interim review should be performed after\nthe first 3 pulses and full assessment after completion of 6. Pulse\ntherapies may be considered in some cases with further spacing\nintervals<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><p>Infection to be excluded before administration of each\ninfusion.<\/p>\n<p>Consider PCP prophylaxis if longer term treatment being used<\/p>\n<p><strong>CAUTION:<\/strong><\/p>\n<p>Porphyria<\/p>\n<p>Previous haematological abnormality<\/p>\n<p>History or recurrent infection<\/p>\n<p>Renal or hepatic impairment<\/p>\n<p>Hypersensitivity<\/p>\n<p>Haemorrhagic cystitis<\/p>\n<p>Urinary incontinence/ recurrent urinary tract\ninfection/catherisation<\/p>\n<p><strong>Drug Interactions:<\/strong><\/p>\n<p>AVOID live vaccines<\/p>\n<p>Other immunosuppressants<\/p>\n<p>Not with clozapine<\/p>\n<p>Oral hypoglycaemics may be potentiated by cyclophosphamide.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Refer to Section 9 (Guidance on use of DMARDS in pregnancy)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><strong>Refer to the Rheumatologist and the Hospital\nMedicines Information Department for more detailed prescribing\ninformation.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"<p>The regimen varies according to the clinical indication and\nco-morbidities. An example of one current regime is:<\/p>\n<p>10-15mg /kg IV Cyclophosphamide + 2.5 - 10mg/kg IV\nmethylprednisolone<\/p>\n<p>3 pulses given 2 weekly, then 3 given 3 weekly<\/p>\n<p>Oral mesna should be given in conjunction with cyclophosphamide:\n400mg orally 2 hours before, 2 hours after and 6 hours after. However,\nthe risk of haemorrhagic cystitis is deemed to be low with current\nstandard dosage regimes used in rheumatology.<\/p>\n<p>Although not highly emetogenic some patients may require\npre-treatment with an anti-emetic.<\/p>\n<p>A high fluid intake should be encouraged on the day of\nadministration.<\/p>"},"baseline-tests":{"label":"Baseline tests","html":"<p>FBC/U&amp;E/LFT<\/p>\n<p>Urinalysis<\/p>\n<p>Consider pregnancy test<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<p>FBC to be performed 10 days after each pulse (nadir result)<\/p>\n<p>Urinalysis<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal range\n(a nadir of less is fine, provided recovery before the next dose)<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>AST or ALT &gt; 3 times normal range (iu/L)<\/p>\n<p>Plus repeat blood results immediately prior to giving next\npulse.<\/p>"},"indications-for-stopping":{"label":"Indications for stopping","html":"<p>Contact local rheumatology service if:<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L, Platelets &lt;140\n10<sup>9/<\/sup>L<\/p>\n<p>Oral ulceration/unusual bruising/rash/fever/cough or shortness of\nbreath/nausea/alopecia<\/p>"},"assessment-of-response":{"label":"Assessment of response","html":"Defined by the Rheumatology Consultant according to the\ndisease/organ(s) affected. An interim review should be performed after\nthe first 3 pulses and full assessment after completion of 6. Pulse\ntherapies may be considered in some cases with further spacing\nintervals"},"additional-information":{"label":"Additional information","html":"<p>Infection to be excluded before administration of each\ninfusion.<\/p>\n<p>Consider PCP prophylaxis if longer term treatment being used<\/p>\n<p><strong>CAUTION:<\/strong><\/p>\n<p>Porphyria<\/p>\n<p>Previous haematological abnormality<\/p>\n<p>History or recurrent infection<\/p>\n<p>Renal or hepatic impairment<\/p>\n<p>Hypersensitivity<\/p>\n<p>Haemorrhagic cystitis<\/p>\n<p>Urinary incontinence/ recurrent urinary tract\ninfection/catherisation<\/p>\n<p><strong>Drug Interactions:<\/strong><\/p>\n<p>AVOID live vaccines<\/p>\n<p>Other immunosuppressants<\/p>\n<p>Not with clozapine<\/p>\n<p>Oral hypoglycaemics may be potentiated by cyclophosphamide.<\/p>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Refer to Section 9 (Guidance on use of DMARDS in pregnancy)"}},"text":"Dose: The regimen varies according to the clinical indication and co-morbidities. An example of one current regime is: 10-15mg /kg IV Cyclophosphamide + 2.5 - 10mg/kg IV methylprednisolone 3 pulses given 2 weekly, then 3 given 3 weekly Oral mesna should be given in conjunction with cyclophosphamide: 400mg orally 2 hours before, 2 hours after and 6 hours after. However, the risk of haemorrhagic cystitis is deemed to be low with current standard dosage regimes used in rheumatology. Although not highly emetogenic some patients may require pre-treatment with an anti-emetic. A high fluid intake should be encouraged on the day of administration. Baseline tests: FBC/U&E/LFT Urinalysis Consider pregnancy test Routine Monitoring: FBC to be performed 10 days after each pulse (nadir result) Urinalysis Neutrophils < 1.6 x 10 9/ L or below local normal range (a nadir of less is fine, provided recovery before the next dose) Platelets <140 x10 9/ L or below local normal range AST or ALT > 3 times normal range (iu/L) Plus repeat blood results immediately prior to giving next pulse. Indications for stopping: Contact local rheumatology service if: Neutrophils < 1.6 x 10 9/ L, Platelets <140 10 9/ L Oral ulceration/unusual bruising/rash/fever/cough or shortness of breath/nausea/alopecia Assessment of response: Defined by the Rheumatology Consultant according to the disease/organ(s) affected. An interim review should be performed after the first 3 pulses and full assessment after completion of 6. Pulse therapies may be considered in some cases with further spacing intervals Additional information: Infection to be excluded before administration of each infusion. Consider PCP prophylaxis if longer term treatment being used CAUTION: Porphyria Previous haematological abnormality History or recurrent infection Renal or hepatic impairment Hypersensitivity Haemorrhagic cystitis Urinary incontinence/ recurrent urinary tract infection/catherisation Drug Interactions: AVOID live vaccines Other immunosuppressants Not with clozapine Oral hypoglycaemics may be potentiated by cyclophosphamide. Pregnancy & Breastfeeding: Refer to Section 9 (Guidance on use of DMARDS in pregnancy) Refer to the Rheumatologist and the Hospital Medicines Information Department for more detailed prescribing information."},{"id":"injectable-gold","title":"Injectable gold","subtitle":"sodium aurothiomalate","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th>RA - An initial 10mg intra-muscular test dose should be given in the\nfirst week followed by a maintenance dose of 50mg by intra-muscular\ninjection the following week and then weekly. Patients should be\nmonitored for 30 minutes following each dose. FBC and urine should be\nchecked before each injection. Frequency of injections can be reduced\naccording to response to once every 4 - 8 weeks.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Baseline Tests:<\/td>\n<td><ul>\n<li><p>FBC<\/p><\/li>\n<li><p>U&amp;E<\/p><\/li>\n<li><p>LFT<\/p><\/li>\n<li><p>Urinalysis<\/p><\/li>\n<li><p>Baseline chest X-ray (consider annual repeat)<\/p><\/li>\n<\/ul>\n<p>Inform patient to report – pruritis, metallic taste in the mouth,\nsore throat or tongue, buccal ulceration, easy bruising, purpura,\nepistaxis, bleeding gums, inappropriate menstrual bleeding or\ndiarrhoea.<\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine Monitoring:<\/td>\n<td><ul>\n<li><p>FBC and Urinalysis at the time of each injection (Provided blood\nresults are stable. The results of the FBC need not be available before\nthe injection is given but must be available before the next injection\n(i.e. it is permissible to work one FBC in arrears). FBC frequency may\nbe reduced to &gt;6 monthly in long term stable users.<\/p><\/li>\n<li><p><u>Urinalysis must be done before each injection.<\/u><\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indications for Stopping Therapy:<\/td>\n<td><p><strong>Note:<\/strong> Anaphylactic reaction may occur at any\nstage of treatment and usually occurs within the first 10 minutes of\nadministering the injection.<\/p>\n<p>If the patient develops sore throat, glossitis, buccal ulceration,\neasy bruising, a rash or bleeding perform an immediate blood test. If\nany of the following occur, <strong>stop treatment<\/strong> and contact\nthe hospital specialist:<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Proteinuria/Blood &gt;1+ (Where protein is detected do MSU and if\nnegative perform a urine PCI / PCR (or 24 hour urine collection for\nprotein and creatinine clearance). <u>If blood tests are normal despite\nthe above symptoms, stop treatment for 1-2 weeks (until symptoms\ndisappear) and consider re-challenge with test dose (consult hospital\nspecialist).<\/u><\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Assessment of Response:<\/td>\n<td>If after reaching a total dose of 1g (excluding test dose), no major\nimprovement has occurred the Specialist will usually discontinue\ntherapy.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Additional information:<\/td>\n<td><p>Contra-indicated - Gross renal or hepatic disease, history of\nblood dyscrasias, exfoliative dermatitis and systemic lupus\nerythematosus (SLE).<\/p>\n<p><u>Important drug reactions:<\/u><\/p>\n<ul>\n<li><p>Penicillamine (increased risk of rashes and bone marrow\ndepression)<\/p><\/li>\n<li><p>Aspirin (increased risk of aspirin-induced hepatic\ndysfunction)<\/p><\/li>\n<li><p>ACE inhibitors (increased risk of severe anaphylactoid\nreactions)<\/p><\/li>\n<\/ul><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pregnancy &amp; Breastfeeding:<\/td>\n<td>Avoid in pregnancy and breastfeeding as safety has not been\nestablished.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td colspan=\"2\"><p>Please refer to licensed datasheet for more\ncomprehensive prescribing information:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"http://www.medicines.org.uk/EMC/medicine/18613/SPC/Myocrisin+100mg+ml+Solution+for+Injection/\">http://www.medicines.org.uk/EMC/medicine/18613/SPC/Myocrisin+100mg+ml+Solution+for+Injection/<\/a><\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","fields":{"dose":{"label":"Dose","html":"RA - An initial 10mg intra-muscular test dose should be given in the\nfirst week followed by a maintenance dose of 50mg by intra-muscular\ninjection the following week and then weekly. Patients should be\nmonitored for 30 minutes following each dose. FBC and urine should be\nchecked before each injection. Frequency of injections can be reduced\naccording to response to once every 4 - 8 weeks."},"baseline-tests":{"label":"Baseline Tests","html":"<ul>\n<li><p>FBC<\/p><\/li>\n<li><p>U&amp;E<\/p><\/li>\n<li><p>LFT<\/p><\/li>\n<li><p>Urinalysis<\/p><\/li>\n<li><p>Baseline chest X-ray (consider annual repeat)<\/p><\/li>\n<\/ul>\n<p>Inform patient to report – pruritis, metallic taste in the mouth,\nsore throat or tongue, buccal ulceration, easy bruising, purpura,\nepistaxis, bleeding gums, inappropriate menstrual bleeding or\ndiarrhoea.<\/p>"},"routine-monitoring":{"label":"Routine Monitoring","html":"<ul>\n<li><p>FBC and Urinalysis at the time of each injection (Provided blood\nresults are stable. The results of the FBC need not be available before\nthe injection is given but must be available before the next injection\n(i.e. it is permissible to work one FBC in arrears). FBC frequency may\nbe reduced to &gt;6 monthly in long term stable users.<\/p><\/li>\n<li><p><u>Urinalysis must be done before each injection.<\/u><\/p><\/li>\n<\/ul>"},"indications-for-stopping-therapy":{"label":"Indications for Stopping Therapy","html":"<p><strong>Note:<\/strong> Anaphylactic reaction may occur at any\nstage of treatment and usually occurs within the first 10 minutes of\nadministering the injection.<\/p>\n<p>If the patient develops sore throat, glossitis, buccal ulceration,\neasy bruising, a rash or bleeding perform an immediate blood test. If\nany of the following occur, <strong>stop treatment<\/strong> and contact\nthe hospital specialist:<\/p>\n<p>Neutrophils &lt; 1.6 x 10<sup>9/<\/sup>L or below local normal\nrange<\/p>\n<p>Platelets &lt;140 x10<sup>9/<\/sup>L or below local normal range<\/p>\n<p>Proteinuria/Blood &gt;1+ (Where protein is detected do MSU and if\nnegative perform a urine PCI / PCR (or 24 hour urine collection for\nprotein and creatinine clearance). <u>If blood tests are normal despite\nthe above symptoms, stop treatment for 1-2 weeks (until symptoms\ndisappear) and consider re-challenge with test dose (consult hospital\nspecialist).<\/u><\/p>"},"assessment-of-response":{"label":"Assessment of Response","html":"If after reaching a total dose of 1g (excluding test dose), no major\nimprovement has occurred the Specialist will usually discontinue\ntherapy."},"additional-information":{"label":"Additional information","html":"<p>Contra-indicated - Gross renal or hepatic disease, history of\nblood dyscrasias, exfoliative dermatitis and systemic lupus\nerythematosus (SLE).<\/p>\n<p><u>Important drug reactions:<\/u><\/p>\n<ul>\n<li><p>Penicillamine (increased risk of rashes and bone marrow\ndepression)<\/p><\/li>\n<li><p>Aspirin (increased risk of aspirin-induced hepatic\ndysfunction)<\/p><\/li>\n<li><p>ACE inhibitors (increased risk of severe anaphylactoid\nreactions)<\/p><\/li>\n<\/ul>"},"pregnancy-breastfeeding":{"label":"Pregnancy & Breastfeeding","html":"Avoid in pregnancy and breastfeeding as safety has not been\nestablished."}},"text":"Dose: RA - An initial 10mg intra-muscular test dose should be given in the first week followed by a maintenance dose of 50mg by intra-muscular injection the following week and then weekly. Patients should be monitored for 30 minutes following each dose. FBC and urine should be checked before each injection. Frequency of injections can be reduced according to response to once every 4 - 8 weeks. Baseline Tests: FBC U&E LFT Urinalysis Baseline chest X-ray (consider annual repeat) Inform patient to report – pruritis, metallic taste in the mouth, sore throat or tongue, buccal ulceration, easy bruising, purpura, epistaxis, bleeding gums, inappropriate menstrual bleeding or diarrhoea. Routine Monitoring: FBC and Urinalysis at the time of each injection (Provided blood results are stable. The results of the FBC need not be available before the injection is given but must be available before the next injection (i.e. it is permissible to work one FBC in arrears). FBC frequency may be reduced to >6 monthly in long term stable users. Urinalysis must be done before each injection. Indications for Stopping Therapy: Note: Anaphylactic reaction may occur at any stage of treatment and usually occurs within the first 10 minutes of administering the injection. If the patient develops sore throat, glossitis, buccal ulceration, easy bruising, a rash or bleeding perform an immediate blood test. If any of the following occur, stop treatment and contact the hospital specialist: Neutrophils < 1.6 x 10 9/ L or below local normal range Platelets <140 x10 9/ L or below local normal range Proteinuria/Blood >1+ (Where protein is detected do MSU and if negative perform a urine PCI / PCR (or 24 hour urine collection for protein and creatinine clearance). If blood tests are normal despite the above symptoms, stop treatment for 1-2 weeks (until symptoms disappear) and consider re-challenge with test dose (consult hospital specialist). Assessment of Response: If after reaching a total dose of 1g (excluding test dose), no major improvement has occurred the Specialist will usually discontinue therapy. Additional information: Contra-indicated - Gross renal or hepatic disease, history of blood dyscrasias, exfoliative dermatitis and systemic lupus erythematosus (SLE). Important drug reactions: Penicillamine (increased risk of rashes and bone marrow depression) Aspirin (increased risk of aspirin-induced hepatic dysfunction) ACE inhibitors (increased risk of severe anaphylactoid reactions) Pregnancy & Breastfeeding: Avoid in pregnancy and breastfeeding as safety has not been established. Please refer to licensed datasheet for more comprehensive prescribing information: http://www.medicines.org.uk/EMC/medicine/18613/SPC/Myocrisin+100mg+ml+Solution+for+Injection/"},{"id":"hydroxychloroquine","title":"Hydroxychloroquine","subtitle":"","group":"csDMARDs","kind":"drug","html":"<div class=\"table-wrap\"><table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Dose:<\/th>\n<th><p>Considered for treatment of rheumatoid arthritis, juvenile\nidiopathic arthritis, systemic lupus erythematosus and other CTDs<\/p>\n<p>Usually started at a dose of 200mg bd for the first 3 months and then\nreduce to 200mg daily as a mainten
